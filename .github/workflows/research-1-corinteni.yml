name: Research 1 Corinteni

on:
  pull_request:
    branches:
      - agent/romani
    paths:
      - .github/workflows/research-1-corinteni.yml

permissions:
  contents: read

jobs:
  transcribe:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        episode:
          - number: 1
            slug: 01-1cor-1-1-to-1-24
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-1-1-to-chapter-1-25.mp3
          - number: 2
            slug: 02-1cor-1-25-to-2-16
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-1-25-to-chapter-2-16.mp3
          - number: 3
            slug: 03-1cor-3-1-to-3-17
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-3-1-to-chapter-3-18.mp3
          - number: 4
            slug: 04-1cor-3-18-to-4-14
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-3-18-to-chapter-4-14.mp3
          - number: 5
            slug: 05-1cor-4-15-to-6-6
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-4-15-to-chapter-6-7.mp3
          - number: 6
            slug: 06-1cor-6-7-to-6-20
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-6-7-to-chapter-6-20.mp3
          - number: 7
            slug: 07-1cor-7-1-to-7-24
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-7-1-to-chapter-7-24.mp3
          - number: 8
            slug: 08-1cor-7-25-to-8-13
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-7-25-to-chapter-8-13.mp3
          - number: 9
            slug: 09-1cor-9-1-to-9-23
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-9-1-to-chapter-9-23.mp3
          - number: 10
            slug: 10-1cor-9-24-to-10-13
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-9-24-to-chapter-10-13.mp3
          - number: 11
            slug: 11-1cor-10-14-to-10-33
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-10-14-to-chapter-10-33.mp3
          - number: 12
            slug: 12-1cor-11-1-to-11-34
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-11-1-to-chapter-11-34.mp3
          - number: 13
            slug: 13-1cor-12-1-to-12-21
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-12-1-to-chapter-12-21.mp3
          - number: 14
            slug: 14-1cor-12-22-to-13-13
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-12-22-to-chapter-14-1.mp3
          - number: 15
            slug: 15-1cor-14-1-to-15-19
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-14-1-to-chapter-15-20.mp3
          - number: 16
            slug: 16-1cor-15-20-to-16-24
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt07-1corinthians-chapter-15-20-to-chapter-16-24.mp3

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install transcription tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper==1.2.0 requests
      - name: Download official CFC audio
        env:
          EPISODE_URL: ${{ matrix.episode.url }}
          EPISODE_SLUG: ${{ matrix.episode.slug }}
        run: |
          mkdir -p .research/1-corinteni/audio .research/1-corinteni/transcripts
          curl --fail --location --retry 4 "$EPISODE_URL" --output ".research/1-corinteni/audio/$EPISODE_SLUG.mp3"
          test -s ".research/1-corinteni/audio/$EPISODE_SLUG.mp3"
      - name: Transcribe episode
        env:
          EPISODE_SLUG: ${{ matrix.episode.slug }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from faster_whisper import WhisperModel
          root = Path('.research/1-corinteni')
          slug = os.environ['EPISODE_SLUG']
          source = root / 'audio' / f'{slug}.mp3'
          target = root / 'transcripts' / f'{slug}.txt'
          model = WhisperModel('tiny.en', device='cpu', compute_type='int8', cpu_threads=4)
          segments, info = model.transcribe(str(source), language='en', beam_size=1, best_of=1, vad_filter=True)
          lines = [' '.join(segment.text.split()) for segment in segments if segment.text.strip()]
          target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'{source.name}: {info.duration:.1f}s audio, {target.stat().st_size} bytes transcript')
          if target.stat().st_size < 5000:
              raise SystemExit('Transcriere prea scurta')
          PY
      - name: Upload private research artifact
        uses: actions/upload-artifact@v4
        with:
          name: unu-corinteni-${{ matrix.episode.slug }}
          path: .research/1-corinteni/transcripts/${{ matrix.episode.slug }}.txt
          if-no-files-found: error
          retention-days: 1
