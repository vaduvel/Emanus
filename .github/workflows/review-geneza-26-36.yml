name: Aplica revizia Geneza 26-36

on:
  push:
    branches: [review/geneza-26-36]

permissions:
  contents: write

jobs:
  revise-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/geneza-26-36
          fetch-depth: 0

      - name: Aplica revizia si captureaza eroarea
        id: revise
        continue-on-error: true
        run: python3 scripts/review-geneza-26-36.py > review-error.log 2>&1

      - name: Publica diagnosticul daca revizia a esuat
        if: steps.revise.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-error.log
          git commit -m "chore: consemneaza eroarea reviziei"
          git push origin HEAD:review/geneza-26-36

      - name: Opreste dupa diagnostic
        if: steps.revise.outcome == 'failure'
        run: exit 1

      - uses: pnpm/action-setup@v4
        if: steps.revise.outcome == 'success'

      - uses: actions/setup-node@v4
        if: steps.revise.outcome == 'success'
        with:
          node-version: 20
          cache: pnpm

      - name: Instaleaza dependentele
        if: steps.revise.outcome == 'success'
        run: pnpm install --frozen-lockfile

      - name: Verificari
        if: steps.revise.outcome == 'success'
        run: |
          pnpm check:quotes
          pnpm check:typos
          pnpm check:content
          pnpm check:bible-publication
          pnpm typecheck
          pnpm build

      - name: Publica revizia verificata
        if: steps.revise.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(biblia): revizuieste Geneza 26-36"
          git push origin HEAD:review/geneza-26-36
