name: Repair Exodus 16-20

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-repair-exodus-16-20.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Rebuild and audit Exodus 16-20
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          texts={
          16:[
          'Au pornit din Elim, iar întreaga comunitate a fiilor lui Israel a ajuns în pustia Sin, care este între Elim și Sinai, în ziua a cincisprezecea a lunii a doua după ieșirea lor din țara Egiptului.',
          'Întreaga comunitate a fiilor lui Israel a murmurat în pustie împotriva lui Moise și a lui Aaron.',
          'Fiii lui Israel le-au spus: „Mai bine am fi murit de mâna DOMNULUI în țara Egiptului, când stăteam lângă oalele cu carne și mâncam pâine pe săturate! Ne-ați adus în pustia aceasta ca să omorâți de foame întreaga adunare.”',
          'Atunci DOMNUL i-a spus lui Moise: „Iată, voi face să plouă pentru voi pâine din cer. Poporul să iasă și să strângă în fiecare zi porția necesară pentru acea zi, ca să-l pun la încercare și să văd dacă va umbla sau nu după Legea Mea.',
          'În ziua a șasea, când vor pregăti ceea ce au adus, va fi de două ori mai mult decât strâng în fiecare zi.”',
          'Moise și Aaron le-au spus tuturor fiilor lui Israel: „Diseară veți ști că DOMNUL v-a scos din țara Egiptului,',
          'iar dimineață veți vedea gloria DOMNULUI, fiindcă El a auzit murmurele voastre împotriva DOMNULUI. Cine suntem noi, ca să murmurați împotriva noastră?”',
          'Moise a mai spus: „DOMNUL vă va da diseară carne de mâncat, iar dimineață pâine ca să vă săturați, fiindcă DOMNUL a auzit murmurele pe care le-ați rostit împotriva Lui. Cine suntem noi? Murmurele voastre nu sunt împotriva noastră, ci împotriva DOMNULUI.”',
          'Moise i-a spus lui Aaron: „Spune întregii comunități a fiilor lui Israel: «Apropiați-vă înaintea DOMNULUI, căci El a auzit murmurele voastre.»”',
          'În timp ce Aaron vorbea întregii comunități a fiilor lui Israel, ei s-au întors spre pustie și iată că gloria DOMNULUI s-a arătat în nor.',
          'DOMNUL i-a vorbit lui Moise și i-a spus:',
          '„Am auzit murmurele fiilor lui Israel. Vorbește-le și spune-le: «Spre seară veți mânca carne, iar dimineață vă veți sătura cu pâine. Atunci veți ști că Eu sunt DOMNUL, Dumnezeul vostru.»”',
          'Seara au venit prepelițe și au acoperit tabăra, iar dimineața un strat de rouă era în jurul taberei.',
          'Când stratul de rouă s-a ridicat, iată că pe suprafața pustiei era ceva mărunt și solzos, mărunt ca bruma pe pământ.',
          'Când fiii lui Israel au văzut, și-au spus unii altora: „Ce este aceasta?”, fiindcă nu știau ce era. Moise le-a spus: „Aceasta este pâinea pe care v-a dat-o DOMNUL ca hrană.',
          'Iată ce a poruncit DOMNUL: «Fiecare să strângă cât îi trebuie pentru hrană: câte un omer de persoană, după numărul celor din cortul său.»”',
          'Fiii lui Israel au făcut astfel; unii au strâns mai mult, iar alții mai puțin.',
          'Când au măsurat cu omerul, celui care strânsese mult nu i-a rămas în plus, iar celui care strânsese puțin nu i-a lipsit. Fiecare strânsese cât îi trebuia pentru hrană.',
          'Moise le-a spus: „Nimeni să nu lase din ea până dimineață.”',
          'Dar unii nu l-au ascultat pe Moise și au lăsat din ea până dimineață. A făcut viermi și a început să miroasă urât, iar Moise s-a mâniat pe ei.',
          'O strângeau în fiecare dimineață, fiecare cât îi trebuia pentru hrană. Când se încingea soarele, se topea.',
          'În ziua a șasea au strâns de două ori mai multă pâine, câte doi omeri de persoană. Toate căpeteniile comunității au venit și i-au spus lui Moise.',
          'El le-a răspuns: „Aceasta este ceea ce a spus DOMNUL: «Mâine este o odihnă deplină, un Sabat sfânt pentru DOMNUL. Coaceți ce aveți de copt și fierbeți ce aveți de fiert, iar tot ce rămâne păstrați pentru dimineață.»”',
          'Au păstrat-o până dimineață, așa cum poruncise Moise, și nu a început să miroasă urât și nici nu au apărut viermi în ea.',
          'Moise a spus: „Mâncați-o astăzi, căci astăzi este Sabat pentru DOMNUL. Astăzi nu o veți găsi pe câmp.',
          'Șase zile să o strângeți, dar în ziua a șaptea este Sabatul și nu va fi deloc.”',
          'Totuși, în ziua a șaptea, unii dintre oameni au ieșit să strângă, dar nu au găsit nimic.',
          'DOMNUL i-a spus lui Moise: „Până când veți refuza să păziți poruncile și legile Mele?',
          'Vedeți că DOMNUL v-a dat Sabatul; de aceea, în ziua a șasea vă dă pâine pentru două zile. Fiecare să rămână la locul său și nimeni să nu iasă din locul lui în ziua a șaptea.”',
          'Astfel, poporul s-a odihnit în ziua a șaptea.',
          'Casa lui Israel a numit hrana aceea „mană”. Era ca sămânța de coriandru, albă, iar gustul ei era ca al unei turte cu miere.',
          'Moise a spus: „Iată ce a poruncit DOMNUL: «Să se păstreze un omer plin din ea pentru generațiile voastre, ca să vadă pâinea cu care v-am hrănit în pustie când v-am scos din țara Egiptului.»”',
          'Moise i-a spus lui Aaron: „Ia un vas, pune în el un omer plin cu mană și așază-l înaintea DOMNULUI, ca să fie păstrat pentru generațiile voastre.”',
          'Așa cum îi poruncise DOMNUL lui Moise, Aaron l-a așezat înaintea Mărturiei, ca să fie păstrat.',
          'Fiii lui Israel au mâncat mană timp de patruzeci de ani, până când au ajuns într-o țară locuită. Au mâncat mană până când au ajuns la hotarul țării Canaanului.',
          'Un omer este a zecea parte dintr-o efă.'],
          17:[
          'Întreaga comunitate a fiilor lui Israel a pornit din pustia Sin, călătorind din loc în loc după porunca DOMNULUI, și și-a așezat tabăra la Refidim. Dar nu era apă de băut pentru popor.',
          'Poporul s-a certat cu Moise și a spus: „Dați-ne apă să bem!” Moise le-a răspuns: „De ce vă certați cu mine? De ce Îl puneți la încercare pe DOMNUL?”',
          'Poporul era însetat acolo și a murmurat împotriva lui Moise: „De ce ne-ai scos din Egipt? Ca să ne omori de sete pe noi, pe copiii noștri și animalele noastre?”',
          'Moise a strigat către DOMNUL: „Ce să fac cu poporul acesta? Puțin mai este și mă vor ucide cu pietre!”',
          'DOMNUL i-a spus lui Moise: „Treci înaintea poporului și ia cu tine câțiva dintre bătrânii lui Israel. Ia în mână toiagul cu care ai lovit Nilul și mergi.',
          'Iată, Eu voi sta înaintea ta acolo, pe stâncă, la Horeb. Vei lovi stânca, iar din ea va ieși apă și poporul va bea.” Moise a făcut astfel înaintea bătrânilor lui Israel.',
          'El a numit locul Masa și Meriba, din cauza certei fiilor lui Israel și pentru că Îl puseseră la încercare pe DOMNUL, spunând: „Este DOMNUL în mijlocul nostru sau nu?”',
          'Atunci Amalec a venit și a luptat împotriva lui Israel la Refidim.',
          'Moise i-a spus lui Iosua: „Alege pentru noi bărbați și ieși să lupți împotriva lui Amalec. Mâine voi sta pe vârful dealului cu toiagul lui Dumnezeu în mână.”',
          'Iosua a făcut cum îi spusese Moise și a luptat împotriva lui Amalec, iar Moise, Aaron și Hur s-au urcat pe vârful dealului.',
          'Când Moise își ținea mâna ridicată, Israel biruia; când își lăsa mâna, Amalec biruia.',
          'Mâinile lui Moise au obosit. Atunci au luat o piatră, au pus-o sub el și s-a așezat pe ea. Aaron și Hur îi sprijineau mâinile, unul de o parte și celălalt de cealaltă parte, iar mâinile lui au rămas neclintite până la apusul soarelui.',
          'Iosua l-a învins pe Amalec și poporul lui cu tăișul sabiei.',
          'DOMNUL i-a spus lui Moise: „Scrie acest lucru într-o carte ca aducere-aminte și pune-l în auzul lui Iosua: voi șterge cu desăvârșire amintirea lui Amalec de sub cer.”',
          'Moise a construit un altar și i-a pus numele „DOMNUL este Steagul meu”.',
          'El a spus: „O mână este ridicată spre tronul lui Yah! DOMNUL va purta război împotriva lui Amalec din generație în generație.”'],
          18:[
          'Ietro, preotul Madianului și socrul lui Moise, a auzit tot ce făcuse Dumnezeu pentru Moise și pentru Israel, poporul Său, și cum îl scosese DOMNUL pe Israel din Egipt.',
          'Ietro, socrul lui Moise, a luat-o pe Sefora, soția lui Moise, după ce acesta o trimisese înapoi,',
          'împreună cu cei doi fii ai ei. Unul se numea Gherșom, căci Moise spusese: „Am locuit ca străin într-o țară străină.”',
          'Celălalt se numea Eliezer, căci Moise spusese: „Dumnezeul tatălui meu mi-a fost ajutor și m-a izbăvit de sabia faraonului.”',
          'Ietro, socrul lui Moise, a venit la Moise în pustie, împreună cu fiii și soția lui Moise, acolo unde acesta își așezase tabăra, la muntele lui Dumnezeu.',
          'I-a transmis lui Moise: „Eu, socrul tău Ietro, vin la tine împreună cu soția ta și cu cei doi fii ai ei.”',
          'Moise a ieșit în întâmpinarea socrului său, s-a plecat și l-a sărutat. S-au întrebat unul pe altul de sănătate, apoi au intrat în cort.',
          'Moise i-a povestit socrului său tot ce făcuse DOMNUL faraonului și egiptenilor pentru Israel, toate greutățile care îi întâmpinaseră pe drum și cum îi izbăvise DOMNUL.',
          'Ietro s-a bucurat de tot binele pe care DOMNUL îl făcuse lui Israel, izbăvindu-l din mâna egiptenilor.',
          'Ietro a spus: „Binecuvântat să fie DOMNUL, Care v-a izbăvit din mâna egiptenilor și din mâna faraonului și Care a izbăvit poporul de sub puterea egiptenilor!',
          'Acum știu că DOMNUL este mai mare decât toți dumnezeii, tocmai în lucrul în care egiptenii s-au purtat cu trufie împotriva lor.”',
          'Ietro, socrul lui Moise, a adus pentru Dumnezeu o ardere-de-tot și alte jertfe. Aaron și toți bătrânii lui Israel au venit să mănânce împreună cu socrul lui Moise înaintea lui Dumnezeu.',
          'A doua zi, Moise s-a așezat să judece poporul, iar oamenii au stat în jurul lui de dimineața până seara.',
          'Când socrul lui Moise a văzut tot ce făcea acesta pentru popor, a spus: „Ce faci tu pentru popor? De ce stai singur, iar tot poporul stă în jurul tău de dimineața până seara?”',
          'Moise i-a răspuns socrului său: „Pentru că poporul vine la mine să-L întrebe pe Dumnezeu.',
          'Când au o neînțelegere, vin la mine; eu judec între un om și semenul său și le fac cunoscute hotărârile și legile lui Dumnezeu.”',
          'Socrul lui Moise i-a spus: „Ceea ce faci nu este bine.',
          'Te vei epuiza cu siguranță, atât tu, cât și poporul acesta care este cu tine, căci sarcina este prea grea pentru tine. Nu o poți îndeplini singur.',
          'Ascultă acum glasul meu. Îți voi da un sfat, iar Dumnezeu să fie cu tine. Tu să reprezinți poporul înaintea lui Dumnezeu și să aduci neînțelegerile lor înaintea lui Dumnezeu.',
          'Să-i înveți hotărârile și legile, să le arăți calea pe care trebuie să umble și lucrarea pe care trebuie să o facă.',
          'Alege din tot poporul bărbați capabili, care se tem de Dumnezeu, oameni de încredere, care urăsc câștigul nedrept. Pune-i peste oameni drept căpetenii peste mii, peste sute, peste cincizeci și peste zeci.',
          'Ei să judece poporul în orice vreme. Orice problemă grea să o aducă la tine, iar problemele mici să le judece ei. Astfel îți va fi mai ușor, iar ei vor purta povara împreună cu tine.',
          'Dacă vei face lucrul acesta și dacă Dumnezeu îți poruncește astfel, vei putea rezista, iar tot poporul acesta va ajunge în pace la locul său.”',
          'Moise a ascultat glasul socrului său și a făcut tot ce spusese el.',
          'Moise a ales bărbați capabili din tot Israelul și i-a pus conducători peste popor: căpetenii peste mii, peste sute, peste cincizeci și peste zeci.',
          'Ei judecau poporul în orice vreme. Problemele grele le aduceau la Moise, iar problemele mici le judecau ei înșiși.',
          'Apoi Moise i-a dat drumul socrului său, iar acesta a plecat în țara lui.'],
          19:[
          'În luna a treia după ieșirea fiilor lui Israel din țara Egiptului, chiar în ziua aceea, au ajuns în pustia Sinai.',
          'Au pornit din Refidim, au ajuns în pustia Sinai și și-au așezat tabăra în pustie. Israel și-a așezat tabăra acolo, înaintea muntelui.',
          'Moise s-a urcat la Dumnezeu, iar DOMNUL l-a chemat de pe munte și i-a spus: „Așa să vorbești casei lui Iacov și să le spui fiilor lui Israel:',
          '«Ați văzut ce le-am făcut egiptenilor și cum v-am purtat pe aripi de vultur și v-am adus la Mine.',
          'Acum, dacă veți asculta cu adevărat glasul Meu și veți păzi legământul Meu, veți fi comoara Mea deosebită dintre toate popoarele, căci al Meu este tot pământul.',
          'Îmi veți fi o împărăție de preoți și un popor sfânt.» Acestea sunt cuvintele pe care să le spui fiilor lui Israel.”',
          'Moise a venit, i-a chemat pe bătrânii poporului și a pus înaintea lor toate aceste cuvinte pe care i le poruncise DOMNUL.',
          'Tot poporul a răspuns într-un glas: „Vom face tot ce a spus DOMNUL.” Moise a dus cuvintele poporului înapoi la DOMNUL.',
          'DOMNUL i-a spus lui Moise: „Iată, voi veni la tine într-un nor gros, ca poporul să audă când vorbesc cu tine și să aibă întotdeauna încredere în tine.” Moise I-a spus DOMNULUI cuvintele poporului.',
          'DOMNUL i-a spus lui Moise: „Du-te la popor și sfințește-l astăzi și mâine. Să-și spele hainele',
          'și să fie gata pentru ziua a treia, căci în ziua a treia DOMNUL va coborî înaintea ochilor întregului popor pe muntele Sinai.',
          'Să pui hotare de jur împrejurul poporului și să spui: «Aveți grijă să nu vă urcați pe munte și să nu-i atingeți marginea. Oricine va atinge muntele va fi omorât.',
          'Nicio mână să nu-l atingă, ci să fie ucis cu pietre sau străpuns cu săgeți. Fie animal, fie om, nu va trăi.» Când cornul va suna prelung, ei se vor putea apropia de munte.”',
          'Moise a coborât de pe munte la popor, a sfințit poporul, iar ei și-au spălat hainele.',
          'El a spus poporului: „Fiți gata pentru ziua a treia. Să nu vă apropiați de femei.”',
          'În dimineața zilei a treia au fost tunete, fulgere și un nor gros pe munte și s-a auzit un sunet de corn foarte puternic. Tot poporul din tabără a tremurat.',
          'Moise a scos poporul din tabără în întâmpinarea lui Dumnezeu, iar ei s-au așezat la poalele muntelui.',
          'Tot muntele Sinai fumega, fiindcă DOMNUL coborâse peste el în foc. Fumul lui se ridica asemenea fumului unui cuptor, iar întregul munte se cutremura puternic.',
          'Sunetul cornului devenea tot mai puternic. Moise vorbea, iar Dumnezeu îi răspundea prin glas.',
          'DOMNUL a coborât pe muntele Sinai, pe vârful muntelui. DOMNUL l-a chemat pe Moise pe vârful muntelui, iar Moise s-a urcat.',
          'DOMNUL i-a spus lui Moise: „Coboară și avertizează poporul să nu dea năvală spre DOMNUL ca să privească, altfel mulți dintre ei vor pieri.',
          'Chiar și preoții care se apropie de DOMNUL să se sfințească, pentru ca DOMNUL să nu izbucnească împotriva lor.”',
          'Moise I-a spus DOMNULUI: „Poporul nu se poate urca pe muntele Sinai, căci Tu ne-ai avertizat: «Pune hotare în jurul muntelui și sfințește-l.»”',
          'DOMNUL i-a răspuns: „Coboară! Apoi să urci împreună cu Aaron. Dar preoții și poporul să nu dea năvală să urce spre DOMNUL, ca El să nu izbucnească împotriva lor.”',
          'Moise a coborât la popor și le-a spus aceste lucruri.'],
          20:[
          'Dumnezeu a rostit toate aceste cuvinte:',
          '„Eu sunt DOMNUL, Dumnezeul tău, Care te-am scos din țara Egiptului, din casa robiei.',
          'Să nu ai alți dumnezei înaintea Mea.',
          'Să nu-ți faci idol și nicio imagine a ceea ce este în ceruri sus, pe pământ jos sau în apele de sub pământ.',
          'Să nu te pleci înaintea lor și să nu le slujești, căci Eu, DOMNUL, Dumnezeul tău, sunt un Dumnezeu gelos, Care cercetez vina părinților în copii până la a treia și a patra generație a celor care Mă urăsc,',
          'dar arăt bunătate statornică până la mii de generații celor care Mă iubesc și păzesc poruncile Mele.',
          'Să nu folosești Numele DOMNULUI, Dumnezeul tău, pentru ceva fals sau lipsit de valoare, căci DOMNUL nu-l va socoti nevinovat pe cel care Îi folosește Numele astfel.',
          'Adu-ți aminte de ziua Sabatului ca să o sfințești.',
          'Șase zile să lucrezi și să-ți faci toată munca,',
          'dar ziua a șaptea este un Sabat pentru DOMNUL, Dumnezeul tău. Să nu faci nicio muncă: nici tu, nici fiul tău, nici fiica ta, nici sclavul tău, nici sclava ta, nici animalele tale, nici străinul care este în cetățile tale.',
          'Căci în șase zile DOMNUL a făcut cerurile, pământul, marea și tot ce este în ele, iar în ziua a șaptea S-a odihnit. De aceea DOMNUL a binecuvântat ziua Sabatului și a sfințit-o.',
          'Cinstește-l pe tatăl tău și pe mama ta, pentru ca zilele tale să fie îndelungate în țara pe care ți-o dă DOMNUL, Dumnezeul tău.',
          'Să nu comiți omor.',
          'Să nu comiți adulter.',
          'Să nu furi.',
          'Să nu depui mărturie falsă împotriva semenului tău.',
          'Să nu poftești casa semenului tău. Să nu poftești soția semenului tău, nici sclavul lui, nici sclava lui, nici boul lui, nici măgarul lui și nimic din ce este al semenului tău.”',
          'Tot poporul percepea tunetele, fulgerele, sunetul cornului și muntele fumegând. Când poporul a văzut acestea, a tremurat și a rămas la distanță.',
          'Ei i-au spus lui Moise: „Vorbește-ne tu și vom asculta, dar să nu ne vorbească Dumnezeu, ca să nu murim.”',
          'Moise a spus poporului: „Nu vă temeți, căci Dumnezeu a venit ca să vă pună la încercare și pentru ca teama de El să fie înaintea voastră, ca să nu păcătuiți.”',
          'Poporul a rămas la distanță, iar Moise s-a apropiat de întunericul gros în care era Dumnezeu.',
          'DOMNUL i-a spus lui Moise: „Așa să le vorbești fiilor lui Israel: «Voi înșivă ați văzut că v-am vorbit din cer.',
          'Să nu vă faceți dumnezei de argint alături de Mine și să nu vă faceți dumnezei de aur.',
          'Să-Mi faci un altar de pământ și să aduci pe el arderile-de-tot și jertfele de pace, oile și vitele tale. În orice loc în care voi face ca Numele Meu să fie amintit, voi veni la tine și te voi binecuvânta.',
          'Dacă Îmi vei face un altar de piatră, să nu-l construiești din pietre cioplite, căci, dacă îți vei ridica unealta asupra lor, le vei profana.',
          'Să nu urci pe trepte la altarul Meu, ca să nu ți se descopere goliciunea înaintea lui.»”']}
          notes={
          16:[(14,'daq mehuspās','ceva mărunt și solzos','Al doilea adjectiv este rar; poate însemna solzos, granulat sau rotund. Textul păstrează aspectul neobișnuit fără a identifica mana cu un produs natural modern.',['mărunt și rotund','mărunt ca niște solzi']),
              (15,'man hu','ce este aceasta?','Numele „mană” este legat narativ de întrebarea poporului, deși etimologia exactă a termenului rămâne discutată.',['ce este?']),
              (16,'omer','omer','Omerul este o unitate antică de volum, definită în versetul 36 ca a zecea parte dintr-o efă; nu este convertit într-o valoare modernă exactă în text.',['aproximativ doi litri']),
              (18,'lo hedtif hammarbeh vehammamit lo hehsir','celui cu mult nu i-a rămas în plus, celui cu puțin nu i-a lipsit','Distribuția arată suficiența pentru nevoia fiecărei persoane; textul nu condamnă orice acumulare în alte contexte.',['cel care strânsese mult nu avea surplus']),
              (23,'shabbaton shabbat-qodesh','o odihnă deplină, un Sabat sfânt','Shabbaton intensifică ideea de încetare și odihnă; este păstrată relația cu Sabatul fără a transforma episodul într-o dezbatere confesională ulterioară.',['un Sabat de odihnă sfântă'])],
          17:[(2,'vayarev / ten-lanu mayim','s-a certat / dați-ne apă','Cererea pentru apă este reală, dar narațiunea o diferențiază de modul conflictual și de punerea lui Dumnezeu la încercare.',['a contestat']),
