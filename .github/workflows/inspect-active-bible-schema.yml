name: Inspect active Bible schema

on:
  push:
    branches:
      - agent/biblia-emanus-ot-repair5
    paths:
      - 'scripts/inspect-active-bible-schema.py'
      - '.github/workflows/inspect-active-bible-schema.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-ot-repair5
      - run: python3 scripts/inspect-active-bible-schema.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/OT-REPAIR5-ACTIVE-SCHEMA.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(bible): persist active publication schema summary'
            git push origin HEAD:agent/biblia-emanus-ot-repair5
          fi
