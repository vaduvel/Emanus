name: VT Materialize Work Texts

on:
  push:
    branches:
      - agent/biblia-explicata-vt-complet
  pull_request:
    branches:
      - agent/biblia-explicata-vt-maleahi

permissions:
  contents: write

concurrency:
  group: vt-materialize-work-texts
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-complet
          fetch-depth: 0

      - name: Fetch Bible work-text source
        run: git fetch origin agent/biblia-emanus-ot-and-apocrypha:refs/remotes/origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Materialize all 29 VT overlay books
        run: python3 scripts/materialize-vt-overlay-texts.py --source-ref origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Verify generated footprint
        run: |
          test "$(find packages/shared/src/bible/generated/vtCanonicalText -maxdepth 1 -name '*Text.ts' | wc -l)" -eq 29
          test -f packages/shared/src/bible/generated/vtCanonicalText/index.ts
          git diff --check -- packages/shared/src/bible/generated/vtCanonicalText

      - name: Commit validated work texts
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- packages/shared/src/bible/generated/vtCanonicalText)" ]; then
            echo 'Textele de lucru VT sunt deja materializate.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/shared/src/bible/generated/vtCanonicalText
          git commit -m 'feat(bible): materialize all VT overlay work texts'
          git push origin HEAD:agent/biblia-explicata-vt-complet
