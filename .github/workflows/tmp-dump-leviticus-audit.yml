name: Temporary dump Leviticus audit

on:
  push:
    branches:
      - agent/biblia-emanus-leviticul
    paths:
      - .github/workflows/tmp-dump-leviticus-audit.yml

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-leviticul
          fetch-depth: 0
      - name: Build compact audit inventories
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          files=sorted(root.glob('LEV.*.json'),key=lambda p:int(p.stem.split('.')[1]))
          verses=[];notes=[];summary=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8')); ch=d['chapter']
              verses += [f"LEV {ch}:{v['number']}\t{v['text']}" for v in d['verses']]
              ens=d.get('editorialNotes',[])
              summary.append(f"LEV {ch}\tverses={len(d['verses'])}\tnotes={len(ens)}\tstatus={d.get('status')}\tpublic={d.get('public')}")
              notes += [f"LEV {ch}:{n.get('verse')}\t{n.get('term','')}\t{n.get('decision','')}\t{n.get('reason',n.get('resolutionReason',''))}" for n in ens]
          (root/'.audit-LEV-verses.txt').write_text('\n'.join(verses)+'\n',encoding='utf-8')
          (root/'.audit-LEV-notes.txt').write_text('\n'.join(notes)+'\n',encoding='utf-8')
          (root/'.audit-LEV-summary.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          PY
          git rm .github/workflows/tmp-dump-leviticus-audit.yml
          git add docs/data/biblia-emanus/.audit-LEV-*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Create temporary Leviticus audit inventories"
          git push origin HEAD:agent/biblia-emanus-leviticul
