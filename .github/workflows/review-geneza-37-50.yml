name: Review Geneza 37-50

on:
  push:
    branches: [review/geneza-37-50]
  pull_request:
    branches: [main]
    paths:
      - 'packages/shared/src/bible/geneza*.ts'
      - 'docs/33-raport-revizie-ai-geneza-37-50.md'

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Aplica revizia editoriala
        run: python3 scripts/run-review-geneza-37-50.py
      - name: Commit indreptari aplicate de CI
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/bible/geneza*.ts
          git commit -m "fix(biblia): revizuieste Geneza 37-50"
          git push
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verifica continutul si buildul shared
        run: |
          pnpm check:quotes
          pnpm check:typos
          pnpm build:shared
          pnpm check:content
