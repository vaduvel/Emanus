name: Repair OT repair 5 truncations

on:
  push:
    branches:
      - agent/biblia-emanus-ot-repair5
    paths:
      - 'scripts/repair-ot-repair5-truncations.py'
      - '.github/workflows/repair-ot-repair5-truncations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-ot-repair5
      - name: Apply verified truncation repairs
        run: python3 scripts/repair-ot-repair5-truncations.py
      - name: Commit repaired candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/biblia-emanus-candidates docs/biblia-emanus/OT-REPAIR5-TRUNCATION-REPAIRS.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(bible): restore 33 truncated Old Testament verses'
            git push origin HEAD:agent/biblia-emanus-ot-repair5
          fi
