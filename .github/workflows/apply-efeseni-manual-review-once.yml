name: Apply Ephesians Manual Review Once

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-efeseni-manual-review-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and freeze reviewed Ephesians decisions
        run: |
          set -euo pipefail
          node scripts/materialize-nt-manual-semantic-efeseni.mjs
          python3 scripts/merge_nt_semantic_review_artifacts.py \
            --input docs/data/biblia-explicata/nt-semantic-review-manual \
            --ledger docs/data/biblia-explicata/nt-semantic-review-ledger.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path('docs/data/biblia-explicata/nt-semantic-review-ledger.json').read_text(encoding='utf-8'))
          eph = [d for d in ledger['decisions'] if d['bookId'] == 'efeseni']
          if len(ledger['decisions']) != 55 or len(eph) != 23:
              raise SystemExit(f"Expected 55 total / 23 Efeseni decisions, got {len(ledger['decisions'])} / {len(eph)}")
          print('Frozen semantic ledger: 55 total / 23 Efeseni.')
          PY

      - name: Add Ephesians materializer to recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/nt-explanation-recovery.yml')
          src = path.read_text(encoding='utf-8')
          needle = '          node scripts/materialize-nt-manual-semantic-galateni.mjs\n'
          addition = needle + '          node scripts/materialize-nt-manual-semantic-efeseni.mjs\n'
          if 'materialize-nt-manual-semantic-efeseni.mjs' not in src:
              if src.count(needle) != 1:
                  raise SystemExit(f'Expected one Galateni materializer line, found {src.count(needle)}')
              src = src.replace(needle, addition)
          path.write_text(src, encoding='utf-8')
          PY
          grep -q 'materialize-nt-manual-semantic-efeseni.mjs' .github/workflows/nt-explanation-recovery.yml

      - name: Commit frozen review and remove one-shot
        run: |
          set -euo pipefail
          rm .github/workflows/apply-efeseni-manual-review-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/nt-explanation-recovery.yml
          git add docs/data/biblia-explicata/nt-semantic-review-manual/10-efeseni.json
          git add docs/data/biblia-explicata/nt-semantic-review-ledger.json
          git add -u .github/workflows/apply-efeseni-manual-review-once.yml
          git diff --cached --check
          git commit -m 'Freeze Ephesians semantic transcript review'
          for attempt in 1 2 3; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            git rebase FETCH_HEAD
            if git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
          done
          exit 1
