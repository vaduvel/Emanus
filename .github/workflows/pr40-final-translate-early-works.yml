name: PR40 final — translate early works

on:
  push:
    branches:
      - agent/biblia-emanus-pr40-final
    paths:
      - 'scripts/extract-pr40-early-works.py'
      - 'scripts/extract-pr40-early-works-v2.py'
      - 'scripts/translate-pr40-early-works.py'
      - 'scripts/translate-pr40-early-works-v2.py'
      - '.github/workflows/pr40-final-translate-early-works.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr40-final-early-translation
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extraction and translation runtime
        run: pip install --disable-pip-version-check 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'torch>=2.5,<3' 'transformers>=4.45,<5' 'sentencepiece>=0.2,<1' 'huggingface-hub>=0.26,<1'
      - name: Rebuild and verify source corpus
        run: python3 scripts/extract-pr40-early-works-v2.py
      - name: Generate Romanian candidates
        run: python3 scripts/translate-pr40-early-works-v2.py --batch-size 16
      - name: Upload Romanian candidates and audit ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-final-early-romanian-drafts
          path: |
            docs/data/biblia-emanus-early-romanian-candidates
            docs/biblia-emanus/PR40-EARLY-WORKS-ROMANIAN-DRAFT.json
            docs/biblia-emanus/PR40-EARLY-WORKS-EXTRACTION.json
          if-no-files-found: warn
          retention-days: 7
