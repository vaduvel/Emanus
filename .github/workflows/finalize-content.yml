name: Finalize content fixes

on:
  push:
    branches: [main]
    paths:
      - scripts/wire-pilde-c4.py
      - .github/workflows/finalize-content.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python3 scripts/fix-known-typos.py
      - run: python3 scripts/wire-pilde-c4.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:quotes
      - run: pnpm typecheck
      - run: pnpm build
      - name: Commit validated result
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src apps/web/src
          git commit -m "fix(content): corecturi si wiring pentru cursul 4 de pilde"
          git push origin HEAD:main
