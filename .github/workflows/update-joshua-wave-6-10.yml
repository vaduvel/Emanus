name: Update Joshua 6-10

on:
  push:
    branches:
      - agent/biblia-emanus-iosua

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-iosua
          fetch-depth: 0

      - name: Update ledger and manifest
        run: python3 scripts/update-joshua-wave-6-10.py

      - name: Remove temporary files
        run: |
          rm scripts/update-joshua-wave-6-10.py
          rm .github/workflows/update-joshua-wave-6-10.yml

      - name: Commit final wave
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Audit and publish Joshua 6-10"
          git push origin HEAD:agent/biblia-emanus-iosua
