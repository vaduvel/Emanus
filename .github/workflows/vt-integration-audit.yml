name: VT Integration Audit

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch final VT branch
        run: git fetch origin agent/biblia-explicata-vt-complet:refs/remotes/origin/agent/biblia-explicata-vt-complet

      - name: Classify diff against main
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = 'origin/agent/biblia-explicata-vt-complet'
          raw = subprocess.check_output(
              ['git', 'diff', '--name-only', f'origin/main...{source}'],
              text=True,
          )
          paths = [p for p in raw.splitlines() if p.strip()]

          vt_book_tokens = (
              'geneza', 'exod', 'levitic', 'numeri', 'deuteronom', 'iosua',
              'judecatori', 'rut', 'samuel', 'imparati', 'cronici', 'ezra',
              'neemia', 'estera', 'iov', 'psalm', 'proverb', 'eclesiast',
              'cantarea', 'isaia', 'ieremia', 'planger', 'ezechiel', 'daniel',
              'osea', 'ioel', 'amos', 'obadia', 'iona', 'mica', 'naum',
              'habacuc', 'tefania', 'hagai', 'zaharia', 'maleahi',
          )
          nt_tokens = (
              'matei', 'marcu', 'luca', 'ioan', 'fapte', 'romani', 'corinteni',
              'galateni', 'efeseni', 'filipeni', 'coloseni', 'tesaloniceni',
              'timotei', 'tit', 'filimon', 'evrei', 'iacov', 'petru', 'iuda',
              'apocalipsa',
          )

          groups = {
              'vt_research': [],
              'vt_docs': [],
              'vt_workflows': [],
              'vt_scripts': [],
              'vt_bible_specific': [],
              'vt_bible_infra': [],
              'reader_or_package': [],
              'nt_or_foreign': [],
              'unclassified': [],
          }

          bible_infra_names = {
              'completeOverlay.ts', 'explainedOverlay.ts', 'overlayBibleBooks.ts',
              'publicationBible.ts', 'vtExplainedCoverage.ts',
              'vtFullNarrativesHistorical.ts', 'vtFullNarrativesWisdom.ts',
              'vtFullNarrativesMajorProphets.ts', 'vtFullNarrativesMinorProphets.ts',
          }

          for p in paths:
              low = p.lower()
              name = Path(p).name
              if p.startswith('.research/poonen-through-the-bible-OT/'):
                  groups['vt_research'].append(p)
              elif p.startswith('docs/biblia-explicata/'):
                  groups['vt_docs'].append(p)
              elif p.startswith('.github/workflows/vt-'):
                  groups['vt_workflows'].append(p)
              elif p.startswith('scripts/') and ('vt-' in low or 'vt_' in low or 'materialize-vt' in low):
                  groups['vt_scripts'].append(p)
              elif p.startswith('packages/shared/src/bible/generated/vtCanonicalText/'):
                  groups['vt_bible_specific'].append(p)
              elif p.startswith('packages/shared/src/bible/overlays/'):
                  groups['vt_bible_specific'].append(p)
              elif p.startswith('packages/shared/src/bible/data/') and any(tok in low for tok in vt_book_tokens):
                  groups['vt_bible_specific'].append(p)
              elif p.startswith('packages/shared/src/bible/') and any(tok in low for tok in vt_book_tokens):
                  groups['vt_bible_specific'].append(p)
              elif p.startswith('packages/shared/src/bible/') and name in bible_infra_names:
                  groups['vt_bible_infra'].append(p)
              elif p in {
                  'apps/web/src/screens/Bible.tsx', 'apps/web/src/bible.css',
                  'package.json', 'packages/shared/package.json', '.github/workflows/ci.yml'
              }:
                  groups['reader_or_package'].append(p)
              elif any(tok in low for tok in nt_tokens) or p.startswith('.research/marcu-poonen/'):
                  groups['nt_or_foreign'].append(p)
              else:
                  groups['unclassified'].append(p)

          print(f'TOTAL_CHANGED={len(paths)}')
          for key, vals in groups.items():
              print(f'\n## {key} ({len(vals)})')
              for p in vals:
                  print(p)

          selected = sum((groups[k] for k in (
              'vt_research','vt_docs','vt_workflows','vt_scripts',
              'vt_bible_specific','vt_bible_infra','reader_or_package'
          )), [])
          print(f'\nSELECTED_CANDIDATES={len(selected)}')
          print(f'FOREIGN_OR_NT={len(groups["nt_or_foreign"])}')
          print(f'UNCLASSIFIED={len(groups["unclassified"])}')
          PY
