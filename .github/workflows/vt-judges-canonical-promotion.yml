name: VT Judecatori Canonical Promotion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vt-judges-canonical-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promote-judges:
    if: github.head_ref == 'agent/biblia-explicata-vt-integration-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Verify complete Judecatori fresh review
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs/biblia-explicata/ot-reaudit/JDG/reviews')
          files = [root / f'{chapter:03d}.json' for chapter in range(1, 22)]
          total = 0
          for path in files:
              if not path.is_file():
                  raise SystemExit(f'Missing review: {path}')
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('status') != 'fresh-semantic-review-complete':
                  raise SystemExit(f'{path}: review incomplete')
              total += int(data.get('reviewedVerses', 0))
          if total != 618:
              raise SystemExit(f'Judecatori review: {total}/618 verses')
          print('Judecatori fresh review complete: 21/21 chapters, 618/618 verses')
          PY

      - name: Fetch legacy OT candidate branch for still-temporary books
        run: git fetch origin agent/biblia-emanus-ot-and-apocrypha:refs/remotes/origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Download current sources and public-domain benchmarks
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/engwebp_current.zip https://ebible.org/Scriptures/engwebp_usfm.zip
          curl --fail --location --retry 3 --output /tmp/hboWLC_current.zip https://ebible.org/Scriptures/hboWLC_usfm.zip
          curl --fail --location --retry 3 --output /tmp/ronbtf_current.zip https://ebible.org/Scriptures/ronbtf_usfm.zip
          curl --fail --location --retry 3 --output /tmp/ron1924_current.zip https://ebible.org/Scriptures/ron1924_usfm.zip

      - name: Materialize Judecatori from fresh semantic review
        run: |
          python3 scripts/promote-reviewed-ot-book.py \
            --book JDG \
            --webu-zip /tmp/engwebp_current.zip \
            --wlc-zip /tmp/hboWLC_current.zip \
            --btf-zip /tmp/ronbtf_current.zip \
            --cornilescu-zip /tmp/ron1924_current.zip

      - name: Validate canonical Judecatori publication gate
        run: python3 scripts/check-biblia-emanus-book.py --book JDG

      - name: Verify Judecatori seal eligibility
        run: python3 scripts/seal-biblia-emanus.py --book JDG --check

      - name: Materialize current VT reader catalog
        run: python3 scripts/materialize-vt-overlay-texts.py --source-ref origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Validate full Biblia Emanus corpus
        run: python3 scripts/check-biblia-emanus-corpus.py

      - name: Validate explanations, provenance and reader
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile
          pnpm check:vt-legacy-provenance
          pnpm check:vt-explained
          pnpm check:vt-publication
          pnpm --filter @emanus/shared typecheck

      - name: Commit canonical Judecatori only after all gates pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/data/biblia-emanus/sources/ot-jdg-2026-08-08-usfm.zip \
            docs/data/biblia-emanus/source-lock.json \
            docs/data/biblia-emanus/source-ledger.json \
            docs/data/biblia-emanus/manifest.json \
            docs/data/biblia-emanus/JDG.*.json \
            docs/biblia-explicata/ot-reaudit/JDG-SEMANTIC-REVIEW-SUMMARY.json \
            packages/shared/src/bible/generated/vtCanonicalText
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(bible): materialize canonical Judecatori"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
