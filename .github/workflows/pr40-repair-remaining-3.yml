name: PR40 repair remaining 3 works

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PRIOR_RUN_ID: '31110524525'
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  didascalia:
    name: Repair and audit Didascalia
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: pr40-repair-didascalia-v3-${{ runner.os }}
      - name: Install pinned CPU translation and audit runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'sentencepiece>=0.2,<1' 'huggingface-hub>=0.26,<1' 'sentence-transformers>=3,<4' 'numpy>=2,<3' 'requests>=2,<3'
      - name: Restore the verified Didascalia checkpoint
        uses: actions/download-artifact@v4
        with:
          name: pr40-early-DID
          path: checkpoint
          repository: vaduvel/Emanus
          run-id: ${{ env.PRIOR_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore checkpoint into the working tree
        run: |
          cp -R checkpoint/data/. docs/data/
          cp -R checkpoint/biblia-emanus/. docs/biblia-emanus/
      - name: Segment, retranslate, repair and audit all 43 chapters
        env:
          PR40_BOOKS: DID
        run: python3 scripts/run-with-pinned-hf.py scripts/finalize-pr40-didascalia-checkpoint.py --batch-size 20
      - name: Verify the final Didascalia verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('docs/data/biblia-emanus-early-audited').glob('DID.*.json'))
          assert len(files) == 43, len(files)
          for path in files:
              doc = json.loads(path.read_text(encoding='utf-8'))
              assert doc['status'] == 'published', path
              assert doc['public'] is True, path
              assert doc['runtimeEnabled'] is True, path
              assert doc['audit']['blockingIssueCount'] == 0, path
          print('Didascalia: 43/43 chapters published with zero blockers')
          PY
      - name: Upload final Didascalia evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-early-DID-final
          path: |
            docs/data/biblia-emanus-early-source-candidates
            docs/data/biblia-emanus-early-romanian-candidates
            docs/data/biblia-emanus-early-audited
            docs/biblia-emanus/PR40-EARLY-WORKS-EXTRACTION.json
            docs/biblia-emanus/PR40-EARLY-WORKS-ROMANIAN-DRAFT.json
            docs/biblia-emanus/PR40-EARLY-WORKS-SEMANTIC-AUDIT.json
          if-no-files-found: error
          retention-days: 14

  qumran:
    name: Repair and audit ${{ matrix.id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: TEMP_SCR
            witnesses: 11Q19
            checkpoint: pr40-qumran-TEMP_SCR
          - id: ADD_PSA
            witnesses: 11Q5,4Q381
            checkpoint: pr40-qumran-ADD_PSA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: pr40-repair-qumran-v3-${{ runner.os }}
      - name: Install pinned CPU translation and audit runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'sentencepiece>=0.2,<1' 'huggingface-hub>=0.26,<1' 'sentence-transformers>=3,<4' 'numpy>=2,<3' 'requests>=2,<3'
      - name: Restore verified Qumran source checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.checkpoint }}
          path: checkpoint
          repository: vaduvel/Emanus
          run-id: ${{ env.PRIOR_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore checkpoint into the working tree
        run: |
          cp -R checkpoint/data/. docs/data/
          cp -R checkpoint/biblia-emanus/. docs/biblia-emanus/
      - name: Translate only the selected witnesses
        env:
          PR40_WITNESSES: ${{ matrix.witnesses }}
        run: python3 scripts/run-with-pinned-hf.py scripts/translate-pr40-qumran-shard.py --batch-size 20
      - name: Repair degenerate lines and withhold unsafe fragments
        env:
          PR40_WITNESSES: ${{ matrix.witnesses }}
        run: python3 scripts/run-with-pinned-hf.py scripts/refine-pr40-qumran-candidates.py --batch-size 20
      - name: Audit source fidelity and fragment semantics
        env:
          PR40_WITNESSES: ${{ matrix.witnesses }}
        run: python3 scripts/run-with-pinned-hf.py scripts/audit-pr40-qumran-shard-v2.py
      - name: Verify the final Qumran verdict
        env:
          EXPECTED_WITNESSES: ${{ matrix.witnesses }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          expected = {item for item in os.environ['EXPECTED_WITNESSES'].split(',') if item}
          paths = sorted(Path('docs/data/biblia-emanus-qumran-audited').glob('*.json'))
          found = {path.stem for path in paths}
          assert found == expected, (found, expected)
          for path in paths:
              doc = json.loads(path.read_text(encoding='utf-8'))
              assert doc['status'] == 'published-research', path
              assert doc['public'] is True, path
              assert doc['runtimeEnabled'] is True, path
              assert doc['audit']['blockingIssueCount'] == 0, path
          print(f'Qumran {sorted(expected)}: published research edition with zero blockers')
          PY
      - name: Upload final Qumran evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-qumran-${{ matrix.id }}-final
          path: |
            docs/data/biblia-emanus-qumran-source
            docs/data/biblia-emanus-qumran-romanian-candidates
            docs/data/biblia-emanus-qumran-audited
            docs/biblia-emanus/PR40-QUMRAN-SOURCE-CORPUS.json
            docs/biblia-emanus/PR40-QUMRAN-ROMANIAN-DRAFT.json
            docs/biblia-emanus/PR40-QUMRAN-ROMANIAN-AUDIT.json
          if-no-files-found: error
          retention-days: 14

  publish-64:
    name: Assemble and validate all 64 PR40 works
    needs: [didascalia, qumran]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - run: echo 'Manual repair workflow retained only for explicit recovery. Final publication uses pr40-finalize-verified-64.yml.'
