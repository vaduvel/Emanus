name: Inspect WLC versification repair 5

on:
  push:
    branches:
      - agent/biblia-emanus-ot-repair5
    paths:
      - 'scripts/inspect-wlc-versification-repair5.py'
      - '.github/workflows/inspect-wlc-versification-repair5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-ot-repair5
      - run: python3 scripts/inspect-wlc-versification-repair5.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/OT-REPAIR5-WLC-CHAPTER-DIFFERENCES.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(bible): persist exact WLC versification differences'
            git push origin HEAD:agent/biblia-emanus-ot-repair5
          fi
