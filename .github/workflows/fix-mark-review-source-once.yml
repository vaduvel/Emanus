name: Fix Mark Review Source Once

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
    paths:
      - .github/workflows/fix-mark-review-source-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Repair source and remove one-shot workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/review-nt-poonen-fidelity-marcu-14-16.mjs')
          source = path.read_text(encoding='utf-8')
          replacements = {
              '`textualStatus: double-bracketed`': '«textualStatus: double-bracketed»',
              '`double-bracketed`': '«double-bracketed»',
              'Poonen expune versetele 9–20': 'Expunerea tratează versetele 9–20',
              'Poonen leagă alungarea demonilor': 'Expunerea leagă alungarea demonilor',
          }
          changed = 0
          for before, after in replacements.items():
              count = source.count(before)
              if count:
                  source = source.replace(before, after)
                  changed += count
          if 'Poonen expune' in source or 'Poonen leagă' in source:
              raise SystemExit('Public source attribution still remains in Mark 16 reader copy')
          if '`textualStatus: double-bracketed`' in source or '`double-bracketed`' in source:
              raise SystemExit('Unsafe embedded backticks still remain')
          if changed < 2:
              raise SystemExit(f'Expected source repair work; only {changed} replacements applied')
          path.write_text(source, encoding='utf-8')
          print(f'Applied {changed} permanent Mark review source repairs.')
          PY

          git rm .github/workflows/fix-mark-review-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/review-nt-poonen-fidelity-marcu-14-16.mjs
          git commit -m "Fix Mark 16 direct reader copy provenance"

          for attempt in 1 2 3; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            git rebase FETCH_HEAD
            if git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then
              exit 0
            fi
          done
          exit 1
