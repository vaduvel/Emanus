name: Cancel superseded PR runs

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cancel-superseded-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-superseded:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Cancel older runs for this PR branch through the REST API
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          current_run = int(os.environ['CURRENT_RUN_ID'])
          current_head = os.environ['CURRENT_HEAD']
          current_branch = os.environ['CURRENT_BRANCH']
          active = {'queued', 'in_progress', 'waiting', 'pending', 'requested'}
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'emanus-pr40-cleanup',
          }

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?event=pull_request&per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              runs = json.load(response)['workflow_runs']

          superseded = [
              run for run in runs
              if int(run['id']) < current_run
              and run.get('head_branch') == current_branch
              and run.get('head_sha') != current_head
              and run.get('status') in active
          ]
          print(f'Current run: {current_run}')
          print(f'Current branch: {current_branch}')
          print(f'Current head: {current_head}')
          print(f'Superseded older active runs: {len(superseded)}')

          for run in superseded:
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel"
              for attempt in range(1, 7):
                  try:
                      req = urllib.request.Request(url, data=b'', method='POST', headers=headers)
                      with urllib.request.urlopen(req) as response:
                          response.read()
                      print(f"Cancelled {run['name']} #{run['run_number']} ({run['id']})")
                      break
                  except urllib.error.HTTPError as error:
                      if error.code in {409, 422}:
                          print(f"Run {run['id']} already completed or no longer cancellable")
                          break
                      if error.code in {502, 503, 504} and attempt < 6:
                          delay = min(30, 2 ** attempt)
                          print(f"Transient API {error.code} cancelling {run['id']}; retrying in {delay}s")
                          time.sleep(delay)
                          continue
                      print(f"Could not cancel run {run['id']}: HTTP {error.code}")
                      break
          PY
