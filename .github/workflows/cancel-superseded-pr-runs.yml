name: Cancel superseded PR runs

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel older runs for this PR branch
        uses: actions/github-script@v7
        with:
          script: |
            const currentRunId = Number(context.runId);
            const currentHead = context.payload.pull_request?.head?.sha ?? context.sha;
            const currentBranch = context.payload.pull_request?.head?.ref ?? context.ref.replace('refs/heads/', '');
            const activeStatuses = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'pull_request',
                per_page: 100,
              },
            );

            const superseded = runs.filter((run) =>
              run.id < currentRunId &&
              run.head_branch === currentBranch &&
              run.head_sha !== currentHead &&
              activeStatuses.has(run.status)
            );

            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const cancelWithRetry = async (run) => {
              for (let attempt = 1; attempt <= 6; attempt += 1) {
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  core.info(`Cancelled ${run.name} #${run.run_number} (${run.id}) on ${run.head_sha}`);
                  return;
                } catch (error) {
                  if (error.status === 409 || error.status === 422) {
                    core.info(`Run ${run.id} already completed or no longer cancellable`);
                    return;
                  }
                  if ([502, 503, 504].includes(error.status) && attempt < 6) {
                    const delay = Math.min(30000, 2000 * (2 ** (attempt - 1)));
                    core.warning(`Transient GitHub API ${error.status} cancelling ${run.id}; retry ${attempt}/6 in ${delay}ms`);
                    await sleep(delay);
                    continue;
                  }
                  core.warning(`Could not cancel run ${run.id}: ${error.status ?? 'unknown'} ${error.message}`);
                  return;
                }
              }
            };

            core.info(`Current run: ${currentRunId}`);
            core.info(`Current branch: ${currentBranch}`);
            core.info(`Current head: ${currentHead}`);
            core.info(`Superseded older active runs: ${superseded.length}`);

            for (const run of superseded) {
              await cancelWithRetry(run);
            }
