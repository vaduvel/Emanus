name: Inspect authentic Qumran dataset

on:
  push:
    branches:
      - agent/biblia-emanus-all-pr40-rebuild
    paths:
      - 'scripts/inspect-qumran-etcbc.py'
      - '.github/workflows/inspect-qumran-etcbc.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr40-qumran-inventory
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-all-pr40-rebuild
      - name: Inspect ETCBC DSS commit and document features
        run: python3 scripts/inspect-qumran-etcbc.py
      - name: Upload exact inventory
        uses: actions/upload-artifact@v4
        with:
          name: pr40-qumran-etcbc-inventory
          path: docs/biblia-emanus/PR40-QUMRAN-ETCBC-INVENTORY.json
          retention-days: 7
      - name: Persist manuscript map
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/PR40-QUMRAN-ETCBC-INVENTORY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(bible): persist exact Qumran manuscript map'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/biblia-emanus-all-pr40-rebuild
            if git push origin HEAD:agent/biblia-emanus-all-pr40-rebuild; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
