name: Inspect authentic Qumran dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ETCBC DSS commit and document features
        run: python3 scripts/inspect-qumran-etcbc.py
      - name: Upload exact inventory
        uses: actions/upload-artifact@v4
        with:
          name: pr40-qumran-etcbc-inventory
          path: docs/biblia-emanus/PR40-QUMRAN-ETCBC-INVENTORY.json
          if-no-files-found: error
          retention-days: 7
