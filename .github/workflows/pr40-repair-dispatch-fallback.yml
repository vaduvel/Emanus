name: PR40 dispatch remaining repair fallback

on:
  schedule:
    - cron: '23,28,33,38,43,48,53,58 4 7 8 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr40-repair-remaining-3
          fetch-depth: 0
      - id: state
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path('docs/biblia-emanus/PR40-FINAL-PUBLICATION-VERDICT.json')
          done = False
          if p.exists():
              try:
                  r = json.loads(p.read_text(encoding='utf-8'))
                  done = r.get('status') == 'published' and r.get('counts', {}).get('works') == 64 and r.get('blockingIssues') == 0
              except Exception:
                  pass
          print(f"done={'true' if done else 'false'}")
          PY
      - name: Dispatch the repair workflow explicitly
        if: steps.state.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pr40-repair-remaining-3-scheduled.yml/dispatches \
            -d '{"ref":"main"}'
      - name: Record that GitHub accepted the native dispatch
        if: steps.state.outputs.done != 'true'
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('docs/biblia-emanus/PR40-REPAIR-DISPATCHED.json')
          p.write_text(json.dumps({
              'status': 'dispatched',
              'workflow': 'pr40-repair-remaining-3-scheduled.yml',
              'sourceRunId': os.environ.get('GITHUB_RUN_ID'),
              'dispatchedAt': datetime.now(timezone.utc).isoformat(),
          }, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/PR40-REPAIR-DISPATCHED.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record native PR40 repair dispatch'
          git push origin HEAD:agent/pr40-repair-remaining-3
