name: Temporary NT human-quality audit

on:
  push:
    branches:
      - agent/biblia-emanus-nt-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full NT scan
        run: python3 scripts/tmp-audit-nt-human-quality.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: nt-human-quality-report
          path: tmp-nt-human-quality/
          retention-days: 1
