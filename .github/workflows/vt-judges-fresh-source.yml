name: VT Judecatori Fresh Source Packet

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vt-judges-fresh-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-judges-review-packet:
    if: github.head_ref == 'agent/biblia-explicata-vt-integration-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0
      - name: Download current WEBU and WLC archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/engwebp_current.zip https://ebible.org/Scriptures/engwebp_usfm.zip
          curl --fail --location --retry 3 --output /tmp/hboWLC_current.zip https://ebible.org/Scriptures/hboWLC_usfm.zip
      - name: Build fresh Judecatori source packet and review chunks
        run: |
          set -euo pipefail
          python3 scripts/prepare-ot-book-fresh-reaudit.py \
            --book JDG \
            --webu-zip /tmp/engwebp_current.zip \
            --wlc-zip /tmp/hboWLC_current.zip
          python3 scripts/split-ot-book-fresh-reaudit.py --book JDG
          python3 scripts/chunk-ot-book-fresh-reaudit.py --book JDG --size 12
      - name: Commit fresh Judecatori packet
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/biblia-explicata/ot-reaudit/JDG-FRESH-SOURCE-REAUDIT.json docs/biblia-explicata/ot-reaudit/JDG
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(bible): build fresh Judecatori review evidence"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
