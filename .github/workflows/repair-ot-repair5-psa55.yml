name: Repair OT repair 5 Psalm 55

on:
  push:
    branches:
      - agent/biblia-emanus-ot-repair5
    paths:
      - 'scripts/repair-ot-repair5-psa55.py'
      - '.github/workflows/repair-ot-repair5-psa55.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-ot-repair5
      - name: Apply Psalm 55 repair
        run: python3 scripts/repair-ot-repair5-psa55.py
      - name: Commit repaired chapter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/biblia-emanus-candidates/PSA.55.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(bible): restore singular subject in Psalm 55:20'
            git push origin HEAD:agent/biblia-emanus-ot-repair5
          fi
