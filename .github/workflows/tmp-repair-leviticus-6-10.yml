name: Repair Leviticus 6-10

on:
  push:
    branches:
      - agent/biblia-emanus-leviticul
    paths:
      - .github/workflows/tmp-repair-leviticus-6-10.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-leviticul
          fetch-depth: 0
      - name: Audit Leviticus 6-10
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          corrections={
          6:{1:'DOMNUL i-a vorbit lui Moise și i-a spus:',2:'„Dacă cineva păcătuiește și se poartă cu necredincioșie față de DOMNUL, mințindu-și semenul cu privire la un lucru încredințat, la un bun dat în păstrare, la un lucru furat sau dacă își asuprește semenul,',3:'ori găsește un lucru pierdut și minte cu privire la el, jurând fals în oricare dintre lucrurile prin care omul păcătuiește,',4:'când păcătuiește astfel și devine vinovat, să restituie lucrul furat, bunul luat prin asuprire, lucrul încredințat lui sau lucrul pierdut pe care l-a găsit,',5:'ori orice lucru cu privire la care a jurat fals. Să-l restituie integral, să adauge a cincea parte și să-l dea proprietarului în ziua în care își recunoaște vina.',6:'Să aducă preotului pentru DOMNUL, ca jertfă pentru vină, un berbec fără cusur din turmă, evaluat potrivit valorii stabilite.',9:'„Poruncește-le lui Aaron și fiilor lui: «Aceasta este legea arderii-de-tot: arderea-de-tot să rămână pe vatra altarului toată noaptea până dimineața, iar focul altarului să fie ținut aprins pe el.',10:'Preotul să se îmbrace cu veșmântul său de in și să-și pună pantalonii de in pe trup. Să ridice cenușa rămasă după ce focul a mistuit arderea-de-tot pe altar și să o pună lângă altar.',13:'Focul să ardă permanent pe altar; să nu se stingă.',14:'Aceasta este legea darului de mâncare: fiii lui Aaron să-l prezinte înaintea DOMNULUI, în fața altarului.',15:'Preotul să ia din el un pumn din făina fină și din ulei, împreună cu toată tămâia de pe darul de mâncare, și să ardă pe altar partea de aducere-aminte, ca mireasmă plăcută DOMNULUI.',18:'Orice bărbat dintre urmașii lui Aaron poate mânca din el. Aceasta este partea lor pentru totdeauna, din generație în generație, din jertfele mistuite de foc ale DOMNULUI. Orice lucru care le atinge va deveni sfânt.»”',20:'„Acesta este darul pe care Aaron și fiii lui îl vor aduce DOMNULUI în ziua în care va fi uns: a zecea parte dintr-o efă de făină fină, ca dar de mâncare permanent, jumătate dimineața și jumătate seara.',23:'Orice dar de mâncare al unui preot să fie ars în întregime; să nu fie mâncat.”',25:'„Vorbește-le lui Aaron și fiilor lui: «Aceasta este legea jertfei pentru păcat: jertfa pentru păcat să fie înjunghiată înaintea DOMNULUI în locul unde este înjunghiată arderea-de-tot. Este preasfântă.',27:'Orice lucru care îi atinge carnea va deveni sfânt. Dacă sângele ei stropește o haină, partea stropită să fie spălată într-un loc sfânt.',30:'Dar nicio jertfă pentru păcat din al cărei sânge este adus în Cortul Întâlnirii ca să se facă ispășire în Locul Sfânt să nu fie mâncată; să fie arsă în foc.»”'},
          7:{1:'„Aceasta este legea jertfei pentru vină. Ea este preasfântă.',2:'Jertfa pentru vină să fie înjunghiată în locul unde este înjunghiată arderea-de-tot, iar sângele ei să fie stropit de jur împrejur pe altar.',3:'Să fie adusă toată grăsimea ei: coada grasă și grăsimea care acoperă măruntaiele,',4:'cei doi rinichi cu grăsimea de pe ei, de lângă coapse, și lobul ficatului, care va fi îndepărtat împreună cu rinichii.',7:'Jertfa pentru păcat și jertfa pentru vină au aceeași lege. Ea va fi a preotului care face ispășire prin ea.',11:'Aceasta este legea jertfei de pace pe care cineva o aduce DOMNULUI:',12:'Dacă o aduce ca mulțumire, să aducă împreună cu jertfa de mulțumire turte nedospite frământate cu ulei, lipii nedospite unse cu ulei și turte din făină fină bine amestecate cu ulei.',13:'Împreună cu jertfa de pace adusă ca mulțumire să-și aducă darul și cu turte de pâine dospită.',14:'Din fiecare fel să aducă o bucată drept contribuție pentru DOMNUL. Ea va fi a preotului care stropește sângele jertfei de pace.',18:'Dacă se mănâncă din carnea jertfei de pace în ziua a treia, jertfa nu va fi primită și nu-i va fi socotită celui care a adus-o; va fi un lucru respingător, iar cel care mănâncă din ea își va purta vina.',20:'Persoana care mănâncă din carnea jertfei de pace care Îi aparține DOMNULUI, în timp ce necurăția este asupra ei, va fi îndepărtată din poporul ei.',24:'Grăsimea unui animal mort de la sine sau sfâșiat de fiare poate fi folosită pentru alte scopuri, dar să nu o mâncați.',25:'Cine mănâncă din grăsimea unui animal din care se aduce DOMNULUI o jertfă mistuită de foc va fi îndepărtat din poporul său.',27:'Oricine mănâncă sânge va fi îndepărtat din poporul său.”',30:'Să aducă prin propriile mâini jertfele mistuite de foc ale DOMNULUI. Să aducă grăsimea împreună cu pieptul, pentru ca pieptul să fie legănat ca dar legănat înaintea DOMNULUI.',32:'Pulpa dreaptă din jertfele voastre de pace să o dați preotului drept contribuție.',34:'Căci am luat de la fiii lui Israel, din jertfele lor de pace, pieptul darului legănat și pulpa contribuției și le-am dat preotului Aaron și fiilor lui ca parte permanentă din partea fiilor lui Israel.”',35:'Aceasta este partea lui Aaron și partea fiilor lui din jertfele mistuite de foc ale DOMNULUI, din ziua când au fost aduși ca să-I slujească DOMNULUI în preoție,',37:'Aceasta este legea arderii-de-tot, a darului de mâncare, a jertfei pentru păcat, a jertfei pentru vină, a învestirii și a jertfei de pace,'},
          8:{1:'DOMNUL i-a vorbit lui Moise și i-a spus:',2:'„Ia-i pe Aaron și pe fiii lui împreună cu el, veșmintele, untdelemnul ungerii, taurul jertfei pentru păcat, cei doi berbeci și coșul cu azime.',5:'Moise a spus adunării: „Acesta este lucrul pe care DOMNUL a poruncit să fie făcut.”',8:'I-a pus pieptarul și a așezat în pieptar Urim și Tumim.',12:'A turnat din untdelemnul ungerii pe capul lui Aaron și l-a uns ca să-l sfințească.',15:'Moise a înjunghiat taurul, a luat sângele, a pus cu degetul pe coarnele altarului de jur împrejur și a curățit altarul. A turnat sângele la baza altarului și l-a sfințit, făcând ispășire pentru el.',23:'Moise a înjunghiat berbecul și a luat din sângele lui, punând pe lobul urechii drepte a lui Aaron, pe degetul mare al mâinii lui drepte și pe degetul mare al piciorului lui drept.',27:'A pus toate acestea în mâinile lui Aaron și în mâinile fiilor lui și le-a legănat ca dar legănat înaintea DOMNULUI.',30:'Moise a luat din untdelemnul ungerii și din sângele de pe altar și a stropit pe Aaron și veșmintele lui, pe fiii lui și veșmintele fiilor lui. Astfel i-a sfințit pe Aaron și veșmintele lui, pe fiii lui și veșmintele fiilor lui.',33:'Să nu ieșiți de la intrarea Cortului Întâlnirii timp de șapte zile, până când se vor împlini zilele învestirii voastre, căci învestirea voastră va dura șapte zile.',34:'Ceea ce s-a făcut astăzi a poruncit DOMNUL să fie făcut pentru a se face ispășire pentru voi.',35:'Să rămâneți la intrarea Cortului Întâlnirii zi și noapte timp de șapte zile și să păziți porunca DOMNULUI, ca să nu muriți, căci așa mi s-a poruncit.”'},
          9:{1:'În ziua a opta, Moise i-a chemat pe Aaron, pe fiii lui și pe bătrânii lui Israel.',2:'I-a spus lui Aaron: „Ia un vițel din cireadă ca jertfă pentru păcat și un berbec ca ardere-de-tot, amândoi fără cusur, și adu-i înaintea DOMNULUI.',4:'și un taur și un berbec ca jertfe de pace, ca să le jertfiți înaintea DOMNULUI, împreună cu un dar de mâncare amestecat cu ulei, căci astăzi vi Se va arăta DOMNUL.»”',6:'Moise a spus: „Acesta este lucrul pe care DOMNUL a poruncit să-l faceți, iar gloria DOMNULUI vi se va arăta.”',7:'Moise i-a spus lui Aaron: „Apropie-te de altar, adu jertfa ta pentru păcat și arderea ta de tot și fă ispășire pentru tine și pentru popor. Apoi adu jertfa poporului și fă ispășire pentru ei, așa cum a poruncit DOMNUL.”',15:'Aaron a adus jertfa poporului. A luat țapul jertfei pentru păcat a poporului, l-a înjunghiat și l-a adus ca jertfă pentru păcat, asemenea celei dintâi.',22:'Aaron și-a ridicat mâinile spre popor și l-a binecuvântat. Apoi a coborât după ce adusese jertfa pentru păcat, arderea-de-tot și jertfele de pace.',24:'Un foc a ieșit dinaintea DOMNULUI și a mistuit arderea-de-tot și grăsimea de pe altar. Când tot poporul a văzut, a strigat de bucurie și a căzut cu fața la pământ.'},
          10:{1:'Nadab și Abihu, fiii lui Aaron, și-au luat fiecare fărașul pentru cărbuni, au pus foc în el, au așezat tămâie deasupra și au adus înaintea DOMNULUI un foc neautorizat, pe care El nu li-l poruncise.',2:'Atunci un foc a ieșit dinaintea DOMNULUI și i-a mistuit. Ei au murit înaintea DOMNULUI.',3:'Moise i-a spus lui Aaron: „Acesta este lucrul despre care a vorbit DOMNUL: «Îmi voi arăta sfințenia prin cei care se apropie de Mine și voi fi glorificat înaintea întregului popor.»” Aaron a tăcut.',6:'Moise le-a spus lui Aaron și fiilor săi Eleazar și Itamar: „Să nu vă lăsați părul neîngrijit și să nu vă sfâșiați hainele, ca să nu muriți și ca mânia să nu vină peste întreaga comunitate. Frații voștri, întreaga casă a lui Israel, să jelească arderea pe care a aprins-o DOMNUL.',9:'„Tu și fiii tăi să nu beți vin sau băutură tare când intrați în Cortul Întâlnirii, ca să nu muriți. Aceasta să fie o rânduială veșnică pentru generațiile voastre,',10:'ca să puteți face deosebire între ce este sfânt și ce este obișnuit, între ce este necurat și ce este curat,',11:'și să-i învățați pe fiii lui Israel toate rânduielile pe care le-a rostit DOMNUL prin Moise.”',14:'Pieptul darului legănat și pulpa contribuției să le mâncați într-un loc curat, tu, fiii și fiicele tale împreună cu tine, căci v-au fost date ca parte din jertfele de pace ale fiilor lui Israel.',16:'Moise a căutat cu grijă țapul jertfei pentru păcat și iată că fusese ars. S-a mâniat pe Eleazar și pe Itamar, fiii lui Aaron care rămăseseră, și a spus:',17:'„De ce nu ați mâncat jertfa pentru păcat în locul sfânt? Ea este preasfântă și v-a fost dată ca să purtați nelegiuirea comunității și să faceți ispășire pentru ea înaintea DOMNULUI.',19:'Aaron i-a spus lui Moise: „Iată, astăzi și-au adus jertfa pentru păcat și arderea-de-tot înaintea DOMNULUI, iar mie mi s-au întâmplat asemenea lucruri. Dacă aș fi mâncat astăzi jertfa pentru păcat, ar fi fost oare plăcut în ochii DOMNULUI?”',20:'Când Moise a auzit, explicația a fost plăcută în ochii lui.'}}
          notes={
          6:[(2,'maal baYHWH vekhihesh baamito','necredincioșie față de DOMNUL prin înșelarea semenului','Frauda împotriva aproapelui este numită și necredincioșie față de Dumnezeu; ritualul nu înlocuiește restituirea.',['abatere împotriva DOMNULUI']),
             (5,'bayom ashmato','în ziua în care își recunoaște vina','Expresia poate însemna ziua când devine sau este declarat vinovat; restituirea trebuie să însoțească răspunsul cultic.',['în ziua jertfei pentru vină']),
             (9,'moqdah','vatra altarului','Forma ebraică este dificilă și are o tradiție marginală diferită; sensul privește arderea care rămâne pe altar toată noaptea.',['arderea pe focar']),
             (10,'middo vad / mikhnese vad','veșmânt și pantaloni de in','Preotul își acoperă trupul în slujire; hainele sacre nu îi conferă superioritate morală sau imunitate.',['tunică și izmene de in']),
             (13,'esh tamid','foc permanent','Continuitatea focului aparține altarului rânduit și nu autorizează focuri sau ritualuri improvizate.',['foc neîncetat']),
             (18,'kol asher-yigga bahem yiqdash','orice lucru care le atinge va deveni sfânt','Contactul implică statut și restricții rituale, nu transferul unei energii magice.',['trebuie să fie sfânt']),
             (20,'minhat tamid','dar de mâncare permanent','Darul preotului uns este adus în două jumătăți zilnice și este ars integral, nu consumat de el.',['ofrandă zilnică']),
             (27,'kol asher-yigga bivsarah yiqdash','orice lucru care îi atinge carnea va deveni sfânt','Sfințenia jertfei produce obligații rituale pentru obiectul atins; nu este o vindecare prin atingere.',['orice om care o atinge să fie sfânt']),
             (30,'asher yuva middamah el-ohel moed','al cărei sânge este adus în Cort','Jertfele ale căror sânge intră pentru ispășire sunt arse, nu consumate de preoți.',['al cărei sânge este dus în sanctuar'])],
          7:[(1,'torat haasham','legea jertfei pentru vină','Asham tratează vina și repararea prejudiciului, distinctă dar apropiată ritualic de jertfa pentru păcat.',['jertfa de reparare']),
             (7,'torah ahat lahem','aceeași lege','Afirmația privește anumite reguli rituale și partea preotului, nu șterge diferențele dintre păcat și prejudiciu.',['o singură rânduială']),
             (12,'todah','mulțumire','Este o formă a jertfei de pace în care motivul este recunoștința.',['mărturisire de mulțumire']),
             (13,'lehem hamets','pâine dospită','Pâinea dospită însoțește jertfa de mulțumire, deși partea arsă pe altar rămâne supusă interdicției din Leviticul 2.',['turte dospite']),
             (18,'piggul','lucru respingător','Termenul tehnic descrie jertfa invalidată prin consumul târziu și nu orice aliment considerat dezgustător.',['necurăție rituală','abominație']),
             (20,'venikhretah','va fi îndepărtată','Karet poate desemna excluderea comunitară sau o judecată divină; mecanismul nu este explicat aici.',['va fi nimicită']),
             (24,'helev nevelah uhelev terefah','grăsimea animalului mort sau sfâșiat','Grăsimea nu devine bună de mâncat, dar poate avea utilizări nealimentare.',['seu']),
             (30,'yadav tevienah','prin propriile mâini','Aducătorul participă activ la prezentarea darului; preoția nu îl înlocuiește în întregime.',['mâinile lui să aducă']),
             (32,'shoq hayyamin','pulpa dreaptă','Termenul poate fi redat tradițional prin spată, dar desemnează partea superioară a piciorului.',['spata dreaptă']),
             (35,'mishhat Aharon','partea lui Aaron la ungere','Termenul poate însemna partea consacrată sau dreptul primit odată cu ungerea.',['porția ungerii']),
             (37,'milluim','învestire','Literal, „umplerea mâinilor”, ceremonia instalării în preoție.',['consacrare'])],
          8:[(8,'Urim veTummim','Urim și Tumim','Natura și folosirea obiectelor nu sunt descrise; ele nu sunt transformate într-o tehnică modernă de divinație.',['Luminile și Desăvârșirile']),
             (12,'vayyitsok ... al-rosh','a turnat pe cap','Ungerea este actul public al consacrării lui Aaron, nu o dovadă că orice conducător uns este dincolo de evaluare.',['a vărsat untdelemnul']),
             (15,'vayhatte et-hammizbeah','a curățit altarul','Verbul hattat, în formă verbală, arată funcția de curățire a jertfei pentru păcat.',['a purificat altarul']),
             (23,'ureche, mână și picior','lobul urechii, degetul mare al mâinii și al piciorului','Aplicarea sângelui consacră ascultarea, lucrarea și umblarea preotului; textul nu autorizează ritualuri improvizate.',['vârful urechii']),
             (27,'tenufah','dar legănat','Mișcarea rituală este indicată, dar nu descrisă complet; nu este o practică magică.',['ofrandă legănată']),
             (30,'ulei și sânge pe veșminte','stropirea consacrării','Ritualul sfințește persoanele și veșmintele pentru slujire; nu declară persoana incapabilă de păcat.',['stropire de învestire']),
             (33,'milluim','învestire de șapte zile','Ceremonia este un proces complet, nu o autoproclamare instantanee.',['consacrare']),
             (35,'ushmartem et-mishmeret YHWH','să păziți porunca DOMNULUI','Expresia descrie veghea și responsabilitatea rituală, nu controlul abuziv al vieții personale de către conducători.',['să păziți veghea DOMNULUI'])],
          9:[(2,'egel ben-baqar lehattat','vițel ca jertfă pentru păcat','Textul nu explică dacă vițelul amintește direct de vițelul de aur; conexiunea este posibilă, dar nu este introdusă în verset.',['un vițel tânăr']),
             (4,'ki hayyom YHWH nirah alekhem','astăzi vi Se va arăta DOMNUL','Arătarea are loc prin gloria și focul din final, nu prin controlul unei experiențe vizuale de către preoți.',['gloria DOMNULUI vi se va arăta']),
             (7,'vekhipper beadekha uvead haam','ispășire pentru tine și pentru popor','Preotul are nevoie mai întâi de ispășire pentru sine; funcția lui nu înseamnă impecabilitate.',['pentru casa ta']),
             (15,'vayhattehu','l-a adus ca jertfă pentru păcat','Forma verbală poate fi redată „l-a curățit prin jertfa pentru păcat”, arătând funcția ritualului.',['l-a oferit pentru curățire']),
             (22,'vayissa Aharon et-yadav','Aaron și-a ridicat mâinile','Gestul însoțește binecuvântarea preoțească; nu este tehnică de transfer al unei energii.',['mâna — formă textuală singulară']),
             (24,'vatse esh millifne YHWH','un foc a ieșit dinaintea DOMNULUI','Același tipar narativ deschide capitolul următor în judecata asupra focului neautorizat; apropierea cere ascultare.',['foc de la DOMNUL'])],
          10:[(1,'esh zarah asher lo tsivah otam','foc neautorizat pe care nu li-l poruncise','Zarah înseamnă străin față de poruncă, nu provenit din altă etnie. Textul nu precizează toate detaliile încălcării.',['foc străin']),
              (3,'biqrovay eqqadesh','Îmi voi arăta sfințenia prin cei care se apropie','Cei care slujesc aproape de sanctuar sunt răspunzători în mod special; versetul nu justifică abuzul asupra slujitorilor religioși.',['voi fi sfințit în cei apropiați']),
              (3,'vayidom Aharon','Aaron a tăcut','Tăcerea poate exprima șoc, acceptare sau imposibilitatea răspunsului; nu trebuie idealizată ca interdicție a doliului sau a întrebărilor.',['Aaron a rămas nemișcat']),
              (6,'al-tifra-u rashekhem','să nu vă lăsați părul neîngrijit','Poate însemna să nu-și descopere capul sau să nu-și lase părul liber, gesturi de doliu interzise preoților aflați în slujire.',['să nu vă descoperiți capetele']),
              (9,'yayin veshekhar','vin și băutură tare','Interdicția este explicit legată de intrarea în Cort și de discernământul în slujire; nu afirmă aici o interdicție universală a oricărui consum.',['vin și băutură fermentată']),
              (10,'qodesh / hol','sfânt / obișnuit','Hol înseamnă comun sau profan în sens ritual, nu automat rău moral.',['sacru / comun']),
              (14,'uvnotekha','fiicele tale','Fiicele preoților pot mânca părțile jertfelor de pace într-un loc curat, deși alte părți preasfinte sunt rezervate bărbaților preoți.',['fetele tale']),
              (17,'laset et-avon haedah','să purtați nelegiuirea comunității','Preoții tratează ritual vina prin jertfă; expresia nu le permite să ascundă infracțiuni, să reducă la tăcere victime sau să preia controlul conștiinței.',['să ridicați vina comunității']),
              (19,'vatiqrenah oti kaelleh','mi s-au întâmplat asemenea lucruri','Aaron invocă moartea fiilor săi și caracterul zilei pentru a explica de ce nu a mâncat; nu neagă porunca, ci cere discernământ.',['m-au întâmpinat asemenea nenorociri']),
              (20,'vayyitav beeinav','explicația a fost plăcută în ochii lui','Moise acceptă argumentul lui Aaron, arătând că aplicarea rituală include ascultare și discernământ, nu rigiditate fără context.',['a considerat răspunsul bun'])]}
          def mk(v,t,d,r,a):
              n={'verse':v,'term':t,'decision':d,'reason':r,'reviewRequired':True,'resolutionStatus':'resolved','resolutionReason':r}
              if a:n['alternatives']=a
              return n
          for ch in range(6,11):
              p=root/f'LEV.{ch}.json';d=json.loads(p.read_text(encoding='utf-8'));by={v['number']:v for v in d['verses']}
              for num,text in corrections[ch].items():by[num]['text']=text
              d['editorialNotes']=[mk(*n) for n in notes[ch]];d['status']='published';d['public']=True
              for k in d['review']:d['review'][k]='approved'
              for k in d['benchmark']['checks']:d['benchmark']['checks'][k]='approved'
              a=d['audit'];a.pop('pendingReason',None);a['sourceLanguage'].update(result='approved',scope='legile jertfelor, restituirea, învestirea, gloria, focul și discernământul preoțesc verificate verset cu verset')
              a['romanianLanguage'].update(result='approved',changesApplied=['Terminologia jertfelor și părților preoțești a fost uniformizată.','Formulările rigide și anatomia rituală au fost clarificate fără adaosuri.'])
              a['theologicalContext'].update(result='approved',principles=['Ritualul nu înlocuiește restituirea prejudiciului.','Preoții au nevoie de ispășire și nu primesc imunitate morală prin ungere.','Moartea lui Nadab și Abihu nu autorizează abuzul religios, iar răspunsul lui Aaron păstrează discernământul în doliu.'])
