name: Audit OT repair 5 candidates

on:
  push:
    branches:
      - agent/biblia-emanus-ot-repair5
    paths:
      - 'docs/data/biblia-emanus-candidates/**'
      - 'scripts/ot_repair5_common.py'
      - 'scripts/audit-ot-repair5-v2.py'
      - 'scripts/classify-ot-repair5-candidates.py'
      - '.github/workflows/audit-ot-repair5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-ot-repair5
      - name: Run complete deterministic audit
        run: python3 scripts/audit-ot-repair5-v2.py
      - name: Classify repetition risk
        run: python3 scripts/classify-ot-repair5-candidates.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ot-repair5-deterministic-audit
          path: |
            docs/biblia-emanus/OT-REPAIR5-DETERMINISTIC-AUDIT.md
            docs/biblia-emanus/OT-REPAIR5-DETERMINISTIC-AUDIT.json
            docs/biblia-emanus/OT-REPAIR5-CANDIDATE-CLASSIFICATION.md
            docs/biblia-emanus/OT-REPAIR5-CANDIDATE-CLASSIFICATION.json
          retention-days: 7
      - name: Persist reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/OT-REPAIR5-DETERMINISTIC-AUDIT.* docs/biblia-emanus/OT-REPAIR5-CANDIDATE-CLASSIFICATION.*
          if ! git diff --cached --quiet; then
            git commit -m 'audit(bible): persist OT repair5 deterministic reports'
            git push origin HEAD:agent/biblia-emanus-ot-repair5
          fi
      - name: Enforce deterministic candidate gate
        run: python3 scripts/audit-ot-repair5-v2.py --fail
