name: Finalize NT Audit 3 Branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    if: github.head_ref == 'agent/biblia-emanus-nt-audit3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-nt-audit3
          fetch-depth: 0

      - name: Install permanent Python ignore rules and CI gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ignore = Path('.gitignore')
          text = ignore.read_text(encoding='utf-8')
          block = '\n# Python\n__pycache__/\n*.py[cod]\n'
          if '__pycache__/' not in text:
              ignore.write_text(text.rstrip() + block, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          marker = '''      - name: Testeaza poarta Biblia Emanus
        run: pnpm test:biblia-emanus
'''
          addition = marker + '''
      - name: Verifica versificatia Biblia Emanus
        run: pnpm check:biblia-emanus-versification
'''
          if 'Verifica versificatia Biblia Emanus' not in text:
              if marker not in text:
                  raise SystemExit('CI insertion marker missing')
              ci.write_text(text.replace(marker, addition), encoding='utf-8')
          PY

      - name: Remove all migration-only artifacts
        run: |
          rm -f .github/workflows/tmp-import-nt-audit3.yml
          rm -f scripts/tmp-*.py
          rm -rf scripts/__pycache__

      - name: Validate permanent Biblia Emanus corpus
        run: python3 scripts/check-biblia-emanus.py

      - name: Validate permanent NT versification
        run: python3 scripts/check-biblia-emanus-versification.py

      - name: Run permanent Biblia Emanus tests
        run: python3 -m unittest scripts/test_biblia_emanus.py scripts/test_biblia_emanus_nt.py scripts/test_materialize_biblia_emanus_nt.py

      - name: Commit clean permanent branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize clean New Testament audit 3 corpus"
          git push origin HEAD:agent/biblia-emanus-nt-audit3
