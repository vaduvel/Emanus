name: Finalize Faptele Apostolilor

on:
  pull_request:
    branches:
      - agent/integrate-biblical-review
    paths:
      - .github/workflows/finalize-fapte.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/fapte-apostolilor'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fapte-apostolilor
          persist-credentials: true

      - name: Materialize and commit final Acts files
        run: |
          cat .fapte-payload/part* | base64 -d > /tmp/fapte-final.tar.xz
          tar -xJf /tmp/fapte-final.tar.xz -C .
          echo '' | base64 -d > scripts/check-fapte.py
          rm -rf .fapte-payload
          rm -f .github/workflows/finalize-fapte.yml
          rm -f .github/workflows/research-fapte.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Faptele Apostolilor 1-28"
          git push origin HEAD:agent/fapte-apostolilor
