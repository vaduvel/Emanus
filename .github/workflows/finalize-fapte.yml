name: Finalize Faptele Apostolilor

on:
  pull_request:
    branches:
      - agent/integrate-biblical-review
    paths:
      - .github/workflows/finalize-fapte.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/fapte-apostolilor'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fapte-apostolilor
          persist-credentials: true

      - name: Materialize and commit final Acts files
        run: |
          cp .github/workflows/ci.yml /tmp/ci.yml
          cp .github/workflows/finalize-fapte.yml /tmp/finalize-fapte.yml
          cp .github/workflows/research-fapte.yml /tmp/research-fapte.yml

          cat .fapte-payload/part* | base64 -d > /tmp/fapte-final.tar.xz
          tar -xJf /tmp/fapte-final.tar.xz -C .

          cp /tmp/ci.yml .github/workflows/ci.yml
          cp /tmp/finalize-fapte.yml .github/workflows/finalize-fapte.yml
          cp /tmp/research-fapte.yml .github/workflows/research-fapte.yml

          python - <<'PY'
          from pathlib import Path
          import re

          bible = Path('packages/shared/src/bible')
          source = bible / 'fapte.ts'
          text = source.read_text(encoding='utf-8')

          chapter_pattern = re.compile(
              r'(?m)^(?:export\s+)?const FAPTE_(\d+)\s*=\s*fapteChapter\(\{'
          )
          matches = list(chapter_pattern.finditer(text))
          numbers = [int(match.group(1)) for match in matches]
          if numbers != list(range(1, 29)):
              raise SystemExit(f'Capitole Fapte neașteptate în payload: {numbers}')

          book_start = text.find('export const FAPTE: BibleBook')
          if book_start < 0:
              raise SystemExit('Blocul cărții FAPTE lipsește din payload')

          prefix = text[:matches[0].start()]
          book_block = text[book_start:]
          chapters = {}
          for index, match in enumerate(matches):
              end = matches[index + 1].start() if index + 1 < len(matches) else book_start
              chapters[int(match.group(1))] = text[match.start():end].strip() + '\n'

          import_lines = ''.join(
              f'import {{ FAPTE_{number} }} from "./fapte{number}.js"\n'
              for number in range(2, 29)
          )
          prefix_lines = prefix.splitlines(keepends=True)
          insert_at = 0
          while insert_at < len(prefix_lines) and prefix_lines[insert_at].startswith('import '):
              insert_at += 1
          prefix = ''.join(prefix_lines[:insert_at]) + import_lines + ''.join(prefix_lines[insert_at:])

          expected_array = 'chapters: [\n' + ''.join(
              f'    FAPTE_{number},\n' for number in range(1, 29)
          ) + '  ]'
          book_block, replacements = re.subn(
              r'chapters:\s*\[[^\]]*\]',
              expected_array,
              book_block,
              count=1,
              flags=re.S,
          )
          if replacements != 1:
              raise SystemExit('Lista chapters din FAPTE nu a putut fi rescrisă')

          source.write_text(prefix + chapters[1] + '\n' + book_block, encoding='utf-8')

          for number in range(2, 29):
              block = re.sub(
                  rf'(?m)^(?:export\s+)?const FAPTE_{number}',
                  f'export const FAPTE_{number}',
                  chapters[number],
                  count=1,
              )
              (bible / f'fapte{number}.ts').write_text(
                  'import { fapteChapter, teaching } from "./fapteHelpers.js"\n\n' + block,
                  encoding='utf-8',
              )
          PY

          rm -rf .fapte-payload

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(biblia): adauga Faptele Apostolilor 1-28"
          git push origin HEAD:agent/fapte-apostolilor
