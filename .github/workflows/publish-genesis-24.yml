name: Publish Genesis 24

on:
  push:
    branches:
      - agent/biblia-emanus
    paths:
      - scripts/publish-genesis-24.py
      - .github/workflows/publish-genesis-24.yml

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-gen24]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish audited chapter
        run: python scripts/publish-genesis-24.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus/GEN.24.json docs/data/biblia-emanus/manifest.json
          git commit -m "Audit and publish Genesis 24"
          git push origin HEAD:agent/biblia-emanus
