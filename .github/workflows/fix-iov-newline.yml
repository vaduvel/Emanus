name: Fix Iov newline one-shot

on:
  push:
    branches:
      - agent/biblia-explicata-vt-complet

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-complet
      - name: Fix unterminated string in Iov 41
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/shared/src/bible/overlays/iovTextualChapters.ts')
          s = p.read_text(encoding='utf-8')
          old = 'Creatorului dacă nici această făptură nu poate fi tratată cu ușurință?\n", source: n }'
          new = 'Creatorului dacă nici această făptură nu poate fi tratată cu ușurință?", source: n }'
          if old not in s:
              raise SystemExit('Pattern not found; refusing blind edit')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/bible/overlays/iovTextualChapters.ts
          git diff --cached --check
          git commit -m "fix(bible): close Iov 41 textual string"
          git push origin HEAD:agent/biblia-explicata-vt-complet
