name: Repair OT repair 5 2 Kings 9

on:
  push:
    branches:
      - agent/biblia-emanus-ot-repair5
    paths:
      - 'scripts/repair-ot-repair5-2ki9-quotes.py'
      - '.github/workflows/repair-ot-repair5-2ki9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-ot-repair5
      - run: python3 scripts/repair-ot-repair5-2ki9-quotes.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/biblia-emanus-candidates/2KI.9.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(bible): balance quotation in 2 Kings 9:10'
            git push origin HEAD:agent/biblia-emanus-ot-repair5
          fi
