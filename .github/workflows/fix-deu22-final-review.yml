name: Fix DEU 22 Final Review

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Correct Romanian text and refresh audit digest
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('docs/data/biblia-emanus/DEU.22.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          verse = next(v for v in data['verses'] if v['number'] == 11)
          wrong = 'Să nu porți-o haină țesută din două feluri de fire, din lână și din in împreună.'
          correct = 'Să nu porți o haină țesută din două feluri de fire, din lână și din in împreună.'
          if verse['text'] not in (wrong, correct):
              raise SystemExit(f"DEU 22:11 are text neașteptat: {verse['text']!r}")
          verse['text'] = correct

          changes = data['audit']['romanianLanguage'].setdefault('changesApplied', [])
          note = 'Deuteronom 22:11 — corectat mecanismul greșit „porți-o haină” în „porți o haină”.'
          if note not in changes:
              changes.append(note)
          data['audit']['completedOn'] = '2026-08-08'
          canonical = '\n'.join(f"{v['number']}\t{v['text']}" for v in data['verses'])
          data['audit']['textDigest'] = 'sha256:' + hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('docs/data/biblia-emanus/DEU.22.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert next(v['text'] for v in d['verses'] if v['number'] == 11).startswith('Să nu porți o haină')
          canonical = '\n'.join(f"{v['number']}\t{v['text']}" for v in d['verses'])
          expected = 'sha256:' + hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          assert d['audit']['textDigest'] == expected
          print('DEU 22 final-review correction OK:', expected)
          PY

      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo 'No correction needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/biblia-emanus/DEU.22.json
          git commit -m 'Correct DEU 22 Romanian final review typo'
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
