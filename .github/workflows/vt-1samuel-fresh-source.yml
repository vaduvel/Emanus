name: VT 1 Samuel Fresh Source Packet

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vt-1samuel-fresh-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-1samuel-review-packet:
    if: github.head_ref == 'agent/biblia-explicata-vt-integration-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0
      - name: Download current WEBU and WLC archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/engwebp_current.zip https://ebible.org/Scriptures/engwebp_usfm.zip
          curl --fail --location --retry 3 --output /tmp/hboWLC_current.zip https://ebible.org/Scriptures/hboWLC_usfm.zip
      - name: Diagnose 1 Samuel chapter versification
        run: |
          python3 - <<'PY'
          import json, sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from ot_repair5_common import parse_usfm_zip

          web = parse_usfm_zip(Path('/tmp/engwebp_current.zip'))
          wlc = parse_usfm_zip(Path('/tmp/hboWLC_current.zip'))
          web_counts = Counter(ch for (book, ch, _v) in web if book == '1SA')
          wlc_counts = Counter(ch for (book, ch, _v) in wlc if book == '1SA')
          candidate_counts = {}
          for ch in range(1, 32):
              doc = json.loads(Path(f'docs/data/biblia-emanus-candidates/1SA.{ch}.json').read_text(encoding='utf-8'))
              candidate_counts[ch] = len(doc.get('verses', []))
          print('chapter candidate WEBU WLC delta_wlc_vs_product')
          for ch in range(1, 32):
              c = candidate_counts[ch]
              e = web_counts[ch]
              h = wlc_counts[ch]
              marker = ' <--' if c != h or c != e else ''
              print(f'{ch:02d} {c:3d} {e:3d} {h:3d} {h-c:+d}{marker}')
          print('TOTAL', sum(candidate_counts.values()), sum(web_counts.values()), sum(wlc_counts.values()))
          PY
      - name: Build fresh 1 Samuel source packet and review chunks
        run: |
          set -euo pipefail
          python3 scripts/prepare-ot-book-fresh-reaudit.py \
            --book 1SA \
            --webu-zip /tmp/engwebp_current.zip \
            --wlc-zip /tmp/hboWLC_current.zip
          python3 scripts/split-ot-book-fresh-reaudit.py --book 1SA
          python3 scripts/chunk-ot-book-fresh-reaudit.py --book 1SA
      - name: Commit fresh 1 Samuel packet
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/biblia-explicata/ot-reaudit/1SA-FRESH-SOURCE-REAUDIT.json docs/biblia-explicata/ot-reaudit/1SA
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(bible): build fresh 1 Samuel source packet"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
