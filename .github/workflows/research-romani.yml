name: Research Romani

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/fapte-apostolilor
    paths:
      - .github/workflows/research-romani.yml

permissions:
  contents: read

jobs:
  transcribe:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        episode:
          - number: 1
            slug: 01-romans-1-1-to-1-32
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-1-1-to-chapter-1-32.mp3
          - number: 2
            slug: 02-romans-2-1-to-3-18
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-2-1-to-chapter-3-18.mp3
          - number: 3
            slug: 03-romans-3-19-to-5-21
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-3-19-to-chapter-5-21.mp3
          - number: 4
            slug: 04-romans-6-1-to-6-23
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-6-1-to-chapter-6-23.mp3
          - number: 5
            slug: 05-romans-7-1-to-7-25
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-7-1-to-chapter-7-25.mp3
          - number: 6
            slug: 06-romans-8-1-to-8-14
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-8-1-to-chapter-8-14.mp3
          - number: 7
            slug: 07-romans-8-15-to-8-39
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-8-15-to-chapter-8-39.mp3
          - number: 8
            slug: 08-romans-9-1-to-9-21
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-9-1-to-chapter-9-21.mp3
          - number: 9
            slug: 09-romans-9-22-to-10-21
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-9-22-to-chapter-10-21.mp3
          - number: 10
            slug: 10-romans-11-1-to-11-36
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-11-1-to-chapter-11-36.mp3
          - number: 11
            slug: 11-romans-12-1-to-12-8
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-12-1-to-chapter-12-8.mp3
          - number: 12
            slug: 12-romans-12-9-to-13-10
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-12-9-to-chapter-13-10.mp3
          - number: 13
            slug: 13-romans-13-11-to-15-2
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-13-11-to-chapter-15-2.mp3
          - number: 14
            slug: 14-romans-15-3-to-15-29
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-15-3-to-chapter-15-29.mp3
          - number: 15
            slug: 15-romans-15-30-to-16-27
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt06-romans-chapter-15-30-to-chapter-16-27.mp3

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install transcription tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper==1.2.0 requests

      - name: Download official CFC audio
        env:
          EPISODE_URL: ${{ matrix.episode.url }}
          EPISODE_SLUG: ${{ matrix.episode.slug }}
        run: |
          mkdir -p .research/romani/audio .research/romani/transcripts
          curl --fail --location --retry 4 "$EPISODE_URL" \
            --output ".research/romani/audio/$EPISODE_SLUG.mp3"
          test -s ".research/romani/audio/$EPISODE_SLUG.mp3"

      - name: Transcribe episode
        env:
          EPISODE_SLUG: ${{ matrix.episode.slug }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from faster_whisper import WhisperModel

          root = Path('.research/romani')
          slug = os.environ['EPISODE_SLUG']
          source = root / 'audio' / f'{slug}.mp3'
          target = root / 'transcripts' / f'{slug}.txt'
          model = WhisperModel('tiny.en', device='cpu', compute_type='int8', cpu_threads=4)
          segments, info = model.transcribe(
              str(source),
              language='en',
              beam_size=1,
              best_of=1,
              vad_filter=True,
          )
          lines = []
          for segment in segments:
              text = ' '.join(segment.text.split())
              if text:
                  lines.append(text)
          target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'{source.name}: {info.duration:.1f}s audio, {target.stat().st_size} bytes transcript')
          if target.stat().st_size < 5000:
              raise SystemExit('Transcriere prea scurta')
          PY

      - name: Upload private research artifact
        uses: actions/upload-artifact@v4
        with:
          name: romani-${{ matrix.episode.slug }}
          path: .research/romani/transcripts/${{ matrix.episode.slug }}.txt
          if-no-files-found: error
          retention-days: 1
