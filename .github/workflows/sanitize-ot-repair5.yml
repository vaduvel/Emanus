name: Sanitize OT repair 5 candidates

on:
  push:
    branches:
      - agent/biblia-emanus-ot-repair5
    paths:
      - 'scripts/sanitize-ot-repair5-candidates.py'
      - '.github/workflows/sanitize-ot-repair5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-ot-repair5
      - name: Remove fabricated books and reset inherited provenance
        run: python3 scripts/sanitize-ot-repair5-candidates.py
      - name: Commit sanitized candidate scope
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/biblia-emanus-candidates docs/biblia-emanus/OT-REPAIR5-FABRICATED-DEUTEROCANON-QUARANTINE.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(bible): quarantine fabricated deuterocanon and reset OT provenance'
            git push origin HEAD:agent/biblia-emanus-ot-repair5
          fi
