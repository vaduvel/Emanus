name: PR40 scheduled repair remaining 3

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pr40-repair-remaining-3-scheduled
  cancel-in-progress: false

env:
  PRIOR_RUN_ID: '31110524525'
  REPAIR_BRANCH: 'agent/pr40-repair-remaining-3'
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      done: ${{ steps.state.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
      - id: state
        name: Skip after the 64-work verdict exists
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path('docs/biblia-emanus/PR40-FINAL-PUBLICATION-VERDICT.json')
          done = False
          if p.exists():
              try:
                  r = json.loads(p.read_text(encoding='utf-8'))
                  done = r.get('status') == 'published' and r.get('counts', {}).get('works') == 64 and r.get('blockingIssues') == 0
              except Exception:
                  pass
          print(f"done={'true' if done else 'false'}")
          PY

  didascalia:
    needs: prepare
    if: needs.prepare.outputs.done != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: pr40-repair-didascalia-v4-${{ runner.os }}
      - name: Install pinned CPU translation and audit runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'sentencepiece>=0.2,<1' 'huggingface-hub>=0.26,<1' 'sentence-transformers>=3,<4' 'numpy>=2,<3' 'requests>=2,<3'
      - name: Restore verified Didascalia checkpoint
        uses: actions/download-artifact@v4
        with:
          name: pr40-early-DID
          path: checkpoint
          repository: vaduvel/Emanus
          run-id: ${{ env.PRIOR_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cp -R checkpoint/data/. docs/data/
          cp -R checkpoint/biblia-emanus/. docs/biblia-emanus/
      - name: Recover and audit all 43 Didascalia chapters
        env:
          PR40_BOOKS: DID
        run: python3 scripts/run-with-pinned-hf.py scripts/finalize-pr40-didascalia-checkpoint.py --batch-size 20
      - name: Require zero blockers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('docs/data/biblia-emanus-early-audited').glob('DID.*.json'))
          assert len(files) == 43, len(files)
          for p in files:
              d = json.loads(p.read_text(encoding='utf-8'))
              assert d.get('status') == 'published', p
              assert d.get('public') is True and d.get('runtimeEnabled') is True, p
              assert int((d.get('audit') or {}).get('blockingIssueCount', -1)) == 0, p
          print('DID: 43/43 published, zero blockers')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr40-early-DID-final
          path: |
            docs/data/biblia-emanus-early-source-candidates
            docs/data/biblia-emanus-early-romanian-candidates
            docs/data/biblia-emanus-early-audited
            docs/biblia-emanus/PR40-EARLY-WORKS-EXTRACTION.json
            docs/biblia-emanus/PR40-EARLY-WORKS-ROMANIAN-DRAFT.json
            docs/biblia-emanus/PR40-EARLY-WORKS-SEMANTIC-AUDIT.json
          if-no-files-found: error
          retention-days: 14

  qumran:
    needs: prepare
    if: needs.prepare.outputs.done != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: TEMP_SCR
            witnesses: 11Q19
            checkpoint: pr40-qumran-TEMP_SCR
          - id: ADD_PSA
            witnesses: 11Q5,4Q381
            checkpoint: pr40-qumran-ADD_PSA
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: pr40-repair-qumran-v4-${{ runner.os }}
      - name: Install pinned CPU translation and audit runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'sentencepiece>=0.2,<1' 'huggingface-hub>=0.26,<1' 'sentence-transformers>=3,<4' 'numpy>=2,<3' 'requests>=2,<3'
      - name: Restore verified Qumran source checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.checkpoint }}
          path: checkpoint
          repository: vaduvel/Emanus
          run-id: ${{ env.PRIOR_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cp -R checkpoint/data/. docs/data/
          cp -R checkpoint/biblia-emanus/. docs/biblia-emanus/
      - name: Translate selected witnesses only
        env:
          PR40_WITNESSES: ${{ matrix.witnesses }}
        run: python3 scripts/run-with-pinned-hf.py scripts/translate-pr40-qumran-shard.py --batch-size 20
      - name: Repair degenerate lines and withhold unsafe fragments
        env:
          PR40_WITNESSES: ${{ matrix.witnesses }}
        run: python3 scripts/run-with-pinned-hf.py scripts/refine-pr40-qumran-candidates.py --batch-size 20
      - name: Audit source fidelity and semantics
        env:
          PR40_WITNESSES: ${{ matrix.witnesses }}
        run: python3 scripts/run-with-pinned-hf.py scripts/audit-pr40-qumran-shard-v2.py
      - name: Require zero blockers
        env:
          EXPECTED_WITNESSES: ${{ matrix.witnesses }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          expected = {x for x in os.environ['EXPECTED_WITNESSES'].split(',') if x}
          paths = sorted(Path('docs/data/biblia-emanus-qumran-audited').glob('*.json'))
          assert {p.stem for p in paths} == expected
          for p in paths:
              d = json.loads(p.read_text(encoding='utf-8'))
              assert d.get('status') == 'published-research', p
              assert d.get('public') is True and d.get('runtimeEnabled') is True, p
              assert int((d.get('audit') or {}).get('blockingIssueCount', -1)) == 0, p
          print('Qumran shard published-research, zero blockers')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr40-qumran-${{ matrix.id }}-final
          path: |
            docs/data/biblia-emanus-qumran-source
            docs/data/biblia-emanus-qumran-romanian-candidates
            docs/data/biblia-emanus-qumran-audited
            docs/biblia-emanus/PR40-QUMRAN-SOURCE-CORPUS.json
            docs/biblia-emanus/PR40-QUMRAN-ROMANIAN-DRAFT.json
            docs/biblia-emanus/PR40-QUMRAN-ROMANIAN-AUDIT.json
          if-no-files-found: error
          retention-days: 14

  publish-64:
    needs: [prepare, didascalia, qumran]
    if: needs.prepare.outputs.done != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Download all 61 already-verified artifacts plus historical scope artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pr40-*
          path: staging/prior
          merge-multiple: false
          repository: vaduvel/Emanus
          run-id: ${{ env.PRIOR_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the three repaired final artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: pr40-*-final
          path: staging/current
          merge-multiple: false
      - name: Assemble exact 64-work publication from audited boundaries
        run: python3 scripts/assemble-pr40-repaired-64-publication.py --prior staging/prior --current staging/current
      - name: Require atomic 64-work verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('docs/biblia-emanus/PR40-FINAL-PUBLICATION-VERDICT.json').read_text(encoding='utf-8'))
          assert r.get('status') == 'published', r
          assert r.get('counts', {}).get('works') == 64, r
          assert r.get('blockingIssues') == 0, r
          print('PR40: 64 works published, zero blockers')
          PY
      - name: Verify application integrity
        run: |
          pnpm install --frozen-lockfile
          pnpm check:quotes
          pnpm check:typos
          pnpm check:content
          pnpm check:biblia-emanus
          pnpm test:biblia-emanus
          pnpm check:biblia-emanus-versification
          pnpm seal:biblia-emanus --check
          pnpm typecheck
          pnpm build
          git diff --check
      - name: Commit verified 64-work corpus to repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/data/biblia-emanus \
            docs/data/biblia-emanus-deuterocanon-audited \
            docs/data/biblia-emanus-early-audited \
            docs/data/biblia-emanus-qumran-audited \
            docs/biblia-emanus/PR40-FINAL-PUBLICATION-VERDICT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair and publish all 64 PR40 works'
          git push origin "HEAD:${REPAIR_BRANCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: pr40-all-64-repaired-publication
          path: |
            docs/data/biblia-emanus
            docs/data/biblia-emanus-deuterocanon-audited
            docs/data/biblia-emanus-early-audited
            docs/data/biblia-emanus-qumran-audited
            docs/biblia-emanus/PR40-FINAL-PUBLICATION-VERDICT.json
          if-no-files-found: error
          retention-days: 14
