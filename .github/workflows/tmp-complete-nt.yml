name: Temporary Complete and Seal Biblia Emanus NT

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-complete-nt.yml
      - scripts/tmp-complete-nt.py

permissions:
  contents: write

jobs:
  translate:
    if: github.head_ref == 'agent/biblia-emanus-nt-audit3'
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group:
          - g01-mat
          - g02-mrk
          - g03-luk
          - g04-jhn
          - g05-act
          - g06-rom-1co
          - g07-2co-gal-eph
          - g08-php-col-th
          - g09-pastoral
          - g10-heb-jas
          - g11-catholic
          - g12-rev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-nt-audit3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned translation and audit runtime
        run: >-
          pip install --quiet
          "transformers==4.53.2"
          "sentence-transformers==5.0.0"
          "sentencepiece==0.2.0"
          "sacremoses==0.1.1"
          "torch==2.7.1"
          --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Translate and preflight ${{ matrix.group }}
        run: python3 scripts/tmp-complete-nt.py translate --group "${{ matrix.group }}"

      - uses: actions/upload-artifact@v4
        with:
          name: nt-${{ matrix.group }}
          path: out/${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 1

  assemble:
    if: github.head_ref == 'agent/biblia-emanus-nt-audit3'
    needs: translate
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-nt-audit3
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: nt-*
          path: assembled
          merge-multiple: true

      - name: Assemble all 260 chapters
        run: |
          cp assembled/docs/data/biblia-emanus/*.json docs/data/biblia-emanus/
          python3 scripts/tmp-complete-nt.py finalize

      - name: Write permanent NT audit summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = [json.loads(path.read_text(encoding='utf-8')) for path in sorted(Path('assembled/reports').glob('*.json'))]
          chapters = sum(item['chapters'] for item in reports)
          verses = sum(item['verses'] for item in reports)
          minimum_semantic = min(item['minimumSemantic'] for item in reports)
          minimum_score = min(item['minimumScore'] for item in reports)
          selected = {
              label: sum(item['selected'].get(label, 0) for item in reports)
              for label in ('existing', 'primary', 'secondary', 'fixed')
          }
          lines = [
              '# Biblia Emanus — Audit Noul Testament 3.0',
              '',
              '- Data finalizării: 2026-08-05',
              '- Cărți: 27',
              f'- Capitole: {chapters}',
              f'- Versete: {verses}',
              '- Autoritate: SBLGNT 1.2, cu aparat critic',
              '- Punte: WEBU Protestant Edition, domeniu public',
              '- Martor grec suplimentar: Textus Receptus, domeniu public',
              '- Etaloane românești fixate: Cornilescu 1924 și BTF; NTR numai comparison-only extern',
              '- Motor: OPUS-MT en-ro + OPUS-MT TC-big en-ro + control semantic multilingual MiniLM',
              f'- Scor semantic minim acceptat: {minimum_semantic:.4f}',
              f'- Scor agregat minim acceptat: {minimum_score:.4f}',
              f"- Selecții: text existent {selected['existing']}; OPUS principal {selected['primary']}; OPUS secundar {selected['secondary']}; corecții editoriale fixate {selected['fixed']}",
              '',
              '## Porți obligatorii',
              '',
              'Toate cele 260 de capitole au trecut: limba-sursă, româna, contextul teologic, omisiuni/adaosuri, benchmarkuri, distanța de copyright, probleme critice, versificație, aparatul critic, digestul textului și digestul deciziilor editoriale.',
              '',
              '## Politica textuală',
              '',
              'Textul principal urmează SBLGNT. Lecturile Textus Receptus și numerele tradiționale absente din textul critic sunt păstrate în note rezolvate, fără armonizare automată. Publicarea s-a făcut atomic numai după validarea întregului NT.',
              '',
          ]
          Path('docs/biblia-emanus/NOUL-TESTAMENT-AUDIT-3.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Seal all New Testament chapters atomically
        run: >-
          python3 scripts/seal-biblia-emanus.py
          --book MAT --book MRK --book LUK --book JHN --book ACT --book ROM
          --book 1CO --book 2CO --book GAL --book EPH --book PHP --book COL
          --book 1TH --book 2TH --book 1TI --book 2TI --book TIT --book PHM
          --book HEB --book JAS --book 1PE --book 2PE --book 1JN --book 2JN
          --book 3JN --book JUD --book REV

      - name: Materialize published New Testament
        run: python3 scripts/materialize-biblia-emanus-nt.py

      - name: Validate complete Biblia Emanus corpus
        run: python3 scripts/check-biblia-emanus.py

      - name: Validate New Testament versification
        run: python3 scripts/check-biblia-emanus-versification.py

      - name: Run Biblia Emanus test suites
        run: python3 -m unittest scripts/test_biblia_emanus.py scripts/test_biblia_emanus_nt.py scripts/test_materialize_biblia_emanus_nt.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Run publication checks
        run: |
          pnpm check:quotes
          pnpm check:typos
          pnpm check:content
          pnpm check:bible-publication
          pnpm check:biblia-emanus
          pnpm test:biblia-emanus
          pnpm check:biblia-emanus-versification

      - name: Verify complete NT seal
        run: >-
          pnpm seal:biblia-emanus --check
          --book MAT --book MRK --book LUK --book JHN --book ACT --book ROM
          --book 1CO --book 2CO --book GAL --book EPH --book PHP --book COL
          --book 1TH --book 2TH --book 1TI --book 2TI --book TIT --book PHM
          --book HEB --book JAS --book 1PE --book 2PE --book 1JN --book 2JN
          --book 3JN --book JUD --book REV

      - name: Typecheck and build
        run: |
          pnpm typecheck
          pnpm build

      - name: Remove temporary NT completion machinery
        run: |
          rm -f .github/workflows/tmp-complete-nt.yml
          rm -f .github/workflows/tmp-cancel-obsolete-nt-runs.yml
          rm -f .github/workflows/tmp-scan-nt-reference-notes.yml
          rm -f scripts/tmp-complete-nt.py
          rm -f scripts/tmp-complete-nt.part??

      - name: Commit final published New Testament
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows scripts docs/data/biblia-emanus docs/biblia-emanus/NOUL-TESTAMENT-AUDIT-3.md packages/shared/src/bible/bibliaEmanusNt.generated.ts
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "Publish complete Biblia Emanus New Testament with audit engine 3.0"
          git push origin HEAD:agent/biblia-emanus-nt-audit3
