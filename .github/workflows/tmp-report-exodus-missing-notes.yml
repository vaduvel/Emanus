name: Report Exodus missing notes

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-report-exodus-missing-notes.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Build missing-note report
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          ledger=json.loads((root/'source-ledger.json').read_text(encoding='utf-8'))
          out=[]
          for ch in range(1,41):
              cid=f'EXO.{ch}'
              d=json.loads((root/f'{cid}.json').read_text(encoding='utf-8'))
              covered={f"{cid}.{n['verse']}" for n in d.get('editorialNotes',[]) if n.get('verse')}
              for ref in ledger['chapters'][cid].get('textualVariantReview',[]):
                  if ref not in covered: out.append(ref)
          (root/'.audit-EXO-missing-notes.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git rm .github/workflows/tmp-report-exodus-missing-notes.yml
          git add docs/data/biblia-emanus/.audit-EXO-missing-notes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Report Exodus ledger notes still missing"
          git push origin HEAD:agent/biblia-emanus-exodul
