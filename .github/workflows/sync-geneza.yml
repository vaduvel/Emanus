name: Sincronizare Geneza

# FISIER TEMPORAR. Se sterge imediat dupa ce si-a facut treaba.
#
# DE CE EXISTA:
# PR #5 (spec/devotional-mesaj-borcan -> main) nu se mai poate actualiza din
# main: "422 merge conflict between base and head". GitHub spune ca exista un
# conflict, dar nu spune unde. Comparand arborii in trei puncte - baza de
# imbinare 4139583d, main 2260149c si varful ramurii - iese la iveala ca un
# singur fisier a fost atins de ambele parti:
#
#   packages/shared/src/bible/geneza.ts
#     baza  abc25a50  31.883 octeti
#     main  c327e082  41.474 octeti   (+9.591, munca la Biblia Emanus)
#     aici  76695d6e  32.048 octeti   (+165, o atingere care n-avea ce cauta)
#
# Restul - .github, docs, apps, packages - se imbina curat: cele doua parti au
# umblat la fisiere diferite.
#
# DE CE NU COPIEZ EU FISIERUL CU MANA:
# Sunt peste 40 KB de text biblic. Regula proiectului e limpede: textul se aduce
# verificat sau nu se pune deloc, nu se scrie din memorie. Orice trecere printr-un
# model poate schimba tacut o litera, iar litera aceea ar ajunge in main peste
# munca de colationare. Asa ca las git-ul sa faca copia, octet cu octet.

on:
  push:
    branches: [spec/devotional-mesaj-borcan]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-geneza-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Ia Geneza exact cum e pe main
        env:
          GH_TOKEN: ${{ github.token }}
          FISIER: packages/shared/src/bible/geneza.ts
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- "${FISIER}"

          if git diff --cached --quiet -- "${FISIER}" && git diff --quiet -- "${FISIER}"; then
            echo 'Geneza este deja identica cu cea de pe main. Nu am ce comite.'
            exit 0
          fi

          echo '=== ce se schimba ==='
          git diff --cached --stat -- "${FISIER}"

          git config user.name 'Emanus CI'
          git config user.email 'ci@emanus.local'
          git add -- "${FISIER}"
          git commit -m 'Geneza: se ia exact versiunea de pe main'
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo 'Gata. Fisierul .github/workflows/sync-geneza.yml se poate sterge acum.'
