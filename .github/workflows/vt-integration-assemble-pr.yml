name: VT Clean Integration Finalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/biblia-explicata-vt-integration-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Fetch main and final VT source
        run: |
          git fetch origin main:refs/remotes/origin/main
          git fetch origin agent/biblia-explicata-vt-complet:refs/remotes/origin/agent/biblia-explicata-vt-complet

      - name: Rebuild deterministic clean VT tree
        run: |
          python3 scripts/assemble-vt-clean.py
          python3 scripts/patch-vt-bundle.py
          python3 scripts/patch-vt-reader.py

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify 39/39 and publication runtime
        run: |
          pnpm check:vt-explained
          pnpm check:vt-publication

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Guard clean VT scope
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main'], text=True).splitlines()
          tokens = (
              'matei', 'marcu', 'luca', 'ioan', 'fapte', 'romani', 'corinteni',
              'galateni', 'efeseni', 'filipeni', 'coloseni', 'tesaloniceni',
              'timotei', 'filimon', 'evrei', 'iacov', 'petru', 'apocalipsa',
          )
          forbidden = []
          for path in changed:
              low = path.lower()
              name = Path(low).name
              if low.startswith('.research/marcu-poonen/'):
                  forbidden.append(path)
              elif (
                  low.startswith('packages/shared/src/bible/')
                  or low.startswith('.research/')
                  or low.startswith('docs/biblia-explicata/')
              ) and any(name.startswith(token) for token in tokens):
                  forbidden.append(path)

          if forbidden:
              raise SystemExit('Fișiere NT detectate în integrarea VT:\n' + '\n'.join(forbidden))

          print(f'Guard VT OK: {len(changed)} fișiere față de main; zero fișiere NT interzise.')
          PY
          git diff --check

      - name: Wire VT gates into normal CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text(encoding='utf-8')
          anchor = '          pnpm check:bible-publication\n'
          addition = anchor + '          pnpm check:vt-explained\n          pnpm check:vt-publication\n'
          if 'pnpm check:vt-explained' not in s:
              if anchor not in s:
                  raise SystemExit('CI anchor check:bible-publication missing')
              s = s.replace(anchor, addition, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -n 'check:vt-' .github/workflows/ci.yml

      - name: Remove migration-only tooling
        run: |
          rm -f \
            .github/workflows/vt-integration-audit.yml \
            .github/workflows/vt-integration-assemble-pr.yml \
            scripts/assemble-vt-clean.py \
            scripts/patch-vt-bundle.py \
            scripts/patch-vt-reader.py

      - name: Verify final cleanup footprint
        run: |
          test ! -e .github/workflows/vt-integration-audit.yml
          test ! -e .github/workflows/vt-integration-assemble-pr.yml
          test ! -e scripts/assemble-vt-clean.py
          test ! -e scripts/patch-vt-bundle.py
          test ! -e scripts/patch-vt-reader.py
          grep -q 'pnpm check:vt-explained' .github/workflows/ci.yml
          grep -q 'pnpm check:vt-publication' .github/workflows/ci.yml
          git diff --check

      - name: Commit finalized clean VT integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/ci.yml \
            .github/workflows/vt-integration-audit.yml \
            .github/workflows/vt-integration-assemble-pr.yml \
            scripts/assemble-vt-clean.py \
            scripts/patch-vt-bundle.py \
            scripts/patch-vt-reader.py
          git diff --cached --check
          git commit -m "chore(bible): finalize clean VT integration gates"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
