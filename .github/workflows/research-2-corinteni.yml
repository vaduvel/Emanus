name: Research 2 Corinteni

on:
  pull_request:
    branches:
      - agent/1-corinteni
    paths:
      - .github/workflows/research-2-corinteni.yml

permissions:
  contents: read

jobs:
  transcribe:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        episode:
          - number: 1
            slug: 01-2cor-1-1-to-1-19
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-1-1-to-chapter-1-20.mp3
          - number: 2
            slug: 02-2cor-1-20-to-3-4
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-1-20-to-chapter-3-8.mp3
          - number: 3
            slug: 03-2cor-3-5-to-4-2
            url: https://www.cfcindia.org/resources/en/study-series/verse-by--verse/nt08-2corinthians-chapter-3-1-to-chapter-4-2.mp3
          - number: 4
            slug: 04-2cor-4-3-to-4-11
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-4-3-to-chapter-4-14.mp3
          - number: 5
            slug: 05-2cor-4-12-to-5-9
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-4-12-to-chapter-5-10.mp3
          - number: 6
            slug: 06-2cor-5-10-to-6-2
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-5-10-to-chapter-6-5.mp3
          - number: 7
            slug: 07-2cor-6-3-to-7-5
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-6-3-to-chapter-7-6.mp3
          - number: 8
            slug: 08-2cor-7-6-to-8-9
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-7-6-to-chapter-8-10.mp3
          - number: 9
            slug: 09-2cor-8-10-to-9-15
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-8-10-to-chapter-9-15.mp3
          - number: 10
            slug: 10-2cor-10-1-to-11-3
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-10-1-to-chapter-11-3.mp3
          - number: 11
            slug: 11-2cor-11-4-to-11-33
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-11-4-to-chapter-11-33.mp3
          - number: 12
            slug: 12-2cor-12-1-to-13-14
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt08-2corinthians-chapter-12-1-to-chapter-13-14.mp3

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install transcription tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper==1.2.0 requests
      - name: Download official CFC audio
        env:
          EPISODE_URL: ${{ matrix.episode.url }}
          EPISODE_SLUG: ${{ matrix.episode.slug }}
        run: |
          mkdir -p .research/2-corinteni/audio .research/2-corinteni/transcripts
          curl --fail --location --retry 4 "$EPISODE_URL" --output ".research/2-corinteni/audio/$EPISODE_SLUG.mp3"
          test -s ".research/2-corinteni/audio/$EPISODE_SLUG.mp3"
      - name: Transcribe episode
        env:
          EPISODE_SLUG: ${{ matrix.episode.slug }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from faster_whisper import WhisperModel
          root = Path('.research/2-corinteni')
          slug = os.environ['EPISODE_SLUG']
          source = root / 'audio' / f'{slug}.mp3'
          target = root / 'transcripts' / f'{slug}.txt'
          model = WhisperModel('tiny.en', device='cpu', compute_type='int8', cpu_threads=4)
          segments, info = model.transcribe(str(source), language='en', beam_size=1, best_of=1, vad_filter=True)
          lines = [' '.join(segment.text.split()) for segment in segments if segment.text.strip()]
          target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'{source.name}: {info.duration:.1f}s audio, {target.stat().st_size} bytes transcript')
          if target.stat().st_size < 5000:
              raise SystemExit('Transcriere prea scurta')
          PY
      - name: Upload private research artifact
        uses: actions/upload-artifact@v4
        with:
          name: doi-corinteni-${{ matrix.episode.slug }}
          path: .research/2-corinteni/transcripts/${{ matrix.episode.slug }}.txt
          if-no-files-found: error
          retention-days: 1
