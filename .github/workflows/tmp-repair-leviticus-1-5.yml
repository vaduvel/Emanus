name: Repair Leviticus 1-5

on:
  push:
    branches:
      - agent/biblia-emanus-leviticul
    paths:
      - .github/workflows/tmp-repair-leviticus-1-5.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-leviticul
          fetch-depth: 0
      - name: Normalize terminology and audit Leviticus 1-5
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('docs/data/biblia-emanus')
          replacements=[
            ('Domnului','DOMNULUI'),('Domnul','DOMNUL'),
            ('jertfă de ardere de tot','ardere-de-tot'),('jertfei de ardere de tot','arderii-de-tot'),
            ('jertfelor de ardere de tot','arderilor-de-tot'),('altarul arderilor de tot','altarul arderii-de-tot'),
            ('altarului arderilor de tot','altarului arderii-de-tot'),('arderilor de tot','arderilor-de-tot'),
            ('jertfă de mâncare','dar de mâncare'),('jertfei de mâncare','darului de mâncare'),
            ('jertfele de mâncare','darurile de mâncare'),('jertfelor de mâncare','darurilor de mâncare'),
            ('floarea făinii','făină fină'),('untdelemn','ulei'),('un miros plăcut','o mireasmă plăcută'),
            ('o ordonanță veșnică','o rânduială veșnică'),('ordonanță veșnică','rânduială veșnică')]
          for p in sorted(root.glob('LEV.*.json')):
              d=json.loads(p.read_text(encoding='utf-8'))
              for v in d['verses']:
                  s=v['text']
                  for a,b in replacements:s=s.replace(a,b)
                  v['text']=s
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          corrections={
          1:{1:'DOMNUL l-a chemat pe Moise și i-a vorbit din Cortul Întâlnirii:',2:'„Vorbește-le fiilor lui Israel și spune-le: «Când cineva dintre voi aduce un dar DOMNULUI, să-și aducă darul dintre animale, fie din cireadă, fie din turmă.',3:'Dacă darul lui este o ardere-de-tot din cireadă, să aducă un mascul fără cusur. Să-l aducă la intrarea Cortului Întâlnirii, ca să fie primit înaintea DOMNULUI.',4:'Să-și pună mâna pe capul animalului adus ca ardere-de-tot, iar acesta va fi primit pentru el ca să se facă ispășire pentru el.',5:'El să înjunghie taurul înaintea DOMNULUI, iar fiii lui Aaron, preoții, să prezinte sângele și să-l stropească de jur împrejur pe altarul de la intrarea Cortului Întâlnirii.',7:'Fiii preotului Aaron să pună foc pe altar și să așeze lemnele pe foc.',9:'El să spele cu apă măruntaiele și picioarele, iar preotul să ardă totul pe altar ca ardere-de-tot, o jertfă mistuită de foc, o mireasmă plăcută DOMNULUI.',15:'Preotul să aducă pasărea la altar, să-i frângă capul la ceafă și să-l ardă pe altar, iar sângele ei să fie scurs pe peretele altarului.',16:'Să-i scoată gușa împreună cu conținutul ei și să o arunce lângă altar, spre răsărit, în locul cenușii.',17:'Să o despice între aripi, fără să o despartă în două, iar preotul să o ardă pe altar, pe lemnele puse pe foc. Este o ardere-de-tot, o jertfă mistuită de foc, o mireasmă plăcută DOMNULUI.»”'},
          2:{1:'„Când cineva aduce DOMNULUI un dar de mâncare, darul lui să fie din făină fină. Să toarne ulei peste ea și să pună tămâie pe ea.',2:'Să-l aducă fiilor lui Aaron, preoții. Preotul să ia un pumn din făina fină și din ulei, împreună cu toată tămâia, și să ardă pe altar partea de aducere-aminte, ca jertfă mistuită de foc, o mireasmă plăcută DOMNULUI.',3:'Ce rămâne din darul de mâncare să fie al lui Aaron și al fiilor lui; este o parte preasfântă din jertfele mistuite de foc ale DOMNULUI.',11:'Niciun dar de mâncare pe care îl aduceți DOMNULUI să nu fie pregătit cu aluat dospit, căci nu trebuie să ardeți pe altar nici aluat dospit, nici miere ca jertfă mistuită de foc pentru DOMNUL.',12:'Le puteți aduce DOMNULUI ca dar din primele roade, dar să nu fie înălțate pe altar ca mireasmă plăcută.',13:'Să sărezi cu sare orice dar de mâncare. Să nu lași să lipsească din darul tău de mâncare sarea legământului Dumnezeului tău. Împreună cu toate darurile tale să aduci sare.',14:'Dacă aduci DOMNULUI un dar de mâncare din primele roade, să aduci spice proaspete prăjite la foc, boabe zdrobite din grâne noi.'},
          3:{1:'„Dacă darul cuiva este o jertfă de pace și aduce din cireadă, fie mascul, fie femelă, să aducă înaintea DOMNULUI un animal fără cusur.',3:'Din jertfa de pace să aducă drept jertfă mistuită de foc pentru DOMNUL grăsimea care acoperă măruntaiele și toată grăsimea de pe măruntaie,',4:'cei doi rinichi cu grăsimea de pe ei, de lângă coapse, și lobul ficatului, pe care să-l îndepărteze împreună cu rinichii.',9:'Din jertfa de pace să aducă drept jertfă mistuită de foc pentru DOMNUL grăsimea ei: întreaga coadă grasă, tăiată aproape de șira spinării, grăsimea care acoperă măruntaiele și toată grăsimea de pe măruntaie,',11:'Preotul să le ardă pe altar; aceasta este hrana jertfei mistuite de foc pentru DOMNUL.',16:'Preotul să le ardă pe altar. Aceasta este hrana jertfei mistuite de foc, ca mireasmă plăcută. Toată grăsimea este a DOMNULUI.',17:'Aceasta să fie o rânduială veșnică pentru generațiile voastre, în toate locuințele voastre: să nu mâncați grăsimea rezervată jertfei și nici sânge.»”'},
          4:{1:'DOMNUL i-a vorbit lui Moise și i-a spus:',2:'„Vorbește-le fiilor lui Israel: «Dacă cineva păcătuiește fără intenție, încălcând una dintre poruncile DOMNULUI și făcând ceva ce nu trebuie făcut,',3:'dacă preotul uns păcătuiește și aduce vină asupra poporului, să aducă DOMNULUI pentru păcatul său un taur tânăr fără cusur, ca jertfă pentru păcat.',6:'Preotul să-și înmoaie degetul în sânge și să stropească de șapte ori din sânge înaintea DOMNULUI, în fața perdelei sanctuarului.',10:'să le îndepărteze așa cum sunt îndepărtate de la taurul jertfei de pace. Preotul să le ardă pe altarul arderii-de-tot.',13:'Dacă întreaga comunitate a lui Israel păcătuiește fără intenție, iar lucrul este ascuns de ochii adunării, și încalcă una dintre poruncile DOMNULUI, devenind vinovată,',20:'Să facă cu taurul acesta așa cum a făcut cu taurul jertfei pentru păcat. Astfel preotul va face ispășire pentru ei și vor fi iertați.',22:'Dacă un conducător păcătuiește și, fără intenție, încalcă una dintre poruncile DOMNULUI, Dumnezeul său, devenind vinovat,',27:'Dacă cineva din poporul țării păcătuiește fără intenție, încălcând una dintre poruncile DOMNULUI și devenind vinovat,',31:'Să îndepărteze toată grăsimea, așa cum este îndepărtată grăsimea de la jertfa de pace, iar preotul să o ardă pe altar ca mireasmă plăcută DOMNULUI. Astfel preotul va face ispășire pentru el și va fi iertat.'},
          5:{1:'„Dacă cineva păcătuiește pentru că aude o chemare publică la mărturie și, deși este martor — a văzut sau cunoaște lucrul — nu îl declară, își va purta vina.',2:'Dacă cineva atinge un lucru necurat — cadavrul unui animal sălbatic necurat, cadavrul unui animal domestic necurat sau cadavrul unei vietăți târâtoare necurate — chiar dacă nu și-a dat seama, devine necurat și vinovat.',3:'Dacă atinge necurăția unui om, oricare ar fi necurăția care îl face necurat, și nu și-a dat seama, când află devine vinovat.',4:'Dacă cineva jură pripit cu buzele să facă rău sau bine — orice ar rosti omul pripit prin jurământ — și nu și-a dat seama, când află devine vinovat în unul dintre aceste cazuri.',5:'Când devine vinovat în unul dintre aceste cazuri, să mărturisească păcatul pe care l-a comis.',6:'Să aducă DOMNULUI, pentru vina păcatului comis, o femelă din turmă, o oaie sau o capră, ca jertfă pentru păcat. Preotul să facă ispășire pentru el cu privire la păcatul lui.',7:'Dacă nu-și permite un animal din turmă, să aducă DOMNULUI pentru vina sa două turturele sau doi pui de porumbel: unul ca jertfă pentru păcat și celălalt ca ardere-de-tot.',11:'Dacă nu-și permite nici două turturele sau doi pui de porumbel, să aducă pentru păcatul său a zecea parte dintr-o efă de făină fină, ca jertfă pentru păcat. Să nu pună ulei sau tămâie peste ea, fiindcă este o jertfă pentru păcat.',15:'„Dacă cineva comite o încălcare și păcătuiește fără intenție cu privire la lucrurile sfinte ale DOMNULUI, să aducă DOMNULUI ca jertfă pentru vină un berbec fără cusur din turmă, evaluat în șecheli de argint după șechelul sanctuarului.',16:'Să restituie ceea ce a folosit greșit din lucrul sfânt, să adauge a cincea parte și să o dea preotului. Preotul să facă ispășire pentru el cu berbecul jertfei pentru vină, iar el va fi iertat.',17:'Dacă cineva păcătuiește încălcând una dintre poruncile DOMNULUI, chiar dacă nu a știut, este vinovat și își va purta nelegiuirea.',19:'Este o jertfă pentru vină; el este cu adevărat vinovat înaintea DOMNULUI.»”'}}
          notes={
          1:[(2,'qorban','dar','Qorban este ceea ce este apropiat sau prezentat înaintea DOMNULUI; termenul general nu trebuie confundat cu un singur tip de jertfă.',['ofrandă']),
             (3,'olah','ardere-de-tot','Animalul este ars în întregime pe altar; numele provine din ideea de urcare.',['jertfă care se înalță']),
             (4,'samak yado','să-și pună mâna','Gestul identifică aducătorul cu darul și îl prezintă înaintea lui Dumnezeu; textul nu spune că păcatul este transferat mecanic prin atingere.',['să-și sprijine mâna']),
             (4,'lekhapper alav','ca să se facă ispășire pentru el','Rădăcina kipper poate include ispășire, curățire și îndepărtarea vinei în funcție de obiectul ritualului.',['să se facă curățire pentru el']),
             (5,'veshahat','el să înjunghie','La animalele din cireadă și turmă, aducătorul înjunghie animalul, iar preoții manipulează sângele.',['să fie înjunghiat']),
             (9,'reah nihoah','mireasmă plăcută','Expresia indică acceptarea jertfei de către Dumnezeu, nu faptul că Dumnezeu are nevoie fizică de miros sau hrană.',['mireasmă liniștitoare']),
             (15,'malaq et-rosho','să-i frângă capul la ceafă','Verbul tehnic descrie o acțiune preoțească asupra gâtului păsării; dacă partea este desprinsă complet diferă după tipul jertfei.',['să-i răsucească gâtul']),
             (16,'murato benotsatah','gușa împreună cu conținutul ei','Al doilea termen poate însemna conținut, pene sau murdărie; decizia urmează funcția de îndepărtare a părții necomestibile.',['gușa cu penele'])],
          2:[(1,'minhah','dar de mâncare','Minhah este un dar sau tribut, aici din produse agricole; nu conține carne.',['ofrandă de cereale']),
             (2,'azkaratah','partea de aducere-aminte','Partea arsă reprezintă întregul dar înaintea lui Dumnezeu; nu este o tehnică prin care Dumnezeu ar fi făcut să-Și amintească ceva uitat.',['partea memorială']),
             (3,'qodesh qodashim','parte preasfântă','Superlativul ebraic indică statutul ritual cel mai strict și limitele consumului preoțesc.',['sfântul sfinților']),
             (11,'seor / devash','aluat dospit / miere','Devash poate desemna miere de albine sau sirop de fructe. Interdicția privește arderea pe altar, nu orice consum.',['sirop de curmale']),
             (13,'melah berit','sarea legământului','Sarea simbolizează durabilitatea și apartenența legământului; textul nu explică un ritual magic al sării.',['sarea acordului']),
             (14,'aviv qalui baesh','spice proaspete prăjite','Aviv indică grâne aflate într-un stadiu timpuriu, nu numele lunii în acest verset.',['spice verzi'])],
          3:[(1,'zevah shelamim','jertfă de pace','Shelamim este legat de pace, bunăstare și părtășie; o parte este arsă, iar alte părți sunt mâncate în cadrul jertfei.',['jertfă de părtășie','jertfă de mulțumire']),
             (4,'yoteret al-hakkaved','lobul ficatului','Identificarea exactă a părții anatomice este disputată; poate fi membrana sau apendicele ficatului.',['membrana ficatului']),
             (9,'alyah temimah','întreaga coadă grasă','Este coada grasă specifică unor rase de oi din regiune, nu coada obișnuită a tuturor oilor.',['grăsimea cozii întregi']),
             (11,'lehem isheh','hrana jertfei mistuite de foc','Limbajul cultic numește partea arsă „hrană”, fără a afirma că Dumnezeu depinde de hrană fizică.',['pâinea focului']),
             (17,'helev vedam','grăsimea rezervată și sângele','Contextul privește grăsimea sacrificială indicată în capitol; nu orice țesut adipos din orice aliment. Sângele este interzis separat.',['nicio grăsime și niciun sânge'])],
          4:[(2,'bishgagah','fără intenție','Termenul descrie eroarea, neatenția sau lipsa cunoașterii, distincte de răzvrătirea deliberată.',['din neștiință']),
             (3,'leashmat haam','aduce vină asupra poporului','Păcatul preotului uns are consecințe comunitare prin rolul său reprezentativ; nu transferă automat vina morală personală fiecărui om.',['spre vinovăția poporului']),
             (3,'hattat','jertfă pentru păcat','Hattat poate desemna păcatul sau jertfa de curățire; ritualul curăță sanctuarul și tratează vina.',['jertfă de curățire']),
             (6,'parokhet haqqodesh','perdeaua sanctuarului','Sângele este stropit în fața perdelei, nu introdus în Locul Preasfânt în acest ritual obișnuit.',['perdeaua Locului Sfânt']),
             (12,'el-maqom tahor','într-un loc curat','Restul este ars în afara taberei într-un loc ritual curat; „afară” nu înseamnă automat necurat.',['loc curățit']),
             (20,'vekhipper alehem ... venislah','va face ispășire ... vor fi iertați','Ritualul și iertarea sunt legate explicit; textul nu descrie ispășirea ca simplă calmare emoțională.',['va face curățire']),
             (27,'meam haarets','cineva din poporul țării','Expresia desemnează oamenii obișnuiți, în contrast cu preotul, adunarea și conducătorul.',['un om de rând'])],
          5:[(1,'alah','chemare publică la mărturie','Alah poate fi jurământ, blestem sau formulă de adjurare care îl obligă pe martor să vorbească.',['un jurământ rostit public']),
             (2,'tame / ashem','necurat și vinovat','Necurăția rituală nu este identică în toate cazurile cu imoralitatea, dar ignorarea responsabilității după aflare produce vină.',['necurat și răspunzător']),
             (4,'levatte bisfatayim','jură pripit cu buzele','Verbul indică rostirea necugetată; obligația jurământului nu justifică împlinirea unei fapte rele.',['rostește nechibzuit']),
             (5,'vehitvaddah','să mărturisească','Mărturisirea concretă a păcatului face parte din răspuns, nu doar aducerea jertfei.',['să-și recunoască păcatul']),
             (6,'ashamo ... lehattat','pentru vina sa ... ca jertfă pentru păcat','Asham descrie aici obligația produsă de vină, în timp ce animalul este numit hattat; terminologia se specializează în versetele 14–19.',['jertfa lui pentru vină']),
             (7,'im-lo taggia yado','dacă nu-și permite','Literal, „dacă mâna lui nu ajunge”; sistemul oferă alternative reale celui sărac, fără reducerea accesului la ispășire.',['dacă mijloacele lui nu ajung']),
             (11,'asirit haefah','a zecea parte dintr-o efă','Efa este o unitate antică de volum; valoarea modernă este aproximativă și nu este introdusă în text.',['aproximativ doi litri']),
             (15,'maal','încălcare','Maal descrie necredincioșia sau folosirea neautorizată a lucrurilor sfinte.',['sacrilegiu']),
             (15,'asham','jertfă pentru vină','Această jertfă include evaluare și, când există prejudiciu, restituire plus o cincime; nu înlocuiește repararea pagubei.',['jertfă de reparare']),
             (16,'hamishito','a cincea parte','Restituirea adaugă douăzeci la sută la valoarea prejudiciului, fără convertirea șechelului într-o sumă modernă.',['încă o cincime']),
             (17,'velo yada veashem','chiar dacă nu a știut, este vinovat','Ignoranța poate diminua intenția, dar nu anulează consecința obiectivă a încălcării; textul nu justifică vinovăția imaginară fără faptă.',['nu știa, dar își poartă vina'])]}
          def mk(v,t,d,r,a):
              n={'verse':v,'term':t,'decision':d,'reason':r,'reviewRequired':True,'resolutionStatus':'resolved','resolutionReason':r}
              if a:n['alternatives']=a
              return n
          for ch in range(1,6):
              p=root/f'LEV.{ch}.json';d=json.loads(p.read_text(encoding='utf-8'))
              by={v['number']:v for v in d['verses']}
              for num,text in corrections[ch].items():by[num]['text']=text
              d['editorialNotes']=[mk(*n) for n in notes[ch]]
              d['status']='published';d['public']=True
              for k in d['review']:d['review'][k]='approved'
              for k in d['benchmark']['checks']:d['benchmark']['checks'][k]='approved'
              a=d['audit'];a.pop('pendingReason',None)
              a['sourceLanguage'].update(result='approved',scope='tipurile de jertfe, agenții ritualului, sângele, grăsimea, ispășirea, vina și restituirea verificate verset cu verset')
              a['romanianLanguage'].update(result='approved',changesApplied=['DOMNUL și terminologia sacrificială au fost uniformizate.','Formulările mecanice și termenii anatomici au fost revizuiți pentru naturalețe și precizie.'])
              a['theologicalContext'].update(result='approved',principles=['Jertfele sunt descrise în cadrul legământului, fără transformarea ritualului în tehnică magică.','Necurăția rituală este diferențiată de vina morală, iar mărturisirea și restituirea sunt păstrate.','Alternativele pentru săraci arată accesul proporțional și nu permit presiunea financiară.'])
              a['omissionAddition'].update(result='approved',omissions=0,additions=0);a['copyrightDistance']['result']='approved';a['criticalIssues'].update(result='approved',open=0)
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          m=root/'manifest.json';manifest=json.loads(m.read_text(encoding='utf-8'))
          manifest['progress'].update(chaptersDrafted=77,versesDrafted=2392,chaptersApproved=55,chaptersPublished=55)
          m.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          git rm .github/workflows/tmp-repair-leviticus-1-5.yml
          git add docs/data/biblia-emanus/LEV.*.json docs/data/biblia-emanus/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize Leviticus and substantively audit chapters 1-5"
          git push origin HEAD:agent/biblia-emanus-leviticul
