name: Upgrade OT to Biblia Emanus Audit 2.0

on:
  push:
    branches:
      - agent/biblia-emanus-ot-audit2

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch validated source branches
        run: |
          git fetch origin agent/biblia-emanus-exodul:refs/remotes/origin/agent/biblia-emanus-exodul
          git fetch origin agent/biblia-emanus-leviticul:refs/remotes/origin/agent/biblia-emanus-leviticul
          git fetch origin agent/biblia-emanus-numeri:refs/remotes/origin/agent/biblia-emanus-numeri
          git fetch origin agent/biblia-emanus-deuteronomul:refs/remotes/origin/agent/biblia-emanus-deuteronomul

      - name: Build the unified pinned snapshot and audits
        run: python3 scripts/upgrade-ot-audit2.py

      - name: Validate Biblia Emanus engine 2.0
        run: python3 scripts/check-biblia-emanus.py

      - name: Run negative gate tests
        run: python3 -m unittest scripts/test_biblia_emanus.py

      - name: Verify all six books are sealable
        run: >-
          python3 scripts/seal-biblia-emanus.py --check
          --book GEN --book EXO --book LEV --book NUM --book DEU --book JOS

      - name: Commit only permanent audited output
        run: |
          rm scripts/upgrade-ot-audit2.py
          rm .github/workflows/upgrade-ot-audit2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Upgrade audited OT books to Biblia Emanus engine 2.0"
          git push origin HEAD:agent/biblia-emanus-ot-audit2
