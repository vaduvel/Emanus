name: VT Restore Psalmi Review

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
    paths:
      - ".github/workflows/vt-restore-psalmi-review.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full review file and apply Psalm 51 versification patch
        shell: bash
        run: |
          set -euo pipefail
          path="packages/shared/src/bible/overlays/psalmi22_32_51_110ExplanationReview.ts"
          git checkout 7802935c5a769638a3cdcbeb1997c40ce91b1938 -- "$path"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/shared/src/bible/overlays/psalmi22_32_51_110ExplanationReview.ts")
          text = path.read_text()
          start = text.index("const PSALMUL_51:")
          end = text.index("const PSALMUL_110:")
          before, block, after = text[:start], text[start:end], text[end:]

          replacements = {
              "from: 13,\n      to: 19,": "from: 13,\n      to: 17,",
              'sources: ["Psalmul 51:13-19", "2 Samuel 12:13", "1 Ioan 1:7-9"],': 'sources: ["Psalmul 51:13-17", "2 Samuel 12:13", "1 Ioan 1:7-9"],',
              "from: 20,\n      to: 21,": "from: 18,\n      to: 19,",
              'sources: ["Psalmul 51:20-21"],': 'sources: ["Psalmul 51:18-19"],',
          }
          for old, new in replacements.items():
              if old not in block:
                  raise SystemExit(f"missing expected Psalm 51 fragment: {old!r}")
              block = block.replace(old, new, 1)

          path.write_text(before + block + after)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "Restore Psalm review file and align Psalm 51 versification"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
