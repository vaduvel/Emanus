name: Temporary dump Exodus audit

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-dump-exodus-audit.yml

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Build compact audit inventories
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('docs/data/biblia-emanus')
          files = sorted(root.glob('EXO.*.json'), key=lambda p: int(p.stem.split('.')[1]))
          verses=[]; notes=[]; summary=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))
              ch=d['chapter']
              for v in d['verses']:
                  verses.append(f"EXO {ch}:{v['number']}\t{v['text']}")
              ens=d.get('editorialNotes',[])
              summary.append(f"EXO {ch}\tverses={len(d['verses'])}\tnotes={len(ens)}\tstatus={d.get('status')}\tpublic={d.get('public')}")
              for n in ens:
                  notes.append(f"EXO {ch}:{n.get('verse')}\t{n.get('term','')}\t{n.get('decision','')}\t{n.get('reason',n.get('resolutionReason',''))}")
          (root/'.audit-EXO-verses.txt').write_text('\n'.join(verses)+'\n',encoding='utf-8')
          (root/'.audit-EXO-notes.txt').write_text('\n'.join(notes)+'\n',encoding='utf-8')
          (root/'.audit-EXO-summary.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          PY
          git rm .github/workflows/tmp-dump-exodus-audit.yml
          git add docs/data/biblia-emanus/.audit-EXO-*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Create temporary Exodus audit inventories"
          git push origin HEAD:agent/biblia-emanus-exodul
