name: Review Numbers 1-36

on:
  push:
    branches:
      - agent/biblia-emanus-numeri
    paths:
      - scripts/review-numbers-1-36.py
      - .github/workflows/review-numbers-1-36.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-numeri
          fetch-depth: 0
      - name: Run full audit safely
        id: audit
        shell: bash
        run: |
          set +e
          python3 scripts/review-numbers-1-36.py > /tmp/numbers-audit.log 2>&1
          code=$?
          echo "exit_code=$code" >> /tmp/numbers-audit.log
          if [ "$code" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/numbers-audit.log docs/data/biblia-emanus/.audit-NUM-run.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit result or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.audit.outputs.failed }}" = "true" ]; then
            git add docs/data/biblia-emanus/.audit-NUM-run.log
            git commit -m "Record Numbers audit failure"
            git push origin HEAD:agent/biblia-emanus-numeri
            exit 1
          fi
          git add -A docs/data/biblia-emanus/NUM.*.json docs/data/biblia-emanus/manifest.json docs/data/biblia-emanus/.audit-NUM-notes.txt docs/data/biblia-emanus/.audit-NUM-summary.txt docs/data/biblia-emanus/.audit-NUM-verses.txt docs/biblia-emanus/NUMERI-AUDIT.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Audit and publish Numbers 1-36"
          git push origin HEAD:agent/biblia-emanus-numeri

# Diagnostic run with rollback on failure.
