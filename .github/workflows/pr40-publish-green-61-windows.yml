name: PR40 emergency publish 61 green works

on:
  issue_comment:
    types: [created]
  pull_request:
    branches:
      - main
    paths:
      - 'docs/biblia-emanus/PR40-PUBLISH-61.trigger'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: pr40-emergency-publish-green-61-main
  cancel-in-progress: true

env:
  PRIOR_RUN_ID: '31110524525'

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.issue.number == 43 && github.event.comment.body == '/publish-pr40-green-61')
    name: Publish 61 green works directly to main
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Cancel obsolete PR40 publication runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          @'
          import json, os, time, urllib.error, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'emanus-pr40-windows-publisher',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?branch=main&per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              runs = json.load(response)['workflow_runs']
          active = {'queued', 'in_progress', 'waiting', 'pending', 'requested'}
          obsolete = [
              run for run in runs
              if int(run['id']) != current
              and run.get('status') in active
              and str(run.get('name', '')).startswith('PR40')
          ]
          print(f'Obsolete active PR40 runs: {len(obsolete)}')
          for run in obsolete:
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel"
              for attempt in range(1, 7):
                  try:
                      req = urllib.request.Request(url, data=b'', method='POST', headers=headers)
                      with urllib.request.urlopen(req, timeout=60) as response:
                          response.read()
                      print(f"Cancelled {run['name']} #{run['run_number']} ({run['id']})")
                      break
                  except urllib.error.HTTPError as error:
                      if error.code in {409, 422}:
                          break
                      if error.code in {502, 503, 504} and attempt < 6:
                          time.sleep(min(30, 2 ** attempt))
                          continue
                      raise
          '@ | python -

      - name: Checkout main with native git
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:HEAD_SHA
          git checkout --detach FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record start in main
        shell: pwsh
        run: |
          $status = @{
            status = "running"
            stage = "downloading-green-artifacts"
            runId = "$env:GITHUB_RUN_ID"
            sourceRunId = "$env:PRIOR_RUN_ID"
          } | ConvertTo-Json
          New-Item -ItemType Directory -Force docs/biblia-emanus | Out-Null
          Set-Content -Path docs/biblia-emanus/PR40-PUBLICATION-STATUS.json -Value $status -Encoding utf8
          git add docs/biblia-emanus/PR40-PUBLICATION-STATUS.json
          git commit -m "Record PR40 61-work publication start"
          git push origin HEAD:main

      - name: Download all prior artifacts safely
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/download-pr40-run-artifacts.py `
            --run-id $env:PRIOR_RUN_ID `
            --output staging/prior `
            --require pr40-final-canonical-publication `
            --require pr40-early-4BA `
            --require pr40-early-ENO `
            --require pr40-early-JUB `
            --require pr40-qumran-COMM_REG `
            --require pr40-qumran-GEN_APO `
            --require pr40-qumran-GIANTS `
            --require pr40-qumran-HAB_COM `
            --require pr40-qumran-HODAYOT `
            --require pr40-qumran-SABB_SAC `
            --require pr40-qumran-WAR_SCR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble, validate and commit 61 works
        shell: pwsh
        run: |
          python scripts/assemble-pr40-green-publication.py --prior staging/prior
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json
          from pathlib import Path
          report = json.loads(Path('docs/biblia-emanus/PR40-FINAL-PUBLICATION-VERDICT.json').read_text(encoding='utf-8'))
          assert report['status'] == 'published'
          assert report['counts']['works'] == 61
          assert report['blockingIssues'] == 0
          assert set(report['excludedWorks']) == {'DID', 'TEMP_SCR', 'ADD_PSA'}
          print('61-work publication verdict validated')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $status = @{
            status = "published"
            stage = "complete"
            runId = "$env:GITHUB_RUN_ID"
            works = 61
            excluded = @("DID", "TEMP_SCR", "ADD_PSA")
            verification = "individual-gates-green"
          } | ConvertTo-Json
          Set-Content -Path docs/biblia-emanus/PR40-PUBLICATION-STATUS.json -Value $status -Encoding utf8

          git add docs/data/biblia-emanus
          git add docs/data/biblia-emanus-deuterocanon-audited
          git add docs/data/biblia-emanus-early-audited
          git add docs/data/biblia-emanus-qumran-audited
          git add docs/biblia-emanus/PR40-FINAL-PUBLICATION-VERDICT.json
          git add docs/biblia-emanus/PR40-PUBLICATION-STATUS.json
          git commit -m "Publish the 61 verified PR40 works"
          git push origin HEAD:main

      - name: Record failure
        if: failure()
        shell: pwsh
        run: |
          $status = @{
            status = "failed"
            stage = "windows-emergency-publication"
            runId = "$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          New-Item -ItemType Directory -Force docs/biblia-emanus | Out-Null
          Set-Content -Path docs/biblia-emanus/PR40-PUBLICATION-STATUS.json -Value $status -Encoding utf8
          git add docs/biblia-emanus/PR40-PUBLICATION-STATUS.json
          git commit -m "Record PR40 publication failure" 2>$null
          git push origin HEAD:main 2>$null
