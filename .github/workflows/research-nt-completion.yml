name: Research NT Completion Sources

on:
  pull_request:
    branches:
      - agent/1-tesaloniceni
    paths:
      - .github/workflows/research-nt-completion.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect official CFC episode ranges and audio URLs
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          books = [
              ("2-tesaloniceni", "2-Thessalonians"),
              ("1-timotei", "1-Timothy"),
              ("2-timotei", "2-Timothy"),
              ("evrei", "Hebrews"),
              ("iacov", "James"),
              ("1-petru", "1-Peter"),
              ("2-petru", "2-Peter"),
              ("1-ioan", "1-John"),
              ("2-ioan", "2-John"),
              ("3-ioan", "3-John"),
              ("iuda", "Jude"),
              ("apocalipsa", "Revelation"),
          ]
          session = requests.Session()
          session.headers["User-Agent"] = "Emanus editorial source collector/1.0"
          out = {"source": "Christian Fellowship Church, Bangalore", "books": []}
          for slug, page_slug in books:
              url = f"https://www.cfcindia.com/verse-by-verse/{page_slug}"
              response = session.get(url, timeout=60)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "html.parser")
              episodes = []
              pending = []
              for link in soup.find_all("a", href=True):
                  text = " ".join(link.get_text(" ", strip=True).split())
                  href = link["href"]
                  if re.match(r"^\d{2}\.", text) and "Chapter" in text:
                      pending.append({"title": text, "pageUrl": requests.compat.urljoin(url, href)})
                  elif href.lower().endswith(".mp3") and pending:
                      item = pending.pop(0)
                      item["audioUrl"] = requests.compat.urljoin(url, href)
                      episodes.append(item)
              if pending:
                  for item in pending:
                      item["audioUrl"] = None
                      episodes.append(item)
              if not episodes:
                  raise SystemExit(f"Nu au fost detectate episoade pentru {url}")
              out["books"].append({"slug": slug, "pageUrl": url, "episodes": episodes})
              print(slug, len(episodes))
              time.sleep(0.25)
          target = Path(".research/nt-completion-sources.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nt-completion-official-sources
          path: .research/nt-completion-sources.json
          if-no-files-found: error
          retention-days: 1
