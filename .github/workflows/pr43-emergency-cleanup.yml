name: PR43 emergency cleanup

on:
  push:
    branches:
      - agent/pr43-emergency-cleanup-windows

permissions:
  actions: write
  contents: read

jobs:
  cancel-old-pr-runs:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Cancel every obsolete PR43 run through the REST API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/biblia-emanus-pr40-final
          TARGET_HEAD: 8bde6589d1df7c4a91e122b424aa09a729764469
        run: |
          @'
          import json, os, time, urllib.error, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target_branch = os.environ['TARGET_BRANCH']
          target_head = os.environ['TARGET_HEAD']
          active = {'queued', 'in_progress', 'waiting', 'pending', 'requested'}
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'emanus-pr43-emergency-cleanup',
          }

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?event=pull_request&per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              runs = json.load(response)['workflow_runs']

          obsolete = [
              run for run in runs
              if run.get('head_branch') == target_branch
              and run.get('head_sha') != target_head
              and run.get('status') in active
          ]
          print(f'Obsolete active PR43 runs: {len(obsolete)}')

          for run in obsolete:
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel"
              for attempt in range(1, 7):
                  try:
                      req = urllib.request.Request(url, data=b'', method='POST', headers=headers)
                      with urllib.request.urlopen(req) as response:
                          response.read()
                      print(f"Cancelled {run['name']} #{run['run_number']} ({run['id']})")
                      break
                  except urllib.error.HTTPError as error:
                      if error.code in {409, 422}:
                          print(f"Run {run['id']} already completed or no longer cancellable")
                          break
                      if error.code in {502, 503, 504} and attempt < 6:
                          delay = min(30, 2 ** attempt)
                          print(f"Transient API {error.code}; retrying {run['id']} in {delay}s")
                          time.sleep(delay)
                          continue
                      print(f"Could not cancel run {run['id']}: HTTP {error.code}")
                      break
          '@ | python -
