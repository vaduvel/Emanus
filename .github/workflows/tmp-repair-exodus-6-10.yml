             (12,'vayhazeq YHWH et-lev paroh','DOMNUL a împietrit inima faraonului','Aici narațiunea Îl numește explicit pe Dumnezeu ca agent; aceasta urmează mai multor refuzuri și autoîmpietriri ale faraonului.',['DOMNUL a întărit inima faraonului']),
