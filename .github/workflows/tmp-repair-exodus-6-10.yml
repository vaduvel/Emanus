name: Repair Exodus 6-10

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-repair-exodus-6-10.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Replace contaminated text and complete audit
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          texts={
          6:[
          'DOMNUL i-a spus lui Moise: „Acum vei vedea ce îi voi face faraonului: silit de o mână puternică îi va lăsa să plece și, silit de o mână puternică, îi va izgoni din țara lui.”',
          'Dumnezeu i-a vorbit lui Moise și i-a spus: „Eu sunt DOMNUL.',
          'M-am arătat lui Avraam, lui Isaac și lui Iacov ca Dumnezeul Atotputernic, dar prin Numele Meu, DOMNUL, nu M-am făcut cunoscut lor.',
          'Am încheiat legământul Meu cu ei, ca să le dau țara Canaanului, țara în care au locuit ca străini.',
          'Am auzit și gemetele fiilor lui Israel, pe care egiptenii îi țin în robie, și Mi-am adus aminte de legământul Meu.',
          'De aceea spune-le fiilor lui Israel: «Eu sunt DOMNUL. Vă voi scoate de sub poverile egiptenilor, vă voi elibera din robia lor și vă voi răscumpăra cu braț întins și prin judecăți mari.',
          'Vă voi lua ca popor al Meu și voi fi Dumnezeul vostru. Veți ști că Eu sunt DOMNUL, Dumnezeul vostru, Cel care vă scoate de sub poverile egiptenilor.',
          'Vă voi aduce în țara pe care am jurat că o voi da lui Avraam, lui Isaac și lui Iacov și v-o voi da ca moștenire. Eu sunt DOMNUL.»”',
          'Moise le-a spus aceste lucruri fiilor lui Israel, dar ei nu l-au ascultat din cauza descurajării și a robiei aspre.',
          'DOMNUL i-a vorbit lui Moise și i-a spus:',
          '„Du-te și vorbește-i faraonului, regele Egiptului, ca să-i lase pe fiii lui Israel să plece din țara lui.”',
          'Moise a spus înaintea DOMNULUI: „Iată, fiii lui Israel nu m-au ascultat. Cum mă va asculta faraonul, când eu am buze necircumcise?”',
          'DOMNUL le-a vorbit lui Moise și lui Aaron și le-a dat porunci cu privire la fiii lui Israel și la faraon, regele Egiptului, ca să-i scoată pe fiii lui Israel din țara Egiptului.',
          'Acestea sunt căpeteniile caselor părinților lor. Fiii lui Ruben, întâiul născut al lui Israel, au fost Hanoch, Pallu, Hețron și Carmi. Acestea sunt familiile lui Ruben.',
          'Fiii lui Simeon au fost Iemuel, Iamin, Ohad, Iachin, Țohar și Șaul, fiul unei femei canaanite. Acestea sunt familiile lui Simeon.',
          'Acestea sunt numele fiilor lui Levi, după generațiile lor: Gherșon, Chehat și Merari. Levi a trăit o sută treizeci și șapte de ani.',
          'Fiii lui Gherșon au fost Libni și Șimei, după familiile lor.',
          'Fiii lui Chehat au fost Amram, Ițhar, Hebron și Uziel. Chehat a trăit o sută treizeci și trei de ani.',
          'Fiii lui Merari au fost Mahli și Muși. Acestea sunt familiile leviților, după generațiile lor.',
          'Amram a luat-o de soție pe Iochebed, mătușa sa, iar ea i-a născut pe Aaron și pe Moise. Amram a trăit o sută treizeci și șapte de ani.',
          'Fiii lui Ițhar au fost Core, Nefeg și Zicri.',
          'Fiii lui Uziel au fost Mișael, Elțafan și Sitri.',
          'Aaron a luat-o de soție pe Elișeba, fiica lui Aminadab și sora lui Nahșon, iar ea i-a născut pe Nadab, Abihu, Eleazar și Itamar.',
          'Fiii lui Core au fost Asir, Elcana și Abiasaf. Acestea sunt familiile coriților.',
          'Eleazar, fiul lui Aaron, a luat-o de soție pe una dintre fiicele lui Putiel, iar ea i l-a născut pe Fineas. Acestea sunt căpeteniile caselor părintești ale leviților, după familiile lor.',
          'Aceștia sunt Aaron și Moise cărora DOMNUL le-a spus: „Scoateți-i pe fiii lui Israel din țara Egiptului, după oștirile lor.”',
          'Ei sunt cei care i-au vorbit faraonului, regele Egiptului, ca să-i scoată pe fiii lui Israel din Egipt. Aceștia sunt Moise și Aaron.',
          'În ziua în care DOMNUL i-a vorbit lui Moise în țara Egiptului,',
          'DOMNUL i-a spus lui Moise: „Eu sunt DOMNUL. Spune-i faraonului, regele Egiptului, tot ce îți spun.”',
          'Dar Moise a spus înaintea DOMNULUI: „Iată, eu am buze necircumcise. Cum mă va asculta faraonul?”'],
          7:[
          'DOMNUL i-a spus lui Moise: „Iată, te-am făcut ca Dumnezeu pentru faraon, iar Aaron, fratele tău, va fi profetul tău.',
          'Tu vei spune tot ce îți poruncesc, iar Aaron, fratele tău, îi va vorbi faraonului, ca să-i lase pe fiii lui Israel să plece din țara lui.',
          'Eu voi împietri inima faraonului și Îmi voi înmulți semnele și minunile în țara Egiptului.',
          'Faraonul nu vă va asculta. Atunci Îmi voi pune mâna asupra Egiptului și, prin judecăți mari, Îmi voi scoate oștirile, poporul Meu, pe fiii lui Israel, din țara Egiptului.',
          'Egiptenii vor ști că Eu sunt DOMNUL când Îmi voi întinde mâna asupra Egiptului și îi voi scoate pe fiii lui Israel din mijlocul lor.”',
          'Moise și Aaron au făcut întocmai; au făcut așa cum le poruncise DOMNUL.',
          'Moise avea optzeci de ani, iar Aaron optzeci și trei de ani când i-au vorbit faraonului.',
          'DOMNUL le-a vorbit lui Moise și lui Aaron și le-a spus:',
          '„Când faraonul vă va spune: «Faceți o minune!», să-i spui lui Aaron: «Ia-ți toiagul și aruncă-l înaintea faraonului; el se va preface într-un șarpe.»”',
          'Moise și Aaron au intrat la faraon și au făcut așa cum le poruncise DOMNUL. Aaron și-a aruncat toiagul înaintea faraonului și a slujitorilor lui, iar acesta s-a prefăcut într-un șarpe.',
          'Atunci faraonul i-a chemat și pe înțelepți și pe vrăjitori, iar magicienii Egiptului au făcut și ei același lucru prin practicile lor tainice.',
          'Fiecare și-a aruncat toiagul, iar acestea s-au prefăcut în șerpi. Dar toiagul lui Aaron le-a înghițit toiagurile.',
          'Inima faraonului s-a împietrit și nu i-a ascultat, așa cum spusese DOMNUL.',
          'DOMNUL i-a spus lui Moise: „Inima faraonului este încăpățânată; el refuză să lase poporul să plece.',
          'Du-te la faraon dimineața, când va ieși la apă. Stai înaintea lui pe malul Nilului și ia în mână toiagul care se prefăcuse în șarpe.',
          'Spune-i: «DOMNUL, Dumnezeul evreilor, m-a trimis la tine și ți-a spus: Lasă poporul Meu să plece ca să-Mi slujească în pustiu. Dar până acum nu ai ascultat.',
          'Așa vorbește DOMNUL: Prin aceasta vei ști că Eu sunt DOMNUL. Iată, voi lovi cu toiagul din mâna mea apele Nilului, iar ele se vor preface în sânge.',
          'Peștii din Nil vor muri, Nilul va mirosi urât, iar egiptenilor le va fi scârbă să bea apă din el.»”',
          'DOMNUL i-a spus lui Moise: „Spune-i lui Aaron: «Ia-ți toiagul și întinde-ți mâna peste apele Egiptului, peste râurile, canalele, iazurile și toate rezervoarele lor, ca să se prefacă în sânge. Va fi sânge în toată țara Egiptului, chiar și în vasele de lemn și de piatră.»”',
          'Moise și Aaron au făcut așa cum le poruncise DOMNUL. Aaron și-a ridicat toiagul și a lovit apele Nilului înaintea faraonului și a slujitorilor lui, iar toate apele Nilului s-au prefăcut în sânge.',
          'Peștii din Nil au murit, Nilul a început să miroasă urât, iar egiptenii nu au mai putut bea apă din el. Sângele era în toată țara Egiptului.',
          'Magicienii Egiptului au făcut și ei același lucru prin practicile lor tainice. Inima faraonului s-a împietrit și nu i-a ascultat, așa cum spusese DOMNUL.',
          'Faraonul s-a întors și a intrat în casa lui, fără să ia la inimă nici acest lucru.',
          'Toți egiptenii au săpat în jurul Nilului ca să găsească apă de băut, fiindcă nu puteau bea din apa Nilului.',
          'Au trecut șapte zile după ce DOMNUL lovise Nilul.'],
          8:[
          'DOMNUL i-a vorbit lui Moise: „Du-te la faraon și spune-i: «Așa vorbește DOMNUL: Lasă poporul Meu să plece ca să-Mi slujească.',
          'Dacă refuzi să-l lași să plece, voi lovi întregul tău ținut cu broaște.',
          'Nilul va mișuna de broaște. Ele se vor urca și vor intra în casa ta, în dormitorul tău și în patul tău, în casele slujitorilor tăi și peste poporul tău, în cuptoarele și în covatele tale de frământat.',
          'Broaștele se vor urca peste tine, peste poporul tău și peste toți slujitorii tăi.»”',
          'DOMNUL i-a spus lui Moise: „Spune-i lui Aaron: «Întinde-ți mâna cu toiagul peste râuri, peste canale și peste iazuri și fă să se urce broaște peste țara Egiptului.»”',
          'Aaron și-a întins mâna peste apele Egiptului, iar broaștele s-au urcat și au acoperit țara Egiptului.',
          'Magicienii au făcut și ei la fel prin practicile lor tainice și au făcut să se urce broaște peste țara Egiptului.',
          'Atunci faraonul i-a chemat pe Moise și pe Aaron și le-a spus: „Rugați-L pe DOMNUL să îndepărteze broaștele de la mine și de la poporul meu, iar eu voi lăsa poporul să plece ca să aducă jertfe DOMNULUI.”',
          'Moise i-a spus faraonului: „Hotărăște tu când să mă rog pentru tine, pentru slujitorii tăi și pentru poporul tău, ca broaștele să fie nimicite din casele voastre și să rămână numai în Nil.”',
          'El a răspuns: „Mâine.” Moise a spus: „Va fi după cuvântul tău, ca să știi că nu este nimeni ca DOMNUL, Dumnezeul nostru.',
          'Broaștele se vor îndepărta de la tine, din casele tale, de la slujitorii tăi și de la poporul tău și vor rămâne numai în Nil.”',
          'Moise și Aaron au ieșit de la faraon, iar Moise a strigat către DOMNUL cu privire la broaștele pe care le adusese asupra faraonului.',
          'DOMNUL a făcut după cuvântul lui Moise, iar broaștele au murit în case, în curți și pe câmpuri.',
          'Le-au strâns în grămezi, iar țara a început să miroasă urât.',
          'Când faraonul a văzut că avea răgaz, și-a împietrit inima și nu i-a ascultat, așa cum spusese DOMNUL.',
          'DOMNUL i-a spus lui Moise: „Spune-i lui Aaron: «Întinde-ți toiagul și lovește țărâna pământului, ca ea să se prefacă în țânțari în toată țara Egiptului.»”',
          'Ei au făcut așa. Aaron și-a întins mâna cu toiagul, a lovit țărâna pământului, iar țânțarii au venit peste oameni și peste animale. Toată țărâna pământului s-a prefăcut în țânțari în toată țara Egiptului.',
          'Magicienii au încercat să facă și ei țânțari prin practicile lor tainice, dar nu au putut. Țânțarii erau pe oameni și pe animale.',
          'Atunci magicienii i-au spus faraonului: „Acesta este degetul lui Dumnezeu!” Dar inima faraonului s-a împietrit și nu i-a ascultat, așa cum spusese DOMNUL.',
          'DOMNUL i-a spus lui Moise: „Scoală-te dis-de-dimineață, înfățișează-te înaintea faraonului când va ieși la apă și spune-i: «Așa vorbește DOMNUL: Lasă poporul Meu să plece ca să-Mi slujească.',
          'Dacă nu vei lăsa poporul Meu să plece, voi trimite roiuri de insecte peste tine, peste slujitorii tăi, peste poporul tău și în casele tale. Casele egiptenilor și chiar pământul pe care stau se vor umple de roiuri.',
          'În ziua aceea voi pune deoparte ținutul Goșen, unde locuiește poporul Meu, și acolo nu vor fi roiuri, ca să știi că Eu, DOMNUL, sunt în mijlocul țării.',
          'Voi face o deosebire între poporul Meu și poporul tău. Semnul acesta va avea loc mâine.»”',
          'DOMNUL a făcut astfel. Roiuri grele de insecte au intrat în casa faraonului, în casele slujitorilor lui și în toată țara Egiptului. Țara a fost pustiită de roiuri.',
          'Faraonul i-a chemat pe Moise și pe Aaron și le-a spus: „Duceți-vă și aduceți jertfe Dumnezeului vostru aici, în țară!”',
          'Moise a răspuns: „Nu este potrivit să facem așa, fiindcă jertfele pe care le aducem DOMNULUI, Dumnezeul nostru, sunt detestabile pentru egipteni. Dacă aducem înaintea ochilor lor jertfe pe care le consideră detestabile, nu ne vor ucide cu pietre?',
          'Vom merge cale de trei zile în pustiu și vom aduce jertfe DOMNULUI, Dumnezeul nostru, așa cum ne va porunci.”',
          'Faraonul a spus: „Vă voi lăsa să plecați ca să aduceți jertfe DOMNULUI, Dumnezeul vostru, în pustiu, numai să nu mergeți prea departe. Rugați-vă pentru mine!”',
          'Moise a spus: „Iată, voi ieși de la tine și mă voi ruga DOMNULUI. Mâine, roiurile se vor îndepărta de la faraon, de la slujitorii lui și de la poporul lui. Dar faraonul să nu ne mai înșele, refuzând să lase poporul să plece ca să aducă jertfe DOMNULUI.”',
          'Moise a ieșit de la faraon și s-a rugat DOMNULUI.',
          'DOMNUL a făcut după cuvântul lui Moise și a îndepărtat roiurile de la faraon, de la slujitorii lui și de la poporul lui; nu a mai rămas niciunul.',
          'Dar faraonul și-a împietrit inima și de data aceasta și nu a lăsat poporul să plece.'],
          9:[
          'Atunci DOMNUL i-a spus lui Moise: „Du-te la faraon și spune-i: «Așa vorbește DOMNUL, Dumnezeul evreilor: Lasă poporul Meu să plece ca să-Mi slujească.',
          'Dacă refuzi să-l lași să plece și continui să-l ții,',
          'iată, mâna DOMNULUI va veni peste animalele tale de pe câmp — peste cai, măgari, cămile, cirezi și turme — printr-o ciumă foarte grea.',
          'DOMNUL va face deosebire între animalele lui Israel și animalele Egiptului și nu va muri nimic din tot ce le aparține fiilor lui Israel.»”',
          'DOMNUL a hotărât timpul și a spus: „Mâine va face DOMNUL acest lucru în țară.”',
          'A doua zi, DOMNUL a făcut acel lucru. Animalele egiptenilor au murit, dar dintre animalele fiilor lui Israel nu a murit niciunul.',
          'Faraonul a trimis să cerceteze și iată că dintre animalele israeliților nu murise niciunul. Dar inima faraonului a rămas încăpățânată și nu a lăsat poporul să plece.',
          'DOMNUL le-a spus lui Moise și lui Aaron: „Luați câte un pumn de cenușă din cuptor, iar Moise să o arunce spre cer înaintea faraonului.',
          'Ea se va preface într-un praf fin peste toată țara Egiptului și va provoca pe oameni și pe animale bube care se transformă în bășici, în toată țara Egiptului.”',
          'Ei au luat cenușă din cuptor și s-au înfățișat înaintea faraonului. Moise a aruncat-o spre cer, iar ea a provocat pe oameni și pe animale bube care se transformau în bășici.',
          'Magicienii nu au putut sta înaintea lui Moise din cauza bubelor, fiindcă bubele erau pe magicieni și pe toți egiptenii.',
          'DOMNUL a împietrit inima faraonului și el nu i-a ascultat, așa cum îi spusese DOMNUL lui Moise.',
          'DOMNUL i-a spus lui Moise: „Scoală-te dis-de-dimineață, înfățișează-te înaintea faraonului și spune-i: «Așa vorbește DOMNUL, Dumnezeul evreilor: Lasă poporul Meu să plece ca să-Mi slujească.',
          'De data aceasta voi trimite toate loviturile Mele asupra inimii tale, asupra slujitorilor tăi și asupra poporului tău, ca să știi că nu este nimeni ca Mine pe tot pământul.',
          'Dacă Mi-aș fi întins până acum mâna și te-aș fi lovit pe tine și pe poporul tău cu ciumă, ai fi fost șters de pe pământ.',
          'Dar tocmai pentru aceasta te-am lăsat în picioare: ca să-ți arăt puterea Mea și Numele Meu să fie vestit pe tot pământul.',
          'Tu încă te înalți împotriva poporului Meu și nu-l lași să plece.',
          'Iată, mâine, pe vremea aceasta, voi face să cadă o grindină foarte grea, cum nu a mai fost în Egipt din ziua întemeierii lui și până acum.',
          'Acum trimite să fie adăpostite animalele tale și tot ce ai pe câmp. Grindina va cădea peste orice om și orice animal care va fi găsit pe câmp și nu va fi adus înăuntru, iar ei vor muri.»”',
          'Aceia dintre slujitorii faraonului care s-au temut de cuvântul DOMNULUI și-au adus în grabă slujitorii și animalele în case.',
          'Dar cei care nu au luat în serios cuvântul DOMNULUI și-au lăsat slujitorii și animalele pe câmp.',
          'DOMNUL i-a spus lui Moise: „Întinde-ți mâna spre cer, ca să cadă grindină în toată țara Egiptului, peste oameni, peste animale și peste toate plantele câmpului.”',
          'Moise și-a întins toiagul spre cer, iar DOMNUL a trimis tunete și grindină și a făcut să cadă foc pe pământ. DOMNUL a făcut să plouă cu grindină peste țara Egiptului.',
          'A fost grindină foarte grea, cu foc fulgerând în mijlocul grindinii, cum nu mai fusese în toată țara Egiptului de când devenise un popor.',
          'Grindina a lovit în toată țara Egiptului tot ce era pe câmp, atât oameni, cât și animale. A lovit toate plantele câmpului și a sfărâmat toți copacii de pe câmp.',
          'Numai în ținutul Goșen, unde erau fiii lui Israel, nu a fost grindină.',
          'Faraonul a trimis să-i cheme pe Moise și pe Aaron și le-a spus: „De data aceasta am păcătuit. DOMNUL este drept, iar eu și poporul meu suntem vinovați.',
          'Rugați-vă DOMNULUI! Sunt destule tunetele lui Dumnezeu și grindina. Vă voi lăsa să plecați și nu veți mai rămâne.”',
          'Moise i-a spus: „Când voi ieși din cetate, îmi voi întinde mâinile spre DOMNUL. Tunetele vor înceta și nu va mai fi grindină, ca să știi că pământul este al DOMNULUI.',
          'Dar știu că tu și slujitorii tăi încă nu vă temeți de DOMNUL Dumnezeu.”',
          'Inul și orzul fuseseră lovite, fiindcă orzul era în spic, iar inul era în floare.',
          'Dar grâul și alacul nu fuseseră lovite, pentru că se coc mai târziu.',
          'Moise a ieșit din cetate de la faraon și și-a întins mâinile spre DOMNUL. Tunetele și grindina au încetat, iar ploaia nu s-a mai revărsat pe pământ.',
          'Când faraonul a văzut că ploaia, grindina și tunetele încetaseră, a păcătuit din nou și și-a împietrit inima, el și slujitorii lui.',
          'Inima faraonului s-a împietrit și nu i-a lăsat pe fiii lui Israel să plece, așa cum spusese DOMNUL prin Moise.'],
          10:[
          'DOMNUL i-a spus lui Moise: „Du-te la faraon, căci i-am împietrit inima lui și inimile slujitorilor lui, ca să pun aceste semne ale Mele în mijlocul lor',
          'și ca tu să povestești fiului tău și fiului fiului tău cum am lucrat împotriva Egiptului și ce semne am făcut în mijlocul lor, ca să știți că Eu sunt DOMNUL.”',
          'Moise și Aaron au intrat la faraon și i-au spus: „Așa vorbește DOMNUL, Dumnezeul evreilor: «Până când vei refuza să te smerești înaintea Mea? Lasă poporul Meu să plece ca să-Mi slujească.',
          'Dacă refuzi să lași poporul Meu să plece, iată, mâine voi aduce lăcuste în ținutul tău.',
          'Ele vor acoperi fața pământului, astfel încât pământul nu va mai putea fi văzut. Vor mânca ce a scăpat și v-a rămas după grindină și vor mânca orice copac care crește pe câmpurile voastre.',
          'Casele tale, casele tuturor slujitorilor tăi și casele tuturor egiptenilor se vor umple de ele, cum nu au văzut părinții și strămoșii tăi din ziua în care au fost pe pământ și până astăzi.»” Apoi Moise s-a întors și a ieșit de la faraon.',
          'Slujitorii faraonului i-au spus: „Până când va fi omul acesta o cursă pentru noi? Lasă-i pe bărbați să plece ca să-I slujească DOMNULUI, Dumnezeul lor. Încă nu înțelegi că Egiptul este distrus?”',
          'Moise și Aaron au fost aduși din nou la faraon, iar el le-a spus: „Duceți-vă și slujiți-I DOMNULUI, Dumnezeul vostru. Dar cine anume va merge?”',
          'Moise a răspuns: „Vom merge cu tinerii și cu bătrânii noștri, cu fiii și cu fiicele noastre, cu turmele și cu cirezile noastre, fiindcă avem de ținut o sărbătoare pentru DOMNUL.”',
          'Faraonul le-a spus: „Așa să fie DOMNUL cu voi cum vă voi lăsa eu să plecați împreună cu copiii voștri! Este limpede că aveți intenții rele.',
          'Nu! Mergeți acum numai voi, bărbații, și slujiți-I DOMNULUI, fiindcă aceasta ați cerut.” Apoi au fost izgoniți dinaintea faraonului.',
          'DOMNUL i-a spus lui Moise: „Întinde-ți mâna peste țara Egiptului ca să vină lăcustele peste ea și să mănânce toate plantele țării, tot ce a lăsat grindina.”',
          'Moise și-a întins toiagul peste țara Egiptului, iar DOMNUL a adus peste țară un vânt de răsărit toată ziua aceea și toată noaptea. Dimineața, vântul de răsărit adusese lăcustele.',
          'Lăcustele s-au ridicat peste toată țara Egiptului și s-au așezat în tot ținutul Egiptului. Erau nespus de multe; înaintea lor nu mai fuseseră asemenea lăcuste și nici după ele nu vor mai fi.',
          'Au acoperit fața întregului pământ, încât țara s-a întunecat. Au mâncat toate plantele țării și toate roadele copacilor pe care le lăsase grindina. Nu a mai rămas nimic verde, nici copac, nici plantă a câmpului, în toată țara Egiptului.',
          'Faraonul i-a chemat în grabă pe Moise și pe Aaron și le-a spus: „Am păcătuit împotriva DOMNULUI, Dumnezeul vostru, și împotriva voastră.',
          'Acum, te rog, iartă-mi păcatul încă o dată și rugați-L pe DOMNUL, Dumnezeul vostru, să îndepărteze de la mine această moarte.”',
          'Moise a ieșit de la faraon și s-a rugat DOMNULUI.',
          'DOMNUL a făcut să sufle un vânt foarte puternic dinspre apus, care a ridicat lăcustele și le-a aruncat în Marea Roșie. Nu a mai rămas nicio lăcustă în tot ținutul Egiptului.',
          'Dar DOMNUL a împietrit inima faraonului, iar el nu i-a lăsat pe fiii lui Israel să plece.',
          'DOMNUL i-a spus lui Moise: „Întinde-ți mâna spre cer, ca peste țara Egiptului să vină un întuneric atât de gros, încât să poată fi pipăit.”',
          'Moise și-a întins mâna spre cer, iar peste toată țara Egiptului a fost întuneric gros timp de trei zile.',
          'Oamenii nu se vedeau unii pe alții și nimeni nu s-a ridicat din locul său timp de trei zile. Dar toți fiii lui Israel aveau lumină în locuințele lor.',
          'Faraonul l-a chemat pe Moise și i-a spus: „Duceți-vă și slujiți-I DOMNULUI! Numai turmele și cirezile voastre să rămână; chiar și copiii voștri pot merge cu voi.”',
          'Moise a răspuns: „Tu însuți trebuie să ne dai animale pentru jertfe și arderi-de-tot, ca să le aducem DOMNULUI, Dumnezeul nostru.',
          'Și animalele noastre vor merge cu noi; nu va rămâne nici măcar o copită, fiindcă din ele vom lua ca să-I slujim DOMNULUI, Dumnezeul nostru. Până nu ajungem acolo, nu știm cu ce Îi vom sluji DOMNULUI.”',
          'Dar DOMNUL a împietrit inima faraonului și el nu a vrut să-i lase să plece.',
          'Faraonul i-a spus: „Pleacă de la mine! Ai grijă să nu-mi mai vezi fața, căci în ziua în care îmi vei vedea fața vei muri!”',
          'Moise a răspuns: „Ai vorbit bine. Nu-ți voi mai vedea fața.”']}
          notes={
