name: Repair Exodus 26-30

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-repair-exodus-26-30.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Rebuild and audit Exodus 26-30
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          texts={
          26:[
          '„Să faci Cortul din zece pânze de in fin răsucit și din fir albastru, purpuriu și stacojiu, cu heruvimi lucrați artistic.',
          'Fiecare pânză să fie lungă de douăzeci și opt de coți și lată de patru coți; toate pânzele să aibă aceeași măsură.',
          'Cinci pânze să fie prinse una de alta, iar celelalte cinci pânze să fie prinse una de alta.',
          'Să faci cheotori din fir albastru pe marginea pânzei de la capătul primei îmbinări și la fel pe marginea pânzei de la capătul celei de-a doua îmbinări.',
          'Să faci cincizeci de cheotori pe prima pânză și cincizeci de cheotori pe marginea pânzei din a doua îmbinare. Cheotorile să fie așezate față în față.',
          'Să faci cincizeci de copci de aur și să unești pânzele una cu alta prin copci, astfel încât Cortul să formeze un singur întreg.',
          'Să faci unsprezece pânze din păr de capră, ca acoperământ peste Cort.',
          'Fiecare pânză să fie lungă de treizeci de coți și lată de patru coți; toate cele unsprezece pânze să aibă aceeași măsură.',
          'Să unești separat cinci pânze și separat șase pânze, iar a șasea pânză să o îndoi în două în partea din față a cortului.',
          'Să faci cincizeci de cheotori pe marginea pânzei de la capătul primei îmbinări și cincizeci de cheotori pe marginea pânzei de la capătul celei de-a doua îmbinări.',
          'Să faci cincizeci de copci din bronz, să introduci copcile în cheotori și să unești acoperământul, ca să formeze un singur întreg.',
          'Partea care rămâne în plus din pânzele acoperământului, jumătatea de pânză rămasă, să atârne în partea din spate a Cortului.',
          'Cotul rămas pe o latură și cotul rămas pe cealaltă latură din lungimea pânzelor să atârne peste laturile Cortului, ca să-l acopere.',
          'Să faci pentru cort un înveliș din piei de berbec vopsite în roșu, iar deasupra lui un înveliș din piei fine.',
          'Să faci scândurile Cortului din lemn de salcâm și să le așezi în picioare.',
          'Fiecare scândură să fie lungă de zece coți și lată de un cot și jumătate.',
          'Fiecare scândură să aibă două cepuri paralele. Așa să faci toate scândurile Cortului.',
          'Să faci douăzeci de scânduri pentru latura de sud a Cortului.',
          'Sub cele douăzeci de scânduri să faci patruzeci de socluri de argint: două socluri sub o scândură, pentru cele două cepuri ale ei, și două socluri sub fiecare dintre celelalte scânduri.',
          'Pentru a doua latură a Cortului, cea de nord, să faci douăzeci de scânduri',
          'și patruzeci de socluri de argint: două socluri sub fiecare scândură.',
          'Pentru partea din spate a Cortului, spre apus, să faci șase scânduri.',
          'Să faci încă două scânduri pentru colțurile din spate ale Cortului.',
          'Ele să fie duble în partea de jos și unite până sus, la primul inel. Așa să fie amândouă, pentru cele două colțuri.',
          'Să fie opt scânduri cu șaisprezece socluri de argint, câte două socluri sub fiecare scândură.',
          'Să faci drugi din lemn de salcâm: cinci pentru scândurile de pe o latură a Cortului,',
          'cinci pentru scândurile de pe cealaltă latură și cinci pentru scândurile din partea din spate, spre apus.',
          'Drugul din mijloc să treacă prin mijlocul scândurilor de la un capăt la celălalt.',
          'Să acoperi scândurile cu aur, să le faci inele de aur prin care să treacă drugii și să acoperi drugii cu aur.',
          'Să ridici Cortul după modelul care ți-a fost arătat pe munte.',
          'Să faci o perdea din fir albastru, purpuriu și stacojiu și din in fin răsucit, cu heruvimi lucrați artistic.',
          'Să o atârni pe patru stâlpi din lemn de salcâm acoperiți cu aur, cu cârlige de aur, așezați pe patru socluri de argint.',
          'Să atârni perdeaua sub copci și să aduci chivotul Mărturiei dincolo de perdea. Perdeaua să despartă pentru voi Locul Sfânt de Locul Preasfânt.',
          'Să pui capacul ispășirii pe chivotul Mărturiei, în Locul Preasfânt.',
          'Să așezi masa dincoace de perdea, iar sfeșnicul în fața mesei, pe latura de sud a Cortului. Masa să o pui pe latura de nord.',
          'Pentru intrarea cortului să faci un paravan din fir albastru, purpuriu și stacojiu și din in fin răsucit, lucrat prin broderie.',
          'Pentru paravan să faci cinci stâlpi din lemn de salcâm și să-i acoperi cu aur. Cârligele lor să fie din aur, iar pentru ei să torni cinci socluri din bronz.'],
          27:[
          '„Să faci altarul din lemn de salcâm, lung de cinci coți și lat de cinci coți. Altarul să fie pătrat și înalt de trei coți.',
          'Să-i faci coarne la cele patru colțuri; coarnele să fie dintr-o singură bucată cu el. Să-l acoperi cu bronz.',
          'Să-i faci vase pentru cenușă, lopeți, lighene, furculițe și fărașe pentru cărbuni. Toate uneltele lui să le faci din bronz.',
          'Să-i faci un grătar ca o rețea din bronz și să pui patru verigi de bronz la cele patru colțuri ale rețelei.',
          'Să pui rețeaua sub marginea altarului, în partea de jos, astfel încât să ajungă până la jumătatea altarului.',
          'Să faci drugi pentru altar, drugi din lemn de salcâm, și să-i acoperi cu bronz.',
          'Drugii să fie introduși în verigi și să fie pe cele două laturi ale altarului când este purtat.',
          'Să faci altarul gol pe dinăuntru, din scânduri. Să-l facă după cum ți-a fost arătat pe munte.',
          'Să faci curtea Cortului. Pe latura de sud, curtea să aibă pânze din in fin răsucit, lungi de o sută de coți.',
          'Să aibă douăzeci de stâlpi și douăzeci de socluri din bronz; cârligele și legăturile stâlpilor să fie din argint.',
          'La fel, pe latura de nord să fie pânze lungi de o sută de coți, cu douăzeci de stâlpi și douăzeci de socluri din bronz; cârligele și legăturile stâlpilor să fie din argint.',
          'Pe latura de apus, curtea să aibă pânze late de cincizeci de coți, cu zece stâlpi și zece socluri.',
          'Lățimea curții pe latura de răsărit să fie de cincizeci de coți.',
          'Pe o parte a intrării să fie pânze de cincisprezece coți, cu trei stâlpi și trei socluri.',
          'Pe cealaltă parte să fie pânze de cincisprezece coți, cu trei stâlpi și trei socluri.',
          'Pentru intrarea curții să fie un paravan lung de douăzeci de coți, din fir albastru, purpuriu și stacojiu și din in fin răsucit, lucrat prin broderie, cu patru stâlpi și patru socluri.',
          'Toți stâlpii curții să fie legați de jur împrejur cu argint; cârligele lor să fie din argint, iar soclurile din bronz.',
          'Curtea să fie lungă de o sută de coți, lată de cincizeci de coți pe toată întinderea și înaltă de cinci coți. Pânzele să fie din in fin răsucit, iar soclurile din bronz.',
          'Toate uneltele folosite în slujirea Cortului, toți țărușii lui și toți țărușii curții să fie din bronz.',
          'Să le poruncești fiilor lui Israel să-ți aducă ulei curat din măsline zdrobite pentru lumină, ca să ardă permanent candela.',
          'Aaron și fiii lui să o îngrijească de seara până dimineața înaintea DOMNULUI, în Cortul Întâlnirii, dincoace de perdeaua care este înaintea Mărturiei. Aceasta să fie o rânduială veșnică pentru fiii lui Israel, din generație în generație.'],
          28:[
          '„Adu-i lângă tine, dintre fiii lui Israel, pe Aaron, fratele tău, și pe fiii lui — Nadab, Abihu, Eleazar și Itamar — ca Aaron să-Mi slujească în preoție.',
          'Să faci pentru Aaron, fratele tău, veșminte sfinte, pentru onoare și frumusețe.',
          'Să vorbești tuturor celor pricepuți la inimă, pe care i-am umplut cu duh de înțelepciune, ca să facă veșmintele lui Aaron, pentru a-l sfinți ca să-Mi slujească în preoție.',
          'Acestea sunt veșmintele pe care să le facă: un pieptar, un efod, o mantie, o tunică țesută, un turban și un brâu. Să facă veșminte sfinte pentru Aaron, fratele tău, și pentru fiii lui, ca să-Mi slujească în preoție.',
          'Să folosească aur, fir albastru, purpuriu și stacojiu și in fin.',
          'Să facă efodul din aur, din fir albastru, purpuriu și stacojiu și din in fin răsucit, lucrat artistic.',
          'Să aibă două bretele unite la cele două capete ale lui, ca să fie legat.',
          'Brâul țesut al efodului să fie lucrat la fel și dintr-o singură bucată cu el, din aur, fir albastru, purpuriu și stacojiu și in fin răsucit.',
          'Să iei două pietre de onix și să gravezi pe ele numele fiilor lui Israel:',
          'șase nume pe prima piatră și celelalte șase nume pe a doua piatră, în ordinea nașterii lor.',
          'Să gravezi pe cele două pietre numele fiilor lui Israel, prin lucrarea unui gravor în piatră, asemenea gravurii unui sigiliu, și să le montezi în monturi de aur.',
          'Să pui cele două pietre pe bretelele efodului, ca pietre de aducere-aminte pentru fiii lui Israel. Aaron să poarte numele lor pe cei doi umeri ai săi înaintea DOMNULUI, ca aducere-aminte.',
          'Să faci monturi de aur',
          'și două lănțișoare din aur curat, lucrate ca niște șnururi împletite, și să prinzi lănțișoarele împletite de monturi.',
          'Să faci pieptarul judecății, lucrat artistic. Să-l faci la fel ca efodul, din aur, fir albastru, purpuriu și stacojiu și din in fin răsucit.',
          'Să fie pătrat și îndoit în două, lung de o palmă și lat de o palmă.',
          'Să montezi în el patru rânduri de pietre. În primul rând: un rubin, un topaz și un smarald;',
          'în al doilea rând: un turcoaz, un safir și un diamant;',
          'în al treilea rând: un opal, un agat și un ametist;',
          'iar în al patrulea rând: un crisolit, un onix și un jasp. Pietrele să fie fixate în monturi de aur.',
          'Pietrele să fie douăsprezece, după numele fiilor lui Israel, câte una pentru fiecare nume. Fiecare să fie gravată asemenea unui sigiliu, cu numele uneia dintre cele douăsprezece seminții.',
          'Să faci pentru pieptar lănțișoare din aur curat, ca niște șnururi împletite.',
          'Să faci pentru pieptar două verigi de aur și să pui cele două verigi la cele două capete ale pieptarului.',
          'Să introduci cele două lănțișoare împletite din aur în cele două verigi de la capetele pieptarului.',
          'Celelalte două capete ale lănțișoarelor să le prinzi de cele două monturi și să le fixezi pe bretelele efodului, în partea din față.',
          'Să faci două verigi de aur și să le pui la celelalte două capete ale pieptarului, pe marginea lui dinspre partea interioară a efodului.',
          'Să mai faci două verigi de aur și să le pui pe cele două bretele ale efodului, în partea de jos și din față, aproape de locul unde se unesc, deasupra brâului țesut al efodului.',
          'Pieptarul să fie legat prin verigile lui de verigile efodului cu un șnur albastru, ca să rămână deasupra brâului țesut al efodului și să nu se desprindă de efod.',
          'Când va intra în Locul Sfânt, Aaron va purta pe inima sa numele fiilor lui Israel în pieptarul judecății, ca aducere-aminte permanentă înaintea DOMNULUI.',
          'Să pui în pieptarul judecății Urim și Tumim. Ele să fie pe inima lui Aaron când intră înaintea DOMNULUI. Aaron va purta permanent pe inima sa judecata fiilor lui Israel înaintea DOMNULUI.',
          'Să faci mantia efodului în întregime din fir albastru.',
          'Să aibă în mijloc o deschizătură pentru cap, iar în jurul deschizăturii să aibă o margine țesută, asemenea deschizăturii unei platoșe, ca să nu se rupă.',
          'Pe tivul ei să faci rodii din fir albastru, purpuriu și stacojiu, de jur împrejurul tivului, iar între ele clopoței de aur:',
          'un clopoțel de aur și o rodie, un clopoțel de aur și o rodie, de jur împrejurul tivului mantiei.',
          'Aaron să o poarte când slujește. Sunetul ei să se audă când intră în Locul Sfânt înaintea DOMNULUI și când iese, ca să nu moară.',
          'Să faci o plăcuță din aur curat și să gravezi pe ea, asemenea gravurii unui sigiliu: «SFÂNT PENTRU DOMNUL».',
          'Să o prinzi cu un șnur albastru pe turban; să fie în partea din față a turbanului.',
          'Ea să fie pe fruntea lui Aaron. Aaron va purta vina legată de lucrurile sfinte pe care fiii lui Israel le vor sfinți prin toate darurile lor sfinte. Ea să fie permanent pe fruntea lui, pentru ca ei să fie primiți înaintea DOMNULUI.',
          'Să țeseți tunica din in fin, să faci turbanul din in fin și să faci brâul lucrat prin broderie.',
          'Pentru fiii lui Aaron să faci tunici, brâie și bonete, pentru onoare și frumusețe.',
          'Să-i îmbraci cu ele pe Aaron, fratele tău, și pe fiii lui împreună cu el. Să-i ungi, să-i învestești, să-i sfințești, iar ei Îmi vor sluji în preoție.',
          'Să le faci pantaloni de in care să le acopere trupul gol, de la talie până la coapse.',
          'Aaron și fiii lui să-i poarte când intră în Cortul Întâlnirii sau când se apropie de altar ca să slujească în Locul Sfânt, ca să nu poarte vină și să moară. Aceasta să fie o rânduială veșnică pentru el și pentru urmașii lui.'],
          29:[
          '„Iată ce să faci pentru a-i sfinți ca să-Mi slujească în preoție: ia un taur tânăr și doi berbeci fără cusur,',
          'pâine nedospită, turte nedospite frământate cu ulei și lipii nedospite unse cu ulei. Să le faci din făină fină de grâu.',
          'Să le pui într-un coș și să le aduci în coș împreună cu taurul și cei doi berbeci.',
          'Să-i aduci pe Aaron și pe fiii lui la intrarea Cortului Întâlnirii și să-i speli cu apă.',
          'Să iei veșmintele și să-l îmbraci pe Aaron cu tunica, mantia efodului, efodul și pieptarul și să-l încingi cu brâul țesut al efodului.',
          'Să-i pui turbanul pe cap și să fixezi pe turban coroana sfântă.',
          'Apoi să iei untdelemnul ungerii, să-l torni pe capul lui și să-l ungi.',
          'Să-i aduci pe fiii lui și să-i îmbraci cu tunicile.',
          'Să-i încingi cu brâiele, pe Aaron și pe fiii lui, și să le legi bonetele. Preoția va fi a lor printr-o rânduială veșnică. Astfel să-i învestești pe Aaron și pe fiii lui.',
          'Să aduci taurul înaintea Cortului Întâlnirii, iar Aaron și fiii lui să-și pună mâinile pe capul taurului.',
          'Să înjunghii taurul înaintea DOMNULUI, la intrarea Cortului Întâlnirii.',
          'Să iei din sângele taurului și să pui cu degetul pe coarnele altarului, iar tot sângele rămas să-l verși la baza altarului.',
          'Să iei toată grăsimea care acoperă măruntaiele, lobul ficatului, cei doi rinichi și grăsimea de pe ei și să le arzi pe altar.',
          'Dar carnea taurului, pielea și bălegarul lui să le arzi în foc în afara taberei. Este o jertfă pentru păcat.',
          'Să iei unul dintre berbeci, iar Aaron și fiii lui să-și pună mâinile pe capul berbecului.',
          'Să înjunghii berbecul, să-i iei sângele și să-l stropești de jur împrejur pe altar.',
          'Să tai berbecul în bucăți, să-i speli măruntaiele și picioarele și să le pui lângă bucăți și lângă cap.',
          'Să arzi întregul berbec pe altar. Este o ardere-de-tot pentru DOMNUL, o mireasmă plăcută, o jertfă mistuită de foc pentru DOMNUL.',
          'Să iei celălalt berbec, iar Aaron și fiii lui să-și pună mâinile pe capul berbecului.',
          'Să înjunghii berbecul și să pui din sângele lui pe lobul urechii drepte a lui Aaron și pe lobul urechii drepte a fiilor lui, pe degetul mare al mâinii lor drepte și pe degetul mare al piciorului lor drept. Să stropești sângele de jur împrejur pe altar.',
          'Să iei din sângele de pe altar și din untdelemnul ungerii și să stropești pe Aaron și veșmintele lui, pe fiii lui și veșmintele fiilor lui. Astfel vor fi sfințiți el, veșmintele lui, fiii lui și veșmintele fiilor lui.',
          'Să iei din grăsimea berbecului: coada grasă, grăsimea care acoperă măruntaiele, lobul ficatului, cei doi rinichi cu grăsimea de pe ei și pulpa dreaptă, căci este berbecul învestirii.',
          'Să iei și o pâine, o turtă făcută cu ulei și o lipie din coșul cu azime care este înaintea DOMNULUI.',
          'Să le pui pe toate în mâinile lui Aaron și în mâinile fiilor lui și să le legeni ca dar legănat înaintea DOMNULUI.',
          'Apoi să le iei din mâinile lor și să le arzi pe altar, deasupra arderii-de-tot, ca mireasmă plăcută înaintea DOMNULUI. Este o jertfă mistuită de foc pentru DOMNUL.',
          'Să iei pieptul berbecului învestirii lui Aaron și să-l legeni ca dar legănat înaintea DOMNULUI. Aceasta va fi partea ta.',
          'Să sfințești pieptul darului legănat și pulpa contribuției, care au fost legănate și ridicate din berbecul învestirii, din ceea ce este pentru Aaron și fiii lui.',
          'Ele vor fi partea lui Aaron și a fiilor lui din partea fiilor lui Israel, printr-o rânduială veșnică, fiindcă sunt o contribuție. Ele vor fi contribuția fiilor lui Israel din jertfele lor de pace, contribuția lor pentru DOMNUL.',
          'Veșmintele sfinte ale lui Aaron vor fi ale fiilor lui după el, ca să fie unși și învestiți în ele.',
          'Fiul care îi va urma ca preot să le poarte șapte zile când va intra în Cortul Întâlnirii ca să slujească în Locul Sfânt.',
          'Să iei berbecul învestirii și să-i fierbi carnea într-un loc sfânt.',
          'Aaron și fiii lui să mănânce carnea berbecului și pâinea din coș la intrarea Cortului Întâlnirii.',
          'Să mănânce lucrurile prin care s-a făcut ispășire pentru învestirea și sfințirea lor. Niciun străin să nu mănânce din ele, fiindcă sunt sfinte.',
          'Dacă rămâne până dimineață ceva din carnea învestirii sau din pâine, să arzi ce a rămas în foc. Să nu fie mâncat, fiindcă este sfânt.',
          'Să faci pentru Aaron și fiii lui tot ce ți-am poruncit. Timp de șapte zile să-i învestești.',
          'În fiecare zi să aduci un taur ca jertfă pentru păcat, pentru ispășire. Să cureți altarul făcând ispășire pentru el și să-l ungi ca să-l sfințești.',
          'Timp de șapte zile să faci ispășire pentru altar și să-l sfințești. Altarul va fi preasfânt; orice lucru care atinge altarul va deveni sfânt.',
          'Iată ce să aduci permanent pe altar: doi miei de un an, în fiecare zi.',
          'Un miel să-l aduci dimineața, iar pe celălalt miel spre seară.',
          'Împreună cu primul miel să aduci a zecea parte dintr-o efă de făină fină, amestecată cu un sfert de hin de ulei din măsline zdrobite, și un sfert de hin de vin ca dar de băutură.',
          'Pe al doilea miel să-l aduci spre seară, împreună cu un dar de mâncare și un dar de băutură ca dimineața, ca mireasmă plăcută, o jertfă mistuită de foc pentru DOMNUL.',
          'Aceasta să fie o ardere-de-tot permanentă din generație în generație, la intrarea Cortului Întâlnirii, înaintea DOMNULUI, unde Mă voi întâlni cu voi ca să-ți vorbesc.',
          'Acolo Mă voi întâlni cu fiii lui Israel, iar locul va fi sfințit prin gloria Mea.',
          'Voi sfinți Cortul Întâlnirii și altarul; îi voi sfinți și pe Aaron și pe fiii lui ca să-Mi slujească în preoție.',
          'Voi locui în mijlocul fiilor lui Israel și voi fi Dumnezeul lor.',
          'Ei vor ști că Eu sunt DOMNUL, Dumnezeul lor, Care i-am scos din țara Egiptului ca să locuiesc în mijlocul lor. Eu sunt DOMNUL, Dumnezeul lor.'],
          30:[
          '„Să faci un altar pentru arderea tămâiei. Să-l faci din lemn de salcâm.',
          'Să fie lung de un cot, lat de un cot, pătrat, și înalt de doi coți. Coarnele lui să fie dintr-o singură bucată cu el.',
          'Să-i acoperi cu aur curat partea de sus, laturile și coarnele și să-i faci de jur împrejur un chenar de aur.',
          'Să-i faci două verigi de aur sub chenar, pe cele două laturi opuse, ca să țină drugii cu care va fi purtat.',
          'Să faci drugii din lemn de salcâm și să-i acoperi cu aur.',
          'Să așezi altarul înaintea perdelei care este lângă chivotul Mărturiei, înaintea capacului ispășirii care este deasupra Mărturiei, acolo unde Mă voi întâlni cu tine.',
          'Aaron să ardă pe el tămâie parfumată în fiecare dimineață, când îngrijește candelele.',
          'Să ardă tămâie și spre seară, când aprinde candelele. Aceasta să fie o tămâie permanentă înaintea DOMNULUI, din generație în generație.',
          'Să nu aduceți pe el tămâie neautorizată, ardere-de-tot sau dar de mâncare și să nu turnați pe el dar de băutură.',
