name: PR40 final — extract Qumran corpus

on:
  push:
    branches:
      - agent/biblia-emanus-pr40-final
    paths:
      - 'scripts/extract-pr40-qumran-corpus.py'
      - '.github/workflows/pr40-final-extract-qumran-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr40-final-qumran-corpus
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Text-Fabric
        run: pip install --disable-pip-version-check 'text-fabric>=12,<14'
      - name: Extract and validate authentic fragment corpus
        run: python3 scripts/extract-pr40-qumran-corpus.py
      - name: Upload source corpus and provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-final-qumran-source-corpus
          path: |
            docs/data/biblia-emanus-qumran-source
            docs/biblia-emanus/PR40-QUMRAN-SOURCE-CORPUS.json
          if-no-files-found: error
          retention-days: 7
