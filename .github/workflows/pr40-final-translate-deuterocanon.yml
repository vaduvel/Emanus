name: PR40 final — translate deuterocanon

on:
  push:
    branches:
      - agent/biblia-emanus-pr40-final
    paths:
      - 'scripts/translate-pr40-deuterocanon-missing.py'
      - 'scripts/translate-pr40-deuterocanon-all-missing.py'
      - '.github/workflows/pr40-final-translate-deuterocanon.yml'
  pull_request:
    paths:
      - 'scripts/translate-pr40-deuterocanon-missing.py'
      - 'scripts/translate-pr40-deuterocanon-all-missing.py'
      - '.github/workflows/pr40-final-translate-deuterocanon.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr40-final-deuterocanon-translation-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned translation runtime
        run: pip install --disable-pip-version-check 'torch>=2.5,<3' 'transformers>=4.45,<5' 'sentencepiece>=0.2,<1' 'huggingface-hub>=0.26,<1'
      - name: Generate twelve modern Romanian candidates
        run: python3 scripts/translate-pr40-deuterocanon-all-missing.py --batch-size 24
      - name: Upload candidates and audit ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-final-deuterocanon-drafts
          path: |
            docs/data/biblia-emanus-deuterocanon-new-translation
            docs/biblia-emanus/PR40-DEUTEROCANON-NEW-TRANSLATION.json
          if-no-files-found: warn
          retention-days: 7
