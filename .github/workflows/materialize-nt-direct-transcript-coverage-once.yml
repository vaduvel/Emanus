name: Materialize NT Direct Transcript Coverage Once

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
    paths:
      - .github/workflows/materialize-nt-direct-transcript-coverage-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize exact containing transcript ranges
        run: |
          set -euo pipefail
          node scripts/materialize-nt-direct-transcript-coverage.mjs
          node scripts/materialize-nt-semantic-review-index.mjs
      - name: Remove one-shot and commit inventory
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-nt-direct-transcript-coverage-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-explicata/nt-direct-transcript-coverage.json docs/data/biblia-explicata/nt-semantic-review-index.json .github/workflows/materialize-nt-direct-transcript-coverage-once.yml
          git commit -m 'Materialize direct transcript coverage for NT semantic fidelity'
          for attempt in 1 2 3; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            git rebase FETCH_HEAD
            if git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
          done
          exit 1
