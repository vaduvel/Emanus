name: Temporary publish Joshua 21-24

on:
  push:
    branches:
      - agent/biblia-emanus-iosua
    paths:
      - .github/workflows/tmp-publish-jos21-24.yml
      - scripts/tmp_publish_jos21_24.py

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-iosua
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish Joshua 21-24
        run: python scripts/tmp_publish_jos21_24.py
      - name: Commit final Joshua chapters and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus/JOS.21.json docs/data/biblia-emanus/JOS.22.json docs/data/biblia-emanus/JOS.23.json docs/data/biblia-emanus/JOS.24.json docs/data/biblia-emanus/source-ledger.json docs/data/biblia-emanus/manifest.json docs/biblia-emanus/IOSUA-AUDIT.md
          if git diff --cached --quiet; then
            echo "No publication changes"
            exit 0
          fi
          git commit -m "Audit and publish Biblia Emanus Iosua 21-24"
          git push origin HEAD:agent/biblia-emanus-iosua
