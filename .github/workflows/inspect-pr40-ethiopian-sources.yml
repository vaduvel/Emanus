name: Inspect PR40 Ethiopian sources

on:
  push:
    branches:
      - agent/biblia-emanus-all-pr40-rebuild
    paths:
      - 'scripts/inspect-pr40-ethiopian-sources.py'
      - '.github/workflows/inspect-pr40-ethiopian-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr40-ethiopian-source-inventory
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-all-pr40-rebuild
      - name: Pin and inspect public-domain source texts
        run: python3 scripts/inspect-pr40-ethiopian-sources.py
      - name: Upload source inventory
        uses: actions/upload-artifact@v4
        with:
          name: pr40-ethiopian-source-inventory
          path: docs/biblia-emanus/PR40-ETHIOPIAN-SOURCE-INVENTORY.json
          retention-days: 7
      - name: Persist source inventory
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/PR40-ETHIOPIAN-SOURCE-INVENTORY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(bible): persist Ethiopian source structure inventory'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/biblia-emanus-all-pr40-rebuild
            if git push origin HEAD:agent/biblia-emanus-all-pr40-rebuild; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
