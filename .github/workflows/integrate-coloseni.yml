name: Integrate Coloseni

on:
  push:
    branches:
      - agent/coloseni
    paths:
      - .github/workflows/integrate-coloseni.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coloseni

      - name: Extend Filipeni canonical gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-filipeni.py')
          text = path.read_text(encoding='utf-8')
          old = r'EFESENI,\s*FILIPENI,\s*TIT\b'
          new = r'EFESENI,\s*FILIPENI,\s*(?:COLOSENI,\s*)?TIT\b'
          if new not in text:
              if old not in text:
                  raise SystemExit('Filipeni canonical gate anchor lipseste')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit gate extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-filipeni.py
          git diff --cached --quiet && exit 0
          git commit -m "test(bible): extend Filipeni canonical gate"
          git push origin HEAD:agent/coloseni
