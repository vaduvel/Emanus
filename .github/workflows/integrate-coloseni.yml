name: Integrate Coloseni

on:
  push:
    branches:
      - agent/coloseni
    paths:
      - .github/workflows/integrate-coloseni.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coloseni

      - name: Connect Coloseni to catalog and build
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          index_path = Path('packages/shared/src/bible/index.ts')
          index = index_path.read_text(encoding='utf-8')
          needle = 'import { FILIPENI } from "./filipeni.js"\n'
          addition = needle + 'import { COLOSENI } from "./coloseni.js"\n'
          if 'import { COLOSENI } from "./coloseni.js"' not in index:
              if needle not in index:
                  raise SystemExit('Import anchor FILIPENI lipseste')
              index = index.replace(needle, addition, 1)
          old_books = 'EFESENI, FILIPENI, TIT, FILIMON'
          new_books = 'EFESENI, FILIPENI, COLOSENI, TIT, FILIMON'
          if new_books not in index:
              if old_books not in index:
                  raise SystemExit('BIBLE_BOOKS anchor lipseste')
              index = index.replace(old_books, new_books, 1)
          index_path.write_text(index, encoding='utf-8')

          shared_path = Path('packages/shared/package.json')
          shared = json.loads(shared_path.read_text(encoding='utf-8'))
          materialize = shared['scripts']['materialize:bible-texts']
          cfg = '../../docs/data/coloseni-rccv-import.json'
          if cfg not in materialize:
              shared['scripts']['materialize:bible-texts'] = materialize + ' ' + cfg
          shared_path.write_text(json.dumps(shared, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          root_path = Path('package.json')
          root = json.loads(root_path.read_text(encoding='utf-8'))
          root['scripts']['check:coloseni'] = 'python3 scripts/check-coloseni.py'
          root_path.write_text(json.dumps(root, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gate_path = Path('scripts/check-filipeni.py')
          gate = gate_path.read_text(encoding='utf-8')
          old = r'EFESENI,\\s*FILIPENI,\\s*TIT\\b'
          new = r'EFESENI,\\s*FILIPENI,\\s*(?:COLOSENI,\\s*)?TIT\\b'
          if old not in gate:
              raise SystemExit('Filipeni canonical gate anchor lipseste')
          gate_path.write_text(gate.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit catalog integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/bible/index.ts packages/shared/package.json package.json scripts/check-filipeni.py
          git diff --cached --quiet && exit 0
          git commit -m "feat(bible): connect Coloseni to catalog and build"
          git push origin HEAD:agent/coloseni
