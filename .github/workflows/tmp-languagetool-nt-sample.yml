name: Temporary NT Romanian LanguageTool sample

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-languagetool-nt-sample.yml
      - scripts/tmp-languagetool-nt-sample.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    if: github.head_ref == 'agent/biblia-emanus-nt-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct source helper
        run: |
          : > scripts/tmp-old-pipeline.generated.py
          for part in 00 01 02 03 04 05; do
            git show 8cdc210e01c:scripts/tmp-complete-nt.part${part} >> scripts/tmp-old-pipeline.generated.py
            printf '\n' >> scripts/tmp-old-pipeline.generated.py
          done

      - name: Install Romanian grammar checker
        run: pip install --quiet "language-tool-python==2.9.4"

      - name: Compare defective verses with public-domain witness
        env:
          OLD_PIPELINE: scripts/tmp-old-pipeline.generated.py
        run: python3 scripts/tmp-languagetool-nt-sample.py

      - uses: actions/upload-artifact@v4
        with:
          name: nt-languagetool-sample
          path: tmp-nt-languagetool-sample/
          retention-days: 1
