name: VT Deep Explanation Completion

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
    paths:
      - "packages/shared/src/bible/overlays/**"
      - "packages/shared/src/bible/explainedOverlay.ts"
      - "scripts/check-vt-deep-explanations.mjs"
      - ".github/workflows/vt-deep-explanations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-deep-explanations:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Wire final Proverbs focused complement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/shared/src/bible/overlays/proverbeEditorialOverlay.ts")
          text = path.read_text(encoding="utf-8")

          import_line = 'import { PROVERBE_FOCUSED_COMPLEMENTS } from "./proverbeFocusedComplements.js"\n'
          anchor = 'import { PROVERBE_EXPLAINED as POONEN_BASE } from "./proverbeOverlay.js"\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit("Nu găsesc ancora de import pentru Proverbe.")
              text = text.replace(anchor, anchor + import_line, 1)

          old = '  if (chapter.units.length > 0) return chapter\n'
          new = '''  if (chapter.units.length > 0) {
            const complement = PROVERBE_FOCUSED_COMPLEMENTS[chapter.number]
            if (!complement) return chapter
            return {
              ...chapter,
              units: [...chapter.units, ...complement].sort((a, b) => a.from - b.from),
            }
          }
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'PROVERBE_FOCUSED_COMPLEMENTS[chapter.number]' not in text:
              raise SystemExit("Nu găsesc blocul Poonen de înlocuit în Proverbe.")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install workspace
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Build shared Bible package
        run: pnpm build:shared

      - name: Reject generic explanation fallbacks from Psalm 126 through Daniel
        run: node scripts/check-vt-deep-explanations.mjs

      - name: Validate complete VT explained coverage
        run: pnpm check:vt-explained

      - name: Commit wiring only after all gates pass
        shell: bash
        run: |
          if git diff --quiet -- packages/shared/src/bible/overlays/proverbeEditorialOverlay.ts; then
            echo "Proverbs complement already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/bible/overlays/proverbeEditorialOverlay.ts
          git commit -m "Wire final Proverbs deep explanation gap"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
