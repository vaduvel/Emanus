name: Temporary export NT repair candidates

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-export-nt-repair-candidates.yml
      - scripts/tmp-export-nt-repair-candidates.py
      - scripts/tmp-audit-nt-human-quality.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/biblia-emanus-nt-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct source helper
        run: |
          : > scripts/tmp-old-pipeline.generated.py
          for part in 00 01 02 03 04 05; do
            git show 8cdc210e01c:scripts/tmp-complete-nt.part${part} >> scripts/tmp-old-pipeline.generated.py
            printf '\n' >> scripts/tmp-old-pipeline.generated.py
          done
          python3 -m py_compile scripts/tmp-old-pipeline.generated.py

      - name: Scan corpus
        run: python3 scripts/tmp-audit-nt-human-quality.py

      - name: Export source-backed repair candidates
        env:
          OLD_PIPELINE: scripts/tmp-old-pipeline.generated.py
        run: python3 scripts/tmp-export-nt-repair-candidates.py

      - uses: actions/upload-artifact@v4
        with:
          name: nt-repair-candidates
          path: tmp-nt-repair-candidates/
          retention-days: 1
