name: Repair Exodus 11-15

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-repair-exodus-11-15.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Rebuild and audit Exodus 11-15
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          texts={
          11:[
          'DOMNUL i-a spus lui Moise: „Voi mai aduce o singură lovitură asupra faraonului și asupra Egiptului. După aceea vă va lăsa să plecați de aici. Când vă va lăsa să plecați, vă va izgoni cu totul de aici.',
          'Vorbește acum poporului: fiecare bărbat să ceară de la vecinul său, iar fiecare femeie de la vecina sa obiecte de argint și obiecte de aur.”',
          'DOMNUL a făcut ca poporul să găsească bunăvoință în ochii egiptenilor. Mai mult, Moise era foarte respectat în țara Egiptului, atât de slujitorii faraonului, cât și de popor.',
          'Moise a spus: „Așa vorbește DOMNUL: «Pe la miezul nopții voi trece prin mijlocul Egiptului.',
          'Toți întâii născuți din țara Egiptului vor muri, de la întâiul născut al faraonului, care stă pe tronul său, până la întâiul născut al slujitoarei aflate în spatele râșniței, precum și toți întâii născuți ai animalelor.',
          'În toată țara Egiptului va fi un strigăt atât de mare cum nu a mai fost și nu va mai fi.',
          'Dar împotriva niciunuia dintre fiii lui Israel, fie om, fie animal, nici măcar un câine nu-și va mișca limba, ca să știți că DOMNUL face deosebire între Egipt și Israel.»',
          'Toți acești slujitori ai tăi vor coborî la mine, se vor pleca înaintea mea și vor spune: «Pleacă, tu și tot poporul care te urmează!» După aceea voi pleca.” Apoi Moise a ieșit de la faraon aprins de mânie.',
          'DOMNUL îi spusese lui Moise: „Faraonul nu vă va asculta, pentru ca minunile Mele să se înmulțească în țara Egiptului.”',
          'Moise și Aaron au făcut toate aceste minuni înaintea faraonului, dar DOMNUL a împietrit inima faraonului, iar el nu i-a lăsat pe fiii lui Israel să plece din țara lui.'],
          12:[
          'DOMNUL le-a vorbit lui Moise și lui Aaron în țara Egiptului și le-a spus:',
          '„Luna aceasta să fie pentru voi începutul lunilor; să fie pentru voi prima lună a anului.',
          'Vorbiți întregii adunări a lui Israel și spuneți-le: «În ziua a zecea a acestei luni, fiecare bărbat să ia un animal din turmă pentru casa părintească, câte unul pentru fiecare gospodărie.',
          'Dacă gospodăria este prea mică pentru un animal întreg, să-l ia împreună cu vecinul cel mai apropiat, după numărul persoanelor. Să calculați pentru fiecare animal cât poate mânca fiecare om.',
          'Animalul să fie fără cusur, de parte bărbătească și de un an. Îl puteți lua dintre oi sau dintre capre.',
          'Să-l păstrați până în ziua a paisprezecea a acestei luni, iar întreaga adunare a comunității lui Israel să-l înjunghie spre seară.',
          'Să ia din sânge și să pună pe cei doi ușori ai ușii și pe pragul de sus al caselor în care îl vor mânca.',
          'În noaptea aceea să mănânce carnea friptă la foc, împreună cu azime și ierburi amare.',
          'Să nu mâncați nimic din el crud sau fiert în apă, ci fript la foc, cu capul, picioarele și măruntaiele lui.',
          'Să nu lăsați nimic din el până dimineața. Ce va rămâne până dimineața să ardeți în foc.',
          'Să-l mâncați astfel: cu brâul strâns la mijloc, cu sandalele în picioare și cu toiagul în mână. Să-l mâncați în grabă; este Paștele DOMNULUI.',
          'În noaptea aceea voi trece prin țara Egiptului și voi lovi pe toți întâii născuți din țara Egiptului, atât dintre oameni, cât și dintre animale. Voi aduce judecăți împotriva tuturor dumnezeilor Egiptului. Eu sunt DOMNUL.',
          'Sângele va fi pentru voi un semn pe casele în care vă aflați. Când voi vedea sângele, voi trece pe lângă voi și nu va veni peste voi nicio lovitură nimicitoare când voi lovi țara Egiptului.',
          'Ziua aceasta să fie pentru voi o aducere-aminte. Să o sărbătoriți ca sărbătoare pentru DOMNUL, din generație în generație; să o sărbătoriți printr-o rânduială veșnică.',
          'Timp de șapte zile să mâncați azime. Chiar din prima zi să îndepărtați aluatul dospit din casele voastre, căci oricine va mânca pâine dospită din prima zi până în ziua a șaptea va fi îndepărtat din Israel.',
          'În prima zi să aveți o adunare sfântă și în ziua a șaptea o adunare sfântă. Să nu faceți nicio muncă în aceste zile, în afară de pregătirea hranei necesare fiecărei persoane.',
          'Să păziți Sărbătoarea Azimelor, căci chiar în ziua aceasta am scos oștirile voastre din țara Egiptului. Să păziți ziua aceasta din generație în generație, printr-o rânduială veșnică.',
          'În prima lună, din seara zilei a paisprezecea până în seara zilei a douăzeci și una, să mâncați azime.',
          'Timp de șapte zile să nu se găsească aluat dospit în casele voastre. Oricine va mânca ceva dospit va fi îndepărtat din comunitatea lui Israel, fie străin, fie născut în țară.',
          'Să nu mâncați nimic dospit. În toate locuințele voastre să mâncați azime.»”',
          'Moise i-a chemat pe toți bătrânii lui Israel și le-a spus: „Mergeți, luați-vă animale din turmă pentru familiile voastre și înjunghiați jertfa de Paște.',
          'Luați un mănunchi de isop, înmuiați-l în sângele din vas și atingeți cu sângele din vas pragul de sus și cei doi ușori ai ușii. Niciunul dintre voi să nu iasă pe ușa casei sale până dimineața.',
          'Când DOMNUL va trece ca să-i lovească pe egipteni și va vedea sângele pe pragul de sus și pe cei doi ușori, DOMNUL va trece peste intrare și nu-i va permite nimicitorului să intre în casele voastre ca să vă lovească.',
          'Să păziți acest lucru ca rânduială pentru voi și pentru fiii voștri pentru totdeauna.',
          'Când veți intra în țara pe care DOMNUL v-o va da, așa cum a promis, să păstrați această slujire.',
          'Când copiii voștri vă vor întreba: «Ce înseamnă pentru voi această slujire?»,',
          'să le răspundeți: «Este jertfa de Paște pentru DOMNUL, Care a trecut peste casele fiilor lui Israel în Egipt, când i-a lovit pe egipteni, dar casele noastre le-a cruțat.»” Poporul s-a plecat și s-a închinat.',
          'Fiii lui Israel au mers și au făcut întocmai; au făcut așa cum le poruncise DOMNUL lui Moise și lui Aaron.',
          'La miezul nopții, DOMNUL i-a lovit pe toți întâii născuți din țara Egiptului, de la întâiul născut al faraonului, care stătea pe tronul său, până la întâiul născut al prizonierului aflat în temniță, precum și pe toți întâii născuți ai animalelor.',
          'Faraonul s-a ridicat în timpul nopții, el, toți slujitorii lui și toți egiptenii. În Egipt a fost un strigăt mare, căci nu era casă în care să nu fie cineva mort.',
          'Faraonul i-a chemat noaptea pe Moise și pe Aaron și le-a spus: „Ridicați-vă și plecați din mijlocul poporului meu, atât voi, cât și fiii lui Israel! Mergeți și slujiți-I DOMNULUI, așa cum ați spus.',
          'Luați-vă și turmele și cirezile, așa cum ați spus, și plecați! Binecuvântați-mă și pe mine.”',
          'Egiptenii îi zoreau pe oameni ca să-i scoată repede din țară, căci spuneau: „Vom muri cu toții!”',
          'Poporul și-a luat aluatul înainte să dospească, purtându-și covatele de frământat învelite în haine, pe umeri.',
          'Fiii lui Israel au făcut după cuvântul lui Moise și au cerut de la egipteni obiecte de argint, obiecte de aur și haine.',
          'DOMNUL a făcut ca poporul să găsească bunăvoință în ochii egiptenilor, iar aceștia le-au dat ceea ce au cerut. Astfel au luat prada Egiptului.',
          'Fiii lui Israel au pornit din Ramses spre Sucot. Erau aproximativ șase sute de mii de bărbați care mergeau pe jos, în afară de cei aflați în întreținerea lor.',
          'Împreună cu ei a urcat și o mulțime amestecată, precum și turme și cirezi, foarte multe animale.',
          'Au copt turte nedospite din aluatul pe care îl scoseseră din Egipt. Aluatul nu dospise, fiindcă fuseseră izgoniți din Egipt și nu putuseră aștepta; nici nu-și pregătiseră provizii pentru drum.',
          'Timpul cât au locuit fiii lui Israel în Egipt a fost de patru sute treizeci de ani.',
          'La sfârșitul celor patru sute treizeci de ani, chiar în ziua aceea, toate oștirile DOMNULUI au ieșit din țara Egiptului.',
          'A fost o noapte de veghe pentru DOMNUL, când i-a scos din țara Egiptului. Aceasta este noaptea DOMNULUI, noapte de veghe pentru toți fiii lui Israel, din generație în generație.',
          'DOMNUL le-a spus lui Moise și lui Aaron: „Aceasta este rânduiala Paștelui: niciun străin din afară să nu mănânce din el.',
          'Orice sclav cumpărat cu argint va putea mânca din el după ce îl vei circumcide.',
          'Străinul aflat temporar și lucrătorul angajat să nu mănânce din el.',
          'Să fie mâncat într-o singură casă. Să nu scoateți nimic din carne afară din casă și să nu-i zdrobiți niciun os.',
          'Întreaga comunitate a lui Israel să țină Paștele.',
          'Dacă un străin care locuiește printre voi vrea să țină Paștele pentru DOMNUL, toți cei de parte bărbătească din casa lui să fie circumciși. Atunci se va putea apropia și îl va putea ține și va fi ca unul născut în țară. Dar nicio persoană necircumcisă să nu mănânce din el.',
          'Aceeași lege să fie pentru cel născut în țară și pentru străinul care locuiește printre voi.”',
          'Toți fiii lui Israel au făcut întocmai; au făcut așa cum le poruncise DOMNUL lui Moise și lui Aaron.',
          'Chiar în ziua aceea, DOMNUL i-a scos pe fiii lui Israel din țara Egiptului, după oștirile lor.'],
          13:[
          'DOMNUL i-a vorbit lui Moise și i-a spus:',
          '„Pune-Mi deoparte orice întâi născut, orice întâi venit care deschide pântecele printre fiii lui Israel, atât dintre oameni, cât și dintre animale. Este al Meu.”',
          'Moise a spus poporului: „Aduceți-vă aminte de ziua aceasta, în care ați ieșit din Egipt, din casa robiei, căci prin puterea mâinii Sale v-a scos DOMNUL de aici. Să nu se mănânce pâine dospită.',
          'Astăzi ieșiți, în luna Abib.',
          'Când DOMNUL te va aduce în țara canaaniților, hetiților, amoriților, heviților și iebusiților, țară pe care a jurat părinților tăi că ți-o va da, o țară în care curge lapte și miere, să ții această slujire în luna aceasta.',
          'Timp de șapte zile să mănânci azime, iar în ziua a șaptea să fie o sărbătoare pentru DOMNUL.',
          'Azime să se mănânce în cele șapte zile. Să nu se vadă la tine pâine dospită și să nu se vadă la tine aluat dospit în tot ținutul tău.',
          'În ziua aceea să-i spui fiului tău: «Aceasta este din cauza a ceea ce a făcut DOMNUL pentru mine când am ieșit din Egipt.»',
          'Să fie pentru tine ca un semn pe mâna ta și ca o aducere-aminte între ochii tăi, pentru ca Legea DOMNULUI să fie în gura ta, căci cu mână puternică te-a scos DOMNUL din Egipt.',
          'Să păzești această rânduială la timpul ei, an de an.',
          'Când DOMNUL te va aduce în țara canaaniților, așa cum ți-a jurat ție și părinților tăi, și ți-o va da,',
          'să-I pui deoparte DOMNULUI orice întâi venit care deschide pântecele și orice întâi născut de parte bărbătească al animalelor tale; aceștia sunt ai DOMNULUI.',
          'Orice întâi născut al măgăriței să-l răscumperi cu un animal din turmă, iar dacă nu-l răscumperi, să-i frângi gâtul. Să răscumperi orice întâi născut dintre fiii tăi.',
          'Când fiul tău te va întreba în viitor: «Ce înseamnă aceasta?», să-i răspunzi: «Prin puterea mâinii Sale ne-a scos DOMNUL din Egipt, din casa robiei.',
          'Când faraonul s-a încăpățânat să nu ne lase să plecăm, DOMNUL i-a omorât pe toți întâii născuți din țara Egiptului, atât pe întâii născuți dintre oameni, cât și pe întâii născuți ai animalelor. De aceea Îi aduc jertfă DOMNULUI pe orice întâi venit de parte bărbătească care deschide pântecele, dar pe orice întâi născut dintre fiii mei îl răscumpăr.»',
          'Aceasta să fie ca un semn pe mâna ta și ca un simbol între ochii tăi, căci cu mână puternică ne-a scos DOMNUL din Egipt.”',
          'Când faraonul a lăsat poporul să plece, Dumnezeu nu l-a condus pe drumul țării filistenilor, deși era mai scurt, căci Dumnezeu a spus: „Nu cumva poporul să se răzgândească atunci când va vedea războiul și să se întoarcă în Egipt.”',
          'Dumnezeu a făcut poporul să ocolească pe drumul pustiei, spre Marea Roșie. Fiii lui Israel au ieșit din țara Egiptului în formație organizată.',
          'Moise a luat cu el oasele lui Iosif, căci Iosif îi pusese pe fiii lui Israel să jure, spunând: „Dumnezeu va veni negreșit în ajutorul vostru; atunci să luați de aici oasele mele cu voi.”',
          'Au pornit din Sucot și și-au așezat tabăra la Etam, la marginea pustiei.',
          'DOMNUL mergea înaintea lor ziua într-un stâlp de nor, ca să-i călăuzească pe drum, iar noaptea într-un stâlp de foc, ca să le dea lumină, pentru ca ei să poată merge zi și noapte.',
          'Stâlpul de nor nu se îndepărta dinaintea poporului ziua, nici stâlpul de foc noaptea.'],
          14:[
          'DOMNUL i-a vorbit lui Moise și i-a spus:',
          '„Spune-le fiilor lui Israel să se întoarcă și să-și așeze tabăra înaintea Pi-Hahirotului, între Migdol și mare, în fața lui Baal-Țefon. Să vă așezați tabăra lângă mare, față în față cu acel loc.',
          'Faraonul va spune despre fiii lui Israel: «S-au rătăcit în țară; pustia i-a închis.»',
          'Eu voi împietri inima faraonului, iar el îi va urmări. Îmi voi arăta gloria asupra faraonului și asupra întregii lui oștiri, iar egiptenii vor ști că Eu sunt DOMNUL.” Ei au făcut astfel.',
          'Când regelui Egiptului i s-a spus că poporul fugise, inima faraonului și a slujitorilor lui s-a schimbat față de popor și au spus: „Ce am făcut, lăsându-l pe Israel să plece din slujba noastră?”',
          'Faraonul și-a pregătit carul și și-a luat poporul cu el.',
          'A luat șase sute de care alese și toate celelalte care ale Egiptului, fiecare cu căpeteniile lui.',
          'DOMNUL a împietrit inima faraonului, regele Egiptului, iar acesta i-a urmărit pe fiii lui Israel. Fiii lui Israel ieșeau cu mâna ridicată.',
          'Egiptenii i-au urmărit și i-au ajuns când își așezaseră tabăra lângă mare, lângă Pi-Hahirot, în fața lui Baal-Țefon: toți caii și carele faraonului, călăreții și oștirea lui.',
          'Când faraonul s-a apropiat, fiii lui Israel și-au ridicat ochii și iată că egiptenii veneau după ei. Atunci s-au înspăimântat foarte tare și au strigat către DOMNUL.',
          'I-au spus lui Moise: „Pentru că nu erau morminte în Egipt ne-ai adus să murim în pustiu? Ce ne-ai făcut, scoțându-ne din Egipt?',
          'Nu acesta este cuvântul pe care ți l-am spus în Egipt: «Lasă-ne în pace ca să le slujim egiptenilor»? Era mai bine pentru noi să le slujim egiptenilor decât să murim în pustiu.”',
          'Moise a spus poporului: „Nu vă temeți! Stați pe loc și priviți izbăvirea pe care DOMNUL o va înfăptui astăzi pentru voi, căci pe egiptenii pe care îi vedeți astăzi nu-i veți mai vedea niciodată.',
          'DOMNUL va lupta pentru voi, iar voi să tăceți.”',
          'DOMNUL i-a spus lui Moise: „De ce strigi către Mine? Spune-le fiilor lui Israel să pornească înainte.',
          'Ridică-ți toiagul, întinde-ți mâna peste mare și desparte-o, iar fiii lui Israel vor intra prin mijlocul mării pe uscat.',
          'Iată, Eu voi împietri inimile egiptenilor, iar ei vor intra după fiii lui Israel. Îmi voi arăta gloria asupra faraonului și asupra întregii lui oștiri, asupra carelor și călăreților lui.',
          'Egiptenii vor ști că Eu sunt DOMNUL când Îmi voi arăta gloria asupra faraonului, asupra carelor și călăreților lui.”',
          'Îngerul lui Dumnezeu, care mergea înaintea taberei lui Israel, s-a mutat și a mers în urma lor. Stâlpul de nor s-a mutat dinaintea lor și s-a așezat în urma lor.',
          'A venit între tabăra Egiptului și tabăra lui Israel. Norul aducea întuneric pentru unii și lumina noaptea pentru ceilalți, astfel încât o tabără nu s-a apropiat de cealaltă toată noaptea.',
          'Moise și-a întins mâna peste mare, iar DOMNUL a făcut marea să se retragă toată noaptea printr-un vânt puternic de răsărit. A prefăcut marea în uscat, iar apele s-au despărțit.',
          'Fiii lui Israel au intrat prin mijlocul mării pe uscat, iar apele erau ca un zid la dreapta și la stânga lor.',
          'Egiptenii i-au urmărit și au intrat după ei în mijlocul mării: toți caii faraonului, carele și călăreții lui.',
          'În straja dimineții, DOMNUL a privit spre tabăra egiptenilor din stâlpul de foc și de nor și a adus tulburare în tabăra egiptenilor.',
          'A făcut ca roțile carelor lor să meargă cu greu. Atunci egiptenii au spus: „Să fugim dinaintea lui Israel, căci DOMNUL luptă pentru ei împotriva Egiptului!”',
          'DOMNUL i-a spus lui Moise: „Întinde-ți mâna peste mare, ca apele să se întoarcă peste egipteni, peste carele și călăreții lor.”',
          'Moise și-a întins mâna peste mare, iar spre dimineață marea s-a întors la puterea ei. Egiptenii fugeau în întâmpinarea ei, iar DOMNUL i-a aruncat pe egipteni în mijlocul mării.',
          'Apele s-au întors și au acoperit carele, călăreții și întreaga oștire a faraonului care intrase după ei în mare. Nu a mai rămas niciunul dintre ei.',
          'Dar fiii lui Israel au mers pe uscat prin mijlocul mării, iar apele erau ca un zid la dreapta și la stânga lor.',
          'În ziua aceea, DOMNUL l-a izbăvit pe Israel din mâna egiptenilor, iar Israel i-a văzut pe egipteni morți pe țărmul mării.',
          'Israel a văzut lucrarea cea mare pe care DOMNUL o făcuse împotriva egiptenilor. Poporul s-a temut de DOMNUL și a crezut în DOMNUL și în Moise, slujitorul Său.'],
          15:[
          'Atunci Moise și fiii lui Israel I-au cântat DOMNULUI această cântare: „Voi cânta DOMNULUI, căci S-a înălțat cu măreție; a aruncat în mare calul și călărețul lui.',
          'Yah este tăria și cântarea mea și a devenit izbăvirea mea. El este Dumnezeul meu și Îl voi lăuda, Dumnezeul tatălui meu și Îl voi înălța.',
          'DOMNUL este un războinic; DOMNUL este Numele Lui.',
          'A aruncat în mare carele faraonului și oștirea lui; căpeteniile lui alese s-au scufundat în Marea Roșie.',
          'Adâncurile i-au acoperit; s-au coborât în adâncimi ca o piatră.',
          'Dreapta Ta, DOMNULE, este măreață în putere; dreapta Ta, DOMNULE, îl sfărâmă pe dușman.',
          'În măreția slavei Tale îi dobori pe cei care se ridică împotriva Ta; Îți trimiți mânia și ea îi mistuie ca pe paie.',
          'La suflarea nărilor Tale, apele s-au îngrămădit; șuvoaiele au stat ca un zid, adâncurile s-au închegat în inima mării.',
          'Dușmanul a spus: «Îi voi urmări, îi voi ajunge, voi împărți prada; dorința mea se va sătura cu ei. Îmi voi scoate sabia, iar mâna mea îi va nimici.»',
          'Ai suflat cu vântul Tău și marea i-a acoperit; s-au scufundat ca plumbul în apele puternice.',
          'Cine este ca Tine între dumnezei, DOMNULE? Cine este ca Tine, măreț în sfințenie, înfricoșător în laude și făcător de minuni?',
          'Ți-ai întins dreapta, iar pământul i-a înghițit.',
          'Prin bunătatea Ta statornică ai călăuzit poporul pe care l-ai răscumpărat; prin puterea Ta l-ai condus spre locuința Ta sfântă.',
          'Popoarele au auzit și tremură; groaza i-a cuprins pe locuitorii Filistiei.',
          'Atunci căpeteniile Edomului s-au înspăimântat, tremurul i-a cuprins pe conducătorii Moabului, iar toți locuitorii Canaanului s-au topit de frică.',
