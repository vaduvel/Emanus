name: Refresh Safe WLC Archive Hash Once

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Update WLC archive hash only after per-book proof
        run: |
          set -euo pipefail
          old='da7b33af7a23e0e9fce8a8adf3cb5bcb035a513f44b83865b390c52dc3dd2ce3'
          new='0b0b9416b941550ef780b8fb8efd114c3ba141a4e9c094a43da70d1458122ded'
          files=(
            scripts/promote-hosea-to-biblia-emanus.py
            scripts/promote-minor-prophet-to-biblia-emanus.py
          )
          for file in "${files[@]}"; do
            grep -q "$old" "$file" || { echo "Expected old WLC hash missing in $file"; exit 1; }
            python3 - "$file" "$old" "$new" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          old, new = sys.argv[2], sys.argv[3]
          text = path.read_text(encoding='utf-8')
          text2 = text.replace(old, new)
          if text2 == text:
              raise SystemExit(f'No replacement in {path}')
          path.write_text(text2, encoding='utf-8')
          PY
          done

      - name: Record provenance note and self-clean
        run: |
          cat > docs/biblia-explicata/WLC-ARCHIVE-DRIFT-2026-08-08.md <<'EOF'
          # WLC archive drift — 2026-08-08

          Current upstream archive SHA-256:
          `0b0b9416b941550ef780b8fb8efd114c3ba141a4e9c094a43da70d1458122ded`

          Previous pinned archive SHA-256:
          `da7b33af7a23e0e9fce8a8adf3cb5bcb035a513f44b83865b390c52dc3dd2ce3`

          The fresh-source capture gate compared all 12 in-scope WLC USFM payloads
          (HOS–MAL) against the previous per-book lock and proved them byte-identical.
          Therefore the observed difference is archive packaging/metadata drift for this
          scope, not a change to the biblical source text used by the minor-prophet audit.

          Promotion scripts were updated to the currently verified archive hash only after
          that per-book proof. Any future archive drift remains a hard failure until the
          payloads are checked again.
          EOF
          git rm .github/workflows/refresh-safe-wlc-archive-hash-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/promote-hosea-to-biblia-emanus.py scripts/promote-minor-prophet-to-biblia-emanus.py docs/biblia-explicata/WLC-ARCHIVE-DRIFT-2026-08-08.md
          git diff --cached --check
          git commit -m 'Accept verified WLC archive packaging drift'
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
