name: VT Integrate Main

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
    paths:
      - ".github/workflows/vt-explanation-review.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: vt-integrate-main
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge main, resolve known conflicts, validate, and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local sha="$1"
            local context="$2"
            local state="$3"
            local description="$4"
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\"}" >/dev/null
          }

          fail() {
            post_status "$PRE_SHA" "vt/integration-main" failure "$1"
            echo "ERROR: $1" >&2
            exit 1
          }

          post_status "$PRE_SHA" "vt/integration-main" pending "merging current main into VT branch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            [ "${#conflicts[@]}" -gt 0 ] || fail "merge failed without conflict paths"

            noncorpus=()
            corpus=0
            for path in "${conflicts[@]}"; do
              if [[ "$path" == docs/data/biblia-emanus/* ]]; then
                corpus=$((corpus + 1))
                git checkout --theirs -- "$path"
                git add "$path"
              else
                noncorpus+=("$path")
              fi
            done

            if [ "${#noncorpus[@]}" -ne 1 ] || [ "${noncorpus[0]}" != "apps/web/src/screens/Bible.tsx" ]; then
              printf 'Unexpected non-corpus conflicts:\n%s\n' "${noncorpus[*]}" >&2
              fail "unexpected non-corpus merge conflicts"
            fi

            # Păstrează arhitectura publication/temporary-text din ramura VT.
            git checkout --ours -- apps/web/src/screens/Bible.tsx
            python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/screens/Bible.tsx")
          text = path.read_text()
          text = text.translate(str.maketrans({"ş": "ș", "Ş": "Ș", "ţ": "ț", "Ţ": "Ț"}))
          path.write_text(text)
          if any(ch in text for ch in "şŞţŢ"):
              raise SystemExit("sedila Romanian characters remain in Bible.tsx")
          PY
            git add apps/web/src/screens/Bible.tsx
          fi

          unresolved=$(git diff --name-only --diff-filter=U)
          [ -z "$unresolved" ] || fail "unresolved merge conflicts remain"

          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile

          pnpm check:vt-explained
          pnpm check:vt-legacy-provenance
          pnpm check:vt-poonen-fidelity
          pnpm check:vt-chapter-review
          pnpm check:vt-publication
          pnpm --filter @emanus/shared typecheck
          pnpm --filter @emanus/shared build
          pnpm --filter @emanus/web typecheck
          git diff --check
          git diff --cached --check

          git commit -m "Merge main into VT explanation branch"
          merge_sha=$(git rev-parse HEAD)
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean

          for item in \
            "vt/check-explained:check:vt-explained passed" \
            "vt/legacy-provenance:legacy provenance passed" \
            "vt/poonen-fidelity:Poonen fidelity passed" \
            "vt/chapter-review:929/929 chapter review passed" \
            "vt/publication:publication gate passed" \
            "vt/shared-typecheck:shared typecheck passed" \
            "vt/shared-build:shared build passed" \
            "vt/diff-check:diff check passed" \
            "vt/web-typecheck:web typecheck passed" \
            "vt/integration-main:main integrated and validated"; do
            context=${item%%:*}
            description=${item#*:}
            post_status "$merge_sha" "$context" success "$description"
          done
          post_status "$PRE_SHA" "vt/integration-main" success "main integrated; merge commit pushed"
