name: VT Explanation Review

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
    paths:
      - "packages/shared/src/bible/**"
      - "scripts/check-vt-explained-coverage.py"
      - "scripts/check-vt-legacy-provenance.mjs"
      - "scripts/check-vt-poonen-fidelity.mjs"
      - "scripts/check-vt-chapter-by-chapter-review.mjs"
      - "scripts/check-vt-publication-runtime.mjs"
      - "docs/biblia-explicata/**"
      - "package.json"
      - "packages/shared/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/vt-explanation-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/shared/src/bible/**"
      - "scripts/check-vt-explained-coverage.py"
      - "scripts/check-vt-legacy-provenance.mjs"
      - "scripts/check-vt-poonen-fidelity.mjs"
      - "scripts/check-vt-chapter-by-chapter-review.mjs"
      - "scripts/check-vt-publication-runtime.mjs"
      - "docs/biblia-explicata/**"
      - "package.json"
      - "packages/shared/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/vt-explanation-review.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  group: vt-explanation-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-explanations:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Fetch main for PR-range whitespace check
        run: git fetch origin main:refs/remotes/origin/main

      - name: Run VT gates, publish statuses and report failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          failed=0
          report=/tmp/vt-gate-report.md
          printf '### VT explanation gate report — `%s`\n\n' "$TARGET_SHA" > "$report"

          post_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\"}" >/dev/null
          }

          run_gate() {
            local context="$1"
            local label="$2"
            local command="$3"
            local slug
            slug=$(echo "$context" | tr '/:' '__')
            local log="/tmp/${slug}.log"
            post_status "$context" pending "$label running"
            echo "::group::$label"
            bash -lc "$command" >"$log" 2>&1
            local rc=$?
            cat "$log"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              post_status "$context" success "$label passed"
              printf -- '- ✅ `%s`\n' "$label" >> "$report"
            else
              post_status "$context" failure "$label failed"
              failed=1
              printf -- '- ❌ `%s`\n\n```text\n' "$label" >> "$report"
              tail -n 28 "$log" >> "$report"
              printf '\n```\n\n' >> "$report"
            fi
          }

          run_gate "vt/check-explained" "check:vt-explained" "pnpm check:vt-explained"
          run_gate "vt/legacy-provenance" "check:vt-legacy-provenance" "pnpm check:vt-legacy-provenance"
          run_gate "vt/poonen-fidelity" "check:vt-poonen-fidelity" "pnpm check:vt-poonen-fidelity"
          run_gate "vt/chapter-review" "check:vt-chapter-review" "pnpm check:vt-chapter-review"
          run_gate "vt/publication" "check:vt-publication" "pnpm check:vt-publication"
          run_gate "vt/shared-typecheck" "shared TypeScript typecheck" "pnpm --filter @emanus/shared typecheck"
          run_gate "vt/shared-build" "shared build" "pnpm --filter @emanus/shared build"
          run_gate "vt/diff-check" "git diff --check" "git diff --check && git diff --check origin/main...HEAD"

          if [ "$failed" -ne 0 ]; then
            payload=$(python3 -c 'import json, pathlib; print(json.dumps({"body": pathlib.Path("/tmp/vt-gate-report.md").read_text()}))')
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/85/comments" \
              -d "$payload" >/dev/null
          fi

          exit "$failed"
