name: VT Explanation Review

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
    paths:
      - "packages/shared/src/bible/**"
      - "packages/shared/package.json"
      - "apps/web/src/screens/Bible.tsx"
      - "scripts/check-vt-*.mjs"
      - "scripts/check-vt-*.py"
      - "scripts/materialize-published-emanus-ot-runtime.py"
      - "package.json"
      - ".github/workflows/vt-explanation-review.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: vt-explanation-review-integrate-main
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge published VT from main without changing canonical text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local sha="$1" context="$2" state="$3" description="$4"
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\"}" >/dev/null
          }

          fail() {
            post_status "$PRE_SHA" "vt/emanus-final-integration" failure "$1"
            echo "ERROR: $1" >&2
            exit 1
          }

          post_status "$PRE_SHA" "vt/emanus-final-integration" pending "syncing PR85 with published Emanus VT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main

          git merge-base --is-ancestor 9d40cd53643d1568f8c806645d9b576f6c70b961 origin/main \
            || fail "main does not contain published VT commit 9d40cd53"

          set +e
          git merge --no-commit --no-ff origin/main >/tmp/vt-main-merge.log 2>&1
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            unexpected=()
            for path in "${conflicts[@]}"; do
              case "$path" in
                docs/data/biblia-emanus/*|docs/data/biblia-emanus-candidates/*|docs/biblia-emanus/*|.github/workflows/ci.yml|.github/workflows/review-ot-source-evidence.yml)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                scripts/*biblia-emanus*|scripts/test_biblia_emanus*)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                package.json)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                apps/web/src/screens/Bible.tsx|packages/shared/package.json|.github/workflows/vt-explanation-review.yml)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if [ "${#unexpected[@]}" -ne 0 ]; then
              printf 'Unexpected conflicts:\n%s\n' "${unexpected[*]}" >&2
              fail "unexpected merge conflicts; canonical text was not altered"
            fi
          fi

          unresolved=$(git diff --name-only --diff-filter=U)
          [ -z "$unresolved" ] || fail "unresolved merge conflicts remain"

          # Canonical VT in this branch must be byte-for-byte the current main tree.
          if [ -d docs/data/biblia-emanus ]; then
            git rm -r -f docs/data/biblia-emanus >/dev/null
          fi
          git checkout origin/main -- docs/data/biblia-emanus
          git add docs/data/biblia-emanus
          test ! -e docs/data/biblia-emanus/ot-source-evidence.jsonl \
            || fail "raw 53 MB evidence JSONL must not exist"
          test -e docs/data/biblia-emanus/ot-source-evidence.jsonl.gz \
            || fail "compressed source evidence archive is missing"

          # Keep all scripts introduced by main, then add/override only VT-explanation commands.
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('package.json')
          data = json.loads(path.read_text())
          scripts = data.setdefault('scripts', {})
          scripts.update({
              'materialize:vt-emanus-runtime': 'python3 scripts/materialize-published-emanus-ot-runtime.py',
              'check:vt-explained': 'python3 scripts/check-vt-explained-coverage.py',
              'check:vt-legacy-provenance': 'pnpm build:shared && node scripts/check-vt-legacy-provenance.mjs',
              'check:vt-poonen-fidelity': 'pnpm build:shared && node scripts/check-vt-poonen-fidelity.mjs',
              'check:vt-chapter-review': 'pnpm build:shared && node scripts/check-vt-chapter-by-chapter-review.mjs',
              'check:vt-emanus-binding': 'python3 scripts/materialize-published-emanus-ot-runtime.py --check && pnpm build:shared && node scripts/check-vt-emanus-binding.mjs',
              'check:vt-publication': 'python3 scripts/materialize-published-emanus-ot-runtime.py --check && pnpm build:shared && node scripts/check-vt-emanus-binding.mjs',
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          shared = Path('packages/shared/package.json')
          pkg = json.loads(shared.read_text())
          pkg.setdefault('exports', {})['./bible-publication'] = {
              'types': './dist/bible/publicationBibleFinal.d.ts',
              'default': './dist/bible/publicationBibleFinal.js',
          }
          shared.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')
          PY
          git add package.json packages/shared/package.json

          python3 scripts/materialize-published-emanus-ot-runtime.py
          git add packages/shared/src/bible/generated/publishedEmanusOtText.ts

          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile

          # Dedicated VT source/publication gate from PR87. NT failures are intentionally out of scope.
          python3 scripts/check-biblia-emanus-ot-publication-gate.py
          pnpm check:vt-explained
          pnpm check:vt-legacy-provenance
          pnpm check:vt-poonen-fidelity
          pnpm check:vt-chapter-review
          pnpm check:vt-publication
          pnpm --filter @emanus/shared typecheck
          pnpm --filter @emanus/shared build
          pnpm --filter @emanus/web typecheck
          git diff --check
          git diff --cached --check

          git add -A
          git commit -m "Bind explained VT to published Biblia Emanus"
          merge_sha=$(git rev-parse HEAD)
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean

          for item in \
            "vt/check-explained:39/39 explanation coverage passed" \
            "vt/legacy-provenance:legacy provenance passed" \
            "vt/poonen-fidelity:Poonen fidelity passed" \
            "vt/chapter-review:929/929 explanation chapters passed" \
            "vt/publication:published Emanus VT binding passed" \
            "vt/emanus-binding:39 books 929 chapters 23145 verses bound" \
            "vt/shared-typecheck:shared typecheck passed" \
            "vt/shared-build:shared build passed" \
            "vt/web-typecheck:web typecheck passed" \
            "vt/diff-check:diff check passed" \
            "vt/emanus-final-integration:main VT integrated without canonical edits"; do
            context=${item%%:*}
            description=${item#*:}
            post_status "$merge_sha" "$context" success "$description"
          done
          post_status "$PRE_SHA" "vt/emanus-final-integration" success "published Emanus VT integrated and validated"
