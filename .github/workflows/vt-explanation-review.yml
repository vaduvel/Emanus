name: VT Explanation Review

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
    paths:
      - "packages/shared/src/bible/**"
      - "scripts/check-vt-explained-coverage.py"
      - "scripts/check-vt-legacy-provenance.mjs"
      - "scripts/check-vt-poonen-fidelity.mjs"
      - "scripts/check-vt-chapter-by-chapter-review.mjs"
      - "scripts/check-vt-publication-runtime.mjs"
      - "docs/biblia-explicata/**"
      - "package.json"
      - "packages/shared/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/vt-explanation-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/shared/src/bible/**"
      - "scripts/check-vt-explained-coverage.py"
      - "scripts/check-vt-legacy-provenance.mjs"
      - "scripts/check-vt-poonen-fidelity.mjs"
      - "scripts/check-vt-chapter-by-chapter-review.mjs"
      - "scripts/check-vt-publication-runtime.mjs"
      - "docs/biblia-explicata/**"
      - "package.json"
      - "packages/shared/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/vt-explanation-review.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vt-explanation-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-explanations:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Detect merge conflicts with main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          git config user.name "vt-merge-dry-run"
          git config user.email "vt-merge-dry-run@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main >/tmp/vt-merge.log 2>&1
          rc=$?

          post_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\"}" >/dev/null
          }

          if [ "$rc" -eq 0 ]; then
            post_status "vt/merge-dry-run" success "main merges without conflicts"
            git merge --abort || true
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          corpus=0
          noncorpus=0
          post_status "vt/merge-dry-run" failure "${#conflicts[@]} merge conflicts with main"

          for path in "${conflicts[@]}"; do
            if [[ "$path" == docs/data/biblia-emanus/* ]]; then
              corpus=$((corpus + 1))
            else
              noncorpus=$((noncorpus + 1))
              safe=$(echo "$path" | sed -E 's/[^[:alnum:]_.-]+/_/g' | cut -c1-70)
              post_status "vt/noncorpus-${safe}" failure "non-corpus merge conflict"
            fi
          done

          post_status "vt/conflicts-total-${#conflicts[@]}" failure "total merge conflicts"
          post_status "vt/corpus-conflicts-${corpus}" failure "Biblia Emanus corpus conflicts"
          post_status "vt/noncorpus-conflicts-${noncorpus}" failure "non-corpus conflicts"
          cat /tmp/vt-merge.log
          git merge --abort || true
          exit 0

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Run VT gates and publish diagnostic statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          failed=0

          post_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\"}" >/dev/null
          }

          diagnostic_context() {
            local log="$1"
            local line
            line=$(grep -E -m1 'error TS[0-9]+|\[.*\] EROARE|Error:|ERR_PNPM|SyntaxError|ReferenceError|TypeError|Cannot find|does not exist|is not exported' "$log")
            if [ -z "$line" ]; then
              line=$(tail -n 1 "$log")
            fi
            line=$(echo "$line" | tr '\n\r' '  ' | sed -E 's/[^[:alnum:]_.()\/-]+/_/g' | cut -c1-90)
            [ -n "$line" ] || line="unknown_error"
            echo "vt/error-${line}"
          }

          run_gate() {
            local context="$1"
            local label="$2"
            local command="$3"
            local slug
            slug=$(echo "$context" | tr '/:' '__')
            local log="/tmp/${slug}.log"
            post_status "$context" pending "$label running"
            echo "::group::$label"
            bash -lc "$command" >"$log" 2>&1
            local rc=$?
            cat "$log"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              post_status "$context" success "$label passed"
            else
              post_status "$context" failure "$label failed"
              local diag
              diag=$(diagnostic_context "$log")
              post_status "$diag" failure "$label first error"
              failed=1
            fi
          }

          run_gate "vt/check-explained" "check:vt-explained" "pnpm check:vt-explained"
          run_gate "vt/legacy-provenance" "check:vt-legacy-provenance" "pnpm check:vt-legacy-provenance"
          run_gate "vt/poonen-fidelity" "check:vt-poonen-fidelity" "pnpm check:vt-poonen-fidelity"
          run_gate "vt/chapter-review" "check:vt-chapter-review" "pnpm check:vt-chapter-review"
          run_gate "vt/publication" "check:vt-publication" "pnpm check:vt-publication"
          run_gate "vt/shared-typecheck" "shared TypeScript typecheck" "pnpm --filter @emanus/shared typecheck"
          run_gate "vt/shared-build" "shared build" "pnpm --filter @emanus/shared build"
          run_gate "vt/diff-check" "git diff --check" "git diff --check && git diff --check origin/main...HEAD"

          exit "$failed"
