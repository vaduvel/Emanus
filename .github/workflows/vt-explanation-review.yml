name: VT Explanation Review

on:
  push:
    branches: [agent/biblia-explicata-vt-integration-clean]
    paths:
      - "packages/shared/src/bible/**"
      - "packages/shared/package.json"
      - "apps/web/src/screens/Bible.tsx"
      - "scripts/check-vt-*.mjs"
      - "scripts/check-vt-*.py"
      - "scripts/materialize-published-emanus-ot-runtime.py"
      - "package.json"
      - ".github/workflows/vt-explanation-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/shared/src/bible/**"
      - "packages/shared/package.json"
      - "apps/web/src/screens/Bible.tsx"
      - "scripts/check-vt-*.mjs"
      - "scripts/check-vt-*.py"
      - "scripts/materialize-published-emanus-ot-runtime.py"
      - "package.json"
      - ".github/workflows/vt-explanation-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vt-explanation-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify published Biblia Emanus VT source
        run: |
          set -euo pipefail
          test ! -e docs/data/biblia-emanus/ot-source-evidence.jsonl
          test -e docs/data/biblia-emanus/ot-source-evidence.jsonl.gz
          python3 scripts/check-biblia-emanus-ot-publication-gate.py
          python3 scripts/materialize-published-emanus-ot-runtime.py --check

      - name: Verify 39-book explained VT and source fidelity
        run: |
          set -euo pipefail
          pnpm check:vt-explained
          pnpm check:vt-legacy-provenance
          pnpm check:vt-poonen-fidelity
          pnpm check:vt-chapter-review
          pnpm check:vt-publication

      - name: Typecheck and build reader packages
        run: |
          set -euo pipefail
          pnpm --filter @emanus/shared typecheck
          pnpm --filter @emanus/shared build
          pnpm --filter @emanus/web typecheck

      - name: Verify clean diff and main mergeability
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin main:refs/remotes/origin/main
          git diff --check origin/main...HEAD
          git merge-tree --write-tree HEAD origin/main >/dev/null
