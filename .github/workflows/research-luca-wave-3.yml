name: Research Luca wave 3

on:
  workflow_dispatch:
  push:
    branches:
      - agent/integrate-biblical-review
    paths:
      - .github/workflows/research-luca-wave-3.yml
  pull_request:
    paths:
      - .github/workflows/research-luca-wave-3.yml

permissions:
  contents: read

jobs:
  transcribe:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        episode:
          - number: 5
            slug: 05-luke-4-20-to-5-32
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-4-20-to-chapter-5-32.mp3
          - number: 6
            slug: 06-luke-5-33-to-6-38
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-5-33-to-chapter-6-38.mp3
          - number: 7
            slug: 07-luke-6-39-to-7-35
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-6-39-to-chapter-7-35.mp3
          - number: 8
            slug: 08-luke-7-35-to-8-48
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-7-35-to-chapter-8-48.mp3
          - number: 9
            slug: 09-luke-8-49-to-9-36
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-8-49-to-chapter-9-36.mp3
          - number: 10
            slug: 10-luke-9-37-to-10-16
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-9-37-to-chapter-10-16.mp3
          - number: 11
            slug: 11-luke-10-17-to-10-42
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-10-17-to-chapter-10-42.mp3
          - number: 12
            slug: 12-luke-11-1-to-11-36
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-11-1-to-chapter-11-36.mp3
          - number: 13
            slug: 13-luke-11-37-to-12-13
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-11-37-to-chapter-12-13.mp3
          - number: 14
            slug: 14-luke-12-13-to-12-59
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-12-13-to-chapter-12-59.mp3
          - number: 15
            slug: 15-luke-13-1-to-14-24
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-13-1-to-chapter-14-24.mp3
          - number: 16
            slug: 16-luke-14-25-to-15-17
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-14-25-to-chapter-15-17.mp3
          - number: 17
            slug: 17-luke-15-11-to-16-18
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-15-11-to-chapter-16-18.mp3
          - number: 18
            slug: 18-luke-16-19-to-17-37
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-16-19-to-chapter-17-37.mp3
          - number: 19
            slug: 19-luke-18-1-to-18-30
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-18-1-to-chapter-18-30.mp3
          - number: 20
            slug: 20-luke-18-31-to-19-48
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-18-31-to-chapter-19-48.mp3
          - number: 21
            slug: 21-luke-20-1-to-21-19
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-20-1-to-chapter-21-19.mp3
          - number: 22
            slug: 22-luke-21-20-to-22-46
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-21-20-to-chapter-22-46.mp3
          - number: 23
            slug: 23-luke-22-47-to-23-46
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-22-47-to-chapter-23-46.mp3
          - number: 24
            slug: 24-luke-23-47-to-24-53
            url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt03-luke-chapter-23-47-to-chapter-24-53.mp3

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install transcription tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper==1.2.0

      - name: Download official CFC audio
        env:
          EPISODE_URL: ${{ matrix.episode.url }}
          EPISODE_SLUG: ${{ matrix.episode.slug }}
        run: |
          mkdir -p .research/luca-wave-3/audio .research/luca-wave-3/transcripts
          curl --fail --location --retry 4 "$EPISODE_URL" \
            --output ".research/luca-wave-3/audio/$EPISODE_SLUG.mp3"
          test -s ".research/luca-wave-3/audio/$EPISODE_SLUG.mp3"

      - name: Transcribe episode
        env:
          EPISODE_SLUG: ${{ matrix.episode.slug }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from faster_whisper import WhisperModel

          root = Path('.research/luca-wave-3')
          slug = os.environ['EPISODE_SLUG']
          source = root / 'audio' / f'{slug}.mp3'
          target = root / 'transcripts' / f'{slug}.txt'
          model = WhisperModel('tiny.en', device='cpu', compute_type='int8', cpu_threads=4)
          segments, info = model.transcribe(
              str(source),
              language='en',
              beam_size=1,
              best_of=1,
              vad_filter=True,
          )
          lines = []
          for segment in segments:
              text = ' '.join(segment.text.split())
              if text:
                  lines.append(text)
          target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'{source.name}: {info.duration:.1f}s audio, {target.stat().st_size} bytes transcript')
          if target.stat().st_size < 5000:
              raise SystemExit('Transcriere prea scurtă')
          PY

      - name: Upload private research artifact
        uses: actions/upload-artifact@v4
        with:
          name: luca-wave-3-${{ matrix.episode.slug }}
          path: .research/luca-wave-3/transcripts/${{ matrix.episode.slug }}.txt
          if-no-files-found: error
          retention-days: 1
