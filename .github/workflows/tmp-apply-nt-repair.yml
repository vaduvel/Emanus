name: Temporary Apply Biblia Emanus NT Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-apply-nt-repair.yml
      - scripts/tmp-apply-nt-repair.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/biblia-emanus-nt-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-nt-repair
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct source helper
        run: |
          : > scripts/tmp-old-pipeline.generated.py
          for part in 00 01 02 03 04 05; do
            git show 8cdc210e01c:scripts/tmp-complete-nt.part${part} >> scripts/tmp-old-pipeline.generated.py
            printf '\n' >> scripts/tmp-old-pipeline.generated.py
          done
          python3 -m py_compile scripts/tmp-old-pipeline.generated.py

      - name: Prepare repair engine compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-apply-nt-repair.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('audit["engineVersion"] = "4.0.0"', 'audit["engineVersion"] = validator.NT_ENGINE_VERSION')
          text = text.replace('"method": "full-corpus-adversarial-language-and-textual-repair"', '"method": "verse-by-verse-source-and-benchmark"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Create pre-repair corpus report
        run: python3 scripts/tmp-audit-nt-human-quality.py

      - name: Apply source-backed repairs
        env:
          OLD_PIPELINE: scripts/tmp-old-pipeline.generated.py
        run: python3 scripts/tmp-apply-nt-repair.py

      - name: Keep manifest compatible until atomic reseal
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/data/biblia-emanus/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['newTestament'] = {'books': 27, 'chapters': 260, 'verses': 7941, 'status': 'published', 'public': True}
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Create post-repair corpus report
        run: |
          rm -rf tmp-nt-human-quality
          python3 scripts/tmp-audit-nt-human-quality.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('tmp-nt-human-quality/report.json').read_text(encoding='utf-8'))
          blocking = [item for item in report['issues'] if item['severity'] in {'critical', 'high'}]
          print(json.dumps({'issues': report['issue_count'], 'blocking': len(blocking), 'byCode': report['by_code']}, ensure_ascii=False, indent=2))
          if blocking:
              print(json.dumps(blocking[:30], ensure_ascii=False, indent=2))
              raise SystemExit(f"Au rămas {len(blocking)} probleme critice/ridicate")
          PY

      - name: Reseal all New Testament chapters atomically
        run: >-
          python3 scripts/seal-biblia-emanus.py
          --engine biblia-emanus-nt-repair-4.0/source-backed-romanian-gate
          --book MAT --book MRK --book LUK --book JHN --book ACT --book ROM
          --book 1CO --book 2CO --book GAL --book EPH --book PHP --book COL
          --book 1TH --book 2TH --book 1TI --book 2TI --book TIT --book PHM
          --book HEB --book JAS --book 1PE --book 2PE --book 1JN --book 2JN
          --book 3JN --book JUD --book REV

      - name: Materialize repaired New Testament
        run: python3 scripts/materialize-biblia-emanus-nt.py

      - name: Validate corpus and versification
        run: |
          python3 scripts/check-biblia-emanus.py
          python3 scripts/check-biblia-emanus-versification.py
          python3 -m unittest scripts/test_biblia_emanus.py scripts/test_biblia_emanus_nt.py scripts/test_materialize_biblia_emanus_nt.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run permanent checks
        run: |
          pnpm check:quotes
          pnpm check:typos
          pnpm check:content
          pnpm check:bible-publication
          pnpm check:biblia-emanus
          pnpm test:biblia-emanus
          pnpm check:biblia-emanus-versification
          pnpm seal:biblia-emanus --check
          pnpm typecheck
          pnpm build

      - name: Store repair report
        run: |
          mkdir -p docs/biblia-emanus
          cp tmp-nt-human-quality/report.md docs/biblia-emanus/NOUL-TESTAMENT-AUDIT-4-REPAIR.md

      - name: Commit repaired corpus
        run: |
          rm -f scripts/tmp-old-pipeline.generated.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus docs/biblia-emanus/NOUL-TESTAMENT-AUDIT-4-REPAIR.md packages/shared/src/bible/bibliaEmanusNt.generated.ts scripts/tmp-apply-nt-repair.py
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "Repair Biblia Emanus New Testament language and textual consistency"
          git push origin HEAD:agent/biblia-emanus-nt-repair

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nt-repair-report
          path: tmp-nt-human-quality/
          retention-days: 1
