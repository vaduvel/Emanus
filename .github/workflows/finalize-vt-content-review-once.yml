name: Finalize VT Content Review Once

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Fetch historical candidate source
        run: git fetch origin agent/biblia-emanus-ot-and-apocrypha:refs/remotes/origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Reclassify historical translation candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/materialize-vt-overlay-texts.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Judecători–Daniel sunt Biblia Emanus stabilă din sursa canonică istorică.\nPentru Osea–Maleahi, fiecare carte trece automat la Biblia Emanus numai dacă',
              'Judecători–Daniel provin dintr-un candidat Biblia Emanus istoric și rămân\n`temporary-editorial` până la un fresh re-audit în corpusul canonic curent.\nPentru Osea–Maleahi, fiecare carte trece automat la Biblia Emanus numai dacă',
          )
          text = text.replace('ESTABLISHED_BE_BOOKS = [', 'HISTORICAL_BE_CANDIDATE_BOOKS = [')
          old = '''    for book_id, code, name, order, chapters in ESTABLISHED_BE_BOOKS:\n        verses = write_book(args.source_ref, book_id, code, chapters, temporary=False, local=False)\n        entries.append((book_id, code, name, order, chapters, verses, False))\n        total_chapters += chapters\n        total_verses += verses\n'''
          new = '''    # Candidatul istoric rămâne text de lucru până la fresh re-audit în\n    # corpusul canonic curent. Un vechi `published` nu este suficient pentru\n    # eticheta Biblia Emanus după review-ul final de conținut.\n    for book_id, code, name, order, chapters in HISTORICAL_BE_CANDIDATE_BOOKS:\n        verses = write_book(args.source_ref, book_id, code, chapters, temporary=True, local=False)\n        entries.append((book_id, code, name, order, chapters, verses, True))\n        total_chapters += chapters\n        total_verses += verses\n'''
          if old not in text:
              raise SystemExit('Blocul de materializare istorică nu are forma așteptată')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 scripts/materialize-vt-overlay-texts.py --source-ref origin/agent/biblia-emanus-ot-and-apocrypha

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared

      - name: Validate overlay reader after truthful reclassification
        run: |
          node scripts/check-vt-publication-runtime.mjs
          python3 scripts/check-vt-explained-coverage.py

      - name: Generate final content audit evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { PUBLICATION_BIBLE_BOOKS } from './packages/shared/dist/bible/publicationBible.js'
          import { VT_CANONICAL_TEXT_BOOKS } from './packages/shared/dist/bible/generated/vtCanonicalText/index.js'

          const legacyIds = new Set(['geneza','exod','levitic','numeri','deuteronom','iosua','rut','1-samuel','2-samuel','1-imparati'])
          const legacy = []
          let totalUnits = 0, missingKind = 0, missingSource = 0, unclassifiedApplications = 0, unclassifiedWords = 0
          for (const book of PUBLICATION_BIBLE_BOOKS.filter((b) => legacyIds.has(b.id))) {
            const row = { id: book.id, name: book.name, chapters: book.chapters.length, units: 0, missingExplanationKind: 0, missingExplanationSource: 0, unclassifiedForYourHeart: 0, unclassifiedWordStudies: 0, examples: [] }
            for (const chapter of book.chapters) for (const unit of chapter.units) {
              row.units++; totalUnits++
              const noKind = !unit.explanationKind
              const noSource = !unit.explanationSource
              if (noKind) { row.missingExplanationKind++; missingKind++ }
              if (noSource) { row.missingExplanationSource++; missingSource++ }
              if ((noKind || noSource) && unit.forYourHeart) { row.unclassifiedForYourHeart++; unclassifiedApplications++ }
              if ((noKind || noSource) && (unit.words?.length ?? 0)) { row.unclassifiedWordStudies += unit.words.length; unclassifiedWords += unit.words.length }
              if ((noKind || noSource) && row.examples.length < 4) row.examples.push({chapter: chapter.number, ref: unit.ref, heading: unit.heading})
            }
            legacy.push(row)
          }

          const manifest = JSON.parse(fs.readFileSync('docs/data/biblia-emanus/manifest.json', 'utf8'))
          const otCodes = [['GEN',50],['EXO',40],['LEV',27],['NUM',36],['DEU',34],['JOS',24],['JDG',21],['RUT',4],['1SA',31],['2SA',24],['1KI',22],['2KI',25],['1CH',29],['2CH',36],['EZR',10],['NEH',13],['EST',10],['JOB',42],['PSA',150],['PRO',31],['ECC',12],['SNG',8],['ISA',66],['JER',52],['LAM',5],['EZK',48],['DAN',12],['HOS',14],['JOL',3],['AMO',9],['OBA',1],['JON',4],['MIC',7],['NAM',3],['HAB',3],['ZEP',3],['HAG',2],['ZEC',14],['MAL',4]]
          const drafted = new Set(manifest.draftedChapters ?? [])
          const canonicalOt = []
          let canonicalOtChapters = 0
          for (const [code, expected] of otCodes) {
            const present = Array.from({length: expected}, (_, i) => `${code}.${i+1}`).filter((x) => drafted.has(x)).length
            if (present) canonicalOt.push({code, expectedChapters: expected, presentChapters: present, complete: present === expected})
            canonicalOtChapters += present
          }
          const overlayBe = VT_CANONICAL_TEXT_BOOKS.filter((b) => b.textStage === 'biblia-emanus')
          const overlayTemp = VT_CANONICAL_TEXT_BOOKS.filter((b) => b.textStage === 'temporary-editorial')

          const report = {
            generatedOn: '2026-08-08',
            finalVerdict: 'BLOCKED_PENDING_FRESH_TRANSLATION_AND_LEGACY_DOCTRINE_PROVENANCE_REVIEW',
            translation: {
              expectedCanonicalOtBooks: 39,
              expectedCanonicalOtChapters: 929,
              currentCanonicalOtCompleteBooks: canonicalOt.filter((b) => b.complete).length,
              currentCanonicalOtChapters: canonicalOtChapters,
              currentCanonicalBooks: canonicalOt,
              overlayReaderBibliaEmanusBooks: overlayBe.map((b) => b.name),
              overlayReaderTemporaryBooks: overlayTemp.map((b) => b.name),
            },
            doctrine: {
              explanationCoverageBooks: 39,
              overlayBooksWithTruthGuard: 29,
              legacyBooksNeedingUnitProvenanceReview: legacy.length,
              legacyTotalUnits: totalUnits,
              missingExplanationKind: missingKind,
              missingExplanationSource: missingSource,
              unclassifiedForYourHeart: unclassifiedApplications,
              unclassifiedWordStudies: unclassifiedWords,
              books: legacy,
            },
            correctionsAppliedInFinalReview: [
              'Deuteronom 22 — corectare ebraică în explicație, limite juridice antice și protecția victimei.',
              'Deuteronom 22:11 — corectare română în textul canonic și digest recalculat.',
              'Numeri 31 — explicație reclasificată textual-overview, violența/captivii redați fără aplicare modernă și calculul 1/50 vs 1/500 corectat.',
              'Numeri 31:3,28,37-41 — corectări românești/lexicale în textul canonic și digest recalculat.',
              'Validatorul VT — truth-guard textual acceptă ambele formulări aprobate și numără dinamic stadiile BE/provizoriu.'
            ],
          }
          fs.writeFileSync('docs/biblia-explicata/VT-FINAL-CONTENT-AUDIT.json', JSON.stringify(report, null, 2) + '\n')

          const md = `# VT — review final de conținut (traducere + doctrină)\n\n` +
            `Data: 2026-08-08\n\n` +
            `## Verdict\n\n**NU este încă aprobat pentru publicare integrală.** Acoperirea explicațiilor rămâne 39/39, dar review-ul final a găsit două clase de blocaje reale: traducerea canonică actuală nu conține încă toate cele 39 de cărți VT, iar cele 10 cărți legacy nu au proveniența doctrinară clasificată uniform la nivel de unitate.\n\n` +
            `## Traducere\n\n- Canon OT așteptat: 39 cărți / 929 capitole.\n- În manifestul canonic curent: **${canonicalOt.filter((b)=>b.complete).length}/39 cărți complete, ${canonicalOtChapters}/929 capitole**.\n- Reader overlay după această corecție: **${overlayBe.length} carte/cărți Biblia Emanus canonică** și **${overlayTemp.length} texte de lucru provizorii**.\n- Judecători–Daniel rămân disponibile ca text de lucru din candidatul istoric, dar nu mai sunt etichetate Biblia Emanus finală înainte de fresh re-audit.\n\n` +
            `## Doctrină\n\n- Acoperire explicativă: 39/39 cărți.\n- 29 de overlay-uri folosesc truth-guard Poonen/CFC vs textual-overview.\n- Legacy: **${legacy.length} cărți, ${totalUnits} unități**.\n- Fără explanationKind: **${missingKind}**. Fără explanationSource: **${missingSource}**.\n- Aplicații pastorale aflate în unități încă neclasificate: **${unclassifiedApplications}**.\n- Note lexicale aflate în unități încă neclasificate: **${unclassifiedWords}**.\n\n` +
            `Aceste numere nu afirmă că toate acele unități sunt doctrinar greșite; afirmă că proveniența lor nu este încă demonstrată conform regulii actuale: Poonen/CFC pentru doctrină și aplicație, iar în goluri doar overview textual.\n\n` +
            `## Corecții făcute în review\n\n- Deuteronom 22: ebraică și explicație sensibilă la abuz corectate; v.11 română corectată în corpus și digest actualizat.\n- Numeri 31: explicația refăcută ca overview textual, fără justificare modernă a violenței; eroarea 1/50 vs 1/500 corectată; v.3 și termenul ebraic *mekhes* din v.28,37–41 corectate în traducere și digest actualizat.\n- Validatorul runtime nu mai depinde de un raport înghețat BE/provizoriu și acceptă ambele truth-guard-uri editoriale aprobate.\n\n` +
            `## Condiții pentru verdict verde\n\n1. Fresh re-audit și promovare în manifestul canonic curent pentru toate cele 39 de cărți VT.\n2. Reconcilierea driftului sursei WLC înainte de orice promovare nouă.\n3. Clasificarea celor 10 cărți legacy la nivel de unitate: sursă + exposition/textual-overview; eliminarea aplicațiilor/lexicului din golurile fără sursă doctrinară.\n4. Rerularea validatorului complet, a verificării VT publication și a build-ului după aceste remedieri.\n`
          fs.writeFileSync('docs/biblia-explicata/VT-FINAL-CONTENT-REVIEW.md', md)
          console.log(JSON.stringify(report, null, 2))
          NODE

      - name: Commit final review evidence and self-clean
        run: |
          git rm .github/workflows/finalize-vt-content-review-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/materialize-vt-overlay-texts.py packages/shared/src/bible/generated/vtCanonicalText docs/biblia-explicata/VT-FINAL-CONTENT-AUDIT.json docs/biblia-explicata/VT-FINAL-CONTENT-REVIEW.md
          git commit -m 'Record final VT translation and doctrine review'
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
