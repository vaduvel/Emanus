name: Temporary clean Exodus generators

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-clean-exodus-generators.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Remove temporary and one-off generators
        run: |
          git rm -f \
            scripts/build_exo.py \
            scripts/build_wave_installer.py \
            scripts/build_waves_base.py \
            scripts/create_exo_waves.py \
            scripts/exo_translator.py \
            scripts/gen_wave_range.py \
            scripts/generate_all_waves.py \
            scripts/generate_wave_range.py \
            scripts/make_publisher.py \
            scripts/make_ro_publisher.py \
            scripts/run_w2.py \
            .github/workflows/tmp-clean-exodus-generators.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Exodus generation artifacts"
          git push origin HEAD:agent/biblia-emanus-exodul
