name: Finalize Mark Source Review Once

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
    paths:
      - .github/workflows/finalize-mark-source-review-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Permanently sanitize Mark 16 review source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/review-nt-poonen-fidelity-marcu-14-16.mjs')
          source = path.read_text(encoding='utf-8')
          replacements = {
              '`textualStatus: double-bracketed`': '«textualStatus: double-bracketed»',
              '`double-bracketed`': '«double-bracketed»',
              'Poonen expune versetele 9–20': 'Expunerea tratează versetele 9–20',
              'Poonen leagă alungarea demonilor': 'Expunerea leagă alungarea demonilor',
          }
          for before, after in replacements.items():
              source = source.replace(before, after)
          forbidden = ['Poonen expune', 'Poonen leagă', '`textualStatus: double-bracketed`', '`double-bracketed`']
          remaining = [item for item in forbidden if item in source]
          if remaining:
              raise SystemExit(f'Unsafe Mark review source fragments remain: {remaining}')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Reapply final Mark transcript reviews
        run: |
          set -euo pipefail
          node scripts/review-nt-poonen-fidelity-marcu-13.mjs
          node scripts/review-nt-poonen-fidelity-marcu-14-16.mjs

      - name: Materialize final NT corpus and quote fixes
        run: |
          set -euo pipefail
          node scripts/materialize-nt-final-source-first.mjs
          node scripts/fix-nt-embedded-bible-quotes.mjs
          node scripts/apply-nt-reviewed-be-quote-fixes.mjs

      - name: Verify Mark review and final NT structure
        id: verify_structure
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-nt-final-source-first.mjs 2>&1 | tee /tmp/structure.log

      - name: Verify doctrine fidelity
        id: verify_doctrine
        if: steps.verify_structure.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-nt-poonen-doctrine.mjs 2>&1 | tee /tmp/doctrine.log

      - name: Run editorial audits
        id: audits
        if: steps.verify_structure.outcome == 'success' && steps.verify_doctrine.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node scripts/audit-nt-thin-units.mjs
            node scripts/audit-nt-editorial-traceability.mjs
            node scripts/analyze-nt-embedded-quote-candidates.mjs
            node scripts/summarize-nt-embedded-quote-candidates.mjs
            node scripts/audit-nt-embedded-bible-quotes.mjs
            node scripts/audit-nt-romanian-language.mjs
            node scripts/materialize-nt-lexicon-source-evidence.mjs
            node scripts/summarize-nt-lexicon-source-evidence.mjs
            node scripts/audit-nt-lexicon.mjs
            node scripts/materialize-nt-canonical-binding.mjs
            node scripts/check-nt-publication-readiness.mjs
          } 2>&1 | tee /tmp/audits.log

      - name: Write auditable Mark review status
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const path = require('node:path')
          const markPath = 'docs/data/biblia-explicata/nt-reviewed-recovered/02-marcu.json'
          const blockerPath = 'docs/data/biblia-explicata/nt-publication-blockers.json'
          const mark = JSON.parse(fs.readFileSync(markPath, 'utf8'))
          const chapters = mark.chapters || []
          const units = chapters.flatMap((chapter) => chapter.units || [])
          const reviewed = units.filter((unit) => unit.sourceFidelity?.reviewState === 'reviewed-against-raw-transcript')
          const sourceCommit = 'fe97a4dee2849aaf4573a1046397b5194a171b4e'
          const badProvenance = reviewed.filter((unit) => !Array.isArray(unit.sourceFidelity?.primarySources) || !unit.sourceFidelity.primarySources.length || unit.sourceFidelity.primarySources.some((source) => source.commitSha !== sourceCommit || !source.path || !source.blobSha))
          const readerStrings = []
          for (const chapter of chapters) {
            readerStrings.push(chapter.title, chapter.summary, chapter.literaryContext, chapter.historicalContext, chapter.prayer)
            for (const unit of chapter.units || []) {
              readerStrings.push(unit.heading, unit.teaching, unit.forYourHeart)
              for (const word of unit.words || []) readerStrings.push(word.meaning)
            }
          }
          const readerText = readerStrings.filter((value) => typeof value === 'string').join('\n')
          const forbiddenReaderMatches = [...readerText.matchAll(/\b(?:Poonen|CFC|SermonIndex|RCCV)\b/giu)].map((match) => match[0])
          const structureStatus = '${{ steps.verify_structure.outcome }}'
          const doctrineStatus = '${{ steps.verify_doctrine.outcome }}'
          const auditsStatus = '${{ steps.audits.outcome }}'
          const blockers = fs.existsSync(blockerPath) ? JSON.parse(fs.readFileSync(blockerPath, 'utf8')) : null
          const status = structureStatus === 'success' && doctrineStatus === 'success' && auditsStatus === 'success' && chapters.length === 16 && reviewed.length === units.length && badProvenance.length === 0 && forbiddenReaderMatches.length === 0 ? 'clean' : 'blocked'
          const tail = (file) => fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trim().split(/\r?\n/).slice(-30) : []
          const report = {
            schema: 'emanus-mark-raw-transcript-review-status-v1',
            status,
            book: 'Marcu',
            chapters: chapters.length,
            units: units.length,
            rawTranscriptReviewedUnits: reviewed.length,
            sourceCommit,
            badProvenance: badProvenance.length,
            forbiddenReaderSourceAttributions: forbiddenReaderMatches.length,
            validation: {
              finalStructure: structureStatus,
              doctrine: doctrineStatus,
              auditsAndReadiness: auditsStatus,
            },
            publication: blockers ? {
              status: blockers.status,
              blockerClasses: blockers.counts?.blockerClasses,
              embeddedQuoteFindings: blockers.counts?.embeddedQuoteFindings,
              romanianLanguageFindings: blockers.counts?.romanianLanguageFindings,
              lexiconFindings: blockers.counts?.lexiconFindings,
              canonicalTextBlocker: (blockers.blockers || []).some((item) => item.id === 'canonical-text-not-final'),
            } : null,
            diagnostics: status === 'clean' ? [] : {
              structure: tail('/tmp/structure.log'),
              doctrine: tail('/tmp/doctrine.log'),
              audits: tail('/tmp/audits.log'),
            },
            markSha256: crypto.createHash('sha256').update(fs.readFileSync(markPath)).digest('hex'),
          }
          fs.writeFileSync('docs/data/biblia-explicata/mark-raw-transcript-review-status.json', JSON.stringify(report, null, 2) + '\n')
          console.log(JSON.stringify(report, null, 2))
          NODE

      - name: Commit verification outputs and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-mark-source-review-once.yml
          git add scripts/review-nt-poonen-fidelity-marcu-14-16.mjs
          git add docs/data/biblia-explicata
          git commit -m "Finalize Mark raw transcript source review"
          for attempt in 1 2 3; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            git rebase FETCH_HEAD
            if git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then
              exit 0
            fi
          done
          exit 1
