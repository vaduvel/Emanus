name: Finalize 2 Corinteni

on:
  pull_request:
    branches:
      - agent/1-corinteni
    types:
      - reopened
    paths:
      - .github/workflows/finalize-2-corinteni.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/2-corinteni

      - name: Apply final 2 Corinthians payload
        run: |
          cat .github/payload-2-corinteni/part* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.xz
          tar -xJf /tmp/payload.tar.xz -C .
          python3 apply.py
          rm -f apply.py
          rm -rf .github/payload-2-corinteni
          rm -f .github/workflows/research-2-corinteni.yml
          rm -f .github/workflows/finalize-2-corinteni.yml

      - name: Commit final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(bible): add 2 Corinteni 1-13"
          git push origin HEAD:agent/2-corinteni
