name: Publish Genesis 25-29

on:
  push:
    branches:
      - agent/biblia-emanus
    paths:
      - .github/workflows/publish-genesis-25-29.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited chapter metadata and decisions
        run: |
          python scripts/publish-genesis-25-29.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/data/biblia-emanus/GEN.27.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for verse in data['verses']:
              if verse['number'] == 42:
                  verse['text'] = 'Rebecăi i-au fost spuse cuvintele fiului ei cel mare, Esau. Ea a trimis să-l cheme pe fiul ei cel mic, Iacov, și i-a spus: „Iată, fratele tău Esau își găsește mângâierea în gândul că te va ucide.”'
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Commit published wave
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/biblia-emanus/GEN.25.json docs/data/biblia-emanus/GEN.26.json docs/data/biblia-emanus/GEN.27.json docs/data/biblia-emanus/GEN.28.json docs/data/biblia-emanus/GEN.29.json docs/data/biblia-emanus/manifest.json
          git commit -m 'Audit and publish Genesis 25-29'
          git push origin HEAD:agent/biblia-emanus
