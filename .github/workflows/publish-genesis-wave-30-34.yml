name: Publish Genesis 30-34

on:
  push:
    branches:
      - agent/biblia-emanus
    paths:
      - scripts/publish-genesis-wave-30-34.py
      - .github/workflows/publish-genesis-wave-30-34.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit and publish Genesis 30-34
        run: python scripts/publish-genesis-wave-30-34.py
      - name: Commit audited chapters
        run: |
          if git diff --quiet; then
            echo "No publication changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus/GEN.30.json docs/data/biblia-emanus/GEN.31.json docs/data/biblia-emanus/GEN.32.json docs/data/biblia-emanus/GEN.33.json docs/data/biblia-emanus/GEN.34.json docs/data/biblia-emanus/manifest.json
          git commit -m "Audit and publish Genesis 30-34"
          git push origin HEAD:agent/biblia-emanus
