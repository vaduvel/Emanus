name: Bootstrap Joshua 1-5

on:
  push:
    branches:
      - agent/biblia-emanus-iosua

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-iosua
          fetch-depth: 0
      - name: Apply audited Joshua wave
        env:
          PAYLOAD: 
        run: |
          python3 - <<'PY'
          import base64, os, zlib
          source = zlib.decompress(base64.b64decode(os.environ["PAYLOAD"])).decode("utf-8")
          namespace = {"__name__": "__main__", "__file__": "scripts/bootstrap-joshua-wave-1-5.py"}
          exec(compile(source, namespace["__file__"], "exec"), namespace)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/bootstrap-joshua-wave-1-5.yml
      - name: Commit audited Joshua wave
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-biblia-emanus.py docs/data/biblia-emanus .github/workflows/bootstrap-joshua-wave-1-5.yml
          git diff --cached --quiet && exit 0
          git commit -m "Audit and publish Joshua 1-5"
          git push origin HEAD:agent/biblia-emanus-iosua
