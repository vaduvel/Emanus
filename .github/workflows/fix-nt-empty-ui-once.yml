name: Fix NT Empty UI Sections Once

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
    paths:
      - .github/workflows/fix-nt-empty-ui-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true
      - name: Hide absent optional chapter sections
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/screens/Bible.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''    <details className="bctx">\n      <summary>Unde suntem în carte</summary>\n      <p>{found.literaryContext}</p>\n    </details>\n    <details className="bctx">\n      <summary>Cum era pe atunci</summary>\n      <p>{found.historicalContext}</p>\n    </details>\n\n    {found.units.map((u) => <Unit key={u.id} unit={u} />)}\n\n    <div className="bprayer">\n      <p className="today__kicker">Rugăciune</p>\n      {paragraphs(found.prayer).map((p, i) => <p key={i}>{p}</p>)}\n    </div>'''
          new = '''    {found.literaryContext?.trim() && <details className="bctx">\n      <summary>Unde suntem în carte</summary>\n      <p>{found.literaryContext}</p>\n    </details>}\n    {found.historicalContext?.trim() && <details className="bctx">\n      <summary>Cum era pe atunci</summary>\n      <p>{found.historicalContext}</p>\n    </details>}\n\n    {found.units.map((u) => <Unit key={u.id} unit={u} />)}\n\n    {found.prayer?.trim() && <div className="bprayer">\n      <p className="today__kicker">Rugăciune</p>\n      {paragraphs(found.prayer).map((p, i) => <p key={i}>{p}</p>)}\n    </div>}'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected Bible chapter optional-section block not found')
          p.write_text(s, encoding='utf-8')

          audit = Path('scripts/check-nt-ui-optional-sections.mjs')
          audit.write_text('''#!/usr/bin/env node\nimport fs from "node:fs"\nconst s = fs.readFileSync("apps/web/src/screens/Bible.tsx", "utf8")\nconst required = [\n  'found.literaryContext?.trim() && <details className="bctx">',\n  'found.historicalContext?.trim() && <details className="bctx">',\n  'found.prayer?.trim() && <div className="bprayer">',\n  'unit.words && unit.words.length > 0',\n  'unit.crossRefs && unit.crossRefs.length > 0',\n  'unit.forYourHeart && <div className="bheart">',\n]\nconst missing = required.filter((needle) => !s.includes(needle))\nif (missing.length) {\n  console.error(`NT optional UI gate failed: ${missing.join(" | ")}`)\n  process.exit(1)\n}\nconsole.log("NT optional UI gate: empty optional sections are hidden.")\n''', encoding='utf-8')
          PY
          node scripts/check-nt-ui-optional-sections.mjs
      - name: Remove one-shot workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/fix-nt-empty-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/screens/Bible.tsx scripts/check-nt-ui-optional-sections.mjs .github/workflows/fix-nt-empty-ui-once.yml
          git commit -m "Hide empty optional Biblia Explicata sections"
          for attempt in 1 2 3; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            git rebase FETCH_HEAD
            if git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
          done
          exit 1
