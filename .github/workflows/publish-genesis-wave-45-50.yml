name: Publish Genesis 45-50

on:
  push:
    branches:
      - agent/biblia-emanus
    paths:
      - scripts/publish-genesis-wave-45-50.py
      - .github/workflows/publish-genesis-wave-45-50.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit and publish Genesis 45-50
        run: python scripts/publish-genesis-wave-45-50.py
      - name: Commit audited chapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus/GEN.45.json \
                  docs/data/biblia-emanus/GEN.46.json \
                  docs/data/biblia-emanus/GEN.47.json \
                  docs/data/biblia-emanus/GEN.48.json \
                  docs/data/biblia-emanus/GEN.49.json \
                  docs/data/biblia-emanus/GEN.50.json \
                  docs/data/biblia-emanus/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit and publish Genesis 45-50"
          git push origin HEAD:agent/biblia-emanus
