name: VT Naum Canonical Promotion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vt-naum-canonical-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promote-naum:
    if: github.head_ref == 'agent/biblia-explicata-vt-integration-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Fetch legacy BE candidate branch
        run: git fetch origin agent/biblia-emanus-ot-and-apocrypha:refs/remotes/origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Download source and comparison archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/engwebp_current.zip https://ebible.org/Scriptures/engwebp_usfm.zip
          curl --fail --location --retry 3 --output /tmp/hboWLC_current.zip https://ebible.org/Scriptures/hboWLC_usfm.zip
          curl --fail --location --retry 3 --output /tmp/ronbtf_current.zip https://ebible.org/Scriptures/ronbtf_usfm.zip
          curl --fail --location --retry 3 --output /tmp/ron1924_current.zip https://ebible.org/Scriptures/ron1924_usfm.zip

      - name: Prove current Naum source verses equal the reviewed snapshot
        run: |
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import re
          import zipfile
          from pathlib import Path

          root = Path('.')
          code = 'NAM'
          packet_dir = root / 'docs/biblia-explicata/minor-prophets-reaudit/NAM'
          lock_path = root / 'docs/data/biblia-emanus/minor-prophets-source-lock.json'

          spec = importlib.util.spec_from_file_location('validator', root / 'scripts/check-biblia-emanus.py')
          validator = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(validator)

          def find_member(archive, code):
              matches = []
              for member in archive.namelist():
                  base = Path(member).name
                  if not base.lower().endswith(('.usfm', '.sfm')):
                      continue
                  stem = re.sub(r'^\d+[-_]?', '', base)
                  if stem.upper().startswith(code):
                      matches.append(member)
              if len(matches) != 1:
                  raise SystemExit(f'{code}: expected one USFM member, got {matches}')
              return matches[0]

          current = {}
          raw_bytes = {}
          for key, archive_path in [('WEBU', Path('/tmp/engwebp_current.zip')), ('WLC', Path('/tmp/hboWLC_current.zip'))]:
              with zipfile.ZipFile(archive_path) as archive:
                  member = find_member(archive, code)
                  raw = archive.read(member)
              raw_bytes[key] = raw
              current[key] = validator.parse_usfm_verses(raw, f'{code}-{key}-current')

          expected_web = {}
          expected_wlc = {}
          for chapter in range(1, 4):
              packet = json.loads((packet_dir / f'{chapter:02d}.json').read_text(encoding='utf-8'))
              for item in packet['verses']:
                  product_ref = tuple(map(int, str(item['productRef']).split(':')))
                  wlc_ref = tuple(map(int, str(item['WLCRef']).split(':')))
                  expected_web[product_ref] = item['WEBU']
                  expected_wlc[wlc_ref] = item['WLC']

          def compare(label, actual, expected):
              missing = sorted(set(expected) - set(actual))
              extra = sorted(set(actual) - set(expected))
              changed = sorted(ref for ref in set(actual) & set(expected) if actual[ref] != expected[ref])
              if missing or extra or changed:
                  print(f'{label} missing={missing} extra={extra} changed={changed}')
                  for ref in changed[:10]:
                      print(f'{label} {ref}: OLD={expected[ref]!r}')
                      print(f'{label} {ref}: NEW={actual[ref]!r}')
                  raise SystemExit(f'{label}: parsed biblical text changed; fresh semantic re-audit required')
              print(f'{label}: {len(actual)}/{len(expected)} parsed verses identical to reviewed snapshot')

          compare('WEBU', current['WEBU'], expected_web)
          compare('WLC', current['WLC'], expected_wlc)

          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          book = next((item for item in lock['books'] if item.get('bookId') == code), None)
          if not book:
              raise SystemExit('NAM missing from minor-prophets-source-lock.json')
          for label in ('WEBU', 'WLC'):
              old = book[label]['sha256']
              new = hashlib.sha256(raw_bytes[label]).hexdigest()
              book[label]['sha256'] = new
              evidence = book.setdefault('contentDriftEvidence', {})
              evidence[label] = {
                  'verifiedOn': '2026-08-08',
                  'previousRawUsfmSha256': old,
                  'currentRawUsfmSha256': new,
                  'parsedVerseContentIdentical': True,
                  'verseCount': len(current[label]),
              }
              print(f'{label}: raw USFM pin refreshed {old} -> {new} only after parsed-verse identity proof')
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Make authoritative source drift content-based per book
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/promote-minor-prophet-to-biblia-emanus.py')
          text = path.read_text(encoding='utf-8')

          old_gate = '''    # WEBU + WLC are translation authority and stay hard-pinned.\n    # BTF + Cornilescu are comparison-only benchmarks. Archive drift is recorded\n    # in the new snapshot, while their per-book content must still parse and match\n    # product versification below.\n    for key, path in archive_paths.items():\n        actual = sha256_file(path)\n        expected = EXPECTED_ARCHIVE_SHA256[key]\n        if key in {"webu", "wlc"} and actual != expected:\n            fail(f"{key} source archive drift: {actual} != {expected}")\n        if key in {"btf", "cornilescu"} and actual != expected:\n            print(f"{key} comparison benchmark archive drift: {actual} != {expected}; recapturing current benchmark")\n'''
          new_gate = '''    # Whole-ZIP hashes are evidence about upstream packaging, not the identity\n    # of this biblical book. WEBU/WLC authority is enforced below by the exact\n    # per-book USFM hashes from the fresh source lock. Benchmark ZIP drift is\n    # comparison-only and is recaptured in the deterministic promotion snapshot.\n    for key, path in archive_paths.items():\n        actual = sha256_file(path)\n        expected = EXPECTED_ARCHIVE_SHA256[key]\n        if actual != expected:\n            role = "source archive packaging" if key in {"webu", "wlc"} else "comparison benchmark archive"\n            print(f"{key} {role} drift: {actual} != {expected}; verifying/recapturing per-book payload")\n'''
          if old_gate not in text:
              raise SystemExit('Expected archive gate not found')
          text = text.replace(old_gate, new_gate, 1)

          old_after_extract = '''        extracted[key] = raw\n        parsed[key] = validator.parse_usfm_verses(raw, f"{code}-{key}")\n\n    target_refs = sorted(parsed["webu"])\n'''
          new_after_extract = '''        extracted[key] = raw\n        parsed[key] = validator.parse_usfm_verses(raw, f"{code}-{key}")\n\n    fresh_lock = load_json(DATA / "minor-prophets-source-lock.json")\n    fresh_book = next(\n        (item for item in fresh_lock.get("books", []) if isinstance(item, dict) and item.get("bookId") == code),\n        None,\n    )\n    if not isinstance(fresh_book, dict):\n        fail(f"{code}: lipsește din minor-prophets-source-lock.json")\n    for key, label in (("webu", "WEBU"), ("wlc", "WLC")):\n        expected_payload = (fresh_book.get(label) or {}).get("sha256")\n        actual_payload = sha256_bytes(extracted[key])\n        if not isinstance(expected_payload, str) or actual_payload != expected_payload:\n            fail(\n                f"{code}: {label} source content drift: {actual_payload} != {expected_payload}; "\n                "fresh re-audit required before promotion"\n            )\n        print(f"{code}: {label} per-book USFM matches fresh source lock ({actual_payload})")\n\n    target_refs = sorted(parsed["webu"])\n'''
          if old_after_extract not in text:
              raise SystemExit('Expected extraction block not found')
          path.write_text(text.replace(old_after_extract, new_after_extract, 1), encoding='utf-8')
          PY

      - name: Materialize Naum from fresh semantic review
        run: |
          python3 scripts/promote-minor-prophet-to-biblia-emanus.py \
            --book NAM \
            --webu-zip /tmp/engwebp_current.zip \
            --wlc-zip /tmp/hboWLC_current.zip \
            --btf-zip /tmp/ronbtf_current.zip \
            --cornilescu-zip /tmp/ron1924_current.zip

      - name: Validate canonical Naum publication gate
        run: python3 scripts/check-biblia-emanus-book.py --book NAM

      - name: Verify Naum seal eligibility
        run: python3 scripts/seal-biblia-emanus.py --book NAM --check

      - name: Materialize VT catalog with promoted Naum
        run: python3 scripts/materialize-vt-overlay-texts.py --source-ref origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Validate full Biblia Emanus corpus
        run: python3 scripts/check-biblia-emanus-corpus.py

      - name: Validate VT reader integration
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile
          pnpm check:vt-publication

      - name: Commit canonical Naum only after all gates pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/promote-minor-prophet-to-biblia-emanus.py \
            docs/data/biblia-emanus/minor-prophets-source-lock.json \
            docs/data/biblia-emanus/sources/ot-nam-2026-08-08-usfm.zip \
            docs/data/biblia-emanus/source-lock.json \
            docs/data/biblia-emanus/source-ledger.json \
            docs/data/biblia-emanus/manifest.json \
            docs/data/biblia-emanus/NAM.*.json \
            docs/biblia-explicata/minor-prophets-reaudit/NAM-SEMANTIC-REVIEW-SUMMARY.json \
            packages/shared/src/bible/generated/vtCanonicalText
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(bible): materialize canonical Naum"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
