name: Export Hebrews Transcripts

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref == 'agent/biblia-explicata-nt-integration-clean'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 1

      - name: Export exact semantic transcript representations
        run: |
          set -euo pipefail
          mkdir -p /tmp/evrei-transcripts
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('.').resolve()
          worker_path = root / 'scripts/nt_semantic_copilot_worker.py'
          spec = importlib.util.spec_from_file_location('emanus_semantic_export', worker_path)
          if spec is None or spec.loader is None:
              raise SystemExit('Cannot load semantic worker extractor')
          worker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worker)

          sources = [
              ('01-hebrews-1-1-to-3-8.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch11-38/'),
              ('02-hebrews-3-7-to-4-11.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch37-411/'),
              ('03-hebrews-4-11-to-5-6.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch411-56/'),
              ('04-hebrews-5-7-to-6-15.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch57-615/'),
              ('05-hebrews-6-16-to-8-9.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch616-89/'),
              ('06-hebrews-8-10-to-10-18.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch810-1018/'),
              ('07-hebrews-10-19-to-10-39.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch1019-39/'),
              ('08-hebrews-11-1-to-11-22.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch111-22/'),
              ('09-hebrews-11-23-to-12-4.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch1123-124/'),
              ('10-hebrews-12-5-to-13-25.txt', 'https://sermonindex.net/speakers/zac-poonen/hebrews-ch125-1325/'),
          ]
          out = Path('/tmp/evrei-transcripts')
          meta = []
          for name, url in sources:
              text = worker.extract_transcript(url)
              sha = worker.sha256(text)
              (out / name).write_text(text + '\n', encoding='utf-8')
              meta.append({'file': name, 'url': url, 'sha256': sha, 'words': len(text.split())})
              print(name, sha, len(text.split()))
          (out / 'manifest.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          PY
          cp docs/data/biblia-explicata/nt-final-source-first/19-evrei.json /tmp/evrei-transcripts/19-evrei.json
          cp docs/data/biblia-explicata/nt-direct-transcript-coverage.json /tmp/evrei-transcripts/nt-direct-transcript-coverage.json

      - uses: actions/upload-artifact@v4
        with:
          name: evrei-full-transcripts
          path: /tmp/evrei-transcripts
          if-no-files-found: error
          retention-days: 1

  transcribe_1_timotei:
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        source_id:
          - 1-timotei-vbv-01
          - 1-timotei-vbv-02
          - 1-timotei-vbv-03
          - 1-timotei-vbv-04
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 1

      - name: Transcribe one official CFC VBV episode
        env:
          NT_TRANSCRIPTION_SOURCE_ID: ${{ matrix.source_id }}
        run: |
          set -euo pipefail
          test "$(node -p \"require('./docs/data/biblia-explicata/nt-semantic-manual-review-status.json').currentBook\")" = "1-timotei"
          python3 scripts/transcribe_nt_current_official_audio.py
          test -s "docs/data/biblia-explicata/nt-official-transcripts/${NT_TRANSCRIPTION_SOURCE_ID}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.source_id }}
          path: docs/data/biblia-explicata/nt-official-transcripts/${{ matrix.source_id }}.json
          if-no-files-found: error
          retention-days: 1

  persist_1_timotei:
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]'
    needs: transcribe_1_timotei
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          pattern: transcript-1-timotei-vbv-*
          path: /tmp/1-timotei-transcripts
          merge-multiple: true

      - name: Persist exact four-part transcript set
        run: |
          set -euo pipefail
          target="docs/data/biblia-explicata/nt-official-transcripts"
          mkdir -p "$target"
          for id in 01 02 03 04; do
            src="/tmp/1-timotei-transcripts/1-timotei-vbv-${id}.json"
            test -s "$src"
            cp "$src" "$target/1-timotei-vbv-${id}.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs/data/biblia-explicata/nt-official-transcripts')
          expected = {
              '1-timotei-vbv-01': '1 Timothy 1:1-2:9',
              '1-timotei-vbv-02': '1 Timothy 2:8-4:2',
              '1-timotei-vbv-03': '1 Timothy 4:3-5:13',
              '1-timotei-vbv-04': '1 Timothy 5:11-6:21',
          }
          for source_id, source_range in expected.items():
              p = root / f'{source_id}.json'
              d = json.loads(p.read_text(encoding='utf-8'))
              assert d['schema'] == 'emanus-nt-official-audio-transcript-v1'
              assert d['bookId'] == '1-timotei'
              assert d['sourceId'] == source_id
              assert d['sourceRange'] == source_range
              assert d['transcriptionModel'] == 'faster-whisper small.en / CTranslate2 int8 CPU'
              assert d['wordCount'] >= 1500
              assert len(d['segments']) == d['segmentCount']
              assert d['transcriptSha256'].startswith('sha256:')
              assert d['officialAudioSha256'].startswith('sha256:')
              print(source_id, d['wordCount'], d['transcriptSha256'], d['officialAudioSha256'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-explicata/nt-official-transcripts/1-timotei-vbv-*.json
          if git diff --cached --quiet; then
            echo "1 Timotei transcript set already persisted."
            exit 0
          fi
          git commit -m "Persist 1 Timotei official VBV transcripts"
          git push origin HEAD:agent/biblia-explicata-nt-integration-clean
