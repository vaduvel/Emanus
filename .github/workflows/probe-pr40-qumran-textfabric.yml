name: Probe Qumran Text-Fabric extraction

on:
  push:
    branches:
      - agent/biblia-emanus-pr40-final
    paths:
      - 'scripts/probe-pr40-qumran-textfabric.py'
      - '.github/workflows/probe-pr40-qumran-textfabric.yml'
  pull_request:
    paths:
      - 'scripts/probe-pr40-qumran-textfabric.py'
      - '.github/workflows/probe-pr40-qumran-textfabric.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr40-final-qumran-probe-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Text-Fabric
        run: pip install --disable-pip-version-check 'text-fabric>=12,<14'
      - name: Probe exact manuscript extraction
        run: python3 scripts/probe-pr40-qumran-textfabric.py
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-final-qumran-textfabric-probe
          path: docs/biblia-emanus/PR40-QUMRAN-TEXTFABRIC-PROBE.json
          if-no-files-found: warn
          retention-days: 7
