name: Probe Qumran Text-Fabric extraction

on:
  push:
    branches:
      - agent/biblia-emanus-all-pr40-rebuild
    paths:
      - 'scripts/probe-pr40-qumran-textfabric.py'
      - '.github/workflows/probe-pr40-qumran-textfabric.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr40-qumran-textfabric-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-all-pr40-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Text-Fabric
        run: pip install --disable-pip-version-check 'text-fabric>=12,<14'
      - name: Probe exact manuscript extraction
        run: python3 scripts/probe-pr40-qumran-textfabric.py
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-qumran-textfabric-probe
          path: docs/biblia-emanus/PR40-QUMRAN-TEXTFABRIC-PROBE.json
          if-no-files-found: warn
          retention-days: 7
      - name: Persist successful probe
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/PR40-QUMRAN-TEXTFABRIC-PROBE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(bible): persist reproducible Qumran extraction probe'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/biblia-emanus-all-pr40-rebuild
            if git push origin HEAD:agent/biblia-emanus-all-pr40-rebuild; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
