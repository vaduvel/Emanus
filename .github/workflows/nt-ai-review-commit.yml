name: NT AI Review Commit

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  event-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirm pull request synchronize trigger
        run: echo 'nt-ai-review-synchronize-ok'
