name: NT AI Review Commit

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: read
  models: read

jobs:
  model-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Probe GPT-5 through GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {
            "model": "openai/gpt-5",
            "messages": [
              {
                "role": "user",
                "content": "Return exactly the JSON object {\"ok\":true,\"task\":\"nt-review\"} and nothing else."
              }
            ]
          }
          JSON
          curl --fail-with-body --silent --show-error \
            "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            --data-binary @/tmp/request.json \
            | tee /tmp/response.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/response.json', encoding='utf-8'))
          text = data['choices'][0]['message']['content']
          print('\nMODEL_CONTENT=' + text)
          assert 'nt-review' in text
          PY
