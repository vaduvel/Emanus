name: NT AI Review Commit

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  php-source-dump:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Verify and print pinned Philippians source bundle
        run: |
          set -euo pipefail
          ZIP=docs/data/biblia-emanus/sources/nt-sblgnt-1.2.zip
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "29b8762199eb87757ec36961097b817cb2b569557d95348a70fac66c0262f424"
          unzip -t "$ZIP" >/dev/null
          for entry in \
            sblgnt/text/PHP.txt \
            sblgnt/apparatus/text/PHP.txt \
            tr/PHP.usfm \
            webp/PHP.usfm \
            btf/PHP.usfm \
            cornilescu1924/PHP.usfm \
            biblia-libera/PHP.usfm
          do
            echo "===== BEGIN $entry ====="
            unzip -p "$ZIP" "$entry"
            echo
            echo "===== END $entry ====="
          done
