name: NT AI Review Commit

on:
  pull_request:
    types: [edited]
    branches:
      - main

permissions:
  contents: write

jobs:
  php1-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0

      - name: Verify pinned PHP sources
        run: |
          set -euo pipefail
          ZIP=docs/data/biblia-emanus/sources/nt-sblgnt-1.2.zip
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "29b8762199eb87757ec36961097b817cb2b569557d95348a70fac66c0262f424"
          unzip -t "$ZIP" >/dev/null

      - name: Materialize the already validated PHP 1 batch
        run: python3 .github/nt-ai-review/php1.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Re-run all required post-batch gates
        run: |
          set -euo pipefail
          pnpm check:biblia-emanus
          python3 scripts/check-biblia-emanus-romanian-quality.py
          pnpm check:biblia-emanus-nt-withheld
          python3 scripts/withhold-biblia-emanus-nt.py --check
          pnpm check:biblia-emanus-nt-runtime
          pnpm test:biblia-emanus
          git diff --check

      - name: Commit only chapter and journal
        run: |
          set -euo pipefail
          CHAPTER=docs/data/biblia-emanus/PHP.1.json
          JOURNAL=docs/biblia-emanus/NT-AI-REVIEW-BATCH-2026-08-07-PHP.1.md
          if git diff --quiet -- "$CHAPTER" && git diff --quiet -- "$JOURNAL"; then
            echo 'Validated PHP.1 batch is already committed.'
            exit 0
          fi
          git add "$CHAPTER" "$JOURNAL"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = "$JOURNAL"
          test "${staged[1]}" = "$CHAPTER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(biblia): review Philippians 1 against SBLGNT'
          git push origin HEAD:codex/nt-ai-review-handoff
