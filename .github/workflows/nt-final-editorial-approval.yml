name: NT Final Editorial Approval

# Canonical final-review workflow. Kept manual so evidence commits cannot recursively
# trigger new editorial runs. The temporary main-branch trigger is used only while
# validating the pipeline and will be removed afterwards.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Review mode
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - full

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: nt-final-editorial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    if: inputs.mode == 'pilot'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Review MAT.1 with Copilot auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NT_FINAL_COPILOT_MODEL: auto
          NT_FINAL_CHUNK_SIZE: '5'
          NT_FINAL_CHUNK_ATTEMPTS: '4'
        run: |
          set -euo pipefail
          python3 scripts/nt_final_editorial_copilot_chunked_runner.py \
            --book MAT \
            --chapter 1 \
            --consulted-on "$(date -u +%F)" \
            --output /tmp/MAT.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/MAT.json', encoding='utf-8'))
          assert data['book'] == 'MAT'
          assert len(data['verses']) == 25
          assert data['verses'][0]['reference'] == 'MAT.1.1'
          assert data['verses'][-1]['reference'] == 'MAT.1.25'
          print('[pilot] MAT.1 evidence:', len(data['verses']))
          PY
      - name: Upload pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: nt-final-pilot-mat1
          path: /tmp/MAT.json
          retention-days: 1

  review-book:
    if: inputs.mode == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        book:
          - MAT
          - MRK
          - LUK
          - JHN
          - ACT
          - ROM
          - 1CO
          - 2CO
          - GAL
          - EPH
          - PHP
          - COL
          - 1TH
          - 2TH
          - 1TI
          - 2TI
          - TIT
          - PHM
          - HEB
          - JAS
          - 1PE
          - 2PE
          - 1JN
          - 2JN
          - 3JN
          - JUD
          - REV
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Review ${{ matrix.book }} verse by verse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NT_FINAL_COPILOT_MODEL: auto
          NT_FINAL_CHUNK_SIZE: '5'
          NT_FINAL_CHUNK_ATTEMPTS: '4'
        run: |
          set -euo pipefail
          python3 scripts/nt_final_editorial_copilot_chunked_runner.py \
            --book "${{ matrix.book }}" \
            --consulted-on "$(date -u +%F)" \
            --output "/tmp/${{ matrix.book }}.json"
      - name: Upload ${{ matrix.book }} evidence
        uses: actions/upload-artifact@v4
        with:
          name: nt-evidence-${{ matrix.book }}
          path: /tmp/${{ matrix.book }}.json
          retention-days: 1

  aggregate:
    if: inputs.mode == 'full'
    needs: review-book
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Download all book evidence
        uses: actions/download-artifact@v4
        with:
          pattern: nt-evidence-*
          path: /tmp/nt-evidence
          merge-multiple: true
      - name: Build canonical approval register
        run: |
          set -euo pipefail
          python3 scripts/nt_final_editorial_aggregate.py \
            --evidence-dir /tmp/nt-evidence \
            --approved-on "$(date -u +%F)" \
            --run-id "github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --reviewer-system "GitHub Copilot CLI auto"
      - name: Rebuild non-approving review queue
        run: |
          set -euo pipefail
          python3 scripts/build-nt-editorial-review-queue.py
          python3 scripts/build-nt-editorial-review-queue.py --check
      - name: Run final NT editorial gates
        run: |
          set -euo pipefail
          python3 scripts/check-biblia-emanus-nt-editorial.py
          python3 scripts/check-biblia-emanus-romanian-quality.py
          python3 scripts/check-biblia-emanus.py
          python3 -m unittest scripts/test_nt_editorial_gate.py
          git diff --check
      - name: Commit final approval evidence only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/biblia-emanus/NT-EDITORIAL-APPROVAL.json \
                  docs/biblia-emanus/NT-EDITORIAL-REVIEW-QUEUE.json
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m 'docs(biblia): add canonical NT editorial approval evidence'
          git push origin HEAD:codex/nt-ai-review-handoff
