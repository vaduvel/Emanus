name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout with native git
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Select semantic-audit Python
        run: |
          set -euo pipefail
          python --version
          echo 'PYTHON_BIN=python' >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify repository and Biblia Emanus
        run: |
          set -euo pipefail
          pnpm check:quotes
          pnpm check:typos
          pnpm check:content
          pnpm check:bible-publication
          "$PYTHON_BIN" scripts/check-biblia-emanus-romanian-quality.py
          pnpm check:biblia-emanus-nt-editorial
          pnpm check:biblia-emanus-nt-materialized
          pnpm check:biblia-emanus
          pnpm check:biblia-emanus-nt-runtime
          pnpm test:biblia-emanus
          pnpm check:biblia-emanus-versification
          pnpm seal:biblia-emanus --check
      - name: Verify Old Testament repair candidates when present
        run: |
          set -euo pipefail
          if [ ! -f docs/data/biblia-emanus-candidates/manifest.json ]; then
            echo 'No OT repair candidate manifest; semantic candidate gate skipped.'
            exit 0
          fi
          "$PYTHON_BIN" scripts/apply-pr40-canonical-content-fixes.py
          "$PYTHON_BIN" scripts/apply-pr40-canonical-content-fixes-wave2.py
          "$PYTHON_BIN" scripts/apply-pr40-canonical-content-fixes-wave3.py
          "$PYTHON_BIN" scripts/apply-pr40-canonical-content-fixes-wave4.py
          "$PYTHON_BIN" scripts/audit-ot-repair5-v2.py
          "$PYTHON_BIN" scripts/enforce-ot-repair5-audit.py
          AUDIT_VENV="$(mktemp -d)"
          "$PYTHON_BIN" -m venv "$AUDIT_VENV"
          AUDIT_PYTHON="$AUDIT_VENV/bin/python"
          # Keep the semantic audit separate from the runner Python. The lock
          # contains the CPU-only torch wheel and hashes for every package.
          "$AUDIT_PYTHON" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --requirement .github/requirements/semantic-audit-cpu.txt
          "$AUDIT_PYTHON" -m pip check
          "$AUDIT_PYTHON" - <<'PY'
          import importlib.util
          import sentence_transformers
          import torch

          assert torch.__version__ == "2.4.1+cpu", torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert not torch.backends.cuda.is_built()
          assert importlib.util.find_spec("nvidia") is None
          print(f"Semantic audit runtime: torch {torch.__version__} (CPU only)")
          PY
          # Pin the embedding model revision as well as its Python runtime.
          "$AUDIT_PYTHON" scripts/run-with-pinned-hf.py scripts/semantic-audit-ot-repair5-v2.py --batch-size 128
          "$PYTHON_BIN" scripts/enforce-ot-repair5-semantic.py
      - name: Typecheck and build
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm build
          git diff --check
