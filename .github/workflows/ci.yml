name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-ot-audit2
          fetch-depth: 0

      - name: Fetch validated source branches
        run: |
          git fetch origin agent/biblia-emanus-exodul:refs/remotes/origin/agent/biblia-emanus-exodul
          git fetch origin agent/biblia-emanus-leviticul:refs/remotes/origin/agent/biblia-emanus-leviticul
          git fetch origin agent/biblia-emanus-numeri:refs/remotes/origin/agent/biblia-emanus-numeri
          git fetch origin agent/biblia-emanus-deuteronomul:refs/remotes/origin/agent/biblia-emanus-deuteronomul
          git fetch origin codex/biblia-emanus-editorial-gate:refs/remotes/origin/codex/biblia-emanus-editorial-gate

      - name: Build unified Biblia Emanus 2.0 snapshot
        run: |
          python3 scripts/patch-audit2-integration.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/upgrade-ot-audit2.py')
          text = path.read_text(encoding='utf-8')
          old = 'with urllib.request.urlopen(url, timeout=120) as response:\n        raw = response.read()'
          new = 'request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 Biblia-Emanus-Audit/2.0"})\n    with urllib.request.urlopen(request, timeout=120) as response:\n        raw = response.read()'
          if old not in text:
              raise SystemExit('download patch target missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 scripts/upgrade-ot-audit2.py
          python3 scripts/patch-validator-audit2.py

      - name: Diagnose all deterministic audit failures
        run: python3 scripts/diagnose-audit2.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verifica ghilimelele
        run: pnpm check:quotes

      - name: Verifica typo-urile cunoscute
        run: pnpm check:typos

      - name: Verifica siguranta continutului
        run: pnpm check:content

      - name: Verifica continutul activ
        run: pnpm check:active-content

      - name: Verifica aprobarea Bibliei explicate
        run: pnpm check:bible-publication

      - name: Verifica Biblia explicata Matei
        run: pnpm check:matei

      - name: Verifica Biblia explicata Marcu
        run: pnpm check:marcu

      - name: Verifica Biblia explicata Luca
        run: pnpm check:luca

      - name: Verifica Biblia explicata Fapte
        run: pnpm check:fapte

      - name: Verifica Biblia explicata Romani
        run: pnpm check:romani

      - name: Verifica Biblia explicata 1 Corinteni
        run: pnpm check:1-corinteni

      - name: Verifica Biblia explicata 2 Corinteni
        run: pnpm check:2-corinteni

      - name: Verifica Biblia explicata Galateni
        run: pnpm check:galateni

      - name: Verifica Biblia explicata Efeseni
        run: pnpm check:efeseni

      - name: Verifica Biblia explicata Filipeni
        run: pnpm check:filipeni

      - name: Verifica Biblia explicata Coloseni
        run: pnpm check:coloseni

      - name: Verifica Biblia explicata 1 Tesaloniceni
        run: pnpm check:1-tesaloniceni

      - name: Verifica Biblia explicata 2 Tesaloniceni
        run: pnpm check:2-tesaloniceni

      - name: Verifica Biblia explicata 1 Timotei
        run: pnpm check:1-timotei

      - name: Verifica Biblia explicata 2 Timotei
        run: pnpm check:2-timotei

      - name: Verifica Biblia explicata Tit
        run: pnpm check:tit

      - name: Verifica Biblia explicata Filimon
        run: pnpm check:filimon

      - name: Verifica Biblia explicata Evrei
        run: pnpm check:evrei

      - name: Verifica Biblia explicata Iacov
        run: pnpm check:iacov

      - name: Verifica Biblia explicata 1 Petru
        run: pnpm check:1-petru

      - name: Verifica Biblia explicata 2 Petru
        run: pnpm check:2-petru

      - name: Verifica Biblia explicata 1 Ioan
        run: pnpm check:1-ioan

      - name: Verifica Biblia explicata 2 Ioan
        run: pnpm check:2-ioan

      - name: Verifica Biblia explicata 3 Ioan
        run: pnpm check:3-ioan

      - name: Verifica Biblia explicata Iuda
        run: pnpm check:iuda

      - name: Verifica Biblia explicata Apocalipsa
        run: pnpm check:apocalipsa

      - name: Verifica valul final NT
        run: pnpm check:nt-completion

      - name: Verifica Biblia Emanus
        run: pnpm check:biblia-emanus

      - name: Testeaza poarta Biblia Emanus
        run: pnpm test:biblia-emanus

      - name: Verifica sigiliul tuturor celor sase carti
        run: >-
          pnpm seal:biblia-emanus --check
          --book GEN --book EXO --book LEV --book NUM --book DEU --book JOS

      - name: Verifica structura sursei Bibliei
        run: pnpm check:bible-source

      - name: Verifica securitatea Bibliei cloud
        run: pnpm check:bible-cloud

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verifica bundle-ul Bibliei
        run: pnpm check:bible-bundle

      - name: Commit permanent audited output
        run: |
          git show origin/codex/biblia-emanus-editorial-gate:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/upgrade-ot-audit2.yml
          rm -f scripts/upgrade-ot-audit2.py
          rm -f scripts/patch-audit2-integration.py
          rm -f scripts/patch-validator-audit2.py
          rm -f scripts/diagnose-audit2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Upgrade audited OT books to Biblia Emanus engine 2.0"
          git push origin HEAD:agent/biblia-emanus-ot-audit2
