name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout with native git
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          if command -v python3.11 >/dev/null 2>&1; then echo 'PYTHON_BIN=python3.11' >> "$GITHUB_ENV"; else echo 'PYTHON_BIN=python3' >> "$GITHUB_ENV"; fi
      - name: Detect Biblia Emanus changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "${BASE_SHA}" ] || [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            echo 'biblia=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --depth=1 origin "${BASE_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          if printf '%s\n' "${changed_files}" | grep -Eiq '(^|/)(biblia|bible)|publica-geneza|romanian-quality'; then
            echo 'biblia=true' >> "$GITHUB_OUTPUT"
          else
            echo 'biblia=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify repository and Porți
        run: |
          set -euo pipefail
          pnpm check:quotes
          pnpm check:typos
          pnpm check:content
          pnpm check:course-repetition
          pnpm check:porti
      - name: Verify Biblia Emanus
        if: steps.changes.outputs.biblia == 'true'
        run: |
          set -euo pipefail
          pnpm check:bible-publication
          "$PYTHON_BIN" scripts/check-biblia-emanus-romanian-quality.py
          pnpm check:biblia-emanus
          pnpm check:biblia-emanus-nt-editorial
          pnpm check:biblia-emanus-nt-materialized
          pnpm check:biblia-emanus-nt-runtime
          "$PYTHON_BIN" scripts/check-biblia-emanus-ot-semantic-screening.py
          "$PYTHON_BIN" scripts/check-biblia-emanus-ot-publication-gate.py
          pnpm test:biblia-emanus
          pnpm check:biblia-emanus-versification
          pnpm seal:biblia-emanus --check
      - name: Verify Old Testament repair candidates when present
        if: steps.changes.outputs.biblia == 'true'
        run: |
          set -euo pipefail
          if [ ! -f docs/data/biblia-emanus-candidates/manifest.json ]; then
            echo 'No OT repair candidate manifest; semantic candidate gate skipped.'
            exit 0
          fi
          "$PYTHON_BIN" scripts/apply-pr40-canonical-content-fixes.py
          "$PYTHON_BIN" scripts/apply-pr40-canonical-content-fixes-wave2.py
          "$PYTHON_BIN" scripts/apply-pr40-canonical-content-fixes-wave3.py
          "$PYTHON_BIN" scripts/apply-pr40-canonical-content-fixes-wave4.py
          "$PYTHON_BIN" scripts/audit-ot-repair5-v2.py
          "$PYTHON_BIN" scripts/enforce-ot-repair5-audit.py
          "$PYTHON_BIN" -m pip install --disable-pip-version-check 'sentence-transformers>=3,<4' numpy
          "$PYTHON_BIN" scripts/semantic-audit-ot-repair5-v2.py --batch-size 128
          "$PYTHON_BIN" scripts/enforce-ot-repair5-semantic.py
      - name: Typecheck and build
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm build
          git diff --check
      - name: Install browser for course regression
        run: pnpm --filter @emanus/web exec playwright install --with-deps chromium
      - name: Verify course experience
        env:
          CI: "1"
        run: pnpm --filter @emanus/web test:course-repetition
