name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-main-integration
          fetch-depth: 0

      - name: Fetch final audited Biblia Emanus branch
        run: git fetch origin agent/biblia-emanus-ot-audit2:refs/remotes/origin/agent/biblia-emanus-ot-audit2

      - name: Materialize only Biblia Emanus 2.0
        run: python3 scripts/integrate-biblia-emanus-main.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verifica ghilimelele
        run: pnpm check:quotes

      - name: Verifica typo-urile cunoscute
        run: pnpm check:typos

      - name: Verifica siguranta continutului
        run: pnpm check:content

      - name: Verifica aprobarea Genezei
        run: pnpm check:bible-publication

      - name: Verifica Biblia Emanus 2.0
        run: pnpm check:biblia-emanus

      - name: Testeaza poarta Biblia Emanus 2.0
        run: pnpm test:biblia-emanus

      - name: Verifica sigiliul celor sase carti
        run: >-
          pnpm seal:biblia-emanus --check
          --book GEN --book EXO --book LEV --book NUM --book DEU --book JOS

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Commit clean permanent integration
        run: |
          rm scripts/integrate-biblia-emanus-main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/biblia-emanus docs/data/biblia-emanus scripts package.json .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Integrate Biblia Emanus 2.0 into main line"
          git push origin HEAD:agent/biblia-emanus-main-integration
