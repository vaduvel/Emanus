name: Finalize NT Completion

on:
  push:
    branches:
      - agent/complete-new-testament
    paths:
      - .github/workflows/finalize-nt-completion.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-new-testament
      - name: Extract generated books and integrate catalog
        run: |
          base64 --decode .nt-completion-payload.b64 > /tmp/nt-completion.zip
          unzip -o /tmp/nt-completion.zip -d .
          python3 scripts/apply-nt-completion.py
          rm .nt-completion-payload.b64 scripts/apply-nt-completion.py
      - name: Commit complete remaining New Testament
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(bible): complete remaining New Testament books"
          git push origin HEAD:agent/complete-new-testament
