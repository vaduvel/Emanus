name: Temporary publish Joshua 16-20 metadata

on:
  push:
    branches:
      - agent/biblia-emanus-iosua
    paths:
      - scripts/tmp_publish_jos16_20.py

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-iosua
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Joshua metadata
        run: python scripts/tmp_publish_jos16_20.py
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus/source-ledger.json docs/data/biblia-emanus/manifest.json docs/biblia-emanus/IOSUA-AUDIT.md
          if git diff --cached --quiet; then
            echo "No metadata changes"
            exit 0
          fi
          git commit -m "Register and publish Biblia Emanus Iosua 16-20"
          git push origin HEAD:agent/biblia-emanus-iosua
