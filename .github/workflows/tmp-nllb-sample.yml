name: Temporary NT NLLB sample

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-nllb-sample.yml
      - scripts/tmp-nllb-sample.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    if: github.head_ref == 'agent/biblia-emanus-nt-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct previous source/audit helper
        run: |
          : > /tmp/old_pipeline.py
          for part in 00 01 02 03 04 05; do
            git show 8cdc210e01c:scripts/tmp-complete-nt.part${part} >> /tmp/old_pipeline.py
            printf '\n' >> /tmp/old_pipeline.py
          done
          python3 -m py_compile /tmp/old_pipeline.py

      - name: Install NLLB runtime
        run: >-
          pip install --quiet
          "transformers==4.53.2"
          "sentencepiece==0.2.0"
          "protobuf==6.31.1"
          "torch==2.7.1"
          --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Translate quality sample
        env:
          OLD_PIPELINE: /tmp/old_pipeline.py
        run: python3 scripts/tmp-nllb-sample.py

      - uses: actions/upload-artifact@v4
        with:
          name: nt-nllb-sample
          path: tmp-nt-nllb-sample/
          retention-days: 1
