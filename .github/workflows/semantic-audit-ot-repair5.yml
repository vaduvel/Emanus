name: Semantic audit OT repair 5

on:
  push:
    branches:
      - agent/biblia-emanus-ot-repair5
    paths:
      - 'docs/data/biblia-emanus-candidates/**'
      - 'scripts/ot_repair5_common.py'
      - 'scripts/semantic-audit-ot-repair5-v2.py'
      - '.github/workflows/semantic-audit-ot-repair5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-ot-repair5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install semantic audit dependencies
        run: pip install --disable-pip-version-check 'sentence-transformers>=3,<4' numpy
      - name: Run semantic screening v2
        run: python3 scripts/semantic-audit-ot-repair5-v2.py --batch-size 128
      - name: Upload semantic report
        uses: actions/upload-artifact@v4
        with:
          name: ot-repair5-semantic-audit-v2
          path: |
            docs/biblia-emanus/OT-REPAIR5-SEMANTIC-AUDIT.md
            docs/biblia-emanus/OT-REPAIR5-SEMANTIC-AUDIT.json
          retention-days: 7
      - name: Persist semantic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/OT-REPAIR5-SEMANTIC-AUDIT.md docs/biblia-emanus/OT-REPAIR5-SEMANTIC-AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(bible): persist OT repair5 semantic report v2'
            git push origin HEAD:agent/biblia-emanus-ot-repair5
          fi
