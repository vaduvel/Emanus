name: Fix Leviticus Inner Quotes

on:
  push:
    branches:
      - agent/biblia-emanus-leviticul
    paths:
      - scripts/fix-leviticus-inner-quotes.py
      - .github/workflows/fix-leviticus-inner-quotes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-leviticul
          fetch-depth: 0
      - run: python3 scripts/fix-leviticus-inner-quotes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus/LEV.*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Leviticus quotation balance"
          git push origin HEAD:agent/biblia-emanus-leviticul

# Triggered after CI identified unmatched inner quotation marks.
