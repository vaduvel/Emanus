name: Research Luca YouTube playlist

on:
  workflow_dispatch:
  push:
    branches:
      - agent/integrate-biblical-review
    paths:
      - .github/workflows/research-luca-youtube.yml
  pull_request:
    paths:
      - .github/workflows/research-luca-youtube.yml

permissions:
  contents: read

jobs:
  collect-transcripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYLIST_URL: https://www.youtube.com/watch?v=_OX6ET9Z7Qw&list=PL3myepmxcTQSnSKfFkN-4cNo4kl9B0ILf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install research tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yt-dlp>=2025.7.21" requests

      - name: Read the complete playlist index
        shell: bash
        run: |
          mkdir -p .research/luca-youtube/text
          yt-dlp --flat-playlist --dump-single-json "$PLAYLIST_URL" \
            > .research/luca-youtube/playlist.json

      - name: Fetch public timed-text transcripts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import requests

          root = Path('.research/luca-youtube')
          out = root / 'text'
          out.mkdir(parents=True, exist_ok=True)
          playlist = json.loads((root / 'playlist.json').read_text(encoding='utf-8'))
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 '
                            '(KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          })

          def clean(value: str) -> str:
              value = html.unescape(value)
              value = re.sub(r'<[^>]+>', '', value)
              value = value.replace('\u200b', '').replace('\ufeff', '')
              value = re.sub(r'\s+', ' ', value).strip()
              value = re.sub(r'\s+([,.;:!?])', r'\1', value)
              return value

          def tracks_for(video_id: str) -> list[dict[str, str]]:
              response = session.get(
                  'https://www.youtube.com/api/timedtext',
                  params={'type': 'list', 'v': video_id},
                  timeout=20,
              )
              response.raise_for_status()
              if not response.text.strip():
                  return []
              root_node = ET.fromstring(response.text)
              return [dict(node.attrib) for node in root_node.findall('.//track')]

          def transcript_for(video_id: str) -> tuple[str, dict[str, str] | None]:
              tracks = tracks_for(video_id)
              english = [
                  track for track in tracks
                  if track.get('lang_code', '').lower().startswith('en')
                  or track.get('lang_translated', '').lower() == 'english'
              ]
              for track in english + tracks:
                  params = {
                      'v': video_id,
                      'lang': track.get('lang_code', 'en'),
                      'fmt': 'json3',
                  }
                  if track.get('name'):
                      params['name'] = track['name']
                  if track.get('kind'):
                      params['kind'] = track['kind']
                  response = session.get(
                      'https://www.youtube.com/api/timedtext',
                      params=params,
                      timeout=20,
                  )
                  if not response.ok or not response.content.strip():
                      continue
                  try:
                      payload = response.json()
                  except ValueError:
                      continue
                  chunks: list[str] = []
                  previous = ''
                  for event in payload.get('events', []):
                      text = clean(''.join(seg.get('utf8', '') for seg in event.get('segs', [])))
                      if text and text != previous:
                          chunks.append(text)
                          previous = text
                  transcript = clean(' '.join(chunks))
                  if transcript:
                      return transcript, track
              return '', None

          rows: list[dict[str, object]] = []
          entries = playlist.get('entries') or []
          for index, entry in enumerate(entries, start=1):
              video_id = str(entry.get('id') or '')
              title = str(entry.get('title') or f'Luke video {index}')
              url = str(entry.get('url') or f'https://www.youtube.com/watch?v={video_id}')
              if not url.startswith('http'):
                  url = f'https://www.youtube.com/watch?v={video_id}'
              transcript = ''
              track = None
              try:
                  transcript, track = transcript_for(video_id)
              except Exception as exc:
                  print(f'::warning title=Timed text::{index}. {title}: {exc}')

              if transcript:
                  (out / f'{index:03d}-{video_id}.txt').write_text(
                      f'Title: {title}\nURL: {url}\nPlaylist index: {index}\n\n{transcript}\n',
                      encoding='utf-8',
                  )
              else:
                  print(f'::warning title=Missing transcript::{index}. {title}')

              rows.append({
                  'index': index,
                  'id': video_id,
                  'title': title,
                  'url': url,
                  'duration': entry.get('duration'),
                  'track': track,
                  'transcriptBytes': len(transcript.encode('utf-8')),
              })

          summary = {
              'playlistId': playlist.get('id'),
              'playlistTitle': playlist.get('title'),
              'playlistUrl': 'https://www.youtube.com/playlist?list=PL3myepmxcTQSnSKfFkN-4cNo4kl9B0ILf',
              'videosDiscovered': len(rows),
              'transcriptsCreated': sum(1 for row in rows if int(row['transcriptBytes']) > 0),
              'videos': rows,
          }
          (out / 'index.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(
              f"YouTube Luca: {summary['videosDiscovered']} clipuri găsite, "
              f"{summary['transcriptsCreated']} transcrieri create."
          )
          if len(rows) != 96:
              raise SystemExit(f"Playlist incomplet: {len(rows)} din 96 clipuri.")
          PY

      - name: Upload private research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luca-youtube-transcripts-${{ github.sha }}
          path: .research/luca-youtube/text
          if-no-files-found: error
          retention-days: 1
