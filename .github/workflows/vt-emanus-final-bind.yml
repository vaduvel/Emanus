name: VT Emanus Final Bind

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
    paths:
      - ".github/workflows/vt-emanus-final-bind.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect final Emanus corpus and publication runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          echo "MAIN=$(git rev-parse origin/main)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "--- GEN.1 schema ---"
          git show origin/main:docs/data/biblia-emanus/GEN.1.json > /tmp/gen1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/gen1.json').read_text())
          print('top-level keys:', sorted(data))
          def walk(x, path='root'):
              if isinstance(x, list):
                  if x and all(isinstance(v, dict) for v in x):
                      keys=sorted(set().union(*(v.keys() for v in x)))
                      if {'text'} & set(keys) or {'verse','number'} & set(keys):
                          print('candidate list', path, 'len', len(x), 'keys', keys[:20])
                          print('first', x[0])
                  for i,v in enumerate(x[:3]): walk(v, f'{path}[{i}]')
              elif isinstance(x, dict):
                  for k,v in x.items(): walk(v, f'{path}.{k}')
          walk(data)
          PY
          echo "--- publication exports/tail ---"
          grep -nE 'PUBLICATION_BIBLE_BOOKS|VT_OVERLAY_TEMPORARY_TEXTS|translation|temporary' packages/shared/src/bible/publicationBible.ts | tail -n 80 || true
          tail -n 140 packages/shared/src/bible/publicationBible.ts
          echo "--- current main conflict dry-run ---"
          set +e
          git config user.name inspect
          git config user.email inspect@example.invalid
          git merge --no-commit --no-ff origin/main >/tmp/merge.log 2>&1
          rc=$?
          set -e
          echo "merge_rc=$rc"
          git diff --name-only --diff-filter=U | sed 's#^#CONFLICT #' || true
          git merge --abort || true
