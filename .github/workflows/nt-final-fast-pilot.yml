name: NT Final Fast Pilot

# Temporary throughput pilot for PR #83. Remove after observation.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nt-final-fast-pilot.yml

permissions:
  contents: write
  copilot-requests: write

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout NT review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - id: review
        name: Review MAT.1 in one bounded Copilot request
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NT_FINAL_COPILOT_MODEL: auto
          NT_FINAL_COPILOT_TIMEOUT: '300'
          NT_FINAL_CHUNK_SIZE: '25'
          NT_FINAL_CHUNK_ATTEMPTS: '2'
        run: |
          set -euo pipefail
          python3 scripts/nt_final_editorial_copilot_chunked_runner.py \
            --book MAT \
            --chapter 1 \
            --consulted-on "$(date -u +%F)" \
            --output /tmp/MAT.json 2>&1 | tee /tmp/nt-final-fast-pilot.log
      - id: shape
        name: Validate fast pilot artifact shape
        if: steps.review.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/MAT.json', encoding='utf-8'))
          assert data['book'] == 'MAT'
          assert len(data['verses']) == 25
          assert data['verses'][0]['reference'] == 'MAT.1.1'
          assert data['verses'][-1]['reference'] == 'MAT.1.25'
          print('[fast-pilot] MAT.1 evidence:', len(data['verses']))
          PY
      - name: Persist fast pilot result
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SHAPE_OUTCOME: ${{ steps.shape.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/nt-ai-review-handoff
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('/tmp/nt-final-fast-pilot.log')
          log = p.read_text(encoding='utf-8', errors='replace')[-16000:] if p.exists() else ''
          status = 'success' if os.environ.get('REVIEW_OUTCOME') == 'success' and os.environ.get('SHAPE_OUTCOME') == 'success' else 'failure'
          out = {
              'status': status,
              'reviewOutcome': os.environ.get('REVIEW_OUTCOME'),
              'shapeOutcome': os.environ.get('SHAPE_OUTCOME'),
              'runId': os.environ.get('RUN_ID'),
              'reviewerSystem': 'GitHub Copilot CLI auto; chunk-size=25; one-request-throughput-pilot',
              'diagnosticTail': log,
          }
          Path('docs/biblia-emanus/NT-FINAL-FAST-PILOT.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/biblia-emanus/NT-FINAL-FAST-PILOT.json
          git diff --cached --check
          git commit -m 'docs(biblia): record fast final NT editorial pilot'
          git push origin HEAD:codex/nt-ai-review-handoff
