name: PR40 final — translate Qumran corpus

on:
  push:
    branches:
      - agent/biblia-emanus-pr40-final
    paths:
      - 'scripts/extract-pr40-qumran-corpus.py'
      - 'scripts/translate-pr40-qumran-corpus.py'
      - '.github/workflows/pr40-final-translate-qumran.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr40-final-qumran-translation
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and translation runtime
        run: pip install --disable-pip-version-check 'text-fabric>=12,<14' 'torch>=2.5,<3' 'transformers>=4.45,<5' 'sentencepiece>=0.2,<1' 'huggingface-hub>=0.26,<1'
      - name: Rebuild authentic Qumran source corpus
        run: python3 scripts/extract-pr40-qumran-corpus.py
      - name: Generate Romanian parallel research edition
        run: python3 scripts/translate-pr40-qumran-corpus.py --batch-size 28
      - name: Upload Romanian candidates and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-final-qumran-romanian-drafts
          path: |
            docs/data/biblia-emanus-qumran-romanian-candidates
            docs/biblia-emanus/PR40-QUMRAN-ROMANIAN-DRAFT.json
            docs/biblia-emanus/PR40-QUMRAN-SOURCE-CORPUS.json
          if-no-files-found: warn
          retention-days: 7
