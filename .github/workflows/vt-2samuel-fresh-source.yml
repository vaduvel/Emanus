name: VT 2 Samuel Fresh Source

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vt-2samuel-fresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-2-samuel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Download current WEBU and WLC
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/engwebp_current.zip https://ebible.org/Scriptures/engwebp_usfm.zip
          curl --fail --location --retry 3 --output /tmp/hboWLC_current.zip https://ebible.org/Scriptures/hboWLC_usfm.zip

      - name: Build fresh 2 Samuel packet
        run: |
          set -euo pipefail
          python3 scripts/prepare-ot-book-fresh-reaudit.py \
            --book 2SA \
            --webu-zip /tmp/engwebp_current.zip \
            --wlc-zip /tmp/hboWLC_current.zip
          python3 scripts/split-ot-book-fresh-reaudit.py --book 2SA
          python3 scripts/chunk-ot-book-fresh-reaudit.py --book 2SA --size 12

      - name: Commit fresh packet
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/biblia-explicata/ot-reaudit/2SA-FRESH-SOURCE-REAUDIT.json \
            docs/biblia-explicata/ot-reaudit/2SA
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '2 Samuel packet already current.'
            exit 0
          fi
          git commit -m "chore(bible): capture fresh 2 Samuel source packet"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
