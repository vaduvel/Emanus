name: NT Final Pilot Trigger

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nt-final-pilot-trigger.yml

permissions:
  contents: write
  models: read

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout NT review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - id: review
        name: Review MAT.1 against locked sources and external benchmarks
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NT_FINAL_MODEL: openai/gpt-5
        run: |
          set -euo pipefail
          python3 scripts/nt_final_editorial_worker.py \
            --book MAT \
            --chapter 1 \
            --consulted-on "$(date -u +%F)" \
            --output /tmp/MAT.json 2>&1 | tee /tmp/nt-final-pilot.log
      - id: shape
        name: Validate pilot artifact shape
        if: steps.review.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/MAT.json', encoding='utf-8'))
          assert data['book'] == 'MAT'
          assert len(data['verses']) == 25
          assert data['verses'][0]['reference'] == 'MAT.1.1'
          assert data['verses'][-1]['reference'] == 'MAT.1.25'
          print('[pilot] MAT.1 evidence:', len(data['verses']))
          PY
      - name: Persist pilot result on review branch
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SHAPE_OUTCOME: ${{ steps.shape.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          log_path = Path('/tmp/nt-final-pilot.log')
          log = log_path.read_text(encoding='utf-8', errors='replace')[-12000:] if log_path.exists() else ''
          status = 'success' if os.environ.get('REVIEW_OUTCOME') == 'success' and os.environ.get('SHAPE_OUTCOME') == 'success' else 'failure'
          out = {
              'status': status,
              'reviewOutcome': os.environ.get('REVIEW_OUTCOME'),
              'shapeOutcome': os.environ.get('SHAPE_OUTCOME'),
              'runId': os.environ.get('RUN_ID'),
              'runAttempt': os.environ.get('RUN_ATTEMPT'),
              'diagnosticTail': log,
          }
          Path('docs/biblia-emanus/NT-FINAL-PILOT.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/biblia-emanus/NT-FINAL-PILOT.json
          git diff --cached --check
          git commit -m 'docs(biblia): record final NT editorial pilot result'
          git push origin HEAD:codex/nt-ai-review-handoff
