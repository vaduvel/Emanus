name: NT Final Pilot Trigger

# Temporary, non-publication pilot for PR #83. Remove after the pilot is observed.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nt-final-pilot-trigger.yml

permissions:
  contents: write
  copilot-requests: write

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout NT review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - id: probe
        name: Probe Copilot auto model
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' 'Return exactly this JSON object and nothing else: {"ok":true}' | \
            copilot -s --no-ask-user --model auto --log-level error \
            > /tmp/copilot-auto-probe.out 2> /tmp/copilot-auto-probe.err
          cat /tmp/copilot-auto-probe.out
      - name: Persist Copilot auto probe
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          stdout = Path('/tmp/copilot-auto-probe.out').read_text(encoding='utf-8', errors='replace')[-4000:] if Path('/tmp/copilot-auto-probe.out').exists() else ''
          stderr = Path('/tmp/copilot-auto-probe.err').read_text(encoding='utf-8', errors='replace')[-4000:] if Path('/tmp/copilot-auto-probe.err').exists() else ''
          payload = {
              'outcome': os.environ.get('PROBE_OUTCOME'),
              'runId': os.environ.get('RUN_ID'),
              'stdout': stdout,
              'stderr': stderr,
          }
          Path('docs/biblia-emanus/NT-COPILOT-AUTO-PROBE.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/biblia-emanus/NT-COPILOT-AUTO-PROBE.json
          git diff --cached --check
          git commit -m 'docs(biblia): record Copilot auto probe'
          git push origin HEAD:codex/nt-ai-review-handoff
      - id: review
        name: Review MAT.1 against locked sources and external benchmarks
        if: steps.probe.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NT_FINAL_COPILOT_MODEL: auto
        run: |
          set -euo pipefail
          python3 scripts/nt_final_editorial_copilot_runner.py \
            --book MAT \
            --chapter 1 \
            --consulted-on "$(date -u +%F)" \
            --output /tmp/MAT.json 2>&1 | tee /tmp/nt-final-pilot.log
      - id: shape
        name: Validate pilot artifact shape
        if: steps.review.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/MAT.json', encoding='utf-8'))
          assert data['book'] == 'MAT'
          assert len(data['verses']) == 25
          assert data['verses'][0]['reference'] == 'MAT.1.1'
          assert data['verses'][-1]['reference'] == 'MAT.1.25'
          print('[pilot] MAT.1 evidence:', len(data['verses']))
          PY
      - name: Persist pilot result on review branch
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SHAPE_OUTCOME: ${{ steps.shape.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git pull --ff-only origin codex/nt-ai-review-handoff
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          log_path = Path('/tmp/nt-final-pilot.log')
          log = log_path.read_text(encoding='utf-8', errors='replace')[-12000:] if log_path.exists() else ''
          status = 'success' if os.environ.get('REVIEW_OUTCOME') == 'success' and os.environ.get('SHAPE_OUTCOME') == 'success' else 'failure'
          out = {
              'status': status,
              'reviewOutcome': os.environ.get('REVIEW_OUTCOME'),
              'shapeOutcome': os.environ.get('SHAPE_OUTCOME'),
              'runId': os.environ.get('RUN_ID'),
              'runAttempt': os.environ.get('RUN_ATTEMPT'),
              'reviewerSystem': 'GitHub Copilot CLI auto',
              'diagnosticTail': log,
          }
          Path('docs/biblia-emanus/NT-FINAL-PILOT.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/biblia-emanus/NT-FINAL-PILOT.json
          git diff --cached --check
          git commit -m 'docs(biblia): record final NT editorial pilot result'
          git push origin HEAD:codex/nt-ai-review-handoff
