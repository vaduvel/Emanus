name: Repair Exodus 36-40

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-repair-exodus-36-40.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Rebuild and audit Exodus 36-40
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          texts={
          36:[
          '„Bețaleel, Oholiab și fiecare om priceput, în care DOMNUL a pus înțelepciune și pricepere ca să știe să facă toată lucrarea pentru slujirea sanctuarului, să lucreze după tot ce a poruncit DOMNUL.”',
          'Moise i-a chemat pe Bețaleel, Oholiab și pe fiecare om priceput în a cărui inimă pusese DOMNUL înțelepciune, pe oricine era îndemnat de inimă să vină și să facă lucrarea.',
          'Ei au primit de la Moise toate contribuțiile pe care le aduseseră fiii lui Israel pentru lucrarea de construire și slujire a sanctuarului. Poporul continua să-i aducă lui Moise daruri de bunăvoie în fiecare dimineață.',
          'Atunci toți meșteșugarii pricepuți care făceau lucrarea sanctuarului și-au lăsat fiecare lucrarea',
          'și au venit să-i spună lui Moise: „Poporul aduce mult mai mult decât este necesar pentru lucrarea pe care DOMNUL a poruncit să fie făcută.”',
          'Moise a dat o poruncă și s-a făcut următoarea vestire prin tabără: „Niciun bărbat și nicio femeie să nu mai pregătească nimic drept contribuție pentru sanctuar.” Astfel, poporul a fost oprit să mai aducă.',
          'Materialul era suficient pentru întreaga lucrare și chiar prisosea.',
          'Toți cei pricepuți dintre cei care făceau lucrarea au făcut Cortul din zece pânze de in fin răsucit și din fir albastru, purpuriu și stacojiu, cu heruvimi lucrați artistic.',
          'Fiecare pânză era lungă de douăzeci și opt de coți și lată de patru coți; toate pânzele aveau aceeași măsură.',
          'Au unit cinci pânze una de alta și celelalte cinci pânze una de alta.',
          'Au făcut cheotori din fir albastru pe marginea pânzei de la capătul primei îmbinări și la fel pe marginea pânzei de la capătul celei de-a doua îmbinări.',
          'Au făcut cincizeci de cheotori pe prima pânză și cincizeci de cheotori pe marginea pânzei din a doua îmbinare. Cheotorile erau așezate față în față.',
          'Au făcut cincizeci de copci de aur și au unit pânzele una cu alta prin copci, astfel încât Cortul a devenit un singur întreg.',
          'Au făcut unsprezece pânze din păr de capră, ca acoperământ peste Cort.',
          'Fiecare pânză era lungă de treizeci de coți și lată de patru coți; toate cele unsprezece pânze aveau aceeași măsură.',
          'Au unit separat cinci pânze și separat șase pânze.',
          'Au făcut cincizeci de cheotori pe marginea pânzei de la capătul primei îmbinări și cincizeci de cheotori pe marginea pânzei de la capătul celei de-a doua îmbinări.',
          'Au făcut cincizeci de copci din bronz pentru a uni acoperământul într-un singur întreg.',
          'Au făcut pentru cort un înveliș din piei de berbec vopsite în roșu și, deasupra lui, un înveliș din piei fine.',
          'Au făcut scândurile Cortului din lemn de salcâm și le-au așezat în picioare.',
          'Fiecare scândură era lungă de zece coți și lată de un cot și jumătate.',
          'Fiecare scândură avea două cepuri paralele. Așa au făcut toate scândurile Cortului.',
          'Au făcut douăzeci de scânduri pentru latura de sud a Cortului',
          'și patruzeci de socluri de argint sub cele douăzeci de scânduri: două socluri sub fiecare scândură, pentru cele două cepuri ale ei.',
          'Pentru a doua latură a Cortului, cea de nord, au făcut douăzeci de scânduri',
          'și patruzeci de socluri de argint, câte două socluri sub fiecare scândură.',
          'Pentru partea din spate a Cortului, spre apus, au făcut șase scânduri.',
          'Au făcut încă două scânduri pentru colțurile din spate ale Cortului.',
          'Ele erau duble în partea de jos și unite până sus, la primul inel. Așa au fost făcute amândouă, pentru cele două colțuri.',
          'Erau opt scânduri cu șaisprezece socluri de argint, câte două socluri sub fiecare scândură.',
          'Au făcut drugi din lemn de salcâm: cinci pentru scândurile de pe o latură a Cortului,',
          'cinci pentru scândurile de pe cealaltă latură și cinci pentru scândurile din partea din spate, spre apus.',
          'Au făcut drugul din mijloc să treacă prin mijlocul scândurilor de la un capăt la celălalt.',
          'Au acoperit scândurile cu aur, le-au făcut inele de aur prin care să treacă drugii și au acoperit drugii cu aur.',
          'Au făcut perdeaua din fir albastru, purpuriu și stacojiu și din in fin răsucit, cu heruvimi lucrați artistic.',
          'Au făcut pentru ea patru stâlpi din lemn de salcâm, i-au acoperit cu aur și le-au făcut cârlige din aur; pentru ei au turnat patru socluri de argint.',
          'Pentru intrarea cortului au făcut un paravan din fir albastru, purpuriu și stacojiu și din in fin răsucit, lucrat prin broderie,',
          'împreună cu cei cinci stâlpi și cârligele lor. Au acoperit cu aur capitelurile și legăturile stâlpilor, iar cele cinci socluri ale lor erau din bronz.'],
          37:[
          'Bețaleel a făcut chivotul din lemn de salcâm, lung de doi coți și jumătate, lat de un cot și jumătate și înalt de un cot și jumătate.',
          'L-a acoperit cu aur curat pe dinăuntru și pe dinafară și i-a făcut de jur împrejur un chenar de aur.',
          'A turnat pentru el patru verigi de aur și le-a fixat la cele patru picioare: două verigi pe o latură și două pe cealaltă latură.',
          'A făcut drugi din lemn de salcâm și i-a acoperit cu aur.',
          'A introdus drugii în verigile de pe laturile chivotului, pentru a purta chivotul.',
          'A făcut capacul ispășirii din aur curat, lung de doi coți și jumătate și lat de un cot și jumătate.',
          'A făcut doi heruvimi din aur bătut, la cele două capete ale capacului ispășirii:',
          'un heruvim la un capăt și un heruvim la celălalt capăt; i-a făcut dintr-o singură bucată cu capacul, la cele două capete ale lui.',
          'Heruvimii își întindeau aripile în sus, acoperind cu aripile lor capacul ispășirii. Fețele lor erau îndreptate una spre alta și spre capacul ispășirii.',
          'A făcut masa din lemn de salcâm, lungă de doi coți, lată de un cot și înaltă de un cot și jumătate.',
          'A acoperit-o cu aur curat și i-a făcut de jur împrejur un chenar de aur.',
          'I-a făcut de jur împrejur o margine lată de o palmă și un chenar de aur în jurul marginii.',
          'A turnat pentru ea patru verigi de aur și a pus verigile în cele patru colțuri, la cele patru picioare ale mesei.',
          'Verigile erau aproape de margine, ca să țină drugii cu care era purtată masa.',
          'A făcut drugii din lemn de salcâm, i-a acoperit cu aur și masa era purtată cu ei.',
          'A făcut din aur curat obiectele de pe masă: farfuriile, lingurile, bolurile și cănile folosite la turnarea darurilor de băutură.',
          'A făcut sfeșnicul din aur curat, lucrat prin batere. Baza, tija, cupele, bobocii și florile lui erau dintr-o singură bucată cu el.',
          'Șase brațe ieșeau din laturile lui: trei brațe dintr-o latură și trei din cealaltă latură.',
          'Pe primul braț erau trei cupe în formă de floare de migdal, fiecare cu boboc și floare, și trei cupe în formă de floare de migdal pe brațul următor, fiecare cu boboc și floare; la fel pentru cele șase brațe care ieșeau din sfeșnic.',
          'Pe tija sfeșnicului erau patru cupe în formă de floare de migdal, cu bobocii și florile lor.',
          'Era un boboc sub prima pereche de brațe, un boboc sub a doua pereche și un boboc sub a treia pereche, pentru cele șase brațe care ieșeau din el.',
          'Bobocii și brațele erau dintr-o singură bucată cu el; întregul era o singură lucrare din aur curat, bătut.',
          'A făcut din aur curat cele șapte candele, cleștii pentru fitil și tăvițele lui.',
          'A făcut sfeșnicul și toate obiectele lui dintr-un talant de aur curat.',
          'A făcut altarul tămâierii din lemn de salcâm, lung de un cot, lat de un cot, pătrat, și înalt de doi coți. Coarnele lui erau dintr-o singură bucată cu el.',
          'I-a acoperit cu aur curat partea de sus, laturile și coarnele și i-a făcut de jur împrejur un chenar de aur.',
          'I-a făcut două verigi de aur sub chenar, pe cele două laturi opuse, ca să țină drugii cu care era purtat.',
          'A făcut drugii din lemn de salcâm și i-a acoperit cu aur.',
          'A făcut untdelemnul sfânt pentru ungere și tămâia parfumată curată, după meșteșugul făcătorului de parfumuri.'],
          38:[
          'A făcut altarul arderii-de-tot din lemn de salcâm, lung de cinci coți, lat de cinci coți, pătrat, și înalt de trei coți.',
          'I-a făcut coarne la cele patru colțuri; coarnele erau dintr-o singură bucată cu el. L-a acoperit cu bronz.',
          'A făcut toate uneltele altarului: vasele pentru cenușă, lopețile, lighenele, furculițele și fărașele pentru cărbuni. Toate uneltele lui le-a făcut din bronz.',
          'A făcut pentru altar un grătar ca o rețea din bronz, sub marginea altarului, în partea de jos, până la jumătatea lui.',
          'A turnat patru verigi pentru cele patru colțuri ale grătarului de bronz, ca să țină drugii.',
          'A făcut drugii din lemn de salcâm și i-a acoperit cu bronz.',
          'A introdus drugii în verigile de pe laturile altarului, pentru a-l purta cu ei. A făcut altarul gol pe dinăuntru, din scânduri.',
          'A făcut ligheanul și suportul lui din bronz, folosind oglinzile femeilor care slujeau la intrarea Cortului Întâlnirii.',
          'A făcut curtea. Pe latura de sud, pânzele curții din in fin răsucit aveau o sută de coți.',
          'Erau douăzeci de stâlpi cu douăzeci de socluri din bronz; cârligele și legăturile stâlpilor erau din argint.',
          'Pe latura de nord, pânzele aveau o sută de coți, cu douăzeci de stâlpi și douăzeci de socluri din bronz; cârligele și legăturile stâlpilor erau din argint.',
          'Pe latura de apus, pânzele aveau cincizeci de coți, cu zece stâlpi și zece socluri; cârligele și legăturile stâlpilor erau din argint.',
          'Latura de răsărit avea cincizeci de coți.',
          'Pe o parte a intrării erau pânze de cincisprezece coți, cu trei stâlpi și trei socluri.',
          'La fel era pe cealaltă parte; de o parte și de alta a intrării curții erau pânze de cincisprezece coți, cu trei stâlpi și trei socluri.',
          'Toate pânzele din jurul curții erau din in fin răsucit.',
          'Soclurile stâlpilor erau din bronz, iar cârligele și legăturile stâlpilor din argint. Capitelurile lor erau acoperite cu argint și toți stâlpii curții erau legați cu argint.',
          'Paravanul de la intrarea curții era lucrat prin broderie, din fir albastru, purpuriu și stacojiu și din in fin răsucit. Era lung de douăzeci de coți și înalt de cinci coți, asemenea pânzelor curții.',
          'Avea patru stâlpi cu patru socluri din bronz; cârligele, învelișul capitelurilor și legăturile lor erau din argint.',
          'Toți țărușii Cortului și ai curții din jur erau din bronz.',
          'Acestea sunt cantitățile materialelor folosite pentru Cort, Cortul Mărturiei, numărate după porunca lui Moise pentru slujirea leviților, sub conducerea lui Itamar, fiul preotului Aaron.',
          'Bețaleel, fiul lui Uri, fiul lui Hur, din seminția lui Iuda, a făcut tot ce îi poruncise DOMNUL lui Moise.',
          'Împreună cu el a lucrat Oholiab, fiul lui Ahisamac, din seminția lui Dan, gravor, artist și broder în fir albastru, purpuriu și stacojiu și în in fin.',
          'Tot aurul folosit pentru întreaga lucrare a sanctuarului, aurul contribuției, a fost de douăzeci și nouă de talanți și șapte sute treizeci de șecheli, după șechelul sanctuarului.',
          'Argintul celor numărați din comunitate a fost de o sută de talanți și o mie șapte sute șaptezeci și cinci de șecheli, după șechelul sanctuarului:',
          'câte o becă de persoană, adică o jumătate de șechel după șechelul sanctuarului, pentru fiecare dintre cei numărați de la vârsta de douăzeci de ani în sus, în total șase sute trei mii cinci sute cincizeci de bărbați.',
          'Cei o sută de talanți de argint au fost folosiți pentru turnarea soclurilor sanctuarului și a soclurilor perdelei: o sută de socluri din o sută de talanți, câte un talant pentru fiecare soclu.',
          'Din cei o mie șapte sute șaptezeci și cinci de șecheli a făcut cârligele stâlpilor, le-a acoperit capitelurile și le-a făcut legăturile.',
          'Bronzul contribuției a fost de șaptezeci de talanți și două mii patru sute de șecheli.',
          'Cu el a făcut soclurile de la intrarea Cortului Întâlnirii, altarul de bronz, grătarul lui de bronz, toate uneltele altarului,',
          'soclurile din jurul curții, soclurile de la intrarea curții, toți țărușii Cortului și toți țărușii din jurul curții.'],
          39:[
          'Din fir albastru, purpuriu și stacojiu au făcut veșmintele lucrate pentru slujirea în Locul Sfânt și au făcut veșmintele sfinte pentru Aaron, așa cum îi poruncise DOMNUL lui Moise.',
          'Au făcut efodul din aur, fir albastru, purpuriu și stacojiu și din in fin răsucit.',
          'Au bătut aurul în foi subțiri și l-au tăiat în fire, ca să-l lucreze împreună cu firul albastru, purpuriu și stacojiu și cu inul fin, prin lucrare artistică.',
          'I-au făcut două bretele unite la cele două capete.',
          'Brâul țesut al efodului era dintr-o singură bucată cu el și lucrat la fel, din aur, fir albastru, purpuriu și stacojiu și din in fin răsucit, așa cum îi poruncise DOMNUL lui Moise.',
          'Au prelucrat pietrele de onix, le-au montat în monturi de aur și au gravat pe ele, asemenea gravurii unui sigiliu, numele fiilor lui Israel.',
          'Le-au pus pe bretelele efodului, ca pietre de aducere-aminte pentru fiii lui Israel, așa cum îi poruncise DOMNUL lui Moise.',
          'Au făcut pieptarul prin lucrare artistică, la fel ca efodul, din aur, fir albastru, purpuriu și stacojiu și din in fin răsucit.',
          'Era pătrat și îndoit în două, lung de o palmă și lat de o palmă.',
          'Au montat în el patru rânduri de pietre. În primul rând: un rubin, un topaz și un smarald;',
          'în al doilea rând: un turcoaz, un safir și un diamant;',
          'în al treilea rând: un opal, un agat și un ametist;',
          'iar în al patrulea rând: un crisolit, un onix și un jasp. Pietrele erau fixate în monturi de aur.',
          'Pietrele erau douăsprezece, după numele fiilor lui Israel, câte una pentru fiecare nume. Fiecare era gravată asemenea unui sigiliu, cu numele uneia dintre cele douăsprezece seminții.',
          'Au făcut pentru pieptar lănțișoare din aur curat, ca niște șnururi împletite.',
          'Au făcut două monturi de aur și două verigi de aur și au pus cele două verigi la cele două capete ale pieptarului.',
          'Au introdus cele două lănțișoare împletite din aur în cele două verigi de la capetele pieptarului.',
          'Celelalte două capete ale lănțișoarelor le-au prins de cele două monturi și le-au fixat pe bretelele efodului, în partea din față.',
          'Au făcut două verigi de aur și le-au pus la celelalte două capete ale pieptarului, pe marginea lui dinspre partea interioară a efodului.',
          'Au mai făcut două verigi de aur și le-au pus pe cele două bretele ale efodului, în partea de jos și din față, aproape de locul unde se unesc, deasupra brâului țesut al efodului.',
          'Au legat pieptarul prin verigile lui de verigile efodului cu un șnur albastru, ca să rămână deasupra brâului țesut al efodului și să nu se desprindă de efod, așa cum îi poruncise DOMNUL lui Moise.',
          'Au făcut mantia efodului, țesută în întregime din fir albastru.',
          'Deschizătura pentru cap era în mijlocul ei, asemenea deschizăturii unei platoșe, cu o margine țesută în jur, ca să nu se rupă.',
          'Pe tivul mantiei au făcut rodii din fir albastru, purpuriu și stacojiu și din in răsucit.',
          'Au făcut clopoței din aur curat și au pus clopoțeii între rodii, de jur împrejurul tivului mantiei:',
          'un clopoțel și o rodie, un clopoțel și o rodie, de jur împrejurul tivului mantiei pentru slujire, așa cum îi poruncise DOMNUL lui Moise.',
          'Au făcut tunicile din in fin țesut pentru Aaron și pentru fiii lui,',
          'turbanul din in fin, bonetele din in fin, pantalonii din in fin răsucit',
          'și brâul din in fin răsucit și din fir albastru, purpuriu și stacojiu, lucrat prin broderie, așa cum îi poruncise DOMNUL lui Moise.',
          'Au făcut plăcuța coroanei sfinte din aur curat și au gravat pe ea, asemenea gravurii unui sigiliu: „SFÂNT PENTRU DOMNUL”.',
          'Au prins de ea un șnur albastru pentru a o fixa sus, pe turban, așa cum îi poruncise DOMNUL lui Moise.',
          'Astfel a fost terminată întreaga lucrare a Cortului Întâlnirii. Fiii lui Israel au făcut totul după cum îi poruncise DOMNUL lui Moise; așa au făcut.',
          'Au adus Cortul la Moise: cortul cu toate obiectele lui, copcile, scândurile, drugii, stâlpii și soclurile,',
          'învelișul din piei de berbec vopsite în roșu, învelișul din piei fine și perdeaua despărțitoare,',
          'chivotul Mărturiei cu drugii lui și capacul ispășirii,',
          'masa cu toate obiectele ei și pâinea Prezenței,',
          'sfeșnicul curat cu candelele lui așezate în ordine, toate obiectele lui și uleiul pentru lumină,',
          'altarul de aur, untdelemnul ungerii, tămâia parfumată și paravanul de la intrarea cortului,',
          'altarul de bronz cu grătarul lui de bronz, drugii și toate uneltele lui, ligheanul și suportul lui,',
          'pânzele curții, stâlpii, soclurile, paravanul de la intrarea curții, funiile și țărușii ei și toate uneltele pentru slujirea Cortului Întâlnirii,',
          'veșmintele lucrate pentru slujirea în Locul Sfânt, veșmintele sfinte ale preotului Aaron și veșmintele fiilor lui pentru slujirea preoțească.',
          'Fiii lui Israel au făcut întreaga lucrare după tot ce îi poruncise DOMNUL lui Moise.',
          'Moise a cercetat întreaga lucrare și iată că o făcuseră așa cum poruncise DOMNUL. O făcuseră întocmai, iar Moise i-a binecuvântat.'],
          40:[
          'DOMNUL i-a vorbit lui Moise și i-a spus:',
          '„În prima zi a primei luni să ridici Cortul Întâlnirii.',
          'Să pui în el chivotul Mărturiei și să ascunzi chivotul în spatele perdelei.',
          'Să aduci masa și să așezi în ordine lucrurile de pe ea. Să aduci sfeșnicul și să-i aprinzi candelele.',
          'Să așezi altarul de aur pentru tămâie înaintea chivotului Mărturiei și să pui paravanul la intrarea Cortului.',
          'Să așezi altarul arderii-de-tot înaintea intrării Cortului Întâlnirii.',
          'Să așezi ligheanul între Cortul Întâlnirii și altar și să pui apă în el.',
          'Să ridici curtea de jur împrejur și să atârni paravanul de la intrarea curții.',
          'Să iei untdelemnul ungerii și să ungi Cortul și tot ce este în el; să-l sfințești împreună cu toate obiectele lui, iar el va fi sfânt.',
          'Să ungi altarul arderii-de-tot și toate uneltele lui; să sfințești altarul, iar altarul va fi preasfânt.',
          'Să ungi ligheanul și suportul lui și să-l sfințești.',
          'Să-i aduci pe Aaron și pe fiii lui la intrarea Cortului Întâlnirii și să-i speli cu apă.',
          'Să-l îmbraci pe Aaron cu veșmintele sfinte, să-l ungi și să-l sfințești ca să-Mi slujească în preoție.',
          'Să-i aduci pe fiii lui și să-i îmbraci cu tunicile.',
          'Să-i ungi așa cum l-ai uns pe tatăl lor, ca să-Mi slujească în preoție. Ungerea lor le va conferi o preoție veșnică din generație în generație.”',
          'Moise a făcut întocmai; a făcut totul după cum îi poruncise DOMNUL.',
          'În prima lună a anului al doilea, în prima zi a lunii, Cortul a fost ridicat.',
          'Moise a ridicat Cortul, i-a așezat soclurile, i-a ridicat scândurile, i-a introdus drugii și i-a ridicat stâlpii.',
          'A întins acoperământul peste cort și a pus deasupra învelișul Cortului, așa cum îi poruncise DOMNUL lui Moise.',
          'A luat Mărturia și a pus-o în chivot, a așezat drugii la chivot și a pus capacul ispășirii deasupra chivotului.',
          'A adus chivotul în Cort, a atârnat perdeaua despărțitoare și a ascuns chivotul Mărturiei, așa cum îi poruncise DOMNUL lui Moise.',
          'A pus masa în Cortul Întâlnirii, pe latura de nord a Cortului, dincoace de perdea.',
          'A așezat pe ea pâinea în ordine înaintea DOMNULUI, așa cum îi poruncise DOMNUL lui Moise.',
          'A pus sfeșnicul în Cortul Întâlnirii, în fața mesei, pe latura de sud a Cortului.',
          'A aprins candelele înaintea DOMNULUI, așa cum îi poruncise DOMNUL lui Moise.',
          'A pus altarul de aur în Cortul Întâlnirii, înaintea perdelei,',
