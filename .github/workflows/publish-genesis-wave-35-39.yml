name: Publish Genesis 35-39

on:
  push:
    branches:
      - agent/biblia-emanus
    paths:
      - scripts/publish-genesis-wave-35-39.py
      - .github/workflows/publish-genesis-wave-35-39.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit and publish Genesis 35-39
        run: python scripts/publish-genesis-wave-35-39.py
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs/data/biblia-emanus')
          for chapter in range(35, 40):
              data = json.loads((root / f'GEN.{chapter}.json').read_text(encoding='utf-8'))
              assert data['status'] == 'published'
              assert data['public'] is True
              assert all(value == 'approved' for value in data['review'].values())
              assert all(note.get('resolutionStatus') == 'resolved' for note in data.get('editorialNotes', []) if note.get('reviewRequired'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['progress']['chaptersApproved'] == 39
          assert manifest['progress']['chaptersPublished'] == 39
          PY
      - name: Commit audited wave
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus/GEN.{35,36,37,38,39}.json docs/data/biblia-emanus/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit and publish Genesis 35-39"
          git push origin HEAD:agent/biblia-emanus
