name: VT Rut Fresh Source Packet

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vt-ruth-fresh-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-ruth-review-packet:
    if: github.head_ref == 'agent/biblia-explicata-vt-integration-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0
      - name: Download current WEBU and WLC archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/engwebp_current.zip https://ebible.org/Scriptures/engwebp_usfm.zip
          curl --fail --location --retry 3 --output /tmp/hboWLC_current.zip https://ebible.org/Scriptures/hboWLC_usfm.zip
      - name: Build fresh Rut source packet and review chunks
        run: |
          set -euo pipefail
          python3 scripts/prepare-ot-book-fresh-reaudit.py \
            --book RUT \
            --webu-zip /tmp/engwebp_current.zip \
            --wlc-zip /tmp/hboWLC_current.zip
          python3 scripts/split-ot-book-fresh-reaudit.py --book RUT
          python3 scripts/chunk-ot-book-fresh-reaudit.py --book RUT
      - name: Commit fresh Rut packet
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/biblia-explicata/ot-reaudit/RUT-FRESH-SOURCE-REAUDIT.json docs/biblia-explicata/ot-reaudit/RUT
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(bible): build fresh Rut source packet"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
