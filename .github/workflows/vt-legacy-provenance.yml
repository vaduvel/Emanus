name: VT Legacy Provenance

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-legacy-provenance:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/biblia-explicata-vt-integration-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify legacy doctrinal provenance
        run: pnpm check:vt-legacy-provenance
      - name: Verify complete VT explanation coverage
        run: pnpm check:vt-explained
      - name: Verify VT publication runtime
        run: pnpm check:vt-publication
      - name: Typecheck shared package
        run: pnpm --filter @emanus/shared typecheck
