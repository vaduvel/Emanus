name: Translate all PR40 deuterocanon

on:
  push:
    branches:
      - agent/biblia-emanus-all-pr40-rebuild
    paths:
      - 'scripts/translate-pr40-deuterocanon-missing.py'
      - 'scripts/translate-pr40-deuterocanon-all-missing.py'
      - '.github/workflows/translate-pr40-deuterocanon-missing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr40-deuterocanon-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-all-pr40-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned translation runtime
        run: pip install --disable-pip-version-check 'torch>=2.5,<3' 'transformers>=4.45,<5' 'sentencepiece>=0.2,<1' 'huggingface-hub>=0.26,<1'
      - name: Translate twelve public-domain source witnesses
        run: python3 scripts/translate-pr40-deuterocanon-all-missing.py --batch-size 24
      - name: Upload candidates and audit report
        uses: actions/upload-artifact@v4
        with:
          name: pr40-deuterocanon-new-translation
          path: |
            docs/data/biblia-emanus-deuterocanon-new-translation
            docs/biblia-emanus/PR40-DEUTEROCANON-NEW-TRANSLATION.json
          retention-days: 7
      - name: Persist source-backed drafts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/biblia-emanus-deuterocanon-new-translation docs/biblia-emanus/PR40-DEUTEROCANON-NEW-TRANSLATION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(bible): persist twelve source-backed deuterocanonical translation drafts'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/biblia-emanus-all-pr40-rebuild
            if git push origin HEAD:agent/biblia-emanus-all-pr40-rebuild; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
