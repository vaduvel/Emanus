name: Export Galatians Transcripts

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref == 'agent/biblia-explicata-nt-integration-clean'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 1

      - name: Export exact semantic transcript representations
        run: |
          set -euo pipefail
          mkdir -p /tmp/galateni-transcripts
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          root = Path('.').resolve()
          worker_path = root / 'scripts/nt_semantic_copilot_worker.py'
          spec = importlib.util.spec_from_file_location('emanus_semantic_export', worker_path)
          if spec is None or spec.loader is None:
              raise SystemExit('Cannot load semantic worker extractor')
          worker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worker)

          sources = [
              ('01-galatians-1-1-to-2-21.txt', 'https://sermonindex.net/speakers/zac-poonen/galatians-ch11-ch221/'),
              ('02-galatians-2-1-to-4-7.txt', 'https://sermonindex.net/speakers/zac-poonen/galatians-ch21-ch47/'),
              ('03-galatians-4-8-to-5-13.txt', 'https://sermonindex.net/speakers/zac-poonen/galatians-ch48-ch513/'),
              ('04-galatians-5-14-to-6-18.txt', 'https://sermonindex.net/speakers/zac-poonen/galatians-ch514-ch618/'),
          ]
          out = Path('/tmp/galateni-transcripts')
          meta = []
          for name, url in sources:
              text = worker.extract_transcript(url)
              sha = worker.sha256(text)
              (out / name).write_text(text + '\n', encoding='utf-8')
              meta.append({'file': name, 'url': url, 'sha256': sha, 'words': len(text.split())})
              print(name, sha, len(text.split()))
          (out / 'manifest.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          PY
          cp docs/data/biblia-explicata/nt-final-source-first/09-galateni.json /tmp/galateni-transcripts/09-galateni.json
          cp docs/data/biblia-explicata/nt-direct-transcript-coverage.json /tmp/galateni-transcripts/nt-direct-transcript-coverage.json

      - uses: actions/upload-artifact@v4
        with:
          name: galateni-full-transcripts
          path: /tmp/galateni-transcripts
          if-no-files-found: error
          retention-days: 1
