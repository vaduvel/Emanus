name: Export Galatians Transcripts

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref == 'agent/biblia-explicata-nt-integration-clean'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 1

      - name: Export full transcript representations
        run: |
          set -euo pipefail
          mkdir -p /tmp/galateni-transcripts
          python3 - <<'PY'
          import hashlib
          import html
          import json
          import re
          import urllib.request
          from pathlib import Path

          sources = [
              ('01-galatians-1-1-to-2-21.txt', 'https://sermonindex.net/speakers/zac-poonen/galatians-ch11-ch221/'),
              ('02-galatians-2-1-to-4-7.txt', 'https://sermonindex.net/speakers/zac-poonen/galatians-ch21-ch47/'),
              ('03-galatians-4-8-to-5-13.txt', 'https://sermonindex.net/speakers/zac-poonen/galatians-ch48-ch513/'),
              ('04-galatians-5-14-to-6-18.txt', 'https://sermonindex.net/speakers/zac-poonen/galatians-ch514-ch618/'),
          ]

          def visible(raw):
              raw = re.sub(r'<script\\b[^>]*>.*?</script>', ' ', raw, flags=re.I|re.S)
              raw = re.sub(r'<style\\b[^>]*>.*?</style>', ' ', raw, flags=re.I|re.S)
              raw = re.sub(r'<br\\s*/?>', '\\n', raw, flags=re.I)
              raw = re.sub(r'</(?:p|div|li|h[1-6]|section|article)>', '\\n', raw, flags=re.I)
              raw = re.sub(r'<[^>]+>', ' ', raw)
              raw = html.unescape(raw).replace('\\xa0', ' ')
              return '\\n'.join(line for line in (re.sub(r'\\s+', ' ', line).strip() for line in raw.splitlines()) if line)

          def transcript(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Emanus-Editorial-Research/1.0'})
              with urllib.request.urlopen(req, timeout=60) as res:
                  text = visible(res.read().decode('utf-8', errors='replace'))
              start = text.find('Full Transcript')
              if start < 0:
                  raise SystemExit(f'Full Transcript marker missing: {url}')
              tail = text[start + len('Full Transcript'):].lstrip('\\n ')
              ends = []
              for marker in ['Sermon Outline','Key Quotes','Application Points','Frequently Asked Questions','Citation Web Link','Downloads','Topics']:
                  idx = tail.find('\\n' + marker)
                  if idx >= 0:
                      ends.append(idx)
              if ends:
                  tail = tail[:min(ends)]
              tail = re.sub(r'\\n{3,}', '\\n\\n', tail).strip()
              if len(tail.split()) < 250:
                  raise SystemExit(f'Transcript too short: {url}')
              return tail

          out = Path('/tmp/galateni-transcripts')
          meta = []
          for name, url in sources:
              text = transcript(url)
              sha = 'sha256:' + hashlib.sha256(text.encode()).hexdigest()
              (out / name).write_text(text + '\\n', encoding='utf-8')
              meta.append({'file': name, 'url': url, 'sha256': sha, 'words': len(text.split())})
              print(name, sha, len(text.split()))
          (out / 'manifest.json').write_text(json.dumps(meta, indent=2) + '\\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: galateni-full-transcripts
          path: /tmp/galateni-transcripts
          if-no-files-found: error
          retention-days: 1
