name: Export Ephesians Transcripts

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref == 'agent/biblia-explicata-nt-integration-clean'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 1

      - name: Export exact semantic transcript representations
        run: |
          set -euo pipefail
          mkdir -p /tmp/efeseni-transcripts
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('.').resolve()
          worker_path = root / 'scripts/nt_semantic_copilot_worker.py'
          spec = importlib.util.spec_from_file_location('emanus_semantic_export', worker_path)
          if spec is None or spec.loader is None:
              raise SystemExit('Cannot load semantic worker extractor')
          worker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worker)

          sources = [
              ('01-ephesians-1-1-to-1-17.txt', 'https://sermonindex.net/speakers/zac-poonen/ephesians-ephesians-11-17/'),
              ('02-ephesians-1-18-to-2-9.txt', 'https://sermonindex.net/speakers/zac-poonen/ephesians-ephesians-118-29/'),
              ('03-ephesians-2-10-to-3-9.txt', 'https://sermonindex.net/speakers/zac-poonen/ephesians-ephesians-210-39/'),
              ('04-ephesians-3-10-to-4-22.txt', 'https://sermonindex.net/speakers/zac-poonen/ephesians-ephesians-310-422/'),
              ('05-ephesians-4-23-to-5-20.txt', 'https://sermonindex.net/speakers/zac-poonen/ephesians-ephesians-423-520/'),
              ('06-ephesians-5-21-to-6-11.txt', 'https://sermonindex.net/speakers/zac-poonen/ephesians-ephesians-521-611/'),
              ('07-ephesians-6-12-to-6-24.txt', 'https://sermonindex.net/speakers/zac-poonen/ephesians-ephesians-612-24/'),
          ]
          out = Path('/tmp/efeseni-transcripts')
          meta = []
          for name, url in sources:
              text = worker.extract_transcript(url)
              sha = worker.sha256(text)
              (out / name).write_text(text + '\n', encoding='utf-8')
              meta.append({'file': name, 'url': url, 'sha256': sha, 'words': len(text.split())})
              print(name, sha, len(text.split()))
          (out / 'manifest.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          PY
          cp docs/data/biblia-explicata/nt-final-source-first/10-efeseni.json /tmp/efeseni-transcripts/10-efeseni.json
          cp docs/data/biblia-explicata/nt-direct-transcript-coverage.json /tmp/efeseni-transcripts/nt-direct-transcript-coverage.json

      - uses: actions/upload-artifact@v4
        with:
          name: efeseni-full-transcripts
          path: /tmp/efeseni-transcripts
          if-no-files-found: error
          retention-days: 1
