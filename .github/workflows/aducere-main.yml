name: Aducere main in ramura

# FISIER TEMPORAR. Se sterge imediat dupa ce si-a facut treaba.
#
# DE CE EXISTA:
# main a primit cele trei daruri de zi (PR #5). Ramura asta are Portile si
# Drumul Emaus. Ca sa mearga mai departe amandoua, main trebuie adus aici.
# Nu am git in mana, doar API-ul GitHub, iar API-ul nu stie sa imbine cand
# exista conflicte - spune doar "422 merge conflict", fara sa spuna unde.
#
# CE STIU DINAINTE:
# Doar patru fisiere au fost atinse de amandoua partile:
#
#   packages/shared/src/index.ts   - barrel-ul
#   apps/web/src/router.tsx        - rutele
#   apps/web/src/App.tsx           - ecranele
#     Pe astea trei le-am scris deja de mana pe ramura, ca reuniune: si cele
#     cinci ecrane noi de pe main, si /drum de aici. Deci se ia versiunea de
#     pe ramura (--ours).
#
#   .github/workflows/branch-check.yml
#     Doua variante ale aceleiasi unelte. Cea de pe main isi raporteaza esecul
#     si cand rularea vine dintr-un push, nu doar dintr-un pull request. E mai
#     buna. Deci se ia versiunea de pe main (--theirs).
#
# DACA APARE ALTCEVA:
# Se opreste si spune pe pull request ce a gasit. Nu rezolva nimic pe ghicite;
# un fisier imbinat gresit in tacere e mai rau decat o imbinare care nu s-a
# facut.

on:
  push:
    branches: [agent/porti-continut-v1]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aducere-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imbina:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Imbina main in ramura
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" \
            "+refs/heads/main:refs/remotes/origin/main"
          git checkout -B "${GITHUB_REF_NAME}" "refs/remotes/origin/${GITHUB_REF_NAME}"
          git config user.name 'Emanus CI'
          git config user.email 'ci@emanus.local'

          if git merge --no-edit refs/remotes/origin/main; then
            echo 'S-a imbinat fara conflicte.'
          else
            git diff --name-only --diff-filter=U | sort > /tmp/conflicte.txt
            echo '=== fisiere in conflict ==='
            cat /tmp/conflicte.txt

            printf '%s\n' \
              '.github/workflows/branch-check.yml' \
              'apps/web/src/App.tsx' \
              'apps/web/src/router.tsx' \
              'packages/shared/src/index.ts' | sort > /tmp/asteptate.txt

            comm -23 /tmp/conflicte.txt /tmp/asteptate.txt > /tmp/nepregatite.txt
            if [ -s /tmp/nepregatite.txt ]; then
              echo 'Conflicte pe care nu le-am pregatit de mana:'
              cat /tmp/nepregatite.txt
              git merge --abort
              exit 1
            fi

            while read -r fisier; do
              case "${fisier}" in
                .github/workflows/branch-check.yml)
                  echo "iau de pe main: ${fisier}"
                  git checkout --theirs -- "${fisier}"
                  ;;
                *)
                  echo "iau de pe ramura, scris de mana: ${fisier}"
                  git checkout --ours -- "${fisier}"
                  ;;
              esac
              git add -- "${fisier}"
            done < /tmp/conflicte.txt

            git commit --no-edit
          fi

          echo '=== ce a intrat ==='
          git log --oneline -1
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo '=== ci-sandbox ==='
          git push origin refs/remotes/origin/main:refs/heads/ci-sandbox \
            || echo 'ci-sandbox nu se poate avansa in linie dreapta; il las cum e.'

      - name: Spune pe pull request unde s-a oprit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          PR=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" \
            --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "${PR}" ] || [ "${PR}" = "null" ]; then
            echo 'Nu exista pull request deschis pentru ramura asta.'
            exit 0
          fi
          {
            echo 'Aducerea lui main in ramura s-a oprit.'
            echo
            echo 'Fisiere in conflict:'
            cat /tmp/conflicte.txt 2>/dev/null || echo '(nu s-a apucat sa scrie lista)'
            echo
            echo 'Dintre care nepregatite de mana:'
            cat /tmp/nepregatite.txt 2>/dev/null || echo '(niciunul)'
          } > /tmp/text.txt
          jq -Rs '{body: .}' /tmp/text.txt > /tmp/body.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --input /tmp/body.json
