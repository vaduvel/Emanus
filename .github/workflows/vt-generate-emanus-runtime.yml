name: VT Generate Emanus Runtime

on:
  push:
    branches: [agent/biblia-explicata-vt-integration-clean]
    paths:
      - ".github/workflows/vt-generate-emanus-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0
          persist-credentials: true
      - name: Generate 39 per-book Emanus runtime modules
        run: |
          set -euo pipefail
          python3 scripts/materialize-published-emanus-ot-runtime.py
          python3 scripts/materialize-published-emanus-ot-runtime.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/bible/generated/publishedEmanusOtText.ts packages/shared/src/bible/generated/publishedEmanusOtText
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Split Emanus VT runtime by book"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
