name: Fix Exodus quote balance

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-fix-exodus-quotes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Close chapter-spanning quotations
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          changed=[]
          for p in sorted(root.glob('EXO.*.json'),key=lambda x:int(x.stem.split('.')[1])):
              d=json.loads(p.read_text(encoding='utf-8'))
              text=' '.join(v['text'] for v in d['verses'])
              opens=text.count('„'); closes=text.count('”')
              if opens==closes+1:
                  d['verses'][-1]['text']=d['verses'][-1]['text'].rstrip()+'”'
                  changed.append(p.name)
                  p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              elif opens!=closes:
                  raise SystemExit(f'{p.name}: dezechilibru neașteptat {opens}/{closes}')
          print('Închise:', ', '.join(changed))
          for p in sorted(root.glob('EXO.*.json'),key=lambda x:int(x.stem.split('.')[1])):
              d=json.loads(p.read_text(encoding='utf-8'))
              text=' '.join(v['text'] for v in d['verses'])
              assert text.count('„')==text.count('”'), p.name
          PY
          git rm .github/workflows/tmp-fix-exodus-quotes.yml
          git add docs/data/biblia-emanus/EXO.*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Balance Exodus chapter-spanning quotations"
          git push origin HEAD:agent/biblia-emanus-exodul
