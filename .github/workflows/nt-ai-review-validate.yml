name: NT AI Review Validate

on:
  pull_request:
    types: [edited]
    branches:
      - main

permissions:
  contents: write

jobs:
  hebrews-11-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Review, validate and commit Hebrews 11
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          json='docs/data/biblia-emanus/HEB.11.json'
          journal='docs/biblia-emanus/NT-AI-REVIEW-BATCH-2026-08-08-HEB.11.md'
          python3 scripts/build-nt-editorial-review-queue.py --check
          if test -f "$journal"; then
            echo 'HEB.11 already reviewed; skipping chapter commit.'
          else
            python3 .github/nt-ai-review/heb11.py
            git diff --check
            pnpm check:biblia-emanus
            python3 scripts/check-biblia-emanus-romanian-quality.py
            pnpm check:biblia-emanus-nt-withheld
            python3 scripts/withhold-biblia-emanus-nt.py --check
            pnpm check:biblia-emanus-nt-runtime
            pnpm test:biblia-emanus
            git add "$json" "$journal"
            changed="$(git diff --cached --name-only)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
            printf '%s\n' "$changed" | grep -Fx "$json"
            printf '%s\n' "$changed" | grep -Fx "$journal"
            git diff --cached --check
            git commit -m 'review(biblia): audit Hebrews 11 verse by verse'
          fi
          python3 scripts/build-nt-editorial-review-queue.py
          python3 scripts/build-nt-editorial-review-queue.py --check
          pnpm check:biblia-emanus
          python3 scripts/check-biblia-emanus-romanian-quality.py
          pnpm check:biblia-emanus-nt-withheld
          python3 scripts/withhold-biblia-emanus-nt.py --check
          pnpm check:biblia-emanus-nt-runtime
          pnpm test:biblia-emanus
          git diff --check
          if ! git diff --quiet -- docs/biblia-emanus/NT-EDITORIAL-REVIEW-QUEUE.json; then
            git add docs/biblia-emanus/NT-EDITORIAL-REVIEW-QUEUE.json
            test "$(git diff --cached --name-only | wc -l)" -eq 1
            git diff --cached --check
            git commit -m 'chore(biblia): regenerate NT editorial review queue'
          fi
          if git log --oneline "origin/codex/nt-ai-review-handoff..HEAD" | grep -q .; then
            git push origin HEAD:codex/nt-ai-review-handoff
          else
            echo 'No new editorial commits to push.'
          fi
