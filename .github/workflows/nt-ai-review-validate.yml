name: NT AI Review Validate

on:
  pull_request:
    types: [edited]
    branches:
      - main

permissions:
  contents: write

jobs:
  first-peter-source-materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Materialize pinned 1 Peter witnesses
        run: |
          set -euo pipefail
          ZIP=docs/data/biblia-emanus/sources/nt-sblgnt-1.2.zip
          EXPECTED=29b8762199eb87757ec36961097b817cb2b569557d95348a70fac66c0262f424
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "$EXPECTED"
          unzip -t "$ZIP" >/dev/null
          OUT=.github/nt-ai-review/1pe-source
          mkdir -p "$OUT"
          unzip -p "$ZIP" sblgnt/text/1Pet.txt > "$OUT/sblgnt.txt"
          unzip -p "$ZIP" sblgnt/apparatus/text/1Pet.txt > "$OUT/apparatus.txt"
          unzip -p "$ZIP" tr/1PE.usfm > "$OUT/tr.usfm"
          unzip -p "$ZIP" webp/1PE.usfm > "$OUT/webp.usfm"
          unzip -p "$ZIP" btf/1PE.usfm > "$OUT/btf.usfm"
          unzip -p "$ZIP" cornilescu1924/1PE.usfm > "$OUT/cornilescu1924.usfm"
          unzip -p "$ZIP" biblia-libera/1PE.usfm > "$OUT/biblia-libera.usfm"
          for f in sblgnt.txt apparatus.txt tr.usfm webp.usfm btf.usfm cornilescu1924.usfm biblia-libera.usfm; do test -s "$OUT/$f"; done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT"
          if git diff --cached --quiet; then
            echo '1 Peter sources already materialized.'
          else
            git diff --cached --check
            git commit -m 'chore(biblia): materialize pinned 1 Peter sources'
            git push origin HEAD:codex/nt-ai-review-handoff
          fi
