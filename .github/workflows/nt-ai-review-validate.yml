name: NT AI Review Validate

on:
  pull_request:
    types: [edited]
    branches:
      - main

permissions:
  contents: read

jobs:
  first-peter-source-paths:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Inspect pinned archive paths for 1 Peter
        run: |
          set -euo pipefail
          ZIP=docs/data/biblia-emanus/sources/nt-sblgnt-1.2.zip
          EXPECTED=29b8762199eb87757ec36961097b817cb2b569557d95348a70fac66c0262f424
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "$EXPECTED"
          unzip -t "$ZIP" >/dev/null
          unzip -Z1 "$ZIP" | grep -Ei '(^|/)(1.?pet|1pe|petru|peter|petr)' | head -100
