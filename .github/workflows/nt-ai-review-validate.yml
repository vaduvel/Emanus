name: NT AI Review Validate

on:
  pull_request:
    types: [edited]
    branches:
      - main

permissions:
  contents: read

jobs:
  hebrews-10-13-source-inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Print pinned Hebrews 10-13 source slices
        run: |
          set -euo pipefail
          ZIP=docs/data/biblia-emanus/sources/nt-sblgnt-1.2.zip
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "29b8762199eb87757ec36961097b817cb2b569557d95348a70fac66c0262f424"
          for ch in 10 11 12 13; do
            echo "=== SBLGNT HEBREWS $ch ==="
            unzip -p "$ZIP" sblgnt/text/HEB.txt | grep "^Heb ${ch}:"
            echo "=== APPARATUS HEBREWS $ch ==="
            next=$((ch+1))
            if [ "$ch" -eq 13 ]; then
              unzip -p "$ZIP" sblgnt/apparatus/text/HEB.txt | sed -n "/Hebrews 13:/,$ p"
            else
              unzip -p "$ZIP" sblgnt/apparatus/text/HEB.txt | sed -n "/Hebrews ${ch}:/,/Hebrews ${next}:/p"
            fi
          done
          echo '=== AUX COUNTS ==='
          for ch in 10 11 12 13; do
            expected=$(case "$ch" in 10) echo 39;; 11) echo 40;; 12) echo 29;; 13) echo 25;; esac)
            for f in webp btf cornilescu1924 biblia-libera; do
              unzip -p "$ZIP" "$f/HEB.usfm" | awk -v c="$ch" 'BEGIN{p=0;n=0} $0=="\\c " c "  "{p=1;next} p&&/^\\c /{p=0} p&&/^\\v /{n++} END{print n}' | grep -Fx "$expected"
            done
          done
