name: NT AI Review Validate

on:
  pull_request:
    types: [edited]
    branches:
      - main

permissions:
  contents: read

jobs:
  hebrews-6-source-inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Print pinned Hebrews 6 source slices
        run: |
          set -euo pipefail
          ZIP=docs/data/biblia-emanus/sources/nt-sblgnt-1.2.zip
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "29b8762199eb87757ec36961097b817cb2b569557d95348a70fac66c0262f424"
          unzip -p "$ZIP" sblgnt/text/HEB.txt | grep '^Heb 6:'
          echo '--- APPARATUS HEBREWS 6 ---'
          unzip -p "$ZIP" sblgnt/apparatus/text/HEB.txt | sed -n '/Hebrews 6:2/,/Hebrews 7:1/p'
          echo '--- TR HEBREWS 6 ---'
          unzip -p "$ZIP" tr/HEB.usfm | awk 'BEGIN{p=0} /^\\c 6/{p=1} /^\\c 7/{p=0} p'
          echo '--- AUXILIARY HEBREWS 6 PRESENT ---'
          for f in webp btf cornilescu1924 biblia-libera; do unzip -p "$ZIP" "$f/HEB.usfm" | awk 'BEGIN{p=0;c=0} /^\\c 6/{p=1} /^\\c 7/{p=0} p&&/^\\v /{c++} END{print c}' | grep -Fx '20'; done
