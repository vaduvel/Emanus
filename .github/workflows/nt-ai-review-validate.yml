name: NT AI Review Validate

on:
  pull_request:
    types: [edited]
    branches:
      - main

permissions:
  contents: write

jobs:
  revelation-source-materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/nt-ai-review-handoff
          fetch-depth: 0
      - name: Materialize pinned Revelation witnesses
        run: |
          set -euo pipefail
          ZIP=docs/data/biblia-emanus/sources/nt-sblgnt-1.2.zip
          EXPECTED=29b8762199eb87757ec36961097b817cb2b569557d95348a70fac66c0262f424
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "$EXPECTED"
          unzip -t "$ZIP" >/dev/null
          OUT=.github/nt-ai-review/rev-source
          mkdir -p "$OUT"
          unzip -p "$ZIP" sblgnt/text/REV.txt > "$OUT/sblgnt.txt"
          unzip -p "$ZIP" sblgnt/apparatus/text/REV.txt > "$OUT/apparatus.txt"
          unzip -p "$ZIP" tr/REV.usfm > "$OUT/tr.usfm"
          unzip -p "$ZIP" webp/REV.usfm > "$OUT/webp.usfm"
          unzip -p "$ZIP" btf/REV.usfm > "$OUT/btf.usfm"
          unzip -p "$ZIP" cornilescu1924/REV.usfm > "$OUT/cornilescu1924.usfm"
          unzip -p "$ZIP" biblia-libera/REV.usfm > "$OUT/biblia-libera.usfm"
          for f in sblgnt.txt apparatus.txt tr.usfm webp.usfm btf.usfm cornilescu1924.usfm biblia-libera.usfm; do test -s "$OUT/$f"; done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT"
          if git diff --cached --quiet; then
            echo 'Revelation sources already materialized.'
          else
            git diff --cached --check
            git commit -m 'chore(biblia): materialize pinned Revelation sources'
            git push origin HEAD:codex/nt-ai-review-handoff
          fi
