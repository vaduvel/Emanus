name: NT Explanation Recovery

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nt-explanation-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/biblia-explicata-nt-integration-clean')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout clean integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - name: Fetch immutable legacy explanation source
        run: |
          set -euo pipefail
          git fetch origin agent/complete-new-testament:refs/remotes/origin/agent/complete-new-testament
          rm -rf ../nt-legacy
          git worktree add --detach ../nt-legacy refs/remotes/origin/agent/complete-new-testament

      - name: Compile legacy shared catalog only
        working-directory: ../nt-legacy
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @emanus/shared build

      - name: Materialize explanation-only NT recovery
        run: |
          set -euo pipefail
          node scripts/materialize-nt-explanations-from-legacy.mjs --legacy-root ../nt-legacy
          node scripts/check-nt-explanation-recovery.mjs
          mkdir -p docs/data/biblia-explicata/nt-source-registry
          cp docs/data/biblia-explicata/source-registry-protected/source-first-12.json docs/data/biblia-explicata/nt-source-registry/source-first-12.json
          cp docs/data/biblia-explicata/source-registry-protected/source-first-15.json docs/data/biblia-explicata/nt-source-registry/source-first-15.json

      - name: Rebuild quarantined books source-first
        run: |
          set -euo pipefail
          node scripts/materialize-nt-source-first.mjs
          node scripts/check-nt-source-first.mjs

      - name: Audit and clean recovered source-first books
        run: |
          set -euo pipefail
          node scripts/audit-nt-recovered-source-first.mjs
          node scripts/materialize-nt-audited-recovered.mjs
          node scripts/check-nt-audited-recovered.mjs

      - name: Combine and verify final 27-book source-first corpus
        run: |
          set -euo pipefail
          node scripts/materialize-nt-final-source-first.mjs
          node scripts/check-nt-final-source-first.mjs
          git diff --check

      - name: Commit deterministic NT editorial snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-explicata docs/biblia-explicata
          if git diff --cached --quiet; then
            echo "NT snapshots already current."
            exit 0
          fi
          git commit -m "Materialize final NT source-first corpus"
          git pull --rebase origin agent/biblia-explicata-nt-integration-clean
          git push origin HEAD:agent/biblia-explicata-nt-integration-clean
