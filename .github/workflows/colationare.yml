name: Colationeaza Geneza

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collate-bible.py"

permissions:
  contents: write

jobs:
  colationare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Colationeaza
        run: python3 scripts/collate-bible.py

      - name: Pune raportul in proiect
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "docs(biblia): raportul colationarii Genezei"
            git push
          else
            echo "Raportul nu s-a schimbat."
          fi
