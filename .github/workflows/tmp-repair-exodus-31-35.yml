name: Repair Exodus 31-35

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-repair-exodus-31-35.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Rebuild and audit Exodus 31-35
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          texts={
          31:[
          'DOMNUL i-a vorbit lui Moise și i-a spus:',
          '„Iată, l-am chemat pe nume pe Bețaleel, fiul lui Uri, fiul lui Hur, din seminția lui Iuda.',
          'L-am umplut cu Duhul lui Dumnezeu, cu înțelepciune, pricepere, cunoaștere și îndemânare în orice meșteșug,',
          'ca să conceapă lucrări artistice și să lucreze în aur, argint și bronz,',
          'să taie pietre pentru montare, să cioplească lemnul și să lucreze în orice meșteșug.',
          'Iată, l-am rânduit împreună cu el pe Oholiab, fiul lui Ahisamac, din seminția lui Dan. Am pus înțelepciune în inima tuturor celor pricepuți, ca să facă tot ce ți-am poruncit:',
          'Cortul Întâlnirii, chivotul Mărturiei, capacul ispășirii care este deasupra lui și toate obiectele Cortului,',
          'masa cu obiectele ei, sfeșnicul curat cu toate obiectele lui, altarul tămâierii,',
          'altarul arderii-de-tot cu toate uneltele lui și ligheanul cu suportul său,',
          'veșmintele lucrate pentru slujire, veșmintele sfinte ale preotului Aaron și veșmintele fiilor lui pentru slujirea preoțească,',
          'untdelemnul ungerii și tămâia parfumată pentru Locul Sfânt. Ei să facă totul după cum ți-am poruncit.”',
          'DOMNUL i-a vorbit lui Moise și i-a spus:',
          '„Vorbește-le și fiilor lui Israel: «Să păziți cu grijă Sabaturile Mele, căci acesta este un semn între Mine și voi din generație în generație, ca să știți că Eu sunt DOMNUL, Cel care vă sfințește.',
          'Să păziți Sabatul, căci este sfânt pentru voi. Cine îl profanează să fie omorât; oricine face muncă în ziua aceea va fi îndepărtat din mijlocul poporului său.',
          'Șase zile să se lucreze, dar ziua a șaptea este un Sabat de odihnă deplină, sfânt pentru DOMNUL. Oricine face muncă în ziua Sabatului să fie omorât.',
          'Fiii lui Israel să păzească Sabatul, ținând Sabatul din generație în generație ca legământ veșnic.',
          'El este un semn pentru totdeauna între Mine și fiii lui Israel, căci în șase zile DOMNUL a făcut cerurile și pământul, iar în ziua a șaptea S-a oprit și S-a înviorat.»”',
          'Când a terminat de vorbit cu Moise pe muntele Sinai, Dumnezeu i-a dat cele două table ale Mărturiei, table de piatră scrise cu degetul lui Dumnezeu.'],
          32:[
          'Când poporul a văzut că Moise întârzia să coboare de pe munte, s-a strâns în jurul lui Aaron și i-a spus: „Ridică-te și fă-ne dumnezei care să meargă înaintea noastră, căci nu știm ce s-a întâmplat cu acest Moise, omul care ne-a scos din țara Egiptului.”',
          'Aaron le-a spus: „Scoateți cerceii de aur din urechile soțiilor, fiilor și fiicelor voastre și aduceți-i la mine.”',
          'Tot poporul și-a scos cerceii de aur din urechi și i-a adus lui Aaron.',
          'El a luat aurul din mâinile lor, i-a dat formă cu o unealtă și a făcut un vițel turnat. Ei au spus: „Aceștia sunt dumnezeii tăi, Israel, care te-au scos din țara Egiptului!”',
          'Când Aaron a văzut aceasta, a construit un altar înaintea vițelului și a vestit: „Mâine va fi o sărbătoare pentru DOMNUL.”',
          'A doua zi s-au sculat devreme, au adus arderi-de-tot și jertfe de pace. Poporul s-a așezat să mănânce și să bea, apoi s-a ridicat să petreacă.',
          'DOMNUL i-a spus lui Moise: „Coboară, căci poporul tău, pe care l-ai scos din țara Egiptului, s-a corupt.',
          'S-au abătut repede de la calea pe care le-am poruncit-o. Și-au făcut un vițel turnat, s-au plecat înaintea lui, i-au adus jertfe și au spus: «Aceștia sunt dumnezeii tăi, Israel, care te-au scos din țara Egiptului!»”',
          'DOMNUL i-a mai spus lui Moise: „Am văzut poporul acesta și iată că este un popor cu gâtul înțepenit.',
          'Acum lasă-Mă! Mânia Mea se va aprinde împotriva lor și îi voi nimici, iar din tine voi face un popor mare.”',
          'Dar Moise a căutat bunăvoința DOMNULUI, Dumnezeul său, și a spus: „DOMNULE, de ce să se aprindă mânia Ta împotriva poporului Tău, pe care l-ai scos din țara Egiptului cu putere mare și cu mână tare?',
          'De ce să spună egiptenii: «Cu intenție rea i-a scos, ca să-i omoare în munți și să-i șteargă de pe fața pământului»? Întoarce-Te de la mânia Ta aprinsă și renunță la nenorocirea hotărâtă împotriva poporului Tău.',
          'Adu-Ți aminte de Avraam, Isaac și Israel, slujitorii Tăi, cărora le-ai jurat pe Tine Însuți: «Voi înmulți urmașii voștri ca stelele cerului și voi da urmașilor voștri toată țara despre care am vorbit, iar ei o vor moșteni pentru totdeauna.»”',
          'Atunci DOMNUL a renunțat la nenorocirea despre care spusese că o va aduce asupra poporului Său.',
          'Moise s-a întors și a coborât de pe munte, având în mâini cele două table ale Mărturiei, table scrise pe ambele părți, pe o parte și pe cealaltă.',
          'Tablele erau lucrarea lui Dumnezeu, iar scrierea era scrierea lui Dumnezeu, gravată pe table.',
          'Când Iosua a auzit glasul poporului care striga, i-a spus lui Moise: „Se aude zgomot de război în tabără!”',
          'Moise a răspuns: „Nu este glas de strigăt al biruitorilor și nici glas de strigăt al învinșilor; eu aud glas de cântare.”',
          'Când s-a apropiat de tabără și a văzut vițelul și dansurile, mânia lui Moise s-a aprins. A aruncat tablele din mâini și le-a sfărâmat la poalele muntelui.',
          'A luat vițelul pe care îl făcuseră, l-a ars în foc, l-a măcinat până s-a făcut pulbere, a presărat pulberea pe apă și i-a pus pe fiii lui Israel să o bea.',
          'Moise i-a spus lui Aaron: „Ce ți-a făcut poporul acesta de ai adus asupra lui un păcat atât de mare?”',
          'Aaron a răspuns: „Să nu se aprindă mânia stăpânului meu! Tu știi că poporul este înclinat spre rău.',
          'Ei mi-au spus: «Fă-ne dumnezei care să meargă înaintea noastră, căci nu știm ce s-a întâmplat cu acest Moise, omul care ne-a scos din țara Egiptului.»',
          'Eu le-am spus: «Cine are aur să-l scoată.» Mi l-au dat, eu l-am aruncat în foc și a ieșit vițelul acesta.”',
          'Moise a văzut că poporul scăpase de sub control, căci Aaron îl lăsase fără frâu, spre batjocura dușmanilor lui.',
          'Atunci Moise s-a așezat la intrarea taberei și a spus: „Cine este de partea DOMNULUI să vină la mine!” Toți fiii lui Levi s-au strâns în jurul lui.',
          'El le-a spus: „Așa vorbește DOMNUL, Dumnezeul lui Israel: «Fiecare să-și pună sabia la coapsă. Treceți și întoarceți-vă prin tabără, de la o intrare la alta, și fiecare să-l omoare pe fratele său, pe prietenul său și pe semenul său.»”',
          'Fiii lui Levi au făcut după cuvântul lui Moise, iar în ziua aceea au căzut din popor aproximativ trei mii de bărbați.',
          'Moise a spus: „Astăzi v-ați învestit pentru DOMNUL, fiecare cu prețul fiului și al fratelui său, pentru ca El să vă dea astăzi o binecuvântare.”',
          'A doua zi, Moise a spus poporului: „Ați comis un păcat mare. Acum mă voi urca la DOMNUL; poate voi putea face ispășire pentru păcatul vostru.”',
          'Moise s-a întors la DOMNUL și a spus: „O, poporul acesta a comis un păcat mare și și-a făcut dumnezei de aur!',
          'Acum, Te rog, iartă-le păcatul! Dacă nu, șterge-mă, Te rog, din cartea Ta pe care ai scris-o.”',
          'DOMNUL i-a spus lui Moise: „Pe cel care a păcătuit împotriva Mea îl voi șterge din cartea Mea.',
          'Acum du-te și condu poporul spre locul despre care ți-am vorbit. Iată, Îngerul Meu va merge înaintea ta. Dar în ziua când voi cerceta, îi voi pedepsi pentru păcatul lor.”',
          'DOMNUL a lovit poporul din cauza vițelului pe care îl făcuseră, vițelul făcut de Aaron.'],
          33:[
          'DOMNUL i-a spus lui Moise: „Pleacă și urcă de aici, tu și poporul pe care l-ai scos din țara Egiptului, spre țara despre care le-am jurat lui Avraam, Isaac și Iacov: «O voi da urmașilor voștri.»',
          'Voi trimite înaintea ta un înger și îi voi izgoni pe canaaniți, amoriți, hetiți, periziți, heviți și iebusiți.',
          'Urcă spre țara în care curge lapte și miere. Dar Eu nu voi urca în mijlocul tău, pentru că ești un popor cu gâtul înțepenit, ca să nu te nimicesc pe drum.”',
          'Când poporul a auzit această veste rea, a început să jelească și nimeni nu și-a pus podoabele.',
          'DOMNUL îi spusese lui Moise: „Spune-le fiilor lui Israel: «Sunteți un popor cu gâtul înțepenit. Dacă aș urca o singură clipă în mijlocul vostru, v-aș nimici. Acum scoateți-vă podoabele, iar Eu voi hotărî ce să fac cu voi.»”',
          'Astfel, fiii lui Israel și-au scos podoabele de la muntele Horeb înainte.',
          'Moise obișnuia să ia un cort și să-l ridice în afara taberei, departe de tabără, și îl numea Cortul Întâlnirii. Oricine Îl căuta pe DOMNUL ieșea la Cortul Întâlnirii, care era în afara taberei.',
          'Când Moise ieșea spre Cort, tot poporul se ridica și fiecare stătea la intrarea cortului său, urmărindu-l pe Moise până când intra în Cort.',
          'Când Moise intra în Cort, stâlpul de nor cobora și se oprea la intrarea Cortului, iar DOMNUL vorbea cu Moise.',
          'Tot poporul vedea stâlpul de nor oprit la intrarea Cortului. Atunci tot poporul se ridica și fiecare se închina la intrarea cortului său.',
          'DOMNUL vorbea cu Moise față în față, așa cum vorbește un om cu prietenul său. Apoi Moise se întorcea în tabără, dar slujitorul lui, Iosua, fiul lui Nun, un tânăr, nu se îndepărta din Cort.',
          'Moise I-a spus DOMNULUI: „Iată, Tu îmi spui: «Condu poporul acesta», dar nu mi-ai făcut cunoscut pe cine vei trimite împreună cu mine. Totuși, ai spus: «Te cunosc pe nume și ai găsit bunăvoință în ochii Mei.»',
          'Acum, dacă am găsit bunăvoință în ochii Tăi, fă-mi cunoscute, Te rog, căile Tale, ca să Te cunosc și să găsesc în continuare bunăvoință în ochii Tăi. Privește că poporul acesta este poporul Tău.”',
          'DOMNUL a răspuns: „Prezența Mea va merge cu tine și îți voi da odihnă.”',
          'Moise I-a spus: „Dacă Prezența Ta nu merge cu noi, nu ne face să plecăm de aici.',
          'Prin ce se va cunoaște că eu și poporul Tău am găsit bunăvoință în ochii Tăi? Nu prin faptul că mergi cu noi, astfel încât eu și poporul Tău să fim deosebiți de toate popoarele de pe fața pământului?”',
          'DOMNUL i-a spus lui Moise: „Voi face și lucrul acesta pe care l-ai cerut, căci ai găsit bunăvoință în ochii Mei și te cunosc pe nume.”',
          'Moise a spus: „Arată-mi, Te rog, gloria Ta!”',
          'DOMNUL a răspuns: „Voi face să treacă înaintea ta toată bunătatea Mea și voi proclama înaintea ta Numele DOMNULUI. Voi arăta har cui voi arăta har și voi avea milă de cine voi avea milă.”',
          'El a mai spus: „Nu poți să-Mi vezi fața, căci omul nu Mă poate vedea și să trăiască.”',
          'DOMNUL a spus: „Iată un loc lângă Mine; să stai pe stâncă.',
          'Când va trece gloria Mea, te voi pune într-o crăpătură a stâncii și te voi acoperi cu mâna Mea până voi trece.',
          'Apoi Îmi voi lua mâna și Mă vei vedea din urmă, dar fața Mea nu va fi văzută.”'],
          34:[
          'DOMNUL i-a spus lui Moise: „Cioplește două table de piatră asemenea celor dintâi. Eu voi scrie pe table cuvintele care erau pe primele table, pe care le-ai sfărâmat.',
          'Fii gata dimineață. Urcă dimineață pe muntele Sinai și înfățișează-te înaintea Mea acolo, pe vârful muntelui.',
          'Nimeni să nu urce împreună cu tine și nimeni să nu fie văzut pe tot muntele. Nici turmele, nici cirezile să nu pască înaintea muntelui.”',
          'Moise a cioplit două table de piatră asemenea celor dintâi. S-a sculat dis-de-dimineață și s-a urcat pe muntele Sinai, așa cum îi poruncise DOMNUL, având în mână cele două table de piatră.',
          'DOMNUL a coborât în nor, a stat acolo împreună cu el și a proclamat Numele DOMNULUI.',
          'DOMNUL a trecut pe dinaintea lui și a proclamat: „DOMNUL! DOMNUL! Dumnezeu milos și plin de har, încet la mânie, bogat în bunătate statornică și credincioșie,',
          'Care păstrează bunătatea statornică pentru mii, iartă nelegiuirea, răzvrătirea și păcatul, dar nu-l declară nevinovat pe cel vinovat; cercetează vina părinților în copii și în copiii copiilor, până la a treia și a patra generație.”',
          'Moise s-a grăbit, s-a plecat cu fața la pământ și s-a închinat.',
          'El a spus: „Stăpâne, dacă am găsit bunăvoință în ochii Tăi, Te rog să mergi în mijlocul nostru, chiar dacă este un popor cu gâtul înțepenit. Iartă nelegiuirea și păcatul nostru și ia-ne ca moștenire a Ta.”',
          'DOMNUL a răspuns: „Iată, închei un legământ. Înaintea întregului tău popor voi face minuni cum nu s-au mai făcut în tot pământul și în nicio națiune. Tot poporul în mijlocul căruia te afli va vedea lucrarea DOMNULUI, căci înfricoșător este ceea ce voi face cu tine.',
          'Păzește ceea ce îți poruncesc astăzi. Iată, îi voi izgoni dinaintea ta pe amoriți, canaaniți, hetiți, periziți, heviți și iebusiți.',
          'Ai grijă să nu închei legământ cu locuitorii țării în care mergi, ca să nu devină o cursă în mijlocul tău.',
          'Dimpotrivă, să le dărâmați altarele, să le sfărâmați stâlpii sacri și să le tăiați așerele.',
          'Să nu te închini altui dumnezeu, căci DOMNUL, al Cărui Nume este Gelos, este un Dumnezeu gelos.',
          'Să nu închei legământ cu locuitorii țării, ca nu cumva, prostituându-se după dumnezeii lor și aducând jertfe dumnezeilor lor, cineva să te invite și tu să mănânci din jertfa lui.',
          'Să nu iei dintre fiicele lor pentru fiii tăi, ca nu cumva fiicele lor, prostituându-se după dumnezeii lor, să-i facă și pe fiii tăi să se prostitueze după dumnezeii lor.',
          'Să nu-ți faci dumnezei turnați.',
          'Să păzești Sărbătoarea Azimelor. Timp de șapte zile să mănânci azime, așa cum ți-am poruncit, la timpul hotărât în luna Abib, căci în luna Abib ai ieșit din Egipt.',
          'Orice întâi venit care deschide pântecele este al Meu, precum și orice întâi născut de parte bărbătească al vitelor și oilor tale.',
          'Să răscumperi întâiul născut al măgăriței cu un animal din turmă, iar dacă nu-l răscumperi, să-i frângi gâtul. Să răscumperi orice întâi născut dintre fiii tăi. Nimeni să nu se înfățișeze înaintea Mea cu mâna goală.',
          'Șase zile să lucrezi, dar în ziua a șaptea să te odihnești; chiar și în timpul aratului și al secerișului să te odihnești.',
          'Să păzești Sărbătoarea Săptămânilor, cu primele roade ale secerișului grâului, și Sărbătoarea Strângerii Roadelor la încheierea anului.',
          'De trei ori pe an, toți bărbații tăi să se înfățișeze înaintea Stăpânului, DOMNUL, Dumnezeul lui Israel.',
          'Căci voi izgoni națiunile dinaintea ta și îți voi lărgi hotarele. Nimeni nu-ți va pofti țara când te vei urca să te înfățișezi înaintea DOMNULUI, Dumnezeul tău, de trei ori pe an.',
          'Să nu aduci sângele jertfei Mele împreună cu pâine dospită, iar jertfa Sărbătorii Paștelui să nu rămână până dimineață.',
          'Să aduci cele dintâi dintre primele roade ale pământului tău în Casa DOMNULUI, Dumnezeul tău. Să nu fierbi un ied în laptele mamei sale.”',
          'DOMNUL i-a spus lui Moise: „Scrie aceste cuvinte, căci pe temeiul acestor cuvinte am încheiat un legământ cu tine și cu Israel.”',
          'Moise a rămas acolo cu DOMNUL patruzeci de zile și patruzeci de nopți. Nu a mâncat pâine și nu a băut apă. A scris pe table cuvintele legământului, Cele Zece Cuvinte.',
          'Când Moise a coborât de pe muntele Sinai, având în mână cele două table ale Mărturiei, nu știa că pielea feței lui strălucea pentru că vorbise cu Dumnezeu.',
          'Aaron și toți fiii lui Israel l-au văzut pe Moise și iată că pielea feței lui strălucea, iar ei s-au temut să se apropie de el.',
          'Moise i-a chemat, iar Aaron și toate căpeteniile comunității s-au întors la el. Moise le-a vorbit.',
          'După aceea s-au apropiat toți fiii lui Israel, iar el le-a poruncit tot ce îi spusese DOMNUL pe muntele Sinai.',
          'Când Moise a terminat de vorbit cu ei, și-a pus o învelitoare pe față.',
          'Ori de câte ori Moise intra înaintea DOMNULUI ca să vorbească cu El, își scotea învelitoarea până când ieșea. Când ieșea, le spunea fiilor lui Israel ce îi fusese poruncit.',
          'Fiii lui Israel vedeau că pielea feței lui Moise strălucea. Atunci Moise își punea din nou învelitoarea pe față până când intra să vorbească cu Dumnezeu.'],
          35:[
          'Moise a adunat întreaga comunitate a fiilor lui Israel și le-a spus: „Acestea sunt lucrurile pe care DOMNUL a poruncit să le faceți:',
          'Șase zile să se lucreze, dar ziua a șaptea să fie pentru voi o zi sfântă, un Sabat de odihnă deplină pentru DOMNUL. Oricine face muncă în ziua aceea să fie omorât.',
          'Să nu aprindeți foc în niciuna dintre locuințele voastre în ziua Sabatului.”',
          'Moise a vorbit întregii comunități a fiilor lui Israel și a spus: „Iată ce a poruncit DOMNUL:',
          'Luați dintre bunurile voastre o contribuție pentru DOMNUL. Oricine are inima binevoitoare să aducă drept contribuție pentru DOMNUL aur, argint și bronz,',
          'fir albastru, purpuriu și stacojiu, in fin, păr de capră,',
          'piei de berbec vopsite în roșu, piei fine și lemn de salcâm,',
          'ulei pentru lumină, mirodenii pentru untdelemnul ungerii și pentru tămâia parfumată,',
          'pietre de onix și pietre de montat pentru efod și pieptar.',
          'Toți cei pricepuți dintre voi să vină și să facă tot ce a poruncit DOMNUL:',
          'Cortul, acoperământul și învelișul lui, copcile, scândurile, drugii, stâlpii și soclurile lui;',
          'chivotul cu drugii lui, capacul ispășirii și perdeaua despărțitoare;',
          'masa cu drugii și toate obiectele ei și pâinea Prezenței;',
          'sfeșnicul pentru lumină cu obiectele, candelele și uleiul lui;',
          'altarul tămâierii cu drugii lui, untdelemnul ungerii, tămâia parfumată și paravanul de la intrarea Cortului;',
          'altarul arderii-de-tot cu grătarul lui de bronz, drugii și toate uneltele lui, ligheanul și suportul lui;',
          'pânzele curții, stâlpii, soclurile și paravanul de la intrarea curții;',
          'țărușii Cortului, țărușii curții și funiile lor;',
          'veșmintele lucrate pentru slujirea în Locul Sfânt, veșmintele sfinte ale preotului Aaron și veșmintele fiilor lui pentru slujirea preoțească.”',
          'Întreaga comunitate a fiilor lui Israel a plecat dinaintea lui Moise.',
          'Apoi au venit toți cei a căror inimă îi îndemna și al căror duh îi făcea binevoitori și au adus contribuția DOMNULUI pentru lucrarea Cortului Întâlnirii, pentru întreaga lui slujire și pentru veșmintele sfinte.',
          'Au venit atât bărbați, cât și femei, toți cei cu inimă binevoitoare, și au adus broșe, cercei, inele, brățări și tot felul de obiecte de aur. Fiecare a adus un dar de aur pentru DOMNUL.',
          'Oricine avea fir albastru, purpuriu sau stacojiu, in fin, păr de capră, piei de berbec vopsite în roșu sau piei fine le-a adus.',
          'Oricine aducea o contribuție de argint sau de bronz a adus-o ca dar pentru DOMNUL, iar oricine avea lemn de salcâm potrivit pentru vreo lucrare a slujirii l-a adus.',
          'Toate femeile pricepute au tors cu mâinile lor și au adus ce torseseră: fir albastru, purpuriu și stacojiu și in fin.',
