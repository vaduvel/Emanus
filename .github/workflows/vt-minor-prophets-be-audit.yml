name: VT Minor Prophets Canonical Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vt-minor-prophets-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-all-minor-prophets:
    if: github.head_ref == 'agent/biblia-explicata-vt-integration-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Fetch legacy BE candidate branch
        run: git fetch origin agent/biblia-emanus-ot-and-apocrypha:refs/remotes/origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Validate all promoted minor prophets
        run: |
          set -euo pipefail
          for book in HOS JOL AMO OBA JON MIC NAM HAB ZEP HAG ZEC MAL; do
            python3 scripts/check-biblia-emanus-book.py --book "$book"
            python3 scripts/seal-biblia-emanus.py --book "$book" --check
          done

      - name: Materialize current VT catalog
        run: |
          python3 scripts/materialize-vt-overlay-texts.py \
            --source-ref origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Validate full Biblia Emanus corpus
        run: python3 scripts/check-biblia-emanus-corpus.py

      - name: Validate VT reader and legacy provenance
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile
          pnpm check:vt-legacy-provenance
          pnpm check:vt-explained
          pnpm check:vt-publication
          pnpm --filter @emanus/shared typecheck
