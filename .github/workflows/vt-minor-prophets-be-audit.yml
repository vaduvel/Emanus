name: VT Minor Prophets Fresh Source Capture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture-and-audit:
    if: github.head_ref == 'agent/biblia-explicata-vt-integration-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - name: Fetch legacy BE candidate branch
        run: git fetch origin agent/biblia-emanus-ot-and-apocrypha:refs/remotes/origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Download current official source archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/engwebp_current.zip https://ebible.org/Scriptures/engwebp_usfm.zip
          curl --fail --location --retry 3 --output /tmp/hboWLC_current.zip https://ebible.org/Scriptures/hboWLC_usfm.zip
          curl --fail --location --retry 3 --output /tmp/ronbtf_current.zip https://ebible.org/Scriptures/ronbtf_usfm.zip
          curl --fail --location --retry 3 --output /tmp/ron1924_current.zip https://ebible.org/Scriptures/ron1924_usfm.zip

      - name: Capture NEW deterministic HOS-MAL source snapshot
        run: |
          python3 scripts/capture-minor-prophets-sources.py \
            --webu-zip /tmp/engwebp_current.zip \
            --wlc-zip /tmp/hboWLC_current.zip

      - name: Verify remaining legacy candidates against fresh per-book source locks
        run: |
          python3 scripts/audit-minor-prophets-be-candidates.py \
            --source-ref origin/agent/biblia-emanus-ot-and-apocrypha \
            --webu-zip /tmp/engwebp_current.zip \
            --wlc-zip /tmp/hboWLC_current.zip \
            --exclude-book HOS \
            --exclude-book JOL

      - name: Build Osea fresh-source re-audit packet with explicit WLC mapping
        run: python3 scripts/prepare-minor-prophet-reaudit.py --book HOS

      - name: Extract compact Osea boundary reviews
        run: python3 scripts/extract-hosea-versification-boundaries.py

      - name: Split Osea into semantic-review chapters
        run: python3 scripts/split-minor-prophet-reaudit.py --book HOS

      - name: Build remaining minor-prophet fresh-source packets
        run: |
          set -euo pipefail
          for book in JOL AMO OBA JON MIC NAM HAB ZEP HAG ZEC MAL; do
            python3 scripts/prepare-minor-prophet-reaudit.py --book "$book"
            python3 scripts/split-minor-prophet-reaudit.py --book "$book"
          done

      - name: Validate completed Osea reviewed candidate
        run: python3 scripts/check-hosea-reviewed-candidate.py

      - name: Align legacy Osea promotion with comparison-only benchmark policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/promote-hosea-to-biblia-emanus.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for key, path in archive_paths.items():\n        actual = sha256_file(path)\n        if actual != EXPECTED_ARCHIVE_SHA256[key]:\n            fail(f"{key} archive drift: {actual} != {EXPECTED_ARCHIVE_SHA256[key]}")\n'''
          new = '''    # WEBU + WLC are translation authority and stay hard-pinned.\n    # BTF + Cornilescu are comparison-only benchmarks: recapture current bytes\n    # when their ZIP packaging changes, while validating per-book content below.\n    for key, path in archive_paths.items():\n        actual = sha256_file(path)\n        expected = EXPECTED_ARCHIVE_SHA256[key]\n        if key in {"webu", "wlc"} and actual != expected:\n            fail(f"{key} source archive drift: {actual} != {expected}")\n        if key in {"btf", "cornilescu"} and actual != expected:\n            print(f"{key} comparison benchmark archive drift: {actual} != {expected}; recapturing current benchmark")\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'comparison benchmark archive drift' not in text:
              raise SystemExit('Unexpected Osea promotion drift policy block')
          PY

      - name: Materialize canonical Osea BE candidate
        run: |
          python3 scripts/promote-hosea-to-biblia-emanus.py \
            --webu-zip /tmp/engwebp_current.zip \
            --wlc-zip /tmp/hboWLC_current.zip \
            --btf-zip /tmp/ronbtf_current.zip \
            --cornilescu-zip /tmp/ron1924_current.zip

      - name: Normalize canonical Osea candidate
        run: python3 scripts/normalize-hosea-be-candidate.py

      - name: Validate canonical Osea publication gate
        run: python3 scripts/check-biblia-emanus-book.py --book HOS

      - name: Verify canonical Osea seal eligibility
        run: python3 scripts/seal-biblia-emanus.py --book HOS --check

      - name: Materialize promoted books into VT catalog
        run: |
          python3 scripts/materialize-vt-overlay-texts.py \
            --source-ref origin/agent/biblia-emanus-ot-and-apocrypha

      - name: Validate full Biblia Emanus corpus
        run: python3 scripts/check-biblia-emanus-corpus.py

      - name: Validate VT reader integration
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile
          pnpm check:vt-publication

      - name: Commit source evidence and stable promotion policy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/promote-hosea-to-biblia-emanus.py \
            docs/data/biblia-emanus/sources/ot-minor-prophets-2026-08-07-usfm.zip \
            docs/data/biblia-emanus/sources/ot-hosea-2026-08-08-usfm.zip \
            docs/data/biblia-emanus/minor-prophets-source-lock.json \
            docs/data/biblia-emanus/source-lock.json \
            docs/data/biblia-emanus/source-ledger.json \
            docs/data/biblia-emanus/manifest.json \
            docs/data/biblia-emanus/HOS.*.json \
            packages/shared/src/bible/generated/vtCanonicalText \
            docs/biblia-explicata/MINOR-PROPHETS-BE-CANDIDATE-AUDIT.json \
            docs/biblia-explicata/minor-prophets-reaudit/HOS-FRESH-SOURCE-REAUDIT.json \
            docs/biblia-explicata/minor-prophets-reaudit/HOS-VERSIFICATION-1-2.json \
            docs/biblia-explicata/minor-prophets-reaudit/HOS-VERSIFICATION-11-12.json \
            docs/biblia-explicata/minor-prophets-reaudit/HOS-VERSIFICATION-13-14.json \
            docs/biblia-explicata/minor-prophets-reaudit/HOS
          for book in JOL AMO OBA JON MIC NAM HAB ZEP HAG ZEC MAL; do
            git add "docs/biblia-explicata/minor-prophets-reaudit/${book}-FRESH-SOURCE-REAUDIT.json"
            git add "docs/biblia-explicata/minor-prophets-reaudit/${book}"
          done
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Fresh source evidence is already current.'
            exit 0
          fi
          git commit -m "audit(bible): refresh minor prophet source evidence"
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
