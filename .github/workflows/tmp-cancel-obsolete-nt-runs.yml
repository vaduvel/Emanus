name: Temporary Cancel Obsolete NT Runs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-cancel-obsolete-nt-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.head_ref == 'agent/biblia-emanus-nt-audit3'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete completion runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run_id in 30985810141 30986574483 30986916015 30987198771; do
            status=$(curl --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')
            if [ "${status}" = "queued" ] || [ "${status}" = "in_progress" ] || [ "${status}" = "waiting" ]; then
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/cancel"
              echo "Cancelled ${run_id} (${status})"
            else
              echo "Skipped ${run_id} (${status})"
            fi
          done
