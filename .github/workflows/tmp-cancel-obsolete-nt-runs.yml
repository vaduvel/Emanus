name: Temporary Cancel Obsolete NT Runs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-cancel-obsolete-nt-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.head_ref == 'agent/biblia-emanus-nt-audit3'
    runs-on: ubuntu-latest
    steps:
      - name: Keep only latest NT completion run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/tmp-complete-nt.yml/runs?event=pull_request&per_page=50")
          mapfile -t records < <(printf '%s' "${response}" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          runs = [run for run in payload.get("workflow_runs", []) if run.get("head_branch") == "agent/biblia-emanus-nt-audit3"]
          runs.sort(key=lambda run: run.get("created_at", ""), reverse=True)
          for run in runs:
              print(str(run["id"]) + ":" + str(run["status"]))
          ')
          if [ "${#records[@]}" -eq 0 ]; then
            echo "No NT completion runs found"
            exit 1
          fi
          latest_id=${records[0]%%:*}
          echo "Keeping latest NT completion run ${latest_id}"
          for record in "${records[@]:1}"; do
            run_id=${record%%:*}
            status=${record#*:}
            if [ "${status}" = "queued" ] || [ "${status}" = "in_progress" ] || [ "${status}" = "waiting" ]; then
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/cancel"
              echo "Cancelled ${run_id} (${status})"
            else
              echo "Skipped ${run_id} (${status})"
            fi
          done
