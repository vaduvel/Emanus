name: Inventory PR40 books

on:
  push:
    branches:
      - agent/biblia-emanus-all-pr40-rebuild
    paths:
      - 'scripts/inventory-pr40-books.py'
      - '.github/workflows/inventory-pr40-books.yml'
  pull_request:
    paths:
      - 'scripts/inventory-pr40-books.py'
      - '.github/workflows/inventory-pr40-books.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr40-exact-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-all-pr40-rebuild
          fetch-depth: 1
      - name: Build exact inventory
        run: python3 scripts/inventory-pr40-books.py
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: pr40-exact-book-inventory
          path: docs/biblia-emanus/PR40-EXACT-BOOK-INVENTORY.json
          retention-days: 7
      - name: Persist exact inventory
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/PR40-EXACT-BOOK-INVENTORY.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'audit(bible): persist exact PR40 book inventory'
          git pull --rebase origin agent/biblia-emanus-all-pr40-rebuild
          git push origin HEAD:agent/biblia-emanus-all-pr40-rebuild
