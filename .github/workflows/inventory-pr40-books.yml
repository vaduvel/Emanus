name: Inventory PR40 books

on:
  push:
    branches:
      - agent/biblia-emanus-all-pr40-rebuild
    paths:
      - 'scripts/inventory-pr40-books.py'
      - 'scripts/build-pr40-publication-matrix.py'
      - '.github/workflows/inventory-pr40-books.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr40-exact-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-all-pr40-rebuild
          fetch-depth: 1
      - name: Build exact inventory
        run: python3 scripts/inventory-pr40-books.py
      - name: Build publication matrix
        run: python3 scripts/build-pr40-publication-matrix.py
      - name: Upload inventory and publication matrix
        uses: actions/upload-artifact@v4
        with:
          name: pr40-publication-planning
          path: |
            docs/biblia-emanus/PR40-EXACT-BOOK-INVENTORY.json
            docs/biblia-emanus/PR40-PUBLICATION-MATRIX.json
          retention-days: 7
      - name: Persist exact inventory and publication matrix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-emanus/PR40-EXACT-BOOK-INVENTORY.json docs/biblia-emanus/PR40-PUBLICATION-MATRIX.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(bible): persist exact PR40 inventory and publication matrix'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/biblia-emanus-all-pr40-rebuild
            if git push origin HEAD:agent/biblia-emanus-all-pr40-rebuild; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
