name: Freeze Next Semantic Book Snapshots Once

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
    paths:
      - .github/workflows/snapshot-next-semantic-books-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true
      - name: Freeze exact current reader snapshots
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('docs/data/biblia-explicata')
          books = [
              ('filipeni', '11-filipeni.json', 19),
              ('coloseni', '12-coloseni.json', 22),
              ('1-tesaloniceni', '13-1-tesaloniceni.json', 23),
          ]
          for book_id, filename, expected_count in books:
              book = json.loads((root / 'nt-final-source-first' / filename).read_text(encoding='utf-8'))
              assert book['id'] == book_id
              units = {}
              for chapter in book['chapters']:
                  for unit in chapter['units']:
                      payload = {
                          'heading': str(unit.get('heading') or ''),
                          'teaching': str(unit.get('teaching') or ''),
                          'forYourHeart': str(unit.get('forYourHeart') or ''),
                      }
                      compact = json.dumps(payload, ensure_ascii=False, separators=(',', ':'))
                      units[unit['id']] = {
                          'chapter': int(chapter['number']),
                          'ref': unit.get('ref'),
                          'snapshotSha256': 'sha256:' + hashlib.sha256(compact.encode('utf-8')).hexdigest(),
                          'snapshot': payload,
                      }
              assert len(units) == expected_count, (book_id, len(units), expected_count)
              out = {
                  'schema': 'emanus-nt-semantic-book-preedit-snapshots-v1',
                  'bookId': book_id,
                  'unitCount': expected_count,
                  'policy': 'Exact pre-edit reader snapshots. Hash-binding input only; not semantic approval.',
                  'units': units,
              }
              target = root / 'nt-semantic-review-work' / f'{filename[:-5]}-semantic-preedit-snapshots.json'
              target.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(book_id, expected_count, target)
          PY

          git rm .github/workflows/snapshot-next-semantic-books-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-explicata/nt-semantic-review-work/11-filipeni-semantic-preedit-snapshots.json \
                  docs/data/biblia-explicata/nt-semantic-review-work/12-coloseni-semantic-preedit-snapshots.json \
                  docs/data/biblia-explicata/nt-semantic-review-work/13-1-tesaloniceni-semantic-preedit-snapshots.json
          git commit -m "Freeze pre-edit snapshots for next semantic books"
          for attempt in 1 2 3 4; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            if git rebase FETCH_HEAD && git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
            git rebase --abort || true
            echo "Snapshot persistence raced with branch update; retrying ($attempt/4)."
          done
          exit 1
