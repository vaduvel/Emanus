name: Audit VT Final Content

on:
  push:
    branches:
      - agent/biblia-explicata-vt-integration-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-vt-integration-clean
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared

      - name: Quantify doctrine provenance and canonical OT translation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { PUBLICATION_BIBLE_BOOKS } from './packages/shared/dist/bible/publicationBible.js'

          const legacyIds = new Set([
            'geneza','exod','levitic','numeri','deuteronom','iosua','rut','1-samuel','2-samuel','1-imparati'
          ])
          const legacy = []
          let totalUnits = 0
          let missingKind = 0
          let missingSource = 0
          let unclassifiedApplications = 0
          let unclassifiedWords = 0

          for (const book of PUBLICATION_BIBLE_BOOKS.filter((b) => legacyIds.has(b.id))) {
            const row = {
              id: book.id,
              name: book.name,
              chapters: book.chapters.length,
              units: 0,
              missingExplanationKind: 0,
              missingExplanationSource: 0,
              unclassifiedForYourHeart: 0,
              unclassifiedWordStudies: 0,
              examples: [],
            }
            for (const chapter of book.chapters) {
              for (const unit of chapter.units) {
                row.units += 1
                totalUnits += 1
                const noKind = !unit.explanationKind
                const noSource = !unit.explanationSource
                if (noKind) { row.missingExplanationKind += 1; missingKind += 1 }
                if (noSource) { row.missingExplanationSource += 1; missingSource += 1 }
                if ((noKind || noSource) && unit.forYourHeart) {
                  row.unclassifiedForYourHeart += 1
                  unclassifiedApplications += 1
                }
                if ((noKind || noSource) && (unit.words?.length ?? 0) > 0) {
                  row.unclassifiedWordStudies += unit.words.length
                  unclassifiedWords += unit.words.length
                }
                if ((noKind || noSource) && row.examples.length < 5) {
                  row.examples.push({ chapter: chapter.number, ref: unit.ref, heading: unit.heading })
                }
              }
            }
            legacy.push(row)
          }

          const manifest = JSON.parse(fs.readFileSync('docs/data/biblia-emanus/manifest.json', 'utf8'))
          const otCodes = [
            ['GEN',50],['EXO',40],['LEV',27],['NUM',36],['DEU',34],['JOS',24],['JDG',21],['RUT',4],['1SA',31],['2SA',24],['1KI',22],['2KI',25],['1CH',29],['2CH',36],['EZR',10],['NEH',13],['EST',10],['JOB',42],['PSA',150],['PRO',31],['ECC',12],['SNG',8],['ISA',66],['JER',52],['LAM',5],['EZK',48],['DAN',12],['HOS',14],['JOL',3],['AMO',9],['OBA',1],['JON',4],['MIC',7],['NAM',3],['HAB',3],['ZEP',3],['HAG',2],['ZEC',14],['MAL',4]
          ]
          const drafted = new Set(manifest.draftedChapters ?? [])
          const canonicalOt = []
          let canonicalOtChapters = 0
          for (const [code, count] of otCodes) {
            const present = Array.from({length: count}, (_, i) => `${code}.${i+1}`).filter((x) => drafted.has(x)).length
            if (present) canonicalOt.push({code, expectedChapters: count, presentChapters: present, complete: present === count})
            canonicalOtChapters += present
          }

          const report = {
            generatedOn: '2026-08-08',
            verdict: {
              doctrineProvenanceReady: missingKind === 0 && missingSource === 0,
              translationCanonicalOtReady: canonicalOtChapters === 929 && canonicalOt.length === 39,
            },
            doctrine: {
              legacyBooks: legacy.length,
              totalUnits,
              missingExplanationKind: missingKind,
              missingExplanationSource: missingSource,
              unclassifiedForYourHeart: unclassifiedApplications,
              unclassifiedWordStudies: unclassifiedWords,
              books: legacy,
            },
            translation: {
              expectedOtBooks: 39,
              expectedOtChapters: 929,
              currentCanonicalOtBooksWithAnyChapters: canonicalOt.length,
              currentCanonicalOtCompleteBooks: canonicalOt.filter((b) => b.complete).length,
              currentCanonicalOtChapters: canonicalOtChapters,
              books: canonicalOt,
            },
          }
          fs.writeFileSync('docs/biblia-explicata/VT-FINAL-CONTENT-AUDIT.json', JSON.stringify(report, null, 2) + '\n')
          console.log(JSON.stringify(report, null, 2))
          NODE

      - name: Commit audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/biblia-explicata/VT-FINAL-CONTENT-AUDIT.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record final VT content audit evidence'
          git push origin HEAD:agent/biblia-explicata-vt-integration-clean
