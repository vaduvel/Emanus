name: Temporary NT Offline Translation Smoke Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: github.head_ref == 'agent/biblia-emanus-nt-audit3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install translation runtime
        run: pip install --quiet "transformers==4.53.2" "sentencepiece==0.2.0" "sacremoses==0.1.1" "torch==2.7.1" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run offline translation model
        run: python3 scripts/tmp-nt-model-smoke.py
