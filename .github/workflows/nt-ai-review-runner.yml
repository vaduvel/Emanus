          journal_path.write_text(journal, encoding='utf-8')
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.7.0 --activate
          pnpm install --frozen-lockfile

      - name: Run required post-batch gates before commit
        run: |
          set -euo pipefail
          pnpm check:biblia-emanus
          python3 scripts/check-biblia-emanus-romanian-quality.py
          pnpm check:biblia-emanus-nt-withheld
          python3 scripts/withhold-biblia-emanus-nt.py --check
          pnpm check:biblia-emanus-nt-runtime
          pnpm test:biblia-emanus
          git diff --check

      - name: Commit isolated PHP 1 batch on successful push run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHAPTER=docs/data/biblia-emanus/PHP.1.json
          JOURNAL=docs/biblia-emanus/NT-AI-REVIEW-BATCH-2026-08-07-PHP.1.md
          if git diff --quiet -- "$CHAPTER" "$JOURNAL" && [ -f "$JOURNAL" ]; then
            echo 'PHP.1 batch already committed; nothing to push.'
            exit 0
          fi
          git add "$CHAPTER" "$JOURNAL"
          mapfile -t staged < <(git diff --cached --name-only)
          printf 'Staged files:\n%s\n' "${staged[*]}"
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = "$JOURNAL" -o "${staged[1]}" = "$JOURNAL"
          test "${staged[0]}" = "$CHAPTER" -o "${staged[1]}" = "$CHAPTER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(biblia): review Philippians 1 against SBLGNT'
          git push origin HEAD:codex/nt-ai-review-handoff
