name: NT Semantic Fidelity — Addressable Units

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
    paths:
      - .github/workflows/nt-semantic-review-addressable.yml
      - scripts/nt_semantic_copilot_worker.py
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: nt-semantic-addressable
  cancel-in-progress: false

jobs:
  review:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        book:
          - 2-tesaloniceni
          - 2-timotei
          - 1-ioan
          - 2-ioan
          - 3-ioan
          - iuda
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Review ${{ matrix.book }} against complete transcript content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NT_SEMANTIC_COPILOT_MODEL: auto
          NT_SEMANTIC_COPILOT_TIMEOUT: '300'
          NT_SEMANTIC_BATCH_SIZE: '4'
        run: |
          set -euo pipefail
          python3 scripts/nt_semantic_copilot_worker.py \
            --book '${{ matrix.book }}' \
            --reviewed-on "$(date -u +%F)" \
            --output '/tmp/${{ matrix.book }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-${{ matrix.book }}
          path: /tmp/${{ matrix.book }}.json
          if-no-files-found: error
          retention-days: 2

  merge:
    needs: review
    if: always() && needs.review.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-*
          path: /tmp/semantic
          merge-multiple: true
      - name: Merge hash-bound semantic decisions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          ledger_path = root / 'docs/data/biblia-explicata/nt-semantic-review-ledger.json'
          if ledger_path.exists():
              ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
              if ledger.get('schema') != 'emanus-nt-semantic-review-ledger-v1':
                  raise SystemExit('Unexpected existing semantic ledger schema')
          else:
              ledger = {
                  'schema': 'emanus-nt-semantic-review-ledger-v1',
                  'policy': 'Every decision is two-pass reviewed against complete transcript representation, hash-bound to final reader teaching/application, and retains official-source plus transcript-representation evidence. Locator-only evidence never approves semantic fidelity.',
                  'decisions': [],
              }
          by_key = {(d['bookId'], d['chapter'], d['unitId']): d for d in ledger.get('decisions', [])}
          added = 0
          for p in sorted(Path('/tmp/semantic').glob('*.json')):
              data = json.loads(p.read_text(encoding='utf-8'))
              if data.get('schema') != 'emanus-nt-semantic-review-book-v1':
                  raise SystemExit(f'Bad book artifact schema: {p}')
              for d in data.get('decisions', []):
                  key = (d['bookId'], d['chapter'], d['unitId'])
                  old = by_key.get(key)
                  if old and old != d:
                      raise SystemExit(f'Conflicting semantic decision for {key}')
                  if not old:
                      by_key[key] = d
                      added += 1
          ledger['decisions'] = sorted(by_key.values(), key=lambda d: (d['bookId'], d['chapter'], d['unitId']))
          ledger['count'] = len(ledger['decisions'])
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Merged {added} new decisions; semantic ledger now {len(by_key)}.')
          PY
          git diff --check
      - name: Commit semantic review ledger
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-explicata/nt-semantic-review-ledger.json
          if git diff --cached --quiet; then
            echo 'Semantic ledger already current.'
            exit 0
          fi
          git commit -m 'Review transcript-addressable NT units semantically'
          for attempt in 1 2 3; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            git rebase FETCH_HEAD
            if git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
          done
          exit 1
