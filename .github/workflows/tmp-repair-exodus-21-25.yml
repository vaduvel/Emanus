name: Repair Exodus 21-25

on:
  push:
    branches:
      - agent/biblia-emanus-exodul
    paths:
      - .github/workflows/tmp-repair-exodus-21-25.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-exodul
          fetch-depth: 0
      - name: Rebuild and audit Exodus 21-25
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('docs/data/biblia-emanus')
          texts={
          21:[
          '„Acestea sunt hotărârile pe care să le pui înaintea lor:',
          'Dacă vei cumpăra un sclav evreu, el să slujească șase ani, iar în al șaptelea să plece liber, fără să plătească nimic.',
          'Dacă a intrat singur, să plece singur. Dacă era căsătorit, soția lui să plece împreună cu el.',
          'Dacă stăpânul lui i-a dat o soție, iar ea i-a născut fii sau fiice, soția și copiii ei vor rămâne ai stăpânului, iar el va pleca singur.',
          'Dar dacă sclavul va spune hotărât: «Îmi iubesc stăpânul, soția și copiii; nu vreau să plec liber»,',
          'stăpânul lui să-l aducă înaintea lui Dumnezeu, apoi să-l ducă la ușă sau la ușorul ușii. Stăpânul lui să-i străpungă urechea cu o sulă, iar el îi va sluji pe termen nelimitat.',
          'Dacă un bărbat își vinde fiica drept sclavă, ea să nu plece așa cum pleacă sclavii de parte bărbătească.',
          'Dacă nu-i mai place stăpânului ei, care o destinase pentru sine, acesta să-i permită răscumpărarea. Nu are dreptul să o vândă unui popor străin, fiindcă s-a purtat cu necredincioșie față de ea.',
          'Dacă o destinează fiului său, să se poarte cu ea potrivit drepturilor unei fiice.',
          'Dacă își ia o altă soție, să nu-i reducă celei dintâi hrana, îmbrăcămintea și drepturile conjugale.',
          'Dacă nu-i asigură aceste trei lucruri, ea va putea pleca liberă, fără să plătească argint.',
          'Cine lovește un om și îi provoacă moartea să fie omorât.',
          'Dar dacă nu a acționat cu intenție, ci Dumnezeu a îngăduit să se întâmple, îți voi stabili un loc unde să poată fugi.',
          'Dacă un om acționează cu premeditare împotriva semenului său și îl omoară prin viclenie, să-l iei chiar și de la altarul Meu ca să moară.',
          'Cine își lovește tatăl sau mama să fie omorât.',
          'Cine răpește o persoană, fie că a vândut-o, fie că persoana este găsită în posesia lui, să fie omorât.',
          'Cine își blestemă tatăl sau mama să fie omorât.',
          'Dacă doi bărbați se ceartă și unul îl lovește pe celălalt cu o piatră sau cu pumnul, iar acesta nu moare, ci rămâne la pat,',
          'dacă se ridică și umblă afară sprijinindu-se în toiag, cel care l-a lovit nu va fi condamnat pentru omor. Totuși, să-i plătească timpul pierdut și să se îngrijească de vindecarea lui deplină.',
          'Dacă un om își lovește sclavul sau sclava cu toiagul și acesta moare sub mâna lui, stăpânul să fie pedepsit.',
          'Dar dacă sclavul supraviețuiește o zi sau două, stăpânul nu va fi pedepsit ca pentru omor, fiindcă sclavul reprezintă argintul lui.',
          'Dacă niște bărbați se bat și lovesc o femeie însărcinată, iar copilul ei se naște înainte de vreme, dar nu urmează o vătămare gravă, vinovatul să plătească despăgubirea cerută de soțul femeii și stabilită de judecători.',
          'Dar dacă urmează o vătămare gravă, să dai viață pentru viață,',
          'ochi pentru ochi, dinte pentru dinte, mână pentru mână, picior pentru picior,',
          'arsură pentru arsură, rană pentru rană și vânătaie pentru vânătaie.',
          'Dacă un om lovește ochiul sclavului sau al sclavei sale și îl distruge, să-l lase liber ca despăgubire pentru ochi.',
          'Dacă îi scoate un dinte sclavului sau sclavei sale, să-l lase liber ca despăgubire pentru dinte.',
          'Dacă un bou împunge un bărbat sau o femeie și îi provoacă moartea, boul să fie ucis cu pietre, iar carnea lui să nu fie mâncată. Proprietarul boului nu va fi răspunzător.',
          'Dar dacă boul obișnuia să împungă și proprietarul fusese avertizat, însă nu l-a ținut închis, iar boul a omorât un bărbat sau o femeie, boul să fie ucis cu pietre, iar proprietarul lui să fie și el condamnat la moarte.',
          'Dacă i se impune un preț de răscumpărare, să dea pentru răscumpărarea vieții sale tot ce i se va impune.',
          'Dacă boul a împuns un fiu sau o fiică, să i se aplice proprietarului aceeași hotărâre.',
          'Dacă boul împunge un sclav sau o sclavă, proprietarul să dea stăpânului acestuia treizeci de șecheli de argint, iar boul să fie ucis cu pietre.',
          'Dacă un om lasă deschisă o groapă sau sapă o groapă și nu o acoperă, iar un bou sau un măgar cade în ea,',
          'proprietarul gropii să plătească despăgubirea proprietarului animalului, iar animalul mort va fi al lui.',
          'Dacă boul unui om rănește boul altuia și acesta moare, să vândă boul viu și să împartă prețul lui; să împartă și animalul mort.',
          'Dar dacă se știa că boul obișnuia să împungă, iar proprietarul nu l-a ținut închis, acesta să dea bou pentru bou, iar animalul mort va fi al lui.'],
          22:[
          '„Dacă un om fură un bou sau o oaie și o înjunghie ori o vinde, să dea cinci boi pentru un bou și patru oi pentru o oaie.',
          'Dacă hoțul este prins în timp ce sparge o casă și este lovit mortal, cel care l-a lovit nu va avea vină de sânge.',
          'Dar dacă soarele răsărise deja, cel care l-a omorât va avea vină de sânge. Hoțul să plătească despăgubirea; dacă nu are cu ce, să fie vândut pentru furtul său.',
          'Dacă animalul furat este găsit viu în posesia sa, fie bou, măgar sau oaie, să plătească dublu.',
          'Dacă un om își lasă animalul să pască într-un ogor sau într-o vie și acesta paște în ogorul altuia, să despăgubească din ce are mai bun în propriul ogor și în propria vie.',
          'Dacă izbucnește un foc, cuprinde mărăcinii și arde snopii, grâul încă în picioare sau ogorul, cel care a aprins focul să plătească întreaga despăgubire.',
          'Dacă un om îi încredințează semenului său argint sau bunuri ca să le păstreze, iar acestea sunt furate din casa lui, hoțul, dacă este găsit, să plătească dublu.',
          'Dacă hoțul nu este găsit, stăpânul casei să se apropie înaintea lui Dumnezeu ca să se stabilească dacă și-a însușit bunurile semenului său.',
          'În orice caz de însușire necinstită, cu privire la bou, măgar, oaie, haină sau orice obiect pierdut despre care cineva spune: «Acesta este al meu», cauza ambelor părți să ajungă înaintea lui Dumnezeu. Cel pe care Dumnezeu îl va declara vinovat să-i plătească semenului său dublu.',
          'Dacă un om îi încredințează semenului său un măgar, un bou, o oaie sau orice alt animal ca să-l păstreze, iar animalul moare, este rănit sau este luat fără să vadă cineva,',
          'între cei doi să fie un jurământ înaintea DOMNULUI că păzitorul nu și-a însușit bunul semenului său. Proprietarul să accepte jurământul, iar păzitorul nu va plăti despăgubire.',
          'Dar dacă animalul i-a fost furat, păzitorul să-l despăgubească pe proprietar.',
          'Dacă animalul a fost sfâșiat de fiare, să aducă rămășițele ca dovadă și nu va plăti pentru animalul sfâșiat.',
          'Dacă un om împrumută un animal de la semenul său, iar acesta este rănit sau moare când proprietarul nu era de față, să plătească întreaga despăgubire.',
          'Dacă proprietarul era de față, să nu plătească. Dacă animalul era închiriat, despăgubirea este inclusă în plata chiriei.',
          'Dacă un bărbat seduce o fecioară care nu este logodită și se culcă cu ea, să plătească prețul de căsătorie și să o ia de soție.',
          'Dacă tatăl ei refuză categoric să i-o dea, bărbatul să plătească o sumă egală cu prețul de căsătorie al fecioarelor.',
          'Să nu lași în viață o femeie care practică vrăjitoria.',
          'Oricine întreține relații sexuale cu un animal să fie omorât.',
          'Cine aduce jertfe unui dumnezeu, în afară de DOMNUL singur, să fie dat spre nimicire.',
          'Să nu nedreptățești și să nu asuprești străinul, căci și voi ați fost străini în țara Egiptului.',
          'Să nu exploatezi nicio văduvă și niciun copil rămas fără tată.',
          'Dacă îi exploatezi și ei strigă către Mine, le voi auzi negreșit strigătul.',
          'Mânia Mea se va aprinde și vă voi omorî cu sabia; soțiile voastre vor ajunge văduve, iar copiii voștri vor rămâne fără tată.',
          'Dacă împrumuți argint unui sărac din poporul Meu care este lângă tine, să nu te porți cu el ca un creditor și să nu-i impui dobândă.',
          'Dacă iei drept garanție haina semenului tău, să i-o înapoiezi înainte de apusul soarelui,',
          'căci aceasta este singura lui învelitoare, haina pentru trupul său. În ce va dormi? Când va striga către Mine, îl voi auzi, căci Eu sunt plin de har.',
          'Să nu-L blasfemiezi pe Dumnezeu și să nu blestemi un conducător al poporului tău.',
          'Să nu întârzii să aduci din plinătatea recoltei tale și din ceea ce curge din teascurile tale. Să-Mi dai pe întâiul născut dintre fiii tăi.',
          'Să faci la fel cu vitele și cu oile tale. Întâiul născut să rămână șapte zile cu mama sa, iar în ziua a opta să Mi-l dai.',
          'Să-Mi fiți oameni sfinți. Să nu mâncați carne sfâșiată de fiare pe câmp, ci să o aruncați câinilor.'],
          23:[
          '„Să nu răspândești un zvon fals. Să nu-ți unești mâna cu cel rău ca să fii martor răuvoitor.',
          'Să nu urmezi mulțimea ca să faci rău și să nu depui mărturie într-un proces înclinând după majoritate ca să pervertești dreptatea.',
          'Să nu-l favorizezi nici pe sărac în procesul lui.',
          'Dacă întâlnești boul sau măgarul dușmanului tău rătăcind, să i-l aduci înapoi.',
          'Dacă vezi măgarul celui care te urăște căzut sub povara lui, să nu-l lași acolo, ci să-l ajuți să-l elibereze.',
          'Să nu denaturezi dreptatea săracului tău în procesul lui.',
          'Să te ții departe de o acuzație falsă. Să nu-l condamni la moarte pe cel nevinovat și drept, căci Eu nu-l voi declara drept pe cel vinovat.',
          'Să nu primești mită, căci mita îi orbește pe cei care văd limpede și răstoarnă cuvintele celor drepți.',
          'Să nu asuprești străinul. Voi cunoașteți sufletul străinului, căci ați fost străini în țara Egiptului.',
          'Șase ani să-ți semeni pământul și să-i strângi recolta,',
          'dar în anul al șaptelea să-l lași să se odihnească și să rămână nelucrat. Săracii poporului tău să mănânce din el, iar ce rămâne să mănânce animalele câmpului. La fel să faci cu via și cu livada ta de măslini.',
          'Șase zile să-ți faci lucrarea, iar în ziua a șaptea să te odihnești, pentru ca boul și măgarul tău să se odihnească, iar fiul sclavei tale și străinul să se învioreze.',
          'Să fiți atenți la tot ce v-am spus. Să nu chemați numele altor dumnezei și să nu se audă din gura voastră.',
          'De trei ori pe an să-Mi ții o sărbătoare.',
          'Să păzești Sărbătoarea Azimelor. Timp de șapte zile să mănânci azime, așa cum ți-am poruncit, la timpul hotărât în luna Abib, căci atunci ai ieșit din Egipt. Nimeni să nu se înfățișeze înaintea Mea cu mâna goală.',
          'Să păzești Sărbătoarea Secerișului, cu primele roade ale muncii tale, din ceea ce ai semănat pe câmp, și Sărbătoarea Strângerii Roadelor, la sfârșitul anului, când îți strângi rodul muncii de pe câmp.',
          'De trei ori pe an, toți bărbații tăi să se înfățișeze înaintea Stăpânului, DOMNUL.',
          'Să nu aduci sângele jertfei Mele împreună cu pâine dospită, iar grăsimea sărbătorii Mele să nu rămână peste noapte până dimineața.',
          'Să aduci cele dintâi dintre primele roade ale pământului tău în Casa DOMNULUI, Dumnezeul tău. Să nu fierbi un ied în laptele mamei sale.',
          'Iată, trimit un Înger înaintea ta, ca să te păzească pe drum și să te ducă în locul pe care l-am pregătit.',
          'Fii atent înaintea lui și ascultă-i glasul. Să nu te răzvrătești împotriva lui, căci nu vă va ierta răzvrătirea, fiindcă Numele Meu este în el.',
          'Dar dacă îi vei asculta cu adevărat glasul și vei face tot ce spun Eu, voi fi dușmanul dușmanilor tăi și potrivnicul potrivnicilor tăi.',
          'Îngerul Meu va merge înaintea ta și te va duce la amoriți, hetiți, periziți, canaaniți, heviți și iebusiți, iar Eu îi voi nimici.',
          'Să nu te pleci înaintea dumnezeilor lor, să nu le slujești și să nu urmezi practicile lor, ci să-i dărâmi cu desăvârșire și să le sfărâmi stâlpii sacri.',
          'Să-I slujiți DOMNULUI, Dumnezeul vostru, iar El îți va binecuvânta pâinea și apa. Voi îndepărta boala din mijlocul tău.',
          'În țara ta nu va fi femeie care să piardă sarcina sau să fie stearpă. Voi împlini numărul zilelor tale.',
          'Voi trimite groaza Mea înaintea ta și voi arunca în confuzie orice popor la care vei ajunge; îi voi face pe toți dușmanii tăi să-ți întoarcă spatele.',
          'Voi trimite viespea înaintea ta, iar ea îi va izgoni dinaintea ta pe heviți, canaaniți și hetiți.',
          'Nu-i voi izgoni dinaintea ta într-un singur an, pentru ca țara să nu ajungă pustie și animalele sălbatice să nu se înmulțească împotriva ta.',
          'Îi voi izgoni puțin câte puțin dinaintea ta, până când te vei înmulți și vei lua țara în stăpânire.',
          'Îți voi stabili hotarul de la Marea Roșie până la marea filistenilor și de la pustie până la Râu. Îi voi da pe locuitorii țării în mâna voastră, iar tu îi vei izgoni dinaintea ta.',
          'Să nu închei legământ cu ei și nici cu dumnezeii lor.',
          'Ei să nu locuiască în țara ta, ca să nu te facă să păcătuiești împotriva Mea, căci slujirea dumnezeilor lor va deveni pentru tine o cursă.”'],
          24:[
          'Apoi Dumnezeu i-a spus lui Moise: „Urcați la DOMNUL, tu, Aaron, Nadab, Abihu și șaptezeci dintre bătrânii lui Israel, și închinați-vă de la distanță.',
          'Numai Moise să se apropie de DOMNUL. Ceilalți să nu se apropie, iar poporul să nu urce împreună cu el.”',
          'Moise a venit și a spus poporului toate cuvintele DOMNULUI și toate hotărârile. Tot poporul a răspuns într-un glas: „Vom împlini toate cuvintele pe care le-a spus DOMNUL.”',
          'Moise a scris toate cuvintele DOMNULUI. S-a sculat dis-de-dimineață, a construit un altar la poalele muntelui și a ridicat doisprezece stâlpi pentru cele douăsprezece seminții ale lui Israel.',
          'A trimis câțiva tineri dintre fiii lui Israel, iar ei au adus arderi-de-tot și au jertfit tauri ca jertfe de pace pentru DOMNUL.',
          'Moise a luat jumătate din sânge și l-a pus în vase, iar cealaltă jumătate a stropit-o pe altar.',
          'A luat Cartea Legământului și a citit-o în auzul poporului. Ei au spus: „Vom face tot ce a spus DOMNUL și vom asculta.”',
          'Moise a luat sângele, a stropit poporul și a spus: „Iată sângele legământului pe care DOMNUL l-a încheiat cu voi pe temeiul tuturor acestor cuvinte.”',
          'Moise, Aaron, Nadab, Abihu și șaptezeci dintre bătrânii lui Israel s-au urcat.',
          'Ei L-au văzut pe Dumnezeul lui Israel. Sub picioarele Lui era ceva asemenea unei pardoseli din safir, limpede ca cerul însuși.',
          'Dumnezeu nu Și-a întins mâna împotriva conducătorilor fiilor lui Israel. Ei L-au văzut pe Dumnezeu și au mâncat și au băut.',
          'DOMNUL i-a spus lui Moise: „Urcă la Mine pe munte și rămâi acolo. Îți voi da tablele de piatră, Legea și porunca pe care le-am scris ca să-i înveți.”',
          'Moise s-a ridicat împreună cu Iosua, slujitorul său, iar Moise s-a urcat pe muntele lui Dumnezeu.',
          'El le-a spus bătrânilor: „Așteptați-ne aici până când ne vom întoarce la voi. Iată, Aaron și Hur sunt cu voi. Cine are o neînțelegere să meargă la ei.”',
          'Moise s-a urcat pe munte, iar norul a acoperit muntele.',
          'Gloria DOMNULUI s-a așezat pe muntele Sinai, iar norul l-a acoperit timp de șase zile. În ziua a șaptea, DOMNUL l-a chemat pe Moise din mijlocul norului.',
          'Înfățișarea gloriei DOMNULUI era ca un foc mistuitor pe vârful muntelui, înaintea ochilor fiilor lui Israel.',
          'Moise a intrat în mijlocul norului și s-a urcat pe munte. Moise a rămas pe munte patruzeci de zile și patruzeci de nopți.'],
          25:[
          'DOMNUL i-a vorbit lui Moise și i-a spus:',
          '„Vorbește-le fiilor lui Israel să ia pentru Mine o contribuție. Să primiți contribuția Mea de la orice om a cărui inimă îl îndeamnă să dea.',
          'Aceasta este contribuția pe care să o primiți de la ei: aur, argint, bronz,',
          'fir albastru, purpuriu și stacojiu, in fin, păr de capră,',
          'piei de berbec vopsite în roșu, piei fine și lemn de salcâm,',
          'ulei pentru lumină, mirodenii pentru untdelemnul ungerii și pentru tămâia parfumată,',
          'pietre de onix și pietre de montat pentru efod și pentru pieptar.',
          'Să-Mi facă un sanctuar, iar Eu voi locui în mijlocul lor.',
          'Să faceți totul după modelul Cortului și după modelul tuturor obiectelor lui, pe care ți-l arăt.',
          'Să facă un chivot din lemn de salcâm, lung de doi coți și jumătate, lat de un cot și jumătate și înalt de un cot și jumătate.',
          'Să-l acoperi cu aur curat pe dinăuntru și pe dinafară și să-i faci de jur împrejur un chenar de aur.',
          'Să torni pentru el patru verigi de aur și să le fixezi la cele patru picioare: două verigi pe o latură și două pe cealaltă latură.',
          'Să faci drugi din lemn de salcâm și să-i acoperi cu aur.',
          'Să introduci drugii în verigile de pe laturile chivotului, ca să poată fi purtat cu ei.',
          'Drugii să rămână în verigile chivotului și să nu fie scoși din ele.',
          'Să pui în chivot Mărturia pe care ți-o voi da.',
          'Să faci un capac al ispășirii din aur curat, lung de doi coți și jumătate și lat de un cot și jumătate.',
          'Să faci doi heruvimi din aur bătut, la cele două capete ale capacului ispășirii.',
          'Să faci un heruvim la un capăt și un heruvim la celălalt capăt; să-i faceți dintr-o singură bucată cu capacul, la cele două capete ale lui.',
          'Heruvimii să-și întindă aripile în sus, acoperind cu aripile lor capacul ispășirii. Fețele lor să fie îndreptate una spre alta și spre capacul ispășirii.',
          'Să pui capacul ispășirii deasupra chivotului, iar în chivot să pui Mărturia pe care ți-o voi da.',
          'Acolo Mă voi întâlni cu tine și îți voi vorbi de deasupra capacului ispășirii, dintre cei doi heruvimi care sunt deasupra chivotului Mărturiei, despre tot ce îți voi porunci pentru fiii lui Israel.',
          'Să faci o masă din lemn de salcâm, lungă de doi coți, lată de un cot și înaltă de un cot și jumătate.',
          'Să o acoperi cu aur curat și să-i faci de jur împrejur un chenar de aur.',
          'Să-i faci de jur împrejur o margine lată de o palmă și un chenar de aur în jurul marginii.',
          'Să-i faci patru verigi de aur și să pui verigile în cele patru colțuri, la cele patru picioare ale mesei.',
          'Verigile să fie aproape de margine, ca să țină drugii cu care va fi purtată masa.',
          'Să faci drugii din lemn de salcâm, să-i acoperi cu aur, iar masa să fie purtată cu ei.',
          'Să-i faci farfuriile, lingurile, cănile și bolurile folosite la turnarea darurilor de băutură. Să le faci din aur curat.',
          'Să pui permanent pe masă, înaintea Mea, pâinea Prezenței.',
          'Să faci un sfeșnic din aur curat. Sfeșnicul să fie lucrat prin batere; baza, tija, cupele, bobocii și florile lui să fie dintr-o singură bucată cu el.',
          'Șase brațe să iasă din laturile lui: trei brațe ale sfeșnicului dintr-o latură și trei din cealaltă latură.',
