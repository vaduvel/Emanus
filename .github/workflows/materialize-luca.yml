name: Materializeaza Luca RCCV

on:
  push:
    branches:
      - agent/integrate-biblical-review
    paths:
      - .github/workflows/materialize-luca.yml
      - scripts/materialize-rccv-book.mjs
      - docs/data/luca-rccv-import.json

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-biblical-review
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genereaza textul Luca din RCCV
        run: node scripts/materialize-rccv-book.mjs docs/data/luca-rccv-import.json

      - name: Valideaza totalul
        run: |
          test -f packages/shared/src/bible/lucaText.ts
          test "$(grep -c '^    "' packages/shared/src/bible/lucaText.ts)" -eq 1175

      - name: Publica fisierul generat pe ramura PR-ului
        run: |
          if git diff --quiet -- packages/shared/src/bible/lucaText.ts; then
            echo "lucaText.ts este deja actualizat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/bible/lucaText.ts
          git commit -m "feat(biblia): materializeaza Luca RCCV"
          git push origin HEAD:agent/integrate-biblical-review
