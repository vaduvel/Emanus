name: Transcribe Remaining Large NT Semantic Sources Once

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
    paths:
      - .github/workflows/transcribe-remaining-large-nt-semantic-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transcribe-remaining-large-nt-semantic-once
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 1
      - id: manifest
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('.github/semantic-source-manifests/remaining-large-books.json').read_text(encoding='utf-8'))
          assert d.get('schema')=='emanus-nt-official-audio-semantic-source-manifest-v1'
          include=[]
          for book_id,book in d['books'].items():
              for episode in book['episodes']:
                  include.append({'book':book_id,'id':episode['id'],'source_url':book['canonicalPage'],'audio_url':episode['audioUrl'],'source_range':episode['range']})
          assert len(include)==54 and len({x['id'] for x in include})==54
          print('matrix='+json.dumps(include,separators=(',',':')))
          PY

  transcribe:
    needs: prepare
    name: Transcribe and persist ${{ matrix.id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure one exact official source
        env:
          BOOK: ${{ matrix.book }}
          SOURCE_ID: ${{ matrix.id }}
          SOURCE_URL: ${{ matrix.source_url }}
          AUDIO_URL: ${{ matrix.audio_url }}
          SOURCE_RANGE: ${{ matrix.source_range }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('docs/data/biblia-explicata/nt-semantic-manual-review-status.json'); d=json.loads(p.read_text(encoding='utf-8'))
          d['currentBook']=os.environ['BOOK']; d['currentBookUnits']={'luca':112,'ioan':65,'fapte':95}[os.environ['BOOK']]; d['manualDecisionsFrozen']=0
          d['officialAudioSources']=[{'id':os.environ['SOURCE_ID'],'officialSourceUrl':os.environ['SOURCE_URL'],'officialAudioUrl':os.environ['AUDIO_URL'],'sourceRange':os.environ['SOURCE_RANGE']}]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Transcribe exact official audio
        env:
          NT_TRANSCRIPTION_SOURCE_ID: ${{ matrix.id }}
          NT_TRANSCRIPTION_MODEL: small.en
          NT_TRANSCRIPTION_CPU_THREADS: '4'
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if python3 scripts/transcribe_nt_current_official_audio.py; then break; fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            rm -f "docs/data/biblia-explicata/nt-official-transcripts/${{ matrix.id }}.json"; sleep 5
          done
          test -s "docs/data/biblia-explicata/nt-official-transcripts/${{ matrix.id }}.json"
      - name: Validate and persist this exact transcript
        env:
          BOOK: ${{ matrix.book }}
          SOURCE_ID: ${{ matrix.id }}
          SOURCE_URL: ${{ matrix.source_url }}
          AUDIO_URL: ${{ matrix.audio_url }}
          SOURCE_RANGE: ${{ matrix.source_range }}
        run: |
          set -euo pipefail
          python3 - "$BOOK" "$SOURCE_ID" "$SOURCE_URL" "$AUDIO_URL" "$SOURCE_RANGE" <<'PY'
          import hashlib,json,re,sys
          from pathlib import Path
          book,sid,surl,aurl,srange=sys.argv[1:]
          p=Path('docs/data/biblia-explicata/nt-official-transcripts')/f'{sid}.json'; d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']=='emanus-nt-official-audio-transcript-v1' and d['bookId']==book and d['sourceId']==sid
          assert d['officialSourceUrl']==surl and d['officialAudioUrl']==aurl and d['sourceRange']==srange
          assert re.fullmatch(r'sha256:[0-9a-f]{64}',d['officialAudioSha256']) and re.fullmatch(r'sha256:[0-9a-f]{64}',d['transcriptSha256'])
          assert isinstance(d['wordCount'],int) and d['wordCount']>=1500 and d['segmentCount']==len(d['segments'])>0
          lines=[]; previous=-1.0
          for i,s in enumerate(d['segments']):
              start,end=s['start'],s['end']; text=' '.join(str(s.get('text') or '').split()).strip()
              assert isinstance(start,(int,float)) and isinstance(end,(int,float)) and end>=start and start+0.05>=previous and text,(sid,i)
              previous=end; lines.append(text)
          transcript='\n'.join(lines).strip()+'\n'
          assert len(transcript.split())==d['wordCount']
          assert 'sha256:'+hashlib.sha256(transcript.encode()).hexdigest()==d['transcriptSha256']
          print(sid,d['wordCount'],d['transcriptSha256'],d['officialAudioSha256'])
          PY
          git restore docs/data/biblia-explicata/nt-semantic-manual-review-status.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/data/biblia-explicata/nt-official-transcripts/${SOURCE_ID}.json"
          if git diff --cached --quiet; then echo "$SOURCE_ID already durable"; exit 0; fi
          git commit -m "Persist official ${BOOK} transcript ${SOURCE_ID}"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            if git rebase FETCH_HEAD && git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
            git rebase --abort || true; sleep "$attempt"
          done
          exit 1

  cleanup:
    name: Remove large-book transcription workflow after all 54 are durable
    needs: transcribe
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true
      - name: Verify complete durable source set and self-remove
        run: |
          set -euo pipefail
          git fetch origin agent/biblia-explicata-nt-integration-clean; git reset --hard origin/agent/biblia-explicata-nt-integration-clean
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('.github/semantic-source-manifests/remaining-large-books.json').read_text(encoding='utf-8'))
          missing=[]
          for book in m['books'].values():
              for episode in book['episodes']:
                  p=Path('docs/data/biblia-explicata/nt-official-transcripts')/f"{episode['id']}.json"
                  if not p.is_file(): missing.append(episode['id'])
          if missing: raise SystemExit('Missing durable transcripts: '+','.join(missing))
          print('All 54 large-book official transcripts are durable.')
          PY
          git rm .github/workflows/transcribe-remaining-large-nt-semantic-once.yml
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove completed large NT transcript workflow"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            if git rebase FETCH_HEAD && git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
            git rebase --abort || true; sleep "$attempt"
          done
          exit 1
