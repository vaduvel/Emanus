name: Transcribe Remaining Large NT Semantic Sources Once

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
    paths:
      - .github/workflows/transcribe-remaining-large-nt-semantic-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transcribe-remaining-large-nt-semantic-once
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      count: ${{ steps.manifest.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 1
      - id: manifest
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path('.github/semantic-source-manifests/remaining-large-books.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          if d.get('schema') != 'emanus-nt-official-audio-semantic-source-manifest-v1':
              raise SystemExit('Unexpected remaining-large source manifest schema')
          include = []
          for book_id, book in d['books'].items():
              canonical = book['canonicalPage']
              for episode in book['episodes']:
                  include.append({
                      'book': book_id,
                      'id': episode['id'],
                      'source_url': canonical,
                      'audio_url': episode['audioUrl'],
                      'source_range': episode['range'],
                  })
          if len(include) != 54:
              raise SystemExit(f'Expected 54 official episodes, found {len(include)}')
          if len({x['id'] for x in include}) != len(include):
              raise SystemExit('Duplicate source id in manifest')
          print('matrix=' + json.dumps(include, separators=(',', ':')))
          print('count=' + str(len(include)))
          PY

  transcribe:
    needs: prepare
    name: Transcribe ${{ matrix.id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure one exact official source
        env:
          BOOK: ${{ matrix.book }}
          SOURCE_ID: ${{ matrix.id }}
          SOURCE_URL: ${{ matrix.source_url }}
          AUDIO_URL: ${{ matrix.audio_url }}
          SOURCE_RANGE: ${{ matrix.source_range }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('docs/data/biblia-explicata/nt-semantic-manual-review-status.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['currentBook'] = os.environ['BOOK']
          d['currentBookUnits'] = {'luca':112,'ioan':65,'fapte':95}[os.environ['BOOK']]
          d['manualDecisionsFrozen'] = 0
          d['officialAudioSources'] = [{
              'id': os.environ['SOURCE_ID'],
              'officialSourceUrl': os.environ['SOURCE_URL'],
              'officialAudioUrl': os.environ['AUDIO_URL'],
              'sourceRange': os.environ['SOURCE_RANGE'],
          }]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Transcribe exact official audio
        env:
          NT_TRANSCRIPTION_SOURCE_ID: ${{ matrix.id }}
          NT_TRANSCRIPTION_MODEL: small.en
          NT_TRANSCRIPTION_CPU_THREADS: '4'
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if python3 scripts/transcribe_nt_current_official_audio.py; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            rm -f "docs/data/biblia-explicata/nt-official-transcripts/${{ matrix.id }}.json"
            sleep 5
          done
          test -s "docs/data/biblia-explicata/nt-official-transcripts/${{ matrix.id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.id }}
          path: docs/data/biblia-explicata/nt-official-transcripts/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 2

  persist:
    name: Persist 54 official large-book transcripts
    needs: [prepare, transcribe]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: transcript-*
          path: /tmp/large-nt-transcripts
          merge-multiple: true
      - name: Validate all exact transcript artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / '.github/semantic-source-manifests/remaining-large-books.json').read_text(encoding='utf-8'))
          incoming = Path('/tmp/large-nt-transcripts')
          target = root / 'docs/data/biblia-explicata/nt-official-transcripts'
          target.mkdir(parents=True, exist_ok=True)
          expected = []
          for book_id, book in manifest['books'].items():
              for episode in book['episodes']:
                  expected.append((book_id, book['canonicalPage'], episode))
          if len(expected) != 54:
              raise SystemExit(f'Expected 54 manifest episodes, found {len(expected)}')
          for book_id, official_page, episode in expected:
              source_id = episode['id']
              p = incoming / f'{source_id}.json'
              if not p.is_file():
                  raise SystemExit(f'Missing transcript artifact {source_id}')
              d = json.loads(p.read_text(encoding='utf-8'))
              assert d['schema'] == 'emanus-nt-official-audio-transcript-v1', source_id
              assert d['bookId'] == book_id, (source_id, d['bookId'], book_id)
              assert d['sourceId'] == source_id
              assert d['officialSourceUrl'] == official_page
              assert d['officialAudioUrl'] == episode['audioUrl']
              assert d['sourceRange'] == episode['range']
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', d['officialAudioSha256'])
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', d['transcriptSha256'])
              assert isinstance(d['wordCount'], int) and d['wordCount'] >= 1500
              assert d['segmentCount'] == len(d['segments']) > 0
              lines = []
              previous_end = -1.0
              for i, segment in enumerate(d['segments']):
                  start, end = segment['start'], segment['end']
                  text = ' '.join(str(segment.get('text') or '').split()).strip()
                  assert isinstance(start, (int,float)) and isinstance(end, (int,float)) and end >= start
                  assert start + 0.05 >= previous_end, (source_id, i, start, previous_end)
                  assert text
                  previous_end = end
                  lines.append(text)
              transcript = '\n'.join(lines).strip() + '\n'
              assert len(transcript.split()) == d['wordCount']
              digest = 'sha256:' + hashlib.sha256(transcript.encode('utf-8')).hexdigest()
              assert digest == d['transcriptSha256'], (source_id, digest, d['transcriptSha256'])
              (target / p.name).write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(source_id, d['wordCount'], d['transcriptSha256'], d['officialAudioSha256'])
          actual = list(incoming.glob('*.json'))
          if len(actual) != 54:
              raise SystemExit(f'Expected exactly 54 downloaded JSON artifacts, found {len(actual)}')
          PY
          git diff --check
      - name: Commit transcripts and self-remove
        run: |
          set -euo pipefail
          git rm .github/workflows/transcribe-remaining-large-nt-semantic-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-explicata/nt-official-transcripts/luca-vbv-*.json \
                  docs/data/biblia-explicata/nt-official-transcripts/ioan-vbv-*.json \
                  docs/data/biblia-explicata/nt-official-transcripts/fapte-vbv-*.json
          git commit -m "Persist official Luke John and Acts semantic transcripts"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            if git rebase FETCH_HEAD && git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
            git rebase --abort || true
            sleep "$attempt"
          done
          exit 1
