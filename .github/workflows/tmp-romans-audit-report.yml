name: Temporary Romans 1-4 Audit Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/biblia-emanus-nt-audit3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-nt-audit3
          fetch-depth: 0

      - name: Apply Romans 1-4 semantic audit
        run: python3 scripts/tmp-approve-romans-1-4.py

      - name: Validate complete Biblia Emanus corpus
        run: python3 scripts/check-biblia-emanus.py

      - name: Validate New Testament versification
        run: python3 scripts/check-biblia-emanus-versification.py

      - name: Run Biblia Emanus tests
        run: python3 -m unittest scripts/test_biblia_emanus.py scripts/test_biblia_emanus_nt.py scripts/test_materialize_biblia_emanus_nt.py

      - name: Commit approved Romans wave
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus/ROM.1.json \
                  docs/data/biblia-emanus/ROM.2.json \
                  docs/data/biblia-emanus/ROM.3.json \
                  docs/data/biblia-emanus/ROM.4.json \
                  docs/data/biblia-emanus/manifest.json \
                  docs/biblia-emanus/ROMANI-AUDIT-3-1-4.md
          git commit -m "Approve Biblia Emanus Romans 1-4 with audit engine 3.0"
          git push origin HEAD:agent/biblia-emanus-nt-audit3
