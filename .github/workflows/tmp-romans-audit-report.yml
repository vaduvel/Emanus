name: Temporary Romans 1-4 Audit Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/biblia-emanus-nt-audit3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-emanus-nt-audit3
          fetch-depth: 0

      - name: Align approval script with current Romans corpus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-approve-romans-1-4.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'și a fost desemnat Fiu al lui Dumnezeu cu putere, potrivit Duhului sfințeniei, prin învierea dintre cei morți: Isus Hristos, Domnul nostru.':
                  'și a fost desemnat Fiu al lui Dumnezeu în putere, potrivit duhului sfințeniei, prin învierea dintre cei morți: Isus Hristos, Domnul nostru.',
              'și a fost desemnat drept Fiu al lui Dumnezeu cu putere, potrivit Duhului sfințeniei, prin învierea dintre cei morți: Isus Hristos, Domnul nostru.':
                  'și a fost desemnat drept Fiu al lui Dumnezeu în putere, potrivit duhului sfințeniei, prin învierea dintre cei morți: Isus Hristos, Domnul nostru.',
              'printre care sunteți și voi, chemați ai lui Isus Hristos,':
                  'între care sunteți și voi, chemați ai lui Isus Hristos.',
              'printre care sunteți și voi, chemați să fiți ai lui Isus Hristos,':
                  'între care sunteți și voi, chemați să fiți ai lui Isus Hristos.',
              'adică să fim încurajați împreună între voi prin credința pe care o avem unii în alții, atât a voastră, cât și a mea.':
                  'adică să fim încurajați împreună între voi, prin credința pe care o avem unii în alții, și voi, și eu.',
              'source_data["snapshotSha256"]':
                  'source_data["snapshotSha256ByBook"]["ROM"]',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Romans patch marker missing or duplicated: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Romans 1-4 semantic audit
        run: python3 scripts/tmp-approve-romans-1-4.py

      - name: Validate complete Biblia Emanus corpus
        run: python3 scripts/check-biblia-emanus.py

      - name: Validate New Testament versification
        run: python3 scripts/check-biblia-emanus-versification.py

      - name: Run Biblia Emanus tests
        run: python3 -m unittest scripts/test_biblia_emanus.py scripts/test_biblia_emanus_nt.py scripts/test_materialize_biblia_emanus_nt.py

      - name: Commit approved Romans wave
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/biblia-emanus/ROM.1.json \
                  docs/data/biblia-emanus/ROM.2.json \
                  docs/data/biblia-emanus/ROM.3.json \
                  docs/data/biblia-emanus/ROM.4.json \
                  docs/data/biblia-emanus/manifest.json \
                  docs/biblia-emanus/ROMANI-AUDIT-3-1-4.md
          git commit -m "Approve Biblia Emanus Romans 1-4 with audit engine 3.0"
          git push origin HEAD:agent/biblia-emanus-nt-audit3
