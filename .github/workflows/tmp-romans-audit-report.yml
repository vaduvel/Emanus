name: Temporary Romans 5-8 Semantic Audit Reports

on:
  pull_request:
    branches:
      - main

jobs:
  report:
    if: github.head_ref == 'agent/biblia-emanus-nt-audit3'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter: [5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Generate Romans chapter report
        run: python3 scripts/tmp-report-romans-audit.py ${{ matrix.chapter }}
