# Triggered for the final NT semantic-fidelity pass on 2026-08-11.
name: Transcribe Philippians Semantic Sources Once

on:
  push:
    branches:
      - agent/biblia-explicata-nt-integration-clean
    paths:
      - .github/workflows/transcribe-filipeni-semantic-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    name: Transcribe and persist ${{ matrix.id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: filipeni-vbv-01
            source_url: https://www.cfcindia.com/verse-by-verse/01phiippians-chapter-11-to-chapter-27
            audio_url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt11-philippians-chapter-1-1-to-chapter-2-7.mp3
            source_range: Philippians 1:1-2:7
          - id: filipeni-vbv-02
            source_url: https://www.cfcindia.com/verse-by-verse/02philippians-chapter-25-to-chapter-230
            audio_url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt11-philippians-chapter-2-5-to-chapter-2-30.mp3
            source_range: Philippians 2:5-2:30
          - id: filipeni-vbv-03
            source_url: https://www.cfcindia.com/verse-by-verse/03philippians-chapter-31-to-chapter-319
            audio_url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt11-philippians-chapter-3-1-to-chapter-3-19.mp3
            source_range: Philippians 3:1-3:19
          - id: filipeni-vbv-04
            source_url: https://www.cfcindia.com/verse-by-verse/04philippians-chapter-317-to-chapter-423
            audio_url: https://www.cfcindia.org/resources/en/study-series/verse-by-verse/nt11-philippians-chapter-3-17-to-chapter-4-23.mp3
            source_range: Philippians 3:17-4:23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure isolated exact source
        env:
          SOURCE_ID: ${{ matrix.id }}
          SOURCE_URL: ${{ matrix.source_url }}
          AUDIO_URL: ${{ matrix.audio_url }}
          SOURCE_RANGE: ${{ matrix.source_range }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('docs/data/biblia-explicata/nt-semantic-manual-review-status.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['currentBook'] = 'filipeni'
          d['currentBookUnits'] = 19
          d['manualDecisionsFrozen'] = 0
          d['officialAudioSources'] = [{
              'id': os.environ['SOURCE_ID'],
              'officialSourceUrl': os.environ['SOURCE_URL'],
              'officialAudioUrl': os.environ['AUDIO_URL'],
              'sourceRange': os.environ['SOURCE_RANGE'],
          }]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Transcribe exact official CFC episode
        env:
          NT_TRANSCRIPTION_SOURCE_ID: ${{ matrix.id }}
          NT_TRANSCRIPTION_MODEL: small.en
        run: |
          set -euo pipefail
          python3 scripts/transcribe_nt_current_official_audio.py
          test -s "docs/data/biblia-explicata/nt-official-transcripts/${{ matrix.id }}.json"

      - name: Validate and persist this exact transcript
        env:
          SOURCE_ID: ${{ matrix.id }}
          SOURCE_URL: ${{ matrix.source_url }}
          AUDIO_URL: ${{ matrix.audio_url }}
          SOURCE_RANGE: ${{ matrix.source_range }}
        run: |
          set -euo pipefail
          python3 - "$SOURCE_ID" "$SOURCE_URL" "$AUDIO_URL" "$SOURCE_RANGE" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          source_id, source_url, audio_url, source_range = sys.argv[1:]
          p = Path('docs/data/biblia-explicata/nt-official-transcripts') / f'{source_id}.json'
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['schema'] == 'emanus-nt-official-audio-transcript-v1'
          assert d['bookId'] == 'filipeni' and d['sourceId'] == source_id
          assert d['officialSourceUrl'] == source_url
          assert d['officialAudioUrl'] == audio_url
          assert d['sourceRange'] == source_range
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', d['officialAudioSha256'])
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', d['transcriptSha256'])
          assert d['wordCount'] >= 1500 and d['segmentCount'] == len(d['segments']) > 0
          lines = [' '.join(str(s.get('text') or '').split()).strip() for s in d['segments']]
          assert all(lines)
          transcript = '\n'.join(lines).strip() + '\n'
          assert len(transcript.split()) == d['wordCount']
          assert 'sha256:' + hashlib.sha256(transcript.encode()).hexdigest() == d['transcriptSha256']
          print(source_id, d['wordCount'], d['transcriptSha256'], d['officialAudioSha256'])
          PY
          git restore docs/data/biblia-explicata/nt-semantic-manual-review-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/data/biblia-explicata/nt-official-transcripts/${SOURCE_ID}.json"
          if git diff --cached --quiet; then
            echo "$SOURCE_ID already durable."
            exit 0
          fi
          git commit -m "Persist official Philippians transcript ${SOURCE_ID}"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            if git rebase FETCH_HEAD && git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
            git rebase --abort || true
            sleep "$attempt"
          done
          exit 1

  cleanup:
    name: Remove completed Philippians transcription workflow
    needs: transcribe
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biblia-explicata-nt-integration-clean
          fetch-depth: 0
          persist-credentials: true
      - name: Self-remove only after all four transcripts are durable
        run: |
          set -euo pipefail
          git fetch origin agent/biblia-explicata-nt-integration-clean
          git reset --hard origin/agent/biblia-explicata-nt-integration-clean
          for n in 01 02 03 04; do test -s "docs/data/biblia-explicata/nt-official-transcripts/filipeni-vbv-${n}.json"; done
          git rm .github/workflows/transcribe-filipeni-semantic-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove completed Philippians transcript workflow"
          for attempt in 1 2 3 4; do
            git fetch origin agent/biblia-explicata-nt-integration-clean
            if git rebase FETCH_HEAD && git push origin HEAD:agent/biblia-explicata-nt-integration-clean; then exit 0; fi
            git rebase --abort || true
            sleep "$attempt"
          done
          exit 1
